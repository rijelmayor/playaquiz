<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Final Round Host Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #03050b;
      --surface: #0d1120;
      --surface2: #111827;
      --border: #1f2a3c;
      --border2: #2d3b52;
      --text: #e8edf7;
      --muted: #6b7a99;
      --accent: #3b82f6;
      --green: #10b981;
      --gold: #fbbf24;
      --red: #ef4444;
      --purple: #8b5cf6;
      --orange: #f97316;
    }

    body {
      background: var(--bg);
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .host-layout {
      display: flex;
      height: 100%;
    }

    /* Control Panel (Left) */
    .control-panel {
      width: 420px;
      min-width: 420px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .panel-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #fff, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .room-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 12px;
      text-align: center;
    }

    .room-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 26px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 4px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 14px;
      margin: 2px 10px;
      background: var(--surface2);
      border-radius: 8px;
      font-size: 13px;
    }

    .section {
      padding: 14px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    .players-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .player-card {
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-card.buzzed {
      border-color: var(--gold);
      background: rgba(251,191,36,0.08);
    }

    .player-card.eliminated {
      opacity: 0.4;
      filter: grayscale(1);
    }

    .player-avatar {
      font-size: 32px;
    }

    .player-info {
      flex: 1;
    }

    .player-name {
      font-weight: 700;
      font-size: 14px;
    }

    .player-score {
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--gold);
    }

    .eliminate-btn {
      font-size: 10px;
      padding: 4px 10px;
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 6px;
      color: var(--red);
      cursor: pointer;
    }

    .category-filter {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .cat-filter-btn {
      padding: 5px 12px;
      border-radius: 18px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border2);
      background: var(--surface2);
      cursor: pointer;
      color: var(--text);
    }

    .cat-filter-btn.active {
      background: var(--accent);
      color: white;
    }

    .question-list {
      max-height: 250px;
      overflow-y: auto;
    }

    .q-item {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }

    .q-item:hover {
      background: rgba(255,255,255,0.025);
    }

    .q-item.used {
      opacity: 0.4;
    }

    .fire-btn {
      background: var(--red);
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .timer-control {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 12px 0;
    }

    .timer-control input {
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 9px;
      padding: 8px 12px;
      color: var(--text);
      width: 80px;
    }

    .btn {
      border: none;
      padding: 8px 16px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-green {
      background: var(--green);
      color: #fff;
    }

    .btn-red {
      background: var(--red);
      color: #fff;
    }

    .btn-accent {
      background: var(--accent);
      color: #fff;
    }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border2);
    }

    .btn-purple {
      background: var(--purple);
      color: #fff;
    }

    .btn-orange {
      background: var(--orange);
      color: #fff;
    }

    .btn-lg {
      padding: 10px 20px;
      font-size: 13px;
    }

    .question-area {
      background: linear-gradient(135deg, rgba(59,130,246,0.06), rgba(139,92,246,0.04));
      border-radius: 12px;
      padding: 12px;
      margin: 12px 0;
    }

    .question-text {
      font-size: 13px;
      font-weight: 700;
    }

    .buzzer-card {
      border: 2px solid var(--gold);
      background: rgba(251,191,36,0.05);
    }

    .buzzed-name {
      font-size: 24px;
      font-weight: 800;
      margin: 10px 0;
    }

    /* FOH Preview (Right) */
    .foh-preview {
      flex: 1;
      background: linear-gradient(135deg, #0a0c15, #03050b);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .preview-header {
      background: rgba(0,0,0,0.5);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
    }

    .preview-badge {
      font-size: 11px;
      padding: 4px 12px;
      background: rgba(16,185,129,0.2);
      border-radius: 20px;
      color: var(--green);
    }

    .foh-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px;
    }

    /* Question Display Preview */
    .preview-question {
      background: rgba(255,255,255,0.03);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    .preview-question-text {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .preview-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .preview-option {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
    }

    .preview-option-letter {
      color: var(--gold);
      font-weight: 800;
      margin-right: 8px;
    }

    .buzzer-open-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(244,63,94,0.15);
      border: 1.5px solid rgba(244,63,94,0.4);
      border-radius: 40px;
      padding: 8px 20px;
      font-weight: 800;
      color: var(--red);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Leaderboard Preview */
    .preview-leaderboard {
      background: rgba(255,255,255,0.03);
      border-radius: 20px;
      padding: 20px;
    }

    .preview-leaderboard-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--muted);
    }

    .preview-player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-bottom: 1px solid var(--border);
    }

    .preview-player-rank {
      width: 30px;
      font-size: 14px;
    }

    .preview-player-name {
      flex: 1;
      font-size: 13px;
    }

    .preview-player-score {
      font-weight: 700;
      color: var(--gold);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 10px 16px;
      animation: slideIn 0.3s ease;
      z-index: 1000;
      font-size: 13px;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(50px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      display: inline-block;
      margin-right: 5px;
    }

    .connection-dot.connected {
      background: var(--green);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
<div class="host-layout">
  <!-- Left: Control Panel -->
  <div class="control-panel">
    <div class="panel-header">
      <div class="logo">PLAYAQUIZ HOST</div>
    </div>
    
    <div class="room-box">
      <div class="room-code" id="roomCodeDisplay">——</div>
      <div style="margin-top: 10px;">
        <button class="btn btn-sm btn-ghost" onclick="copyRoomLink()">🔗 Copy Link</button>
        <button class="btn btn-sm btn-ghost" onclick="showQRCode()">📱 Show QR</button>
      </div>
    </div>

    <div class="info-row">
      <span>Connection</span>
      <span><span class="connection-dot" id="connDot"></span><span id="connText">Offline</span></span>
    </div>
    <div class="info-row">
      <span>Players</span>
      <span id="playerCount">0</span>
    </div>

    <div class="section">
      <div class="section-title">👥 Players</div>
      <div class="players-grid" id="playersGrid"></div>
    </div>

    <div class="section">
      <div class="section-title">🎨 Categories</div>
      <div class="category-filter" id="categoryFilter"></div>
    </div>

    <div class="section">
      <div class="section-title">📚 Question Bank</div>
      <div class="question-list" id="questionBankList"></div>
    </div>

    <div class="section">
      <div class="section-title">⏱️ Timer Control</div>
      <div class="timer-control">
        <input type="number" id="timerSeconds" value="10" min="3" max="30">
        <button class="btn btn-accent" onclick="startTimer()">▶ Start Timer</button>
        <button class="btn btn-orange" id="buzzerToggleBtn" onclick="toggleBuzzerGlobal()">🔔 Buzzers ON</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">📢 Question Control</div>
      <div id="selectedQuestionDisplay" class="question-area">
        <div style="color:var(--muted); font-size:12px;">← Select a question above</div>
      </div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn btn-accent btn-lg" style="flex:1;" onclick="openQuestion()" id="openBtn" disabled>🔔 OPEN BUZZERS</button>
        <button class="btn btn-ghost" onclick="resetBuzzers()" id="resetBtn" disabled>↺ Reset</button>
      </div>
    </div>

    <div class="section buzzer-card" id="buzzerCard" style="display:none;">
      <div class="section-title">🎤 JUDGE ANSWER</div>
      <div style="text-align:center;">
        <div class="buzzed-name" id="buzzedName">—</div>
        <div id="buzzerCorrectHint" style="background:rgba(16,185,129,0.08);padding:10px;border-radius:10px;margin:12px 0;">
          <div style="color:var(--green); font-size:12px;">✅ CORRECT ANSWER</div>
          <div id="buzzerCorrectText" style="font-weight:700;margin-top:4px; font-size:13px;"></div>
        </div>
        <div style="display:flex;gap:12px;">
          <button class="btn btn-green btn-lg" onclick="markCorrect()" style="flex:1;">✅ CORRECT</button>
          <button class="btn btn-red btn-lg" onclick="markWrong()" style="flex:1;">❌ WRONG</button>
        </div>
        <button class="btn btn-ghost" style="margin-top:12px; width:100%;" onclick="nextQuestion()">⏭ Skip Question</button>
      </div>
    </div>
  </div>

  <!-- Right: FOH Preview -->
  <div class="foh-preview">
    <div class="preview-header">
      <div class="preview-title">🎯 LIVE DISPLAY PREVIEW</div>
      <div class="preview-badge" id="previewStatus">Waiting for players</div>
    </div>
    <div class="foh-content">
      <div id="previewQuestionArea" class="preview-question">
        <div style="color: var(--muted); font-size: 14px;">Select a question and start the round</div>
      </div>
      <div id="previewLeaderboard" class="preview-leaderboard">
        <div class="preview-leaderboard-title">🏆 LIVE LEADERBOARD</div>
        <div id="previewPlayerList"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// Get room code from URL
const urlParams = new URLSearchParams(window.location.search);
let roomCode = urlParams.get('room') || localStorage.getItem('fr_room');

if (!roomCode) {
  roomCode = prompt('Enter Final Round Room Code:');
  if (roomCode) {
    roomCode = roomCode.toUpperCase();
    localStorage.setItem('fr_room', roomCode);
  } else {
    alert('Room code required');
    window.location.href = 'room-manager.html';
  }
}

// Game state
let frPlayers = new Map();
let buzzedPlayerId = null;
let lockedPlayers = new Set();
let eliminatedPlayers = new Set();
let isQuestionOpen = false;
let realtimeChannel = null;
let pointsPerBuzz = 100;
let allQuestions = [];
let categories = [];
let selectedQuestionForGame = null;
let currentFilterCat = 'all';
let currentQuestionNumber = 0;
let buzzerGlobalEnabled = true;
let usedQuestionIds = new Set();

// Display room code
document.getElementById('roomCodeDisplay').innerText = roomCode;

// ─── Database Functions ───────────────────────────────────────────────────────────
async function loadQuestionsFromDB() {
  try {
    // First get the session
    const { data: session, error: sessionError } = await sb
      .from('game_sessions')
      .select('id')
      .eq('room_code', roomCode)
      .single();
    
    if (sessionError) {
      console.error('Session error:', sessionError);
      return;
    }
    
    const sessionId = session.id;
    
    // Load categories for this session
    const { data: cats, error: catsError } = await sb
      .from('categories')
      .select('*')
      .eq('session_id', sessionId)
      .order('name');
    
    if (catsError) throw catsError;
    categories = cats || [];
    
    // Load questions for this session
    const { data: qs, error: qsError } = await sb
      .from('questions')
      .select('*, categories(name, icon)')
      .eq('session_id', sessionId)
      .order('created_at');
    
    if (qsError) throw qsError;
    allQuestions = qs || [];
    
    renderCategoryFilters();
    renderQuestionBank();
  } catch (err) {
    console.error('Load questions error:', err);
    toast('Error loading questions');
  }
}

function renderCategoryFilters() {
  const html = `<button class="cat-filter-btn active" onclick="filterByCategory('all',this)">📚 All (${allQuestions.length})</button>` +
    categories.map(c => {
      const count = allQuestions.filter(q => q.category_id === c.id).length;
      return `<button class="cat-filter-btn" onclick="filterByCategory('${c.id}',this)">${c.icon || '📁'} ${c.name} (${count})</button>`;
    }).join('');
  
  const filterEl = document.getElementById('categoryFilter');
  if (filterEl) filterEl.innerHTML = html;
}

function filterByCategory(catId, btn) {
  currentFilterCat = catId;
  document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderQuestionBank();
}

function renderQuestionBank() {
  const filtered = currentFilterCat === 'all' ? allQuestions : allQuestions.filter(q => q.category_id === currentFilterCat);
  const html = filtered.map(q => {
    const isUsed = usedQuestionIds.has(q.id);
    return `<div class="q-item ${isUsed ? 'used' : ''}" onclick="selectQuestion('${q.id}')">
      <div style="flex:1;">
        <strong>${escapeHtml(q.question_text.substring(0, 60))}</strong>
        <div style="font-size:10px;color:var(--muted);">${q.categories?.icon || '📁'} ${q.categories?.name || 'General'}${isUsed ? ' · ✓ Used' : ''}</div>
      </div>
      <button class="fire-btn" onclick="event.stopPropagation();fireQuestion('${q.id}')">🔥 Fire</button>
    </div>`;
  }).join('');
  
  const bankEl = document.getElementById('questionBankList');
  if (bankEl) bankEl.innerHTML = html || '<div style="padding:24px;text-align:center;">No questions available</div>';
}

function selectQuestion(qId) {
  const q = allQuestions.find(x => x.id === qId);
  if (!q) return;
  selectedQuestionForGame = q;
  const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
  const letters = ['A', 'B', 'C', 'D'];
  document.getElementById('selectedQuestionDisplay').innerHTML = `
    <div class="question-text">📢 ${escapeHtml(q.question_text)}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;font-size:11px;">
      ${opts.map((o, i) => `<div style="background:rgba(255,255,255,0.04);border-radius:8px;padding:6px;"><span style="color:var(--accent);font-weight:800">${letters[i]}</span> ${escapeHtml(o)}</div>`).join('')}
    </div>
    <div style="font-size:10px;color:var(--green);margin-top:8px;">✅ Correct: ${letters[q.correct_option]} — ${escapeHtml(opts[q.correct_option])}</div>
  `;
  
  // Update preview
  updatePreviewQuestion(q);
  
  document.getElementById('openBtn').disabled = false;
  document.getElementById('resetBtn').disabled = false;
  toast(`Selected: ${q.question_text.substring(0, 50)}`);
}

function fireQuestion(qId) {
  selectQuestion(qId);
  openQuestion();
}

function updatePreviewQuestion(q) {
  if (!q) {
    document.getElementById('previewQuestionArea').innerHTML = `
      <div style="color: var(--muted); font-size: 14px;">Select a question and start the round</div>
    `;
    return;
  }
  
  const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
  const letters = ['A', 'B', 'C', 'D'];
  document.getElementById('previewQuestionArea').innerHTML = `
    <div style="font-size: 14px; color: var(--muted); margin-bottom: 12px;">QUESTION ${currentQuestionNumber + 1}</div>
    <div class="preview-question-text">${escapeHtml(q.question_text)}</div>
    <div class="preview-options">
      ${opts.map((o, i) => `<div class="preview-option"><span class="preview-option-letter">${letters[i]}</span> ${escapeHtml(o)}</div>`).join('')}
    </div>
    <div id="previewBuzzerIndicator" style="margin-top: 20px; ${isQuestionOpen ? '' : 'display:none;'}">
      <div class="buzzer-open-badge"><span>🔴</span> BUZZERS ACTIVE!</div>
    </div>
  `;
}

// ─── Realtime Functions ───────────────────────────────────────────────────────────
function setupRealtimeChannel() {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  
  realtimeChannel = sb.channel(`fr-${roomCode}`);
  realtimeChannel
    .on('broadcast', { event: 'player_join' }, ({ payload }) => handlePlayerJoin(payload))
    .on('broadcast', { event: 'buzz' }, ({ payload }) => handleBuzz(payload))
    .on('broadcast', { event: 'player_heartbeat' }, ({ payload }) => handleHeartbeat(payload))
    .subscribe((status) => {
      const dot = document.getElementById('connDot');
      const txt = document.getElementById('connText');
      if (status === 'SUBSCRIBED') {
        dot.classList.add('connected');
        txt.innerText = 'Live';
      } else {
        dot.classList.remove('connected');
        txt.innerText = status;
      }
    });
}

function broadcast(event, payload) {
  if (realtimeChannel) {
    realtimeChannel.send({ type: 'broadcast', event, payload });
  }
}

function handleHeartbeat(payload) {
  const p = frPlayers.get(payload.id);
  if (p) {
    p.lastSeen = Date.now();
    p.connected = true;
  }
}

function handlePlayerJoin(payload) {
  if (frPlayers.has(payload.id)) {
    const p = frPlayers.get(payload.id);
    p.connected = true;
    p.lastSeen = Date.now();
    renderPlayersGrid();
    updatePreviewLeaderboard();
    return;
  }
  
  frPlayers.set(payload.id, {
    id: payload.id,
    name: payload.name,
    avatar: payload.avatar,
    score: 0,
    status: 'waiting',
    connected: true,
    lastSeen: Date.now()
  });
  
  renderPlayersGrid();
  updatePreviewLeaderboard();
  broadcast('player_list_update', { players: Array.from(frPlayers.values()) });
  toast(`✨ ${payload.avatar} ${payload.name} joined`);
}

function handleBuzz(payload) {
  if (!isQuestionOpen || buzzedPlayerId || !buzzerGlobalEnabled) return;
  if (lockedPlayers.has(payload.id) || eliminatedPlayers.has(payload.id)) return;
  
  const player = frPlayers.get(payload.id);
  if (!player) return;
  
  buzzedPlayerId = payload.id;
  isQuestionOpen = false;
  player.status = 'buzzed';
  frPlayers.forEach((p, id) => {
    if (id !== payload.id && !eliminatedPlayers.has(id)) p.status = 'locked';
  });
  
  document.getElementById('buzzerCard').style.display = 'block';
  document.getElementById('buzzedName').innerHTML = `${player.avatar} ${player.name}`;
  
  if (selectedQuestionForGame) {
    const letters = ['A', 'B', 'C', 'D'];
    const opts = [selectedQuestionForGame.option_a, selectedQuestionForGame.option_b, selectedQuestionForGame.option_c, selectedQuestionForGame.option_d];
    document.getElementById('buzzerCorrectText').innerHTML = `${letters[selectedQuestionForGame.correct_option]}: ${escapeHtml(opts[selectedQuestionForGame.correct_option])}`;
  }
  
  renderPlayersGrid();
  updatePreviewLeaderboard();
  broadcast('buzz_confirmed', { playerId: payload.id, playerName: player.name, playerAvatar: player.avatar });
  
  // Update preview to show buzzed player
  const buzzerIndicator = document.getElementById('previewBuzzerIndicator');
  if (buzzerIndicator) buzzerIndicator.style.display = 'none';
  document.getElementById('previewQuestionArea').innerHTML += `
    <div style="margin-top: 20px; padding: 12px; background: rgba(251,191,36,0.1); border-radius: 12px;">
      ⚡ ${player.avatar} ${player.name} is responding...
    </div>
  `;
  
  toast(`🔔 ${player.name} buzzed!`);
}

// ─── Game Controls ────────────────────────────────────────────────────────────────
function openQuestion() {
  if (!selectedQuestionForGame) {
    toast('Select a question first!', 'error');
    return;
  }
  
  isQuestionOpen = true;
  buzzedPlayerId = null;
  lockedPlayers.clear();
  buzzerGlobalEnabled = true;
  
  document.getElementById('buzzerToggleBtn').innerHTML = '🔔 BUZZERS ON';
  document.getElementById('buzzerToggleBtn').style.background = '#f97316';
  document.getElementById('buzzerCard').style.display = 'none';
  document.getElementById('openBtn').disabled = true;
  
  frPlayers.forEach((p, id) => {
    if (!eliminatedPlayers.has(id)) p.status = 'waiting';
  });
  
  currentQuestionNumber++;
  usedQuestionIds.add(selectedQuestionForGame.id);
  
  const opts = [selectedQuestionForGame.option_a, selectedQuestionForGame.option_b, selectedQuestionForGame.option_c, selectedQuestionForGame.option_d];
  
  broadcast('question_open', {
    question: selectedQuestionForGame.question_text,
    questionNumber: currentQuestionNumber,
    options: opts
  });
  
  // Update preview
  updatePreviewQuestion(selectedQuestionForGame);
  const buzzerIndicator = document.getElementById('previewBuzzerIndicator');
  if (buzzerIndicator) buzzerIndicator.style.display = 'block';
  
  renderPlayersGrid();
  renderQuestionBank();
  toast('🔔 Buzzers OPEN!');
}

function resetBuzzers() {
  if (!selectedQuestionForGame) return;
  
  buzzedPlayerId = null;
  lockedPlayers.clear();
  isQuestionOpen = true;
  buzzerGlobalEnabled = true;
  
  document.getElementById('buzzerToggleBtn').innerHTML = '🔔 BUZZERS ON';
  document.getElementById('buzzerCard').style.display = 'none';
  
  frPlayers.forEach((p, id) => {
    if (!eliminatedPlayers.has(id)) p.status = 'waiting';
  });
  
  renderPlayersGrid();
  updatePreviewLeaderboard();
  broadcast('reset_buzzers', {});
  toast('↺ Buzzers reset');
}

function markCorrect() {
  if (!buzzedPlayerId) return;
  
  const player = frPlayers.get(buzzedPlayerId);
  if (player) {
    player.score += pointsPerBuzz;
    player.status = 'correct';
  }
  
  document.getElementById('buzzerCard').style.display = 'none';
  document.getElementById('openBtn').disabled = true;
  
  broadcast('correct', {
    playerId: buzzedPlayerId,
    newScore: player?.score,
    playerName: player?.name,
    playerAvatar: player?.avatar,
    points: pointsPerBuzz
  });
  
  renderPlayersGrid();
  updatePreviewLeaderboard();
  toast(`✅ Correct! +${pointsPerBuzz} pts`);
  
  buzzedPlayerId = null;
  isQuestionOpen = false;
  
  setTimeout(() => broadcast('reset_for_next_question', {}), 1000);
}

function markWrong() {
  if (!buzzedPlayerId) return;
  
  const player = frPlayers.get(buzzedPlayerId);
  if (player) {
    player.status = 'wrong';
    lockedPlayers.add(buzzedPlayerId);
  }
  
  broadcast('wrong', { playerId: buzzedPlayerId, playerName: player?.name });
  renderPlayersGrid();
  updatePreviewLeaderboard();
  toast(`❌ Wrong — ${player?.name} locked out`);
  
  const remaining = Array.from(frPlayers.keys()).filter(id => !lockedPlayers.has(id) && !eliminatedPlayers.has(id));
  if (remaining.length > 0) {
    setTimeout(() => {
      isQuestionOpen = true;
      buzzerGlobalEnabled = true;
      document.getElementById('buzzerToggleBtn').innerHTML = '🔔 BUZZERS ON';
      broadcast('buzzers_reopen', {});
      document.getElementById('buzzerCard').style.display = 'none';
      
      // Update preview
      const buzzerIndicator = document.getElementById('previewBuzzerIndicator');
      if (buzzerIndicator) buzzerIndicator.style.display = 'block';
    }, 5000);
  } else {
    document.getElementById('buzzerCard').style.display = 'none';
  }
  
  buzzedPlayerId = null;
}

function nextQuestion() {
  buzzedPlayerId = null;
  isQuestionOpen = false;
  selectedQuestionForGame = null;
  
  document.getElementById('buzzerCard').style.display = 'none';
  document.getElementById('openBtn').disabled = true;
  document.getElementById('resetBtn').disabled = true;
  document.getElementById('selectedQuestionDisplay').innerHTML = '<div style="color:var(--muted); font-size:12px;">← Select a question above</div>';
  
  frPlayers.forEach((p, id) => {
    if (!eliminatedPlayers.has(id)) p.status = 'waiting';
  });
  lockedPlayers.clear();
  
  renderPlayersGrid();
  updatePreviewLeaderboard();
  updatePreviewQuestion(null);
  broadcast('next_question', {});
}

function startTimer() {
  const seconds = parseInt(document.getElementById('timerSeconds').value) || 10;
  broadcast('timer_start', { seconds });
  toast(`⏱️ Timer: ${seconds}s`);
}

function toggleBuzzerGlobal() {
  buzzerGlobalEnabled = !buzzerGlobalEnabled;
  const btn = document.getElementById('buzzerToggleBtn');
  if (buzzerGlobalEnabled) {
    btn.innerHTML = '🔔 BUZZERS ON';
    btn.style.background = '#f97316';
  } else {
    btn.innerHTML = '🔕 BUZZERS OFF';
    btn.style.background = '#ef4444';
  }
  broadcast('buzzer_toggle', { enabled: buzzerGlobalEnabled });
  toast(`Buzzers ${buzzerGlobalEnabled ? 'ON' : 'OFF'}`);
}

function eliminatePlayer(id) {
  const player = frPlayers.get(id);
  if (!player || !confirm(`Eliminate ${player.name}?`)) return;
  
  eliminatedPlayers.add(id);
  player.status = 'eliminated';
  
  if (buzzedPlayerId === id) {
    buzzedPlayerId = null;
    document.getElementById('buzzerCard').style.display = 'none';
  }
  
  renderPlayersGrid();
  updatePreviewLeaderboard();
  broadcast('eliminated', { playerId: id, playerName: player.name });
  toast(`⚡ ${player.name} eliminated`);
}

// ─── Render Functions ─────────────────────────────────────────────────────────────
function renderPlayersGrid() {
  const sorted = Array.from(frPlayers.values()).sort((a, b) => b.score - a.score);
  const grid = document.getElementById('playersGrid');
  
  if (sorted.length === 0) {
    grid.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);">Waiting for players...</div>';
    document.getElementById('playerCount').innerText = '0';
    return;
  }
  
  grid.innerHTML = sorted.map(p => {
    const isElim = eliminatedPlayers.has(p.id);
    const isDC = !p.connected;
    let badge = '';
    if (p.status === 'buzzed') badge = '🔔 BUZZED';
    else if (p.status === 'correct') badge = '✅ CORRECT';
    else if (p.status === 'wrong') badge = '❌ WRONG';
    else if (isElim) badge = '⚡ OUT';
    else badge = '● READY';
    
    return `
      <div class="player-card ${isElim ? 'eliminated' : ''} ${p.status === 'buzzed' ? 'buzzed' : ''}">
        <div class="player-avatar">${p.avatar}</div>
        <div class="player-info">
          <div class="player-name">${escapeHtml(p.name)}</div>
          <div style="font-size:10px;color:var(--muted);">${badge}</div>
        </div>
        <div class="player-score">${p.score}</div>
        ${!isElim ? `<button class="eliminate-btn" onclick="eliminatePlayer('${p.id}')">⚡ Eliminate</button>` : ''}
      </div>
    `;
  }).join('');
  
  document.getElementById('playerCount').innerText = frPlayers.size;
}

function updatePreviewLeaderboard() {
  const sorted = Array.from(frPlayers.values())
    .filter(p => !eliminatedPlayers.has(p.id))
    .sort((a, b) => b.score - a.score)
    .slice(0, 10);
  
  const container = document.getElementById('previewPlayerList');
  if (sorted.length === 0) {
    container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);">Waiting for players...</div>';
    return;
  }
  
  container.innerHTML = sorted.map((p, i) => `
    <div class="preview-player-row">
      <div class="preview-player-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}`}</div>
      <div class="preview-player-name">${p.avatar} ${escapeHtml(p.name)}</div>
      <div class="preview-player-score">${p.score}</div>
    </div>
  `).join('');
}

function updatePreviewLeaderboard() {
  const sorted = Array.from(frPlayers.values())
    .filter(p => !eliminatedPlayers.has(p.id))
    .sort((a, b) => b.score - a.score)
    .slice(0, 10);
  
  const container = document.getElementById('previewPlayerList');
  if (sorted.length === 0) {
    container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);">Waiting for players...</div>';
    return;
  }
  
  container.innerHTML = sorted.map((p, i) => `
    <div class="preview-player-row">
      <div class="preview-player-rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}`}</div>
      <div class="preview-player-name">${p.avatar} ${escapeHtml(p.name)}</div>
      <div class="preview-player-score">${p.score}</div>
    </div>
  `).join('');
}

// ─── Utility Functions ────────────────────────────────────────────────────────────
function copyRoomLink() {
  const joinUrl = `${window.location.origin}/finalroundplayer.html?room=${roomCode}`;
  navigator.clipboard.writeText(joinUrl);
  toast('📋 Join link copied!');
}

function showQRCode() {
  const joinUrl = `${window.location.origin}/finalroundplayer.html?room=${roomCode}`;
  alert(`Room Code: ${roomCode}\nJoin URL: ${joinUrl}\n\nShare this code or URL with players.`);
  // You can add QR code modal here
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerText = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

// ─── Initialization ───────────────────────────────────────────────────────────────
async function init() {
  setupRealtimeChannel();
  await loadQuestionsFromDB();
  
  // Update preview status
  document.getElementById('previewStatus').innerText = 'Ready • ' + (allQuestions.length) + ' questions';
}

init();

// Expose functions globally
window.selectQuestion = selectQuestion;
window.fireQuestion = fireQuestion;
window.filterByCategory = filterByCategory;
window.openQuestion = openQuestion;
window.markCorrect = markCorrect;
window.markWrong = markWrong;
window.resetBuzzers = resetBuzzers;
window.nextQuestion = nextQuestion;
window.eliminatePlayer = eliminatePlayer;
window.startTimer = startTimer;
window.toggleBuzzerGlobal = toggleBuzzerGlobal;
window.copyRoomLink = copyRoomLink;
window.showQRCode = showQRCode;
</script>
