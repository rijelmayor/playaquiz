<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Crowd Says — Play Along</title>
<style>
  :root {
    --navy-deep: #06080F;
    --navy-panel: #11162A;
    --navy-line: #232B45;
    --gold: #E8B84B;
    --gold-bright: #FFD571;
    --teal: #3DDC97;
    --red: #D14545;
    --text-hi: #F4F1E8;
    --text-lo: #6E7493;
    --font-display: 'Archivo Black', 'Arial Black', sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--navy-deep); color: var(--text-hi);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh; width: 100%;
  }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 14px) 14px env(safe-area-inset-bottom, 14px) 14px;
    gap: 12px;
  }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 2px 10px; border-bottom: 1px solid var(--navy-line);
  }
  .brand { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; color: var(--text-lo); text-transform: uppercase; }
  .brand strong { color: var(--gold); }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); display: inline-block; margin-right: 5px; }
  .conn-dot.off { background: var(--red); }

  .idle-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 30px 20px; }
  .idle-state .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.25em; color: var(--gold); text-transform: uppercase; }
  .idle-state h2 { font-family: var(--font-display); font-size: 28px; }
  .idle-state p { color: var(--text-lo); font-size: 13px; max-width: 260px; line-height: 1.5; }

  .active-state { display: none; flex: 1; flex-direction: column; gap: 12px; }
  .active-state.show { display: flex; }

  .pot-strip {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--navy-panel); border: 1px solid var(--navy-line); border-radius: 12px;
    padding: 10px 14px;
  }
  .pot-strip .label { font-family: var(--font-mono); font-size: 11px; color: var(--text-lo); text-transform: uppercase; letter-spacing: 0.1em; }
  .pot-strip .val { font-family: var(--font-display); font-size: 24px; color: var(--gold-bright); }

  .prompt-card {
    background: var(--navy-panel); border: 1px solid var(--navy-line); border-radius: 14px;
    padding: 16px; text-align: center;
  }
  .prompt-card .prompt-text { font-size: 17px; font-weight: 600; line-height: 1.35; }

  .status-pill {
    text-align: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; padding: 8px; border-radius: 100px; background: var(--navy-panel);
    color: var(--text-lo); border: 1px solid var(--navy-line);
  }
  .status-pill.randomizing { color: var(--gold); border-color: var(--gold); animation: pulseBorder 1.1s infinite; }
  .status-pill.steal { color: var(--red); border-color: var(--red); }
  @keyframes pulseBorder { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  .mini-board { display: flex; flex-direction: column; gap: 7px; }
  .mini-tile {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--navy-panel); border: 1px solid var(--navy-line); border-radius: 10px;
    padding: 11px 14px; font-size: 14px;
  }
  .mini-tile.revealed { border-color: var(--teal); background: rgba(61,220,151,0.06); }
  .mini-tile .t-text { color: var(--text-lo); }
  .mini-tile.revealed .t-text { color: var(--text-hi); }
  .mini-tile .t-pts { font-family: var(--font-mono); color: var(--gold); font-size: 13px; }
  .mini-tile.revealed .t-pts { color: var(--gold-bright); }

  .teams-mini {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(86px, 1fr)); gap: 8px;
    margin-top: auto; max-height: 30vh; overflow-y: auto;
  }
  .team-mini-card {
    background: var(--navy-panel); border: 2px solid var(--navy-line); border-radius: 10px;
    padding: 8px; text-align: center;
  }
  .team-mini-card.control { border-color: var(--gold); }
  .team-mini-card .nm {
    font-family: var(--font-mono); font-size: 9px; color: var(--text-lo); text-transform: uppercase;
    letter-spacing: 0.08em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .team-mini-card .sc { font-family: var(--font-display); font-size: 18px; margin-top: 2px; }
  .team-mini-card.control .sc { color: var(--gold); }

  .strikes-mini { display: flex; justify-content: center; gap: 6px; }
  .strikes-mini .s { width: 24px; height: 24px; border: 2px solid var(--navy-line); border-radius: 5px; display:flex; align-items:center; justify-content:center; font-size: 12px; color: var(--navy-line); font-family: var(--font-mono); }
  .strikes-mini .s.hit { border-color: var(--red); color: var(--red); background: rgba(209,69,69,0.12); }

  .cheer-hint { text-align: center; font-size: 12px; color: var(--text-lo); padding: 4px 0 0; }

  #errorBanner {
    display: none; position: fixed; top: 0; left: 0; right: 0;
    background: #D14545; color: #fff; padding: 14px 16px;
    font-family: monospace; font-size: 12px; z-index: 9999;
    max-height: 50vh; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  }
  #errorBanner .err-close {
    float: right; cursor: pointer; font-size: 16px; line-height: 1; margin-left: 12px;
    background: rgba(255,255,255,0.2); border: none; color: #fff; border-radius: 4px; padding: 2px 8px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">PLAY<strong>A</strong>QUIZ <span style="color:var(--text-lo)">/ CROWD SAYS</span></div>
  <div><span class="conn-dot" id="connDot"></span></div>
</header>

<div class="idle-state" id="idleState">
  <div class="eyebrow">Play along</div>
  <h2>Crowd Says</h2>
  <p>The host is setting up the next round. Keep your eyes on the big screen — this one's a watch-and-cheer segment!</p>
</div>

<div class="active-state" id="activeState">
  <div class="status-pill" id="statusPill">—</div>
  <div class="prompt-card">
    <div class="prompt-text" id="promptText">—</div>
  </div>
  <div class="pot-strip">
    <span class="label">Pot</span>
    <span class="val" id="potValue">0</span>
  </div>
  <div class="mini-board" id="miniBoard"></div>
  <div class="cheer-hint" id="cheerHint">Cheer your team on — the host is running the board up front.</div>
  <div class="teams-mini" id="teamsMini"></div>
  <div class="strikes-mini">
    <div class="s" id="strike1">✕</div>
    <div class="s" id="strike2">✕</div>
    <div class="s" id="strike3">✕</div>
  </div>
</div>

<div id="errorBanner">
  <button class="err-close" onclick="document.getElementById('errorBanner').style.display='none'">✕ dismiss</button>
  <span id="errorBannerText"></span>
</div>

<script>
  function showBannerMsg(msg) {
    var banner = document.getElementById('errorBanner');
    var text = document.getElementById('errorBannerText');
    banner.style.display = 'block';
    text.textContent += msg + '\n\n';
  }
  window.addEventListener('error', function(e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
      showBannerMsg('⚠ SCRIPT FAILED TO LOAD: ' + (e.target.src || '(inline script)'));
      return;
    }
    var msg = e.message || (e.error && e.error.message);
    if (!msg || msg === 'Script error.') return;
    showBannerMsg('⚠ ERROR: ' + msg + ' (line ' + e.lineno + ')');
  }, true);
  window.addEventListener('unhandledrejection', function(e) {
    showBannerMsg('⚠ UNHANDLED: ' + (e.reason && e.reason.message ? e.reason.message : JSON.stringify(e.reason)));
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  onerror="showBannerMsg('⚠ Supabase CDN failed to load — check internet / ad-blocker')"></script>
<script>
  if (typeof window.supabase === 'undefined') {
    showBannerMsg('⚠ Supabase library undefined after load.');
  }
</script>
<script>
  const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const roomCode = (params.get('room') || '').toUpperCase();
  let sessionId = null;
  let channel = null;
  let currentQuestion = null;
  let teamNames = [];
  let teamScores = [];
  let controllingTeam = null;

  const playerId = sessionStorage.getItem('crowdsays_player_id') || crypto.randomUUID();
  sessionStorage.setItem('crowdsays_player_id', playerId);

  function teamLabel(idx) { return (idx !== null && idx !== undefined && teamNames[idx]) ? teamNames[idx] : '—'; }
  function setConn(ok) { document.getElementById('connDot').classList.toggle('off', !ok); }

  async function init() {
    if (!roomCode) {
      document.getElementById('idleState').querySelector('p').textContent = 'No room code in link — ask your host for the play link.';
      return;
    }
    const { data: sessionRow } = await db.from('crowdsays_sessions').select('*').eq('room_code', roomCode).maybeSingle();
    if (!sessionRow) {
      document.getElementById('idleState').querySelector('p').textContent = 'Room not found — check the link with your host.';
      return;
    }
    sessionId = sessionRow.id;
    teamNames = Array.isArray(sessionRow.team_names) ? sessionRow.team_names : [];
    await loadState();
    subscribeRealtime();
    startPoll();
  }

  async function loadState() {
    const { data } = await db.from('crowdsays_state').select('*').eq('session_id', sessionId).maybeSingle();
    if (!data) return;
    if (data.current_question_id) {
      const { data: qRow } = await db.from('crowdsays_questions').select('*').eq('id', data.current_question_id).single();
      currentQuestion = qRow;
    } else {
      currentQuestion = null;
    }
    renderFromState(data);
    setConn(true);
  }

  function subscribeRealtime() {
    channel = db.channel(`room:${roomCode}`, { config: { broadcast: { self: false } } });
    channel.on('broadcast', { event: 'crowdsays_question_loaded' }, (msg) => handleQuestionLoaded(msg.payload));
    channel.on('broadcast', { event: 'crowdsays_randomize_started' }, (msg) => handleRandomizeStarted(msg.payload));
    channel.on('broadcast', { event: 'crowdsays_answer_revealed' }, (msg) => handleAnswerRevealed(msg.payload));
    channel.on('broadcast', { event: 'crowdsays_strike' }, (msg) => setStrikes(msg.payload.strikes));
    channel.on('broadcast', { event: 'crowdsays_steal_started' }, (msg) => handleStealStarted(msg.payload));
    channel.on('broadcast', { event: 'crowdsays_round_won' }, (msg) => handleRoundWon(msg.payload));
    channel.on('broadcast', { event: 'crowdsays_board_cleared' }, () => handleBoardCleared());
    channel.on('broadcast', { event: 'crowdsays_team_renamed' }, (msg) => { teamNames = msg.payload.team_names; renderTeamsMini(); });
    channel.subscribe((status) => setConn(status === 'SUBSCRIBED'));
  }

  function startPoll() { setInterval(loadState, 8000); }

  function handleQuestionLoaded(payload) {
    document.getElementById('idleState').style.display = 'none';
    document.getElementById('activeState').classList.add('show');
    document.getElementById('promptText').textContent = payload.prompt;
    document.getElementById('potValue').textContent = '0';
    setStatus('randomizing', 'Watch the big screen…');
    setStrikes(0);
    setControl(null);
    currentQuestion = { id: payload.question_id, prompt: payload.prompt, answers: new Array(payload.answer_count).fill({ text: '', points: 0 }), revealed_answers: [] };
    renderMiniBoard([]);
    document.getElementById('cheerHint').textContent = 'The host is about to randomize who controls the board.';
  }

  function handleRandomizeStarted(payload) {
    teamNames = payload.team_names || teamNames;
    renderTeamsMini();
    setStatus('randomizing', 'Shuffling on the big screen…');
    document.getElementById('cheerHint').textContent = "Eyes up — who's it gonna be?";
    setTimeout(() => {
      setStatus('playing', `${teamLabel(payload.result_index)} in control`);
      setControl(payload.result_index);
      document.getElementById('cheerHint').textContent = `${teamLabel(payload.result_index)} is calling out answers now.`;
    }, 2000);
  }

  function handleAnswerRevealed(payload) {
    if (!currentQuestion) return;
    currentQuestion.answers[payload.index] = { text: payload.text, points: payload.points };
    currentQuestion.revealed_answers = [...(currentQuestion.revealed_answers || []), payload.index];
    document.getElementById('potValue').textContent = payload.pot;
    renderMiniBoard(currentQuestion.revealed_answers);
  }

  function handleStealStarted(payload) {
    setStatus('steal', 'Steal! Open floor, one guess wins it');
    document.getElementById('cheerHint').textContent = 'Anyone can call it out now — one shot to steal the pot!';
  }

  function handleRoundWon(payload) {
    const verb = payload.by_steal ? (payload.steal_success ? 'stole' : 'held on to') : 'won';
    setStatus('', `${teamLabel(payload.team_index)} ${verb} the round`);
    document.getElementById('cheerHint').textContent = `+${payload.amount} points for ${teamLabel(payload.team_index)}`;
  }

  function handleBoardCleared() {
    document.getElementById('activeState').classList.remove('show');
    document.getElementById('idleState').style.display = 'flex';
    document.getElementById('idleState').querySelector('p').textContent = 'Waiting for the next question — eyes on the big screen!';
    currentQuestion = null;
  }

  function renderFromState(data) {
    teamScores = Array.isArray(data.team_scores) ? data.team_scores : [];
    controllingTeam = data.controlling_team;
    document.getElementById('potValue').textContent = data.pot;
    setStrikes(data.strikes);
    renderTeamsMini();

    if (data.round_status === 'idle' && !currentQuestion) {
      document.getElementById('activeState').classList.remove('show');
      document.getElementById('idleState').style.display = 'flex';
      return;
    }
    document.getElementById('idleState').style.display = 'none';
    document.getElementById('activeState').classList.add('show');
    if (currentQuestion) {
      document.getElementById('promptText').textContent = currentQuestion.prompt;
      renderMiniBoard(currentQuestion.revealed_answers || []);
    }
    const map = {
      randomizing: ['randomizing', 'Watch the big screen…'],
      playing: ['playing', data.controlling_team !== null && data.controlling_team !== undefined ? `${teamLabel(data.controlling_team)} in control` : ''],
      steal: ['steal', 'Steal — open floor, one guess wins it']
    };
    const [cls, text] = map[data.round_status] || ['', ''];
    setStatus(cls, text);
  }

  function renderTeamsMini() {
    const wrap = document.getElementById('teamsMini');
    wrap.innerHTML = teamNames.map((name, i) => `
      <div class="team-mini-card ${controllingTeam === i ? 'control' : ''}">
        <div class="nm">${escapeHtml(name)}</div>
        <div class="sc">${teamScores[i] || 0}</div>
      </div>
    `).join('');
  }

  function renderMiniBoard(revealedIndices) {
    if (!currentQuestion) return;
    const wrap = document.getElementById('miniBoard');
    wrap.innerHTML = currentQuestion.answers.map((a, i) => {
      const isRevealed = revealedIndices.includes(i);
      return `
        <div class="mini-tile ${isRevealed ? 'revealed' : ''}">
          <span class="t-text">${isRevealed ? escapeHtml(a.text) : `Answer ${i + 1}`}</span>
          <span class="t-pts">${isRevealed ? a.points : ''}</span>
        </div>`;
    }).join('');
  }

  function setStrikes(n) {
    [1, 2, 3].forEach(i => document.getElementById(`strike${i}`).classList.toggle('hit', n >= i));
  }

  function setControl(idx) { controllingTeam = idx; renderTeamsMini(); }

  function setStatus(cls, text) {
    const el = document.getElementById('statusPill');
    el.className = 'status-pill' + (cls ? ' ' + cls : '');
    el.textContent = text;
  }

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  init().catch(function(err) {
    showBannerMsg('⚠ INIT ERROR: ' + (err && err.message ? err.message : String(err)));
  });
</script>
</body>
</html>
