<!DOCTYPE html>
<html>
<head><title>Set Admin Password</title></head>
<body>
    <h2>Set Admin Password</h2>
    <input type="password" id="newPwd" placeholder="New Password">
    <input type="password" id="confirmPwd" placeholder="Confirm Password">
    <button onclick="updatePassword()">Update</button>
    <div id="result"></div>

    <script>
    const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    
    async function hashPassword(password) {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    
    async function updatePassword() {
        const pwd = document.getElementById('newPwd').value;
        const confirm = document.getElementById('confirmPwd').value;
        
        if (!pwd) { alert('Enter password'); return; }
        if (pwd !== confirm) { alert('Passwords do not match'); return; }
        
        const hash = await hashPassword(pwd);
        
        const { error } = await sb
            .from('admin_settings')
            .update({ admin_password_hash: hash, updated_at: new Date() })
            .eq('id', 1);
        
        if (error) {
            document.getElementById('result').innerHTML = '❌ Error: ' + error.message;
        } else {
            document.getElementById('result').innerHTML = '✅ Password updated successfully!';
        }
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
