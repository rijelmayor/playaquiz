<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RetroGreetings — Vintage Video Jukebox + Loop</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #1a1a2a, #0a0a12);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'VT323', 'Share Tech Mono', monospace;
      padding: 20px;
    }

    .tv-cabinet {
      background: #2c1e12;
      border-radius: 48px 48px 32px 32px;
      padding: 24px 28px 36px 28px;
      box-shadow: 0 30px 40px rgba(0,0,0,0.6), inset 0 1px 4px rgba(255,255,200,0.2);
      border-bottom: 6px solid #8b5a2b;
    }

    .crt-tube {
      background: #000000;
      border-radius: 28px;
      padding: 12px;
      box-shadow: inset 0 0 30px rgba(0,255,100,0.1), 0 10px 20px rgba(0,0,0,0.5);
      border: 1px solid #6b4c2c;
    }

    .tv-screen {
      background: #0b0f0b;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16 / 9;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.8), 0 0 0 3px #cb9e6b, 0 0 0 8px #3b2a1c;
    }

    .tv-screen::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,255,0,0.03) 0px, rgba(0,255,0,0.03) 2px, transparent 2px, transparent 6px);
      pointer-events: none;
      z-index: 2;
    }

    .tv-screen::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 2;
    }

    #videoElement {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    #imageElement {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
      z-index: 1;
    }

    .standby-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3;
      transition: opacity 0.5s ease;
    }

    .static-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.3"/></svg>');
      background-repeat: repeat;
      background-size: 200px 150px;
      opacity: 0.4;
      pointer-events: none;
    }

    .standby-text {
      font-family: 'VT323', monospace;
      font-size: 28px;
      color: #8b8b8b;
      text-align: center;
      letter-spacing: 6px;
      animation: blink 2s step-end infinite;
      z-index: 4;
      background: #000000aa;
      padding: 12px 24px;
      border-radius: 8px;
    }

    .standby-text small {
      font-size: 16px;
      letter-spacing: 2px;
      color: #6b6b6b;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .control-deck {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      background: #2f2318;
      border-radius: 60px;
      padding: 14px 24px;
      border-top: 2px solid #cb9e6b;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.4);
    }

    .knob-group {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #221b12;
      padding: 6px 20px;
      border-radius: 60px;
      box-shadow: inset 0 1px 2px #553e22, 0 2px 5px black;
    }

    .knob {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .knob-label {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: #e2c28b;
      text-transform: uppercase;
      font-weight: 700;
    }

    .dial {
      width: 52px;
      height: 52px;
      background: radial-gradient(circle at 30% 30%, #555, #222);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 6px black, inset 0 1px 2px rgba(255,255,200,0.4);
      border: 1px solid #cdaa77;
      transition: transform 0.1s ease;
      font-size: 26px;
      font-weight: bold;
      color: #ffd966;
      text-shadow: 0 1px 0 #000;
    }

    .dial:active {
      transform: scale(0.94);
    }

    .upload-zone {
      background: #12100c;
      border: 2px dashed #b87c3a;
      border-radius: 40px;
      padding: 8px 16px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'VT323', monospace;
      font-size: 18px;
      letter-spacing: 2px;
      color: #e6c28f;
    }

    .upload-zone:hover {
      background: #2a241a;
      border-color: #f3b35f;
    }

    #fileInput {
      display: none;
    }

    .greeting-selector {
      background: #1e1911;
      padding: 6px 14px;
      border-radius: 60px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-family: 'VT323', monospace;
      font-size: 20px;
    }

    select {
      background: #2f2419;
      border: 1px solid #cb9e6b;
      color: #ffeaac;
      padding: 8px 14px;
      border-radius: 40px;
      font-family: 'VT323', monospace;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }

    .volume-value {
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      color: #ffd966;
      background: #00000066;
      padding: 2px 8px;
      border-radius: 20px;
      min-width: 48px;
      text-align: center;
    }

    .status-led {
      width: 12px;
      height: 12px;
      background: #ff3333;
      border-radius: 50%;
      box-shadow: 0 0 6px red;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9);}
      100% { opacity: 1; transform: scale(1.2);}
    }

    .upload-progress {
      font-size: 14px;
      font-family: monospace;
      color: #9eff8a;
    }

    .toast-retro {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: #1a1f12;
      border-left: 6px solid #ffcf4a;
      padding: 12px 24px;
      font-family: 'VT323', monospace;
      font-size: 20px;
      color: #fee6b0;
      z-index: 1000;
      border-radius: 16px;
      box-shadow: 0 5px 15px black;
    }

    /* TV screen fade overlay for smooth autoplay transitions */
    #tvFadeOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.45s ease;
    }
    #tvFadeOverlay.fade-in  { opacity: 1; }
    #tvFadeOverlay.fade-out { opacity: 0; }

    #deleteTapeBtn:hover { background: radial-gradient(circle at 30% 30%,#aa3333,#3a0a0a) !important; border-color:#ff5555 !important; }
    #deleteTapeBtn:active { transform: scale(0.9); }
  </style>
</head>
<body>
<div class="tv-cabinet">
  <div class="crt-tube">
    <div class="tv-screen" id="tvScreen">
      <div id="tvFadeOverlay"></div>
      <video id="videoElement" style="width:100%;height:100%;display:none"></video>
      <img id="imageElement" style="width:100%;height:100%;object-fit:contain;display:none;background:#000;">
      <div class="standby-screen" id="standbyScreen">
        <canvas id="staticCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;"></canvas>
        <div class="standby-text">
          📺 NO SIGNAL<br>
          <small>SELECT A GREETING TAPE</small>
        </div>
      </div>
    </div>
  </div>

  <div class="control-deck">
    <div class="knob-group">
      <div class="knob">
        <span class="knob-label">📢 VOLUME</span>
        <div class="dial" id="volumeDial">🔊</div>
        <span id="volumePercent" class="volume-value">65%</span>
      </div>
      <div class="knob">
        <span class="knob-label">⏪ REEL ⏩</span>
        <div style="display: flex; gap: 10px; align-items: center;">
          <div class="dial" id="rewindBtn" style="width: 44px; height: 44px; font-size: 24px;">⏪</div>
          <div class="dial" id="playBtn" style="width: 54px; height: 54px; background: radial-gradient(circle at 30% 30%, #3b6b3b, #1a3a1a);">▶</div>
          <div class="dial" id="forwardBtn" style="width: 44px; height: 44px; font-size: 24px;">⏩</div>
        </div>
      </div>
    </div>

    <div class="greeting-selector">
      <span>📼 GREETING TAPE</span>
      <select id="greetingSelect">
        <option value="">-- No Signal --</option>
      </select>
      <div class="status-led" id="liveLed"></div>
      <div class="dial" id="deleteTapeBtn" style="width:44px;height:44px;font-size:22px;background:radial-gradient(circle at 30% 30%,#6b2222,#2a0a0a);border-color:#cc4444;" title="Delete selected tape">🗑️</div>
    </div>

    <!-- NEW LOOP BUTTON - actual vintage loop module -->
    <div class="upload-zone" id="loopToggleBtn" style="border-color:#f0a84d; background:#1f1a10;">
      🔁 LOOP OFF
    </div>

    <div class="upload-zone" id="autoplayTrigger" style="border-color:#e2a84b;">
      📼 AUTOPLAY ALL
    </div>

    <div class="upload-zone" id="uploadTrigger">
      📀 UPLOAD VIDEO / IMAGE
      <input type="file" id="fileInput" accept="video/mp4,video/webm,video/quicktime,image/png,image/jpeg,image/gif">
    </div>
  </div>

  <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px;">
    <span style="font-family: 'Share Tech Mono'; color: #cbaa72; font-size: 13px;">RETRO GREETINGS · TV STUDIO</span>
    <span id="uploadStatus" class="upload-progress"></span>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  const videoEl = document.getElementById('videoElement');
  const imageEl = document.getElementById('imageElement');
  const standbyScreen = document.getElementById('standbyScreen');
  const tvScreen = document.getElementById('tvScreen');
  const greetingSelect = document.getElementById('greetingSelect');
  const volumeDialDiv = document.getElementById('volumeDial');
  const volumePercentSpan = document.getElementById('volumePercent');
  const rewindBtn = document.getElementById('rewindBtn');
  const playBtn = document.getElementById('playBtn');
  const forwardBtn = document.getElementById('forwardBtn');
  const fileInput = document.getElementById('fileInput');
  const uploadTrigger = document.getElementById('uploadTrigger');
  const uploadStatusSpan = document.getElementById('uploadStatus');
  const liveLed = document.getElementById('liveLed');
  const loopToggleBtn = document.getElementById('loopToggleBtn');
  const deleteTapeBtn = document.getElementById('deleteTapeBtn');
  const tvFadeOverlay = document.getElementById('tvFadeOverlay');

  let currentVolume = 0.65;
  let currentVideoUrl = null;
  let currentVideoId = null;
  let greetingsList = [];
  let isVideoPlaying = false;

  // --- NEW LOOP STATE ---
  let loopActive = false;     // true = current video will replay infinitely after ending
  let loopWasActiveDuringAutoplay = false; // separate logic to let autoplay not conflict

  // Show standby screen, hide video
  function showStandby() {
    standbyScreen.style.display = 'flex';
    videoEl.style.display = 'none';
    imageEl.style.display = 'none';
    videoEl.pause();
    isVideoPlaying = false;
    playBtn.innerHTML = "▶";
  }

  // Show video player, hide standby
  function showVideo() {
    standbyScreen.style.display = 'none';
    videoEl.style.display = 'block';
    imageEl.style.display = 'none';
  }

  // Show image, hide standby and video
  function showImage() {
    standbyScreen.style.display = 'none';
    videoEl.style.display = 'none';
    imageEl.style.display = 'block';
  }

  function setVolume(value01) {
    currentVolume = Math.min(1, Math.max(0, value01));
    videoEl.volume = currentVolume;
    volumePercentSpan.innerText = `${Math.round(currentVolume * 100)}%`;
    if (currentVolume < 0.2) volumeDialDiv.innerHTML = '🔈';
    else if (currentVolume < 0.6) volumeDialDiv.innerHTML = '🔉';
    else volumeDialDiv.innerHTML = '🔊';
  }

  function volumeUp() { setVolume(currentVolume + 0.1); }
  function volumeDown() { setVolume(currentVolume - 0.1); }

  function playVideo() {
    if (videoEl.src && videoEl.src !== '') {
      videoEl.muted = false;
      const playPromise = videoEl.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          isVideoPlaying = true;
          playBtn.innerHTML = "⏸";
        }).catch(e => {
          console.log("Play error:", e);
          showToast("🔊 Click anywhere to enable audio", 2000);
          document.body.onclick = function enableAudio() {
            videoEl.muted = false;
            videoEl.play().catch(()=>{});
            document.body.onclick = null;
            showToast("✅ Audio enabled!", 1000);
          };
        });
      }
    } else {
      showToast("📭 No video loaded, select a greeting from the dropdown", 1500);
    }
  }

  function pauseVideo() { 
    videoEl.pause(); 
    isVideoPlaying = false;
    playBtn.innerHTML = "▶";
  }

  function rewindVideo() {
    if (videoEl.src && videoEl.src !== '') {
      if (videoEl.currentTime > 3) videoEl.currentTime -= 3;
      else videoEl.currentTime = 0;
      showToast("⏪ REWIND 3s", 800);
    } else {
      showToast("No video playing", 800);
    }
  }

  function forwardVideo() {
    if (videoEl.src && videoEl.src !== '') {
      if (videoEl.duration && videoEl.currentTime + 3 < videoEl.duration) videoEl.currentTime += 3;
      else if (videoEl.duration) videoEl.currentTime = videoEl.duration - 0.5;
      showToast("⏩ FORWARD 3s", 800);
    } else {
      showToast("No video playing", 800);
    }
  }

  // core loading function with loop awareness (reset loop on new video? we preserve loop state)
  function loadVideoByUrl(url, videoId, title, keepLoopStatus = false, mediaType = null) {
    if (!url) {
      showStandby();
      currentVideoUrl = null;
      currentVideoId = null;
      return;
    }

    currentVideoUrl = url;
    currentVideoId = videoId;

    // Use explicit mediaType if passed, otherwise fall back to URL extension detection
    const isImage = mediaType === 'image' || (!mediaType && /\.(png|jpe?g|gif)([?#]|$)/i.test(url));

    if (isImage) {
      videoEl.pause();
      videoEl.src = '';
      videoEl.style.display = 'none';
      imageEl.src = url;
      showImage();
      isVideoPlaying = false;
      playBtn.innerHTML = "▶";
      showToast(`🖼️ Now showing: ${title || "image"}`, 1500);
    } else {
      imageEl.src = '';
      imageEl.style.display = 'none';
      showVideo();
      videoEl.pause();
      videoEl.src = url;
      videoEl.load();
      videoEl.muted = false;
      videoEl.volume = currentVolume;
      showToast(`📺 Now playing: ${title || "greeting"}`, 1500);
      // Make sure loop attribute on video element follows our UI state
      videoEl.loop = loopActive;
      setTimeout(() => {
        playVideo();
      }, 100);
    }
  }

  // Update loop UI and video element's .loop property
  function setLoopMode(active) {
    loopActive = active;
    if (videoEl) {
      videoEl.loop = loopActive;
    }
    // update button visual & text
    if (loopActive) {
      loopToggleBtn.innerHTML = "🔁 LOOP ON";
      loopToggleBtn.style.borderColor = "#7aff87";
      loopToggleBtn.style.background = "#2a4422";
      showToast("🔁 Loop mode ENABLED — video will repeat", 1200);
    } else {
      loopToggleBtn.innerHTML = "🔁 LOOP OFF";
      loopToggleBtn.style.borderColor = "#f0a84d";
      loopToggleBtn.style.background = "#1f1a10";
      showToast("⏹ Loop mode DISABLED", 1000);
    }
  }

  // toggle loop button handler
  function toggleLoop() {
    setLoopMode(!loopActive);
  }

  // ── DELETE TAPE ─────────────────────────────────────────────────────────────
  async function deleteCurrentTape() {
    const selectedId = greetingSelect.value;
    if (!selectedId) {
      showToast("📼 No tape selected to delete", 1500);
      return;
    }
    const greeting = greetingsList.find(g => g.id === selectedId);
    if (!greeting) return;

    const confirmed = confirm(`🗑️ Delete tape "${greeting.title}"?\n\nThis cannot be undone.`);
    if (!confirmed) return;

    showToast("⏳ Ejecting & deleting tape…", 2000);

    // Extract storage path from public URL (everything after /object/public/greetings/)
    try {
      const urlObj = new URL(greeting.video_url);
      const pathMatch = urlObj.pathname.match(/\/object\/public\/greetings\/(.+)$/);
      if (pathMatch) {
        const storagePath = decodeURIComponent(pathMatch[1]);
        await sb.storage.from('greetings').remove([storagePath]);
      }
    } catch (e) {
      console.warn("Storage delete skipped (URL parse failed):", e);
    }

    // Delete from DB
    const { error: dbErr } = await sb
      .from('video_greetings')
      .delete()
      .eq('id', selectedId);

    if (dbErr) {
      showToast("❌ Delete failed: " + dbErr.message, 3000);
      return;
    }

    // If currently playing this tape, go back to standby
    if (currentVideoId === selectedId) {
      showStandby();
      videoEl.src = '';
      currentVideoUrl = null;
      currentVideoId = null;
    }

    showToast(`🗑️ Tape "${greeting.title}" deleted!`, 2000);
    await fetchGreetings();
  }

  deleteTapeBtn.addEventListener('click', deleteCurrentTape);

  async function fetchGreetings() {
    try {
      const { data, error } = await sb
        .from('video_greetings')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) {
        if (error.code === '42P01') {
          showToast("⚠️ TABLE 'video_greetings' missing — please create in Supabase", 4000);
          greetingsList = [];
          renderSelect();
          return;
        }
        throw error;
      }
      greetingsList = data || [];
      renderSelect();
      updateLedStatus(true);
    } catch (err) {
      console.error(err);
      showToast("DB error: " + err.message, 3000);
      updateLedStatus(false);
    }
  }

  function renderSelect() {
    greetingSelect.innerHTML = '<option value="">📼 -- SELECT A TAPE --</option>';
    greetingsList.forEach(g => {
      const isImage = /\.(png|jpe?g|gif)(\?|$)/i.test(g.video_url);
      const icon = isImage ? '🖼️' : '🎞️';
      const option = document.createElement('option');
      option.value = g.id;
      option.textContent = `${g.title.length > 28 ? g.title.slice(0,28)+'…' : g.title} ${icon}`;
      greetingSelect.appendChild(option);
    });
  }

  async function uploadMediaToSupabase(file, titleHint) {
    if (!file) return null;
    const ext = file.name.split('.').pop();
    const fileName = `greeting_${Date.now()}_${Math.floor(Math.random()*10000)}.${ext}`;
    const filePath = `public/${fileName}`;
    const mediaType = file.type.startsWith('image/') ? 'image' : 'video';

    uploadStatusSpan.innerText = `⏫ Uploading ${file.name}...`;
    const { data: uploadData, error: uploadError } = await sb.storage
      .from('greetings')
      .upload(filePath, file, {
        cacheControl: '3600',
        upsert: false
      });
    if (uploadError) {
      uploadStatusSpan.innerText = `❌ Upload failed: ${uploadError.message}`;
      showToast("Storage upload error", 3000);
      return null;
    }
    
    const { data: publicUrlData } = sb.storage.from('greetings').getPublicUrl(filePath);
    const publicURL = publicUrlData.publicUrl;
    const title = titleHint || file.name.replace(/\.[^/.]+$/, "").slice(0, 45);
    
    const { data: insertData, error: insertErr } = await sb
      .from('video_greetings')
      .insert([{ title: title, video_url: publicURL, media_type: mediaType }])
      .select()
      .single();
      
    if (insertErr) {
      // If media_type column doesn't exist, fall back to insert without it
      if (insertErr.code === '42703' || insertErr.message.includes('media_type')) {
        const { data: fallbackData, error: fallbackErr } = await sb
          .from('video_greetings')
          .insert([{ title: title, video_url: publicURL }])
          .select()
          .single();
        if (fallbackErr) {
          uploadStatusSpan.innerText = `⚠️ DB insert failed`;
          showToast("DB insert error: " + fallbackErr.message, 3000);
          return null;
        }
        uploadStatusSpan.innerText = `✅ Uploaded & added: ${title}`;
        setTimeout(() => { uploadStatusSpan.innerText = ''; }, 3000);
        showToast(`🎬 "${title}" added to greetings!`, 2500);
        await fetchGreetings();
        if (fallbackData) {
          greetingSelect.value = fallbackData.id;
          loadVideoByUrl(fallbackData.video_url, fallbackData.id, fallbackData.title, false, mediaType);
        }
        return fallbackData;
      }
      uploadStatusSpan.innerText = `⚠️ DB insert failed`;
      showToast("DB insert error: " + insertErr.message, 3000);
      return null;
    }
    
    uploadStatusSpan.innerText = `✅ Uploaded & added: ${title}`;
    setTimeout(() => { uploadStatusSpan.innerText = ''; }, 3000);
    showToast(`🎬 "${title}" added to greetings!`, 2500);
    await fetchGreetings();
    
    if (insertData) {
      greetingSelect.value = insertData.id;
      loadVideoByUrl(insertData.video_url, insertData.id, insertData.title, false, mediaType);
    }
    return insertData;
  }

  async function ensureStorageBucket() {
    const { data, error } = await sb.storage.getBucket('greetings');
    if (error && error.message.includes('not found')) {
      showToast("⚠️ Storage bucket 'greetings' missing. Please create a public bucket named 'greetings' in Supabase.", 5000);
      return false;
    }
    return true;
  }

  function triggerFileUpload() {
    fileInput.click();
  }

  async function handleFileSelected(event) {
    const file = event.target.files[0];
    if (!file) return;
    const isVideo = file.type.startsWith('video/');
    const isImage = file.type.startsWith('image/');
    if (!isVideo && !isImage) {
      showToast("Please select a video (MP4, MOV, WebM) or image (PNG, JPG, GIF)", 2500);
      return;
    }
    let customTitle = prompt("Enter greeting title (optional):", file.name.replace(/\.[^/.]+$/, ""));
    if (customTitle === null) customTitle = file.name;
    await uploadMediaToSupabase(file, customTitle);
    fileInput.value = '';
  }

  function updateLedStatus(connected) {
    if (connected) {
      liveLed.style.background = "#33ff33";
      liveLed.style.boxShadow = "0 0 8px #2eff5e";
    } else {
      liveLed.style.background = "#ff3333";
    }
  }

  function onSelectGreeting() {
    const selectedId = greetingSelect.value;
    if (!selectedId) {
      showStandby();
      videoEl.src = '';
      currentVideoUrl = null;
      currentVideoId = null;
      if (loopActive) setLoopMode(false); // optional: reset loop when no video
      return;
    }
    const greeting = greetingsList.find(g => g.id === selectedId);
    if (greeting) {
      loadVideoByUrl(greeting.video_url, greeting.id, greeting.title, false, greeting.media_type || null);
    }
  }

  // Event listeners
  volumeDialDiv.onclick = () => {
    let newVol = currentVolume + 0.1;
    if (newVol > 1.05) newVol = 0;
    setVolume(newVol);
  };
  
  playBtn.onclick = () => {
    if (videoEl.src && videoEl.src !== '' && videoEl.style.display !== 'none') {
      if (videoEl.paused) playVideo();
      else pauseVideo();
    } else {
      showToast("📼 No tape loaded — select a greeting first", 1500);
    }
  };
  
  rewindBtn.onclick = () => { rewindVideo(); };
  forwardBtn.onclick = () => { forwardVideo(); };
  loopToggleBtn.onclick = () => { toggleLoop(); };

  videoEl.addEventListener('play', () => { 
    isVideoPlaying = true;
    playBtn.innerHTML = "⏸"; 
  });
  videoEl.addEventListener('pause', () => { 
    isVideoPlaying = false;
    playBtn.innerHTML = "▶"; 
  });
  
  // --- MODIFIED LOOP HANDLING ---
  // Remove standard ended behavior conflict: HTML5 video.loop already handles native loop.
  // But we need to make sure that when loopActive = true, we set video.loop = true.
  // When loopActive = false and video ends, we do NOT replay but also we must not interfere with autoplay chain.
  // The native 'ended' event: if loop == false we will just show message and stop. Autoplay module also listens to 'ended'.
  // We'll let video.loop property handle the infinite loop if turned on. However we want extra toast and clear sync.
  videoEl.addEventListener('ended', () => {
    playBtn.innerHTML = "▶";
    isVideoPlaying = false;
    // If loopActive is true but video.loop is also true, the video will restart automatically. 
    // We just notify about loop continuation.
    if (loopActive) {
      showToast("🔁 Loop active – rewinding tape", 1000);
      // No need to call play, browser repeats due to .loop property
    } else {
      showToast("📼 The tape ended. Select another greeting or enable LOOP.", 1500);
    }
  });
  
  videoEl.addEventListener('canplay', () => {
    videoEl.muted = false;
    videoEl.volume = currentVolume;
    // sync loop property in case it was changed while loading
    videoEl.loop = loopActive;
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { volumeUp(); e.preventDefault(); }
    if (e.key === 'ArrowDown') { volumeDown(); e.preventDefault(); }
    if (e.key === ' ') { playBtn.click(); e.preventDefault(); }
    if (e.key === 'l' || e.key === 'L') { toggleLoop(); e.preventDefault(); } // handy key L for loop
  });

  function showToast(msg, duration = 2000) {
    let toastDiv = document.querySelector('.toast-retro');
    if (toastDiv) toastDiv.remove();
    const toast = document.createElement('div');
    toast.className = 'toast-retro';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => { if (toast) toast.remove(); }, duration);
  }

  async function seedSampleGreetingIfEmpty() {
    const { count, error: countErr } = await sb
      .from('video_greetings')
      .select('*', { count: 'exact', head: true });
    if (!countErr && count === 0) {
      const demoVideoUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
      const { error: insertErr } = await sb
        .from('video_greetings')
        .insert([{ title: "🎬 Retro Welcome Demo", video_url: demoVideoUrl }]);
      if (!insertErr) {
        showToast("✨ Added demo greeting video! Select from dropdown.", 3000);
        await fetchGreetings();
      }
    }
  }

  async function initRetroTV() {
    const { error: tableCheck } = await sb.from('video_greetings').select('id', { count: 'exact', head: true });
    if (tableCheck && tableCheck.code === '42P01') {
      showToast("📺 TABLE MISSING: Run SQL in Supabase SQL editor", 8000);
      return;
    }
    await ensureStorageBucket();
    await fetchGreetings();
    await seedSampleGreetingIfEmpty();
    setVolume(0.65);
    showStandby();
    fileInput.addEventListener('change', handleFileSelected);
    uploadTrigger.addEventListener('click', triggerFileUpload);
    greetingSelect.addEventListener('change', onSelectGreeting);
    
    // initial loop state OFF
    setLoopMode(false);
  }

  initRetroTV().catch(console.error);

  volumeDialDiv.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.deltaY < 0) volumeUp();
    else volumeDown();
  });

  // Animated grayscale TV static
  (function() {
    const canvas = document.getElementById('staticCanvas');
    const ctx = canvas.getContext('2d');
    let rafId = null;

    function syncSize() {
      canvas.width  = canvas.offsetWidth  || 640;
      canvas.height = canvas.offsetHeight || 360;
    }

    function drawNoise() {
      syncSize();
      const w = canvas.width, h = canvas.height;
      const img = ctx.createImageData(w, h);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        d[i] = d[i+1] = d[i+2] = v;
        d[i+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const by = ((Date.now() / 4) % (h + 30)) - 15;
      const g = ctx.createLinearGradient(0, by, 0, by + 30);
      g.addColorStop(0,   'rgba(255,255,255,0)');
      g.addColorStop(0.5, 'rgba(255,255,255,0.07)');
      g.addColorStop(1,   'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, by, w, 30);
      rafId = requestAnimationFrame(drawNoise);
    }

    const observer = new MutationObserver(() => {
      const visible = standbyScreen.style.display !== 'none';
      if (visible && !rafId) { drawNoise(); }
      else if (!visible && rafId) { cancelAnimationFrame(rafId); rafId = null; }
    });
    observer.observe(standbyScreen, { attributes: true, attributeFilter: ['style'] });
    drawNoise();
  })();

  // Autoplay all videos (no conflict with loop)
  (function() {
    const btn = document.getElementById('autoplayTrigger');
    let active = false;
    let idx = 0;
    let autoplayLoopTimer = null;

    function setActive(val) {
      active = val;
      btn.innerHTML = active ? '⏹ STOP AUTOPLAY' : '📼 AUTOPLAY ALL';
      btn.style.borderColor = active ? '#4dff77' : '#e2a84b';
      btn.style.color       = active ? '#7fff99' : '#e6c28f';
      if (!active && autoplayLoopTimer) {
        clearTimeout(autoplayLoopTimer);
        autoplayLoopTimer = null;
      }
    }

    // Smooth fade: only the TV screen fades to black, then loads the next video
    function tvFade(cb) {
      // Fade IN (screen goes dark)
      tvFadeOverlay.classList.remove('fade-out');
      tvFadeOverlay.classList.add('fade-in');

      setTimeout(() => {
        cb(); // load next video while screen is black
        // Fade OUT (reveal the new video)
        setTimeout(() => {
          tvFadeOverlay.classList.remove('fade-in');
          tvFadeOverlay.classList.add('fade-out');
        }, 350); // brief black hold while video starts loading
      }, 480); // wait for fade-in to complete
    }

    function playNext() {
      if (!active || greetingsList.length === 0) { setActive(false); return; }
      idx = idx % greetingsList.length;
      const g = greetingsList[idx];
      greetingSelect.value = g.id;

      // Ensure no native loop so autoplay can advance
      if (videoEl) videoEl.loop = false;

      tvFade(() => {
        loadVideoByUrl(g.video_url, g.id, g.title, false, g.media_type || null);
        showToast(`📺 [${idx + 1}/${greetingsList.length}] ${g.title}`, 2000);
      });
    }

    videoEl.addEventListener('ended', () => {
      if (active) {
        idx++;
        autoplayLoopTimer = setTimeout(playNext, 400);
      }
    });

    btn.addEventListener('click', () => {
      if (active) {
        setActive(false);
        showToast('⏹ Autoplay stopped', 1200);
        if (autoplayLoopTimer) clearTimeout(autoplayLoopTimer);
        // Ensure overlay is cleared
        tvFadeOverlay.classList.remove('fade-in');
        tvFadeOverlay.classList.add('fade-out');
      } else {
        if (greetingsList.length === 0) { showToast('📭 No tapes loaded yet', 1500); return; }
        setActive(true);
        idx = 0;
        playNext();
      }
    });
  })();
</script>
</body>
