<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="screen-orientation" content="landscape">
  <title>RetroGreetings — Vintage Video Jukebox</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #1a1a2a, #0a0a12);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'VT323', 'Share Tech Mono', monospace;
      padding: 12px;
    }

    .tv-cabinet {
      background: #2c1e12;
      border-radius: 48px 48px 32px 32px;
      padding: 16px 20px 28px 20px;
      box-shadow: 0 30px 40px rgba(0,0,0,0.6), inset 0 1px 4px rgba(255,255,200,0.2);
      border-bottom: 6px solid #8b5a2b;
      width: 100%;
      max-width: 1200px;
    }

    /* Force landscape on mobile */
    @media (max-width: 768px) and (orientation: portrait) {
      body {
        transform: rotate(90deg);
        transform-origin: left top;
        width: 100vh;
        height: 100vw;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 100vw;
        padding: 8px;
      }
    }

    @media (max-width: 1024px) {
      .tv-cabinet {
        padding: 12px 14px 20px 14px;
        border-radius: 28px 28px 20px 20px;
      }
      .control-deck {
        gap: 10px !important;
        padding: 10px 16px !important;
      }
    }

    .crt-tube {
      background: #000000;
      border-radius: 28px;
      padding: 12px;
      box-shadow: inset 0 0 30px rgba(0,255,100,0.1), 0 10px 20px rgba(0,0,0,0.5);
      border: 1px solid #6b4c2c;
    }

    .tv-screen {
      background: #0b0f0b;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 16 / 9;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.8), 0 0 0 3px #cb9e6b, 0 0 0 8px #3b2a1c;
    }

    .tv-screen::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,255,0,0.03) 0px, rgba(0,255,0,0.03) 2px, transparent 2px, transparent 6px);
      pointer-events: none;
      z-index: 2;
    }

    .tv-screen::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 2;
    }

    #videoElement {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    /* Standby / Static screen */
    .standby-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3;
      transition: opacity 0.5s ease;
    }

    #staticCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.92;
    }

    .standby-text {
      font-family: 'VT323', monospace;
      font-size: 28px;
      color: #cccccc;
      text-align: center;
      letter-spacing: 6px;
      animation: blink 1.5s step-end infinite;
      z-index: 4;
      background: rgba(0,0,0,0.55);
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid #555;
      text-shadow: 0 0 8px #aaa;
    }

    .standby-text small {
      font-size: 16px;
      letter-spacing: 2px;
      color: #999999;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .control-deck {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      background: #2f2318;
      border-radius: 60px;
      padding: 14px 24px;
      border-top: 2px solid #cb9e6b;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.4);
    }

    .knob-group {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #221b12;
      padding: 6px 20px;
      border-radius: 60px;
      box-shadow: inset 0 1px 2px #553e22, 0 2px 5px black;
    }

    .knob {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .knob-label {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: #e2c28b;
      text-transform: uppercase;
      font-weight: 700;
    }

    .dial {
      width: 52px;
      height: 52px;
      background: radial-gradient(circle at 30% 30%, #555, #222);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 6px black, inset 0 1px 2px rgba(255,255,200,0.4);
      border: 1px solid #cdaa77;
      transition: transform 0.1s ease;
      font-size: 26px;
      font-weight: bold;
      color: #ffd966;
      text-shadow: 0 1px 0 #000;
    }

    .dial:active {
      transform: scale(0.94);
    }

    .upload-zone {
      background: #12100c;
      border: 2px dashed #b87c3a;
      border-radius: 40px;
      padding: 8px 16px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'VT323', monospace;
      font-size: 18px;
      letter-spacing: 2px;
      color: #e6c28f;
    }

    .upload-zone:hover {
      background: #2a241a;
      border-color: #f3b35f;
    }

    #fileInput {
      display: none;
    }

    .greeting-selector {
      background: #1e1911;
      padding: 6px 14px;
      border-radius: 60px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-family: 'VT323', monospace;
      font-size: 20px;
    }

    select {
      background: #2f2419;
      border: 1px solid #cb9e6b;
      color: #ffeaac;
      padding: 8px 14px;
      border-radius: 40px;
      font-family: 'VT323', monospace;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
    }

    .volume-value {
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      color: #ffd966;
      background: #00000066;
      padding: 2px 8px;
      border-radius: 20px;
      min-width: 48px;
      text-align: center;
    }

    .status-led {
      width: 12px;
      height: 12px;
      background: #ff3333;
      border-radius: 50%;
      box-shadow: 0 0 6px red;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9);}
      100% { opacity: 1; transform: scale(1.2);}
    }

    .upload-progress {
      font-size: 14px;
      font-family: monospace;
      color: #9eff8a;
    }

    /* Autoplay button */
    .autoplay-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: radial-gradient(circle at 30% 30%, #4b3a1a, #2a1f0e);
      border: 2px solid #cb9e6b;
      border-radius: 40px;
      padding: 6px 18px;
      font-family: 'VT323', monospace;
      font-size: 18px;
      letter-spacing: 2px;
      color: #ffd966;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
    }
    .autoplay-btn:hover {
      background: radial-gradient(circle at 30% 30%, #6b5a2a, #3a2f1e);
      border-color: #f3c97f;
      box-shadow: 0 0 12px rgba(203,158,107,0.4);
    }
    .autoplay-btn.active {
      background: radial-gradient(circle at 30% 30%, #1a4a1a, #0e2a0e);
      border-color: #4dff77;
      color: #7fff99;
      box-shadow: 0 0 14px rgba(77,255,119,0.3);
      animation: autoplay-pulse 1.5s ease-in-out infinite;
    }
    @keyframes autoplay-pulse {
      0%, 100% { box-shadow: 0 0 8px rgba(77,255,119,0.25); }
      50% { box-shadow: 0 0 20px rgba(77,255,119,0.6); }
    }

    /* Channel transition overlay */
    .channel-flash {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
    }

    .toast-retro {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: #1a1f12;
      border-left: 6px solid #ffcf4a;
      padding: 12px 24px;
      font-family: 'VT323', monospace;
      font-size: 20px;
      color: #fee6b0;
      z-index: 1000;
      border-radius: 16px;
      box-shadow: 0 5px 15px black;
    }
  </style>
</head>
<body>
<div class="tv-cabinet">
  <div class="crt-tube">
    <div class="tv-screen" id="tvScreen">
      <video id="videoElement" style="width:100%;height:100%;display:none"></video>
      <div class="standby-screen" id="standbyScreen">
        <canvas id="staticCanvas"></canvas>
        <div class="standby-text">
          📺 NO SIGNAL<br>
          <small>SELECT A GREETING TAPE</small>
        </div>
      </div>
    </div>
  </div>

  <div class="control-deck">
    <div class="knob-group">
      <div class="knob">
        <span class="knob-label">📢 VOLUME</span>
        <div class="dial" id="volumeDial">🔊</div>
        <span id="volumePercent" class="volume-value">65%</span>
      </div>
      <div class="knob">
        <span class="knob-label">⏪ REEL ⏩</span>
        <div style="display: flex; gap: 10px; align-items: center;">
          <div class="dial" id="rewindBtn" style="width: 44px; height: 44px; font-size: 24px;">⏪</div>
          <div class="dial" id="playBtn" style="width: 54px; height: 54px; background: radial-gradient(circle at 30% 30%, #3b6b3b, #1a3a1a);">▶</div>
          <div class="dial" id="forwardBtn" style="width: 44px; height: 44px; font-size: 24px;">⏩</div>
        </div>
      </div>
    </div>

    <div class="greeting-selector">
      <span>📼 GREETING TAPE</span>
      <select id="greetingSelect">
        <option value="">-- No Signal --</option>
      </select>
      <div class="status-led" id="liveLed"></div>
    </div>

    <button class="autoplay-btn" id="autoplayBtn" title="Play all greetings in sequence">
      📼 AUTOPLAY ALL
    </button>

    <div class="upload-zone" id="uploadTrigger">
      📀 UPLOAD VIDEO GREETING
      <input type="file" id="fileInput" accept="video/mp4,video/webm,video/quicktime">
    </div>
  </div>

  <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px;">
    <span style="font-family: 'Share Tech Mono'; color: #cbaa72; font-size: 13px;">RETRO GREETINGS · TV STUDIO</span>
    <span id="uploadStatus" class="upload-progress"></span>
  </div>
</div>

<div class="channel-flash" id="channelFlash"></div>

<script>
  const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  const videoEl = document.getElementById('videoElement');
  const standbyScreen = document.getElementById('standbyScreen');
  const tvScreen = document.getElementById('tvScreen');
  const greetingSelect = document.getElementById('greetingSelect');
  const volumeDialDiv = document.getElementById('volumeDial');
  const volumePercentSpan = document.getElementById('volumePercent');
  const rewindBtn = document.getElementById('rewindBtn');
  const playBtn = document.getElementById('playBtn');
  const forwardBtn = document.getElementById('forwardBtn');
  const fileInput = document.getElementById('fileInput');
  const uploadTrigger = document.getElementById('uploadTrigger');
  const uploadStatusSpan = document.getElementById('uploadStatus');
  const liveLed = document.getElementById('liveLed');

  let currentVolume = 0.65;
  let currentVideoUrl = null;
  let currentVideoId = null;
  let greetingsList = [];
  let isVideoPlaying = false;

  // Show standby screen, hide video
  function showStandby() {
    standbyScreen.style.display = 'flex';
    videoEl.style.display = 'none';
    videoEl.pause();
    isVideoPlaying = false;
    playBtn.innerHTML = "▶";
  }

  // Show video player, hide standby
  function showVideo() {
    standbyScreen.style.display = 'none';
    videoEl.style.display = 'block';
  }

  function setVolume(value01) {
    currentVolume = Math.min(1, Math.max(0, value01));
    videoEl.volume = currentVolume;
    volumePercentSpan.innerText = `${Math.round(currentVolume * 100)}%`;
    if (currentVolume < 0.2) volumeDialDiv.innerHTML = '🔈';
    else if (currentVolume < 0.6) volumeDialDiv.innerHTML = '🔉';
    else volumeDialDiv.innerHTML = '🔊';
  }

  function volumeUp() { setVolume(currentVolume + 0.1); }
  function volumeDown() { setVolume(currentVolume - 0.1); }

  function playVideo() {
    if (videoEl.src && videoEl.src !== '') {
      videoEl.muted = false;
      const playPromise = videoEl.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          isVideoPlaying = true;
          playBtn.innerHTML = "⏸";
        }).catch(e => {
          console.log("Play error:", e);
          showToast("🔊 Click anywhere to enable audio", 2000);
          document.body.onclick = function enableAudio() {
            videoEl.muted = false;
            videoEl.play().catch(()=>{});
            document.body.onclick = null;
            showToast("✅ Audio enabled!", 1000);
          };
        });
      }
    } else {
      showToast("📭 No video loaded, select a greeting from the dropdown", 1500);
    }
  }

  function pauseVideo() { 
    videoEl.pause(); 
    isVideoPlaying = false;
    playBtn.innerHTML = "▶";
  }

  function rewindVideo() {
    if (videoEl.src && videoEl.src !== '') {
      if (videoEl.currentTime > 3) videoEl.currentTime -= 3;
      else videoEl.currentTime = 0;
      showToast("⏪ REWIND 3s", 800);
    } else {
      showToast("No video playing", 800);
    }
  }

  function forwardVideo() {
    if (videoEl.src && videoEl.src !== '') {
      if (videoEl.duration && videoEl.currentTime + 3 < videoEl.duration) videoEl.currentTime += 3;
      else if (videoEl.duration) videoEl.currentTime = videoEl.duration - 0.5;
      showToast("⏩ FORWARD 3s", 800);
    } else {
      showToast("No video playing", 800);
    }
  }

  function loadVideoByUrl(url, videoId, title) {
    if (!url) {
      showStandby();
      currentVideoUrl = null;
      currentVideoId = null;
      return;
    }
    
    // Show video player first
    showVideo();
    
    // Stop current playback
    videoEl.pause();
    videoEl.src = url;
    videoEl.load();
    currentVideoUrl = url;
    currentVideoId = videoId;
    
    videoEl.muted = false;
    videoEl.volume = currentVolume;
    
    showToast(`📺 Now playing: ${title || "greeting"}`, 1500);
    
    // Auto-play
    setTimeout(() => {
      playVideo();
    }, 100);
  }

  async function fetchGreetings() {
    try {
      const { data, error } = await sb
        .from('video_greetings')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) {
        if (error.code === '42P01') {
          showToast("⚠️ TABLE 'video_greetings' missing — please create in Supabase", 4000);
          greetingsList = [];
          renderSelect();
          return;
        }
        throw error;
      }
      greetingsList = data || [];
      renderSelect();
      updateLedStatus(true);
      // Do NOT auto-load any video - keep standby screen
    } catch (err) {
      console.error(err);
      showToast("DB error: " + err.message, 3000);
      updateLedStatus(false);
    }
  }

  function renderSelect() {
    greetingSelect.innerHTML = '<option value="">📼 -- SELECT A TAPE --</option>';
    greetingsList.forEach(g => {
      const option = document.createElement('option');
      option.value = g.id;
      option.textContent = `${g.title.length > 28 ? g.title.slice(0,28)+'…' : g.title} 🎞️`;
      greetingSelect.appendChild(option);
    });
  }

  async function uploadVideoToSupabase(file, titleHint) {
    if (!file) return null;
    const ext = file.name.split('.').pop();
    const fileName = `greeting_${Date.now()}_${Math.floor(Math.random()*10000)}.${ext}`;
    const filePath = `public/${fileName}`;

    uploadStatusSpan.innerText = `⏫ Uploading ${file.name}...`;
    const { data: uploadData, error: uploadError } = await sb.storage
      .from('greetings')
      .upload(filePath, file, {
        cacheControl: '3600',
        upsert: false
      });
    if (uploadError) {
      uploadStatusSpan.innerText = `❌ Upload failed: ${uploadError.message}`;
      showToast("Storage upload error", 3000);
      return null;
    }
    
    const { data: publicUrlData } = sb.storage.from('greetings').getPublicUrl(filePath);
    const publicURL = publicUrlData.publicUrl;
    const title = titleHint || file.name.replace(/\.[^/.]+$/, "").slice(0, 45);
    
    const { data: insertData, error: insertErr } = await sb
      .from('video_greetings')
      .insert([{ title: title, video_url: publicURL }])
      .select()
      .single();
      
    if (insertErr) {
      uploadStatusSpan.innerText = `⚠️ DB insert failed`;
      showToast("DB insert error: " + insertErr.message, 3000);
      return null;
    }
    
    uploadStatusSpan.innerText = `✅ Uploaded & added: ${title}`;
    setTimeout(() => { uploadStatusSpan.innerText = ''; }, 3000);
    showToast(`🎬 "${title}" added to greetings!`, 2500);
    await fetchGreetings();
    
    // Auto-select and play the newly uploaded video
    if (insertData) {
      greetingSelect.value = insertData.id;
      loadVideoByUrl(insertData.video_url, insertData.id, insertData.title);
    }
    return insertData;
  }

  async function ensureStorageBucket() {
    const { data, error } = await sb.storage.getBucket('greetings');
    if (error && error.message.includes('not found')) {
      showToast("⚠️ Storage bucket 'greetings' missing. Please create a public bucket named 'greetings' in Supabase.", 5000);
      return false;
    }
    return true;
  }

  function triggerFileUpload() {
    fileInput.click();
  }

  async function handleFileSelected(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('video/')) {
      showToast("Please select a video file (MP4, MOV, WebM)", 2000);
      return;
    }
    let customTitle = prompt("Enter greeting title (optional):", file.name.replace(/\.[^/.]+$/, ""));
    if (customTitle === null) customTitle = file.name;
    await uploadVideoToSupabase(file, customTitle);
    fileInput.value = '';
  }

  function updateLedStatus(connected) {
    if (connected) {
      liveLed.style.background = "#33ff33";
      liveLed.style.boxShadow = "0 0 8px #2eff5e";
    } else {
      liveLed.style.background = "#ff3333";
    }
  }

  function onSelectGreeting() {
    const selectedId = greetingSelect.value;
    if (!selectedId) {
      // User selected the placeholder - go back to standby
      showStandby();
      videoEl.src = '';
      currentVideoUrl = null;
      currentVideoId = null;
      return;
    }
    const greeting = greetingsList.find(g => g.id === selectedId);
    if (greeting) {
      loadVideoByUrl(greeting.video_url, greeting.id, greeting.title);
    }
  }

  // Event listeners
  volumeDialDiv.onclick = () => {
    let newVol = currentVolume + 0.1;
    if (newVol > 1.05) newVol = 0;
    setVolume(newVol);
  };
  
  playBtn.onclick = () => {
    if (videoEl.src && videoEl.src !== '' && videoEl.style.display !== 'none') {
      if (videoEl.paused) playVideo();
      else pauseVideo();
    } else {
      showToast("📼 No tape loaded — select a greeting first", 1500);
    }
  };
  
  rewindBtn.onclick = () => { rewindVideo(); };
  forwardBtn.onclick = () => { forwardVideo(); };

  videoEl.addEventListener('play', () => { 
    isVideoPlaying = true;
    playBtn.innerHTML = "⏸"; 
  });
  videoEl.addEventListener('pause', () => { 
    isVideoPlaying = false;
    playBtn.innerHTML = "▶"; 
  });
  videoEl.addEventListener('ended', () => { 
    playBtn.innerHTML = "▶"; 
    isVideoPlaying = false;
    showToast("📼 The tape ended. Select another greeting.", 1500);
  });
  
  videoEl.addEventListener('canplay', () => {
    videoEl.muted = false;
    videoEl.volume = currentVolume;
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { volumeUp(); e.preventDefault(); }
    if (e.key === 'ArrowDown') { volumeDown(); e.preventDefault(); }
    if (e.key === ' ') { playBtn.click(); e.preventDefault(); }
  });

  function showToast(msg, duration = 2000) {
    let toastDiv = document.querySelector('.toast-retro');
    if (toastDiv) toastDiv.remove();
    const toast = document.createElement('div');
    toast.className = 'toast-retro';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => { if (toast) toast.remove(); }, duration);
  }

  async function seedSampleGreetingIfEmpty() {
    const { count, error: countErr } = await sb
      .from('video_greetings')
      .select('*', { count: 'exact', head: true });
    if (!countErr && count === 0) {
      const demoVideoUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
      const { error: insertErr } = await sb
        .from('video_greetings')
        .insert([{ title: "🎬 Retro Welcome Demo", video_url: demoVideoUrl }]);
      if (!insertErr) {
        showToast("✨ Added demo greeting video! Select from dropdown.", 3000);
        await fetchGreetings();
      }
    }
  }

  async function initRetroTV() {
    const { error: tableCheck } = await sb.from('video_greetings').select('id', { count: 'exact', head: true });
    if (tableCheck && tableCheck.code === '42P01') {
      showToast("📺 TABLE MISSING: Run SQL in Supabase SQL editor", 8000);
      return;
    }
    await ensureStorageBucket();
    await fetchGreetings();
    await seedSampleGreetingIfEmpty();
    setVolume(0.65);
    // Start with standby screen
    showStandby();
    
    fileInput.addEventListener('change', handleFileSelected);
    uploadTrigger.addEventListener('click', triggerFileUpload);
    greetingSelect.addEventListener('change', onSelectGreeting);
  }

  // ── Animated TV Static (grayscale canvas noise) ──────────────────
  const staticCanvas = document.getElementById('staticCanvas');
  const sctx = staticCanvas.getContext('2d');
  let staticAnimId = null;

  function resizeStaticCanvas() {
    const rect = staticCanvas.parentElement.getBoundingClientRect();
    staticCanvas.width = rect.width || 640;
    staticCanvas.height = rect.height || 360;
  }

  function drawStatic() {
    const w = staticCanvas.width;
    const h = staticCanvas.height;
    if (w === 0 || h === 0) { resizeStaticCanvas(); }
    const imageData = sctx.createImageData(w, h);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
      // Random gray pixel — classic analog TV snow
      const g = (Math.random() * 200 + 30) | 0;
      // Occasionally add a brighter "hot" pixel for authenticity
      const bright = Math.random() < 0.02 ? 255 : g;
      data[i]     = bright;
      data[i + 1] = bright;
      data[i + 2] = bright;
      data[i + 3] = 240;
    }
    sctx.putImageData(imageData, 0, 0);

    // Horizontal scan-bar sweep for that authentic VHF shimmer
    const barY = (Date.now() / 3) % (h + 40) - 20;
    const grad = sctx.createLinearGradient(0, barY, 0, barY + 40);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0.06)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    sctx.fillStyle = grad;
    sctx.fillRect(0, barY, w, 40);

    staticAnimId = requestAnimationFrame(drawStatic);
  }

  function startStatic() {
    resizeStaticCanvas();
    if (!staticAnimId) drawStatic();
  }

  function stopStatic() {
    if (staticAnimId) { cancelAnimationFrame(staticAnimId); staticAnimId = null; }
  }

  window.addEventListener('resize', () => {
    if (standbyScreen.style.display !== 'none') resizeStaticCanvas();
  });

  // ── Channel Balance Transition ────────────────────────────────────
  const channelFlash = document.getElementById('channelFlash');

  function channelTransition(callback) {
    // Quick white flash → brief darkness → play next
    channelFlash.style.transition = 'none';
    channelFlash.style.opacity = '1';
    setTimeout(() => {
      channelFlash.style.transition = 'opacity 0.25s ease-out';
      channelFlash.style.opacity = '0';
      if (callback) callback();
    }, 80);
  }

  // ── Autoplay ─────────────────────────────────────────────────────
  const autoplayBtn = document.getElementById('autoplayBtn');
  let autoplayActive = false;
  let autoplayIndex = 0;

  function setAutoplay(active) {
    autoplayActive = active;
    autoplayBtn.classList.toggle('active', active);
    autoplayBtn.textContent = active ? '⏹ STOP AUTOPLAY' : '📼 AUTOPLAY ALL';
  }

  function autoplayNext(fromIndex) {
    if (!autoplayActive || greetingsList.length === 0) {
      setAutoplay(false);
      showToast("📼 Autoplay finished", 1800);
      return;
    }
    autoplayIndex = fromIndex % greetingsList.length;
    const g = greetingsList[autoplayIndex];
    greetingSelect.value = g.id;

    channelTransition(() => {
      loadVideoByUrl(g.video_url, g.id, g.title);
      showToast(`📺 [${autoplayIndex + 1}/${greetingsList.length}] ${g.title}`, 2000);
    });
  }

  autoplayBtn.onclick = () => {
    if (autoplayActive) {
      setAutoplay(false);
      showToast("⏹ Autoplay stopped", 1200);
    } else {
      if (greetingsList.length === 0) {
        showToast("📭 No tapes loaded yet", 1500);
        return;
      }
      setAutoplay(true);
      autoplayIndex = 0;
      autoplayNext(0);
    }
  };

  // Hook into video ended to advance autoplay
  const _origEnded = videoEl.onended;
  videoEl.addEventListener('ended', () => {
    if (autoplayActive) {
      setTimeout(() => autoplayNext(autoplayIndex + 1), 600);
    }
  });

  // ── Override showStandby / showVideo to manage static ─────────────
  // Patch: intercept calls by wrapping the originals via prototype trick
  // Since they're plain functions, we patch at call sites via MutationObserver on standbyScreen display
  const standbyObserver = new MutationObserver(() => {
    if (standbyScreen.style.display === 'none') {
      stopStatic();
    } else {
      startStatic();
    }
  });
  standbyObserver.observe(standbyScreen, { attributes: true, attributeFilter: ['style'] });

  // Start static on load (standby is shown by default)
  startStatic();



  volumeDialDiv.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.deltaY < 0) volumeUp();
    else volumeDown();
  });
</script>
</body>
