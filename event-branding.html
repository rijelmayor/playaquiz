<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayAQuiz — Event Branding</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #0a0c15;
    --bg-deep: #06080f;
    --panel: rgba(255,255,255,0.04);
    --panel-border: rgba(255,215,0,0.18);
    --gold: #ffd700;
    --gold-dim: #ffaa00;
    --neon-blue: #00d4ff;
    --text: #f5f5f7;
    --muted: rgba(255,255,255,0.5);
    --green: #00ff88;
    --red: #ff3366;
  }

  body {
    background: linear-gradient(145deg, var(--bg) 0%, var(--bg-deep) 100%);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 32px 28px;
    backdrop-filter: blur(16px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--neon-blue);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 1px;
    color: var(--gold);
    margin-bottom: 22px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    margin-top: 22px;
  }

  label:first-of-type { margin-top: 0; }

  input[type="text"] {
    width: 100%;
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 13px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 1px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--gold); }
  input[type="text"]#roomCodeInput { text-transform: uppercase; }

  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    min-height: 16px;
  }
  .hint.ok { color: var(--green); }
  .hint.err { color: var(--red); }

  .drop-zone {
    border: 2px dashed var(--panel-border);
    border-radius: 14px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--gold);
    background: rgba(255,215,0,0.05);
  }
  .drop-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }
  .drop-zone-text { font-size: 13px; color: var(--muted); }
  .drop-zone-text b { color: var(--gold); }

  .preview-wrap {
    margin-top: 14px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--panel-border);
    display: none;
  }
  .preview-wrap.show { display: block; }
  .preview-wrap img {
    width: 100%;
    display: block;
    max-height: 200px;
    object-fit: cover;
  }
  .preview-remove {
    display: block;
    width: 100%;
    background: rgba(255,51,102,0.12);
    border: none;
    color: var(--red);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 8px;
    cursor: pointer;
  }
  .preview-remove:hover { background: rgba(255,51,102,0.2); }

  .save-btn {
    width: 100%;
    margin-top: 26px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #1a1300;
    cursor: pointer;
    transition: transform 0.12s, opacity 0.12s;
  }
  .save-btn:active { transform: scale(0.98); }
  .save-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .status-msg {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .status-msg.ok { color: var(--green); }
  .status-msg.err { color: var(--red); }

  .current-link {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--panel-border);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .current-link a { color: var(--neon-blue); text-decoration: none; word-break: break-all; }
  .current-link a:hover { text-decoration: underline; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(0,0,0,0.25);
    border-top-color: #1a1300;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">PlayAQuiz</div>
  <h1>Event Branding</h1>

  <label for="roomCodeInput">Room code</label>
  <input type="text" id="roomCodeInput" placeholder="e.g. FRXXXX" maxlength="12" autocomplete="off">
  <div class="hint" id="roomHint"></div>

  <label for="eventTitleInput">Event title</label>
  <input type="text" id="eventTitleInput" placeholder="e.g. SMITH-GARCIA WEDDING FINALS" maxlength="60" disabled>
  <div class="hint">Shown where "FINAL ROUND" normally appears on the waiting screen.</div>

  <label>Background image</label>
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept="image/*" disabled>
    <div class="drop-zone-text" id="dropZoneText">Drag & drop an image, or <b>click to browse</b></div>
  </div>
  <div class="preview-wrap" id="previewWrap">
    <img id="previewImg" alt="Background preview">
    <button class="preview-remove" id="removeImageBtn">Remove image</button>
  </div>

  <button class="save-btn" id="saveBtn" disabled>Save branding</button>
  <div class="status-msg" id="statusMsg"></div>

  <div class="current-link" id="currentLink" style="display:none;">
    Live at this room's background once saved — verify on the FOH display.
  </div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const roomCodeInput   = document.getElementById('roomCodeInput');
const roomHint        = document.getElementById('roomHint');
const eventTitleInput = document.getElementById('eventTitleInput');
const fileInput       = document.getElementById('fileInput');
const dropZone        = document.getElementById('dropZone');
const dropZoneText    = document.getElementById('dropZoneText');
const previewWrap     = document.getElementById('previewWrap');
const previewImg      = document.getElementById('previewImg');
const removeImageBtn  = document.getElementById('removeImageBtn');
const saveBtn         = document.getElementById('saveBtn');
const statusMsg       = document.getElementById('statusMsg');
const currentLink     = document.getElementById('currentLink');

let roomVerified = false;
let verifiedRoomCode = '';
let verifyDebounce = null;
let selectedFile = null;          // a newly chosen file, not yet uploaded
let existingImageUrl = null;      // the URL already saved in the DB for this room
let imageRemoved = false;         // user explicitly cleared the image

function setFormEnabled(enabled) {
  eventTitleInput.disabled = !enabled;
  fileInput.disabled = !enabled;
  saveBtn.disabled = !enabled;
}

roomCodeInput.addEventListener('input', () => {
  const raw = roomCodeInput.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  roomCodeInput.value = raw;
  roomVerified = false;
  setFormEnabled(false);
  statusMsg.textContent = '';
  currentLink.style.display = 'none';
  roomHint.textContent = '';
  roomHint.className = 'hint';
  if (verifyDebounce) clearTimeout(verifyDebounce);
  if (raw.length >= 4) verifyDebounce = setTimeout(() => verifyRoom(raw), 450);
});

async function verifyRoom(code) {
  roomHint.textContent = 'Checking room…';
  roomHint.className = 'hint';
  try {
    const { data, error } = await sb
      .from('game_sessions')
      .select('room_code')
      .eq('room_code', code)
      .maybeSingle();
    if (roomCodeInput.value.trim().toUpperCase() !== code) return; // stale response
    if (error || !data) {
      roomHint.textContent = '❌ Room not found.';
      roomHint.className = 'hint err';
      roomVerified = false;
      return;
    }
    roomVerified = true;
    verifiedRoomCode = code;
    roomHint.textContent = `✓ Room ${code} found.`;
    roomHint.className = 'hint ok';
    setFormEnabled(true);
    await loadExistingBranding(code);
  } catch (err) {
    roomHint.textContent = 'Connection error — try again.';
    roomHint.className = 'hint err';
    roomVerified = false;
  }
}

async function loadExistingBranding(code) {
  selectedFile = null;
  imageRemoved = false;
  try {
    const { data, error } = await sb
      .from('event_branding')
      .select('event_title, background_image_url')
      .eq('room_code', code)
      .maybeSingle();
    if (error) throw error;

    eventTitleInput.value = (data && data.event_title) ? data.event_title : '';
    existingImageUrl = (data && data.background_image_url) ? data.background_image_url : null;

    if (existingImageUrl) {
      previewImg.src = existingImageUrl;
      previewWrap.classList.add('show');
      dropZoneText.innerHTML = 'Drag & drop a new image to replace it, or <b>click to browse</b>';
      currentLink.style.display = 'block';
    } else {
      previewWrap.classList.remove('show');
      dropZoneText.innerHTML = 'Drag & drop an image, or <b>click to browse</b>';
      currentLink.style.display = 'none';
    }
  } catch (err) {
    console.warn('[loadExistingBranding] failed:', err);
  }
}

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    statusMsg.textContent = 'Please choose an image file.';
    statusMsg.className = 'status-msg err';
    return;
  }
  selectedFile = file;
  imageRemoved = false;
  const reader = new FileReader();
  reader.onload = (e) => {
    previewImg.src = e.target.result;
    previewWrap.classList.add('show');
  };
  reader.readAsDataURL(file);
}

fileInput.addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
});

dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

removeImageBtn.addEventListener('click', () => {
  selectedFile = null;
  imageRemoved = true;
  previewWrap.classList.remove('show');
  previewImg.src = '';
  fileInput.value = '';
});

saveBtn.addEventListener('click', async () => {
  if (!roomVerified) return;
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner"></span>Saving…';
  statusMsg.textContent = '';
  statusMsg.className = 'status-msg';

  try {
    let backgroundImageUrl = existingImageUrl;

    if (imageRemoved) {
      backgroundImageUrl = null;
    } else if (selectedFile) {
      const ext = (selectedFile.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      const path = `${verifiedRoomCode}/${Date.now()}.${ext}`;
      const { error: uploadErr } = await sb.storage
        .from('event-backgrounds')
        .upload(path, selectedFile, { upsert: true, contentType: selectedFile.type });
      if (uploadErr) throw uploadErr;
      const { data: pub } = sb.storage.from('event-backgrounds').getPublicUrl(path);
      backgroundImageUrl = pub.publicUrl;
    }

    const titleValue = eventTitleInput.value.trim() || 'FINAL ROUND';

    const { error: saveErr } = await sb
      .from('event_branding')
      .upsert({
        room_code: verifiedRoomCode,
        event_title: titleValue,
        background_image_url: backgroundImageUrl
      }, { onConflict: 'room_code' });
    if (saveErr) throw saveErr;

    existingImageUrl = backgroundImageUrl;
    selectedFile = null;
    imageRemoved = false;
    statusMsg.textContent = `✓ Saved for room ${verifiedRoomCode}`;
    statusMsg.className = 'status-msg ok';
    currentLink.style.display = backgroundImageUrl ? 'block' : 'none';
  } catch (err) {
    console.error('[save] failed:', err);
    statusMsg.textContent = '❌ Save failed — ' + (err.message || 'check console for details');
    statusMsg.className = 'status-msg err';
  } finally {
    saveBtn.disabled = false;
    saveBtn.innerHTML = 'Save branding';
  }
});
</script>
</body>
</html>
