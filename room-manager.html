<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Room Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0c15 0%, #06080f 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: #e8edf7;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(13,17,32,0.8);
      border-radius: 20px;
      border: 1px solid rgba(59,130,246,0.2);
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      background: linear-gradient(135deg, #fff, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .conn-status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 40px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    .status-dot.connected { background: #10b981; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    
    /* Room Creation Card */
    .create-card {
      background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(139,92,246,0.05));
      border: 2px solid rgba(59,130,246,0.3);
      border-radius: 24px;
      padding: 32px;
      margin-bottom: 30px;
    }
    .create-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .room-input-group {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .input-field {
      flex: 1;
    }
    .input-field label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      color: #6b7a99;
      margin-bottom: 5px;
    }
    .room-code-input {
      background: #06080f;
      border: 2px solid #2d3b52;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 24px;
      font-family: 'JetBrains Mono', monospace;
      color: #3b82f6;
      letter-spacing: 4px;
      width: 200px;
      text-align: center;
    }
    input, select {
      background: #06080f;
      border: 1px solid #2d3b52;
      border-radius: 10px;
      padding: 12px 16px;
      color: #e8edf7;
      outline: none;
    }
    input:focus { border-color: #3b82f6; }
    .btn {
      background: #3b82f6;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-green { background: #10b981; }
    .btn-red { background: #ef4444; }
    .btn-purple { background: #8b5cf6; }
    .btn-ghost { background: #111827; border: 1px solid #2d3b52; }
    
    /* Rooms Grid */
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .room-card {
      background: rgba(13,17,32,0.9);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 20px;
      padding: 20px;
      transition: all 0.2s;
    }
    .room-card.active { border-color: #10b981; background: rgba(16,185,129,0.05); }
    .room-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .room-code-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: #3b82f6;
      letter-spacing: 3px;
    }
    .room-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-active { background: rgba(16,185,129,0.2); color: #10b981; }
    .badge-ended { background: rgba(239,68,68,0.2); color: #ef4444; }
    .badge-waiting { background: rgba(245,158,11,0.2); color: #f59e0b; }
    
    .room-stats {
      display: flex;
      gap: 20px;
      margin: 16px 0;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .stat { flex: 1; text-align: center; }
    .stat-value { font-size: 20px; font-weight: 700; color: #f59e0b; }
    .stat-label { font-size: 10px; color: #6b7a99; }
    
    .room-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .btn-sm { padding: 8px 16px; font-size: 12px; }
    
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0d1120;
      border: 1px solid #2d3b52;
      border-radius: 10px;
      padding: 12px 20px;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">PLAY<span style="color:#3b82f6">A</span>QUIZ</div>
    <div class="conn-status">
      <div class="status-dot" id="connDot"></div>
      <span id="connText">Connecting...</span>
    </div>
  </div>

  <!-- Create New Room -->
  <div class="create-card">
    <div class="create-title">🏠 Create New Game Room</div>
    <div class="room-input-group">
      <div class="input-field">
        <label>Room Code (4-8 characters)</label>
        <input type="text" id="manualRoomCode" class="room-code-input" placeholder="QUIZ" maxlength="8" autocomplete="off">
      </div>
      <div class="input-field">
        <label>Game Title</label>
        <input type="text" id="roomTitle" placeholder="My Quiz Game" value="Self-Paced Quiz">
      </div>
      <div class="input-field">
        <label>Game Type</label>
        <select id="gameType">
          <option value="self_paced">Self-Paced (No Admin Intervention)</option>
          <option value="admin_led">Admin-Led (Classic)</option>
        </select>
      </div>
      <button class="btn btn-green" onclick="createRoom()">✨ Create Room</button>
      <button class="btn btn-purple" onclick="generateRandomCode()">🎲 Random Code</button>
    </div>
  </div>

  <!-- Active Rooms List -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px;">
    <h2>📋 Game Rooms</h2>
    <button class="btn btn-ghost btn-sm" onclick="loadRooms()">⟳ Refresh</button>
  </div>
  <div class="rooms-grid" id="roomsGrid">
    <div style="text-align: center; padding: 40px; color: #6b7a99;">Loading rooms...</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let connectionCheckInterval = null;

// Check Supabase connection
async function checkConnection() {
  const dot = document.getElementById('connDot');
  const text = document.getElementById('connText');
  
  try {
    const { data, error } = await sb.from('game_sessions').select('count', { count: 'exact', head: true });
    if (!error) {
      dot.classList.add('connected');
      text.innerText = 'Connected to Supabase';
      return true;
    } else {
      throw error;
    }
  } catch(e) {
    dot.classList.remove('connected');
    text.innerText = 'Connection Error - Check network';
    return false;
  }
}

// Generate random room code
function generateRandomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
  let code = '';
  for (let i = 0; i < 6; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  document.getElementById('manualRoomCode').value = code;
}

// Create a new room
async function createRoom() {
  let roomCode = document.getElementById('manualRoomCode').value.trim().toUpperCase();
  const title = document.getElementById('roomTitle').value.trim() || 'Quiz Game';
  const gameType = document.getElementById('gameType').value;
  
  if (!roomCode) {
    generateRandomCode();
    roomCode = document.getElementById('manualRoomCode').value;
  }
  
  if (roomCode.length < 3) {
    toast('Room code must be at least 3 characters', 'error');
    return;
  }
  
  // Check if room code already exists
  const { data: existing } = await sb
    .from('game_sessions')
    .select('id')
    .eq('room_code', roomCode)
    .maybeSingle();
  
  if (existing) {
    toast(`Room code "${roomCode}" already exists! Try another.`, 'error');
    return;
  }
  
  // Create new session
  const { data: session, error } = await sb
    .from('game_sessions')
    .insert({
      room_code: roomCode,
      title: title,
      status: 'waiting',
      type: gameType,
      created_at: new Date()
    })
    .select()
    .single();
  
  if (error) {
    toast('Error creating room: ' + error.message, 'error');
    return;
  }
  
  toast(`✅ Room "${roomCode}" created successfully!`, 'success');
  document.getElementById('manualRoomCode').value = '';
  await loadRooms();
}

// Load all rooms
async function loadRooms() {
  const { data: rooms, error } = await sb
    .from('game_sessions')
    .select('*')
    .order('created_at', { ascending: false });
  
  if (error) {
    document.getElementById('roomsGrid').innerHTML = '<div style="text-align: center; padding: 40px; color: #ef4444;">Error loading rooms</div>';
    return;
  }
  
  if (!rooms || rooms.length === 0) {
    document.getElementById('roomsGrid').innerHTML = '<div style="text-align: center; padding: 40px; color: #6b7a99;">No rooms yet. Create your first room above!</div>';
    return;
  }
  
  // Get player counts for each room
  const roomsWithCounts = await Promise.all(rooms.map(async (room) => {
    const { count } = await sb
      .from('players')
      .select('*', { count: 'exact', head: true })
      .eq('session_id', room.id);
    
    const { count: completedCount } = await sb
      .from('players')
      .select('*', { count: 'exact', head: true })
      .eq('session_id', room.id)
      .eq('completed', true);
    
    return { ...room, playerCount: count || 0, completedCount: completedCount || 0 };
  }));
  
  document.getElementById('roomsGrid').innerHTML = roomsWithCounts.map(room => `
    <div class="room-card ${room.status === 'active' ? 'active' : ''}">
      <div class="room-card-header">
        <div class="room-code-display">${room.room_code}</div>
        <div class="room-badge badge-${room.status}">${room.status.toUpperCase()}</div>
      </div>
      <div style="font-size: 14px; color: #6b7a99; margin-bottom: 8px;">${escapeHtml(room.title || 'Untitled')}</div>
      <div style="font-size: 11px; color: #6b7a99; margin-bottom: 12px;">Type: ${room.type === 'self_paced' ? 'Self-Paced' : 'Admin-Led'}</div>
      
      <div class="room-stats">
        <div class="stat">
          <div class="stat-value">${room.playerCount}</div>
          <div class="stat-label">Players</div>
        </div>
        <div class="stat">
          <div class="stat-value">${room.completedCount}</div>
          <div class="stat-label">Completed</div>
        </div>
        <div class="stat">
          <div class="stat-value">${new Date(room.created_at).toLocaleDateString()}</div>
          <div class="stat-label">Created</div>
        </div>
      </div>
      
      <div class="room-actions">
        <button class="btn btn-sm btn-green" onclick="openAdmin('${room.id}', '${room.room_code}', '${room.type}')">🎮 Open Admin</button>
        <button class="btn btn-sm btn-purple" onclick="openFOH('${room.id}', '${room.room_code}')">📺 Open FOH</button>
        ${room.status !== 'ended' ? `<button class="btn btn-sm btn-ghost" onclick="copyRoomLink('${room.room_code}')">🔗 Copy Link</button>` : ''}
        <button class="btn btn-sm btn-red" onclick="deleteRoom('${room.id}', '${room.room_code}')">🗑️ Delete</button>
      </div>
    </div>
  `).join('');
}

// Open Admin Console
function openAdmin(sessionId, roomCode, type) {
  if (type === 'self_paced') {
    window.open(`admin-sp.html?session=${sessionId}&room=${roomCode}`, '_blank');
  } else {
    window.open(`admin.html?session=${sessionId}&room=${roomCode}`, '_blank');
  }
}

// Open FOH Display
function openFOH(sessionId, roomCode) {
  window.open(`foh-sp.html?session=${sessionId}&room=${roomCode}`, '_blank');
}

// Copy join link to clipboard
function copyRoomLink(roomCode) {
  const joinUrl = `${window.location.origin}/player-sp.html?room=${roomCode}`;
  navigator.clipboard.writeText(joinUrl);
  toast(`📋 Join link copied! Share with players: ${joinUrl}`, 'success');
}

// Delete room
async function deleteRoom(sessionId, roomCode) {
  if (!confirm(`Delete room "${roomCode}" and all its data? This cannot be undone!`)) return;
  
  // Delete players first
  await sb.from('players').delete().eq('session_id', sessionId);
  // Delete answers
  await sb.from('answers').delete().eq('session_id', sessionId);
  // Delete game events
  await sb.from('game_events').delete().eq('session_id', sessionId);
  // Delete session questions
  await sb.from('questions').delete().eq('session_id', sessionId);
  // Delete session
  await sb.from('game_sessions').delete().eq('id', sessionId);
  
  toast(`🗑️ Room "${roomCode}" deleted`, 'success');
  await loadRooms();
}

// Get player count for a session
async function getPlayerCount(sessionId) {
  const { count } = await sb.from('players').select('*', { count: 'exact', head: true }).eq('session_id', sessionId);
  return count || 0;
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerText = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

// Auto-refresh rooms every 10 seconds
setInterval(loadRooms, 10000);
setInterval(checkConnection, 5000);

// Initialize
checkConnection();
loadRooms();

// Expose functions
window.createRoom = createRoom;
window.generateRandomCode = generateRandomCode;
window.openAdmin = openAdmin;
window.openFOH = openFOH;
window.copyRoomLink = copyRoomLink;
window.deleteRoom = deleteRoom;
window.loadRooms = loadRooms;
</script>
</body>
</html>
