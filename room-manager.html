<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0c15 0%, #03050b 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: #e8edf7;
      min-height: 100vh;
    }
    .login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 5, 11, 0.98);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .login-card {
      background: linear-gradient(135deg, rgba(13, 17, 32, 0.95), rgba(17, 24, 39, 0.95));
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 32px;
      padding: 48px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .login-icon { font-size: 64px; margin-bottom: 16px; }
    .login-title { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .login-sub { font-size: 14px; color: #6b7a99; margin-bottom: 32px; }
    .password-input {
      background: #06080f;
      border: 2px solid #2d3b52;
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 20px;
      color: #fff;
      width: 100%;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 4px;
      font-family: 'JetBrains Mono', monospace;
    }
    .password-input:focus {
      border-color: #3b82f6;
      outline: none;
    }
    .login-btn {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      color: white;
      cursor: pointer;
    }
    .login-error { color: #ef4444; font-size: 13px; margin-top: 16px; }
    .app-container { display: none; padding: 20px; max-width: 1600px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px 24px;
      background: rgba(13, 17, 32, 0.8);
      border-radius: 20px;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      background: linear-gradient(135deg, #fff, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .admin-badge {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 700;
      color: #ef4444;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: rgba(13, 17, 32, 0.8);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }
    .stat-value { font-size: 36px; font-weight: 800; color: #3b82f6; }
    .stat-label { font-size: 12px; color: #6b7a99; margin-top: 8px; }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: rgba(13, 17, 32, 0.5);
      border-radius: 16px;
      padding: 6px;
    }
    .tab {
      flex: 1;
      padding: 12px 24px;
      background: transparent;
      border: none;
      color: #6b7a99;
      font-weight: 700;
      cursor: pointer;
      border-radius: 12px;
    }
    .tab.active {
      background: #3b82f6;
      color: white;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .create-card {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.05));
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-radius: 24px;
      padding: 32px;
      margin-bottom: 30px;
    }
    .form-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .form-group { flex: 1; min-width: 150px; }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      color: #6b7a99;
      margin-bottom: 6px;
      font-weight: 700;
    }
    input, select {
      background: #06080f;
      border: 1px solid #2d3b52;
      border-radius: 12px;
      padding: 12px 16px;
      color: #e8edf7;
      outline: none;
      width: 100%;
      font-size: 14px;
    }
    .btn {
      background: #3b82f6;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      color: white;
      cursor: pointer;
    }
    .btn-green { background: #10b981; }
    .btn-purple { background: #8b5cf6; }
    .btn-red { background: #ef4444; }
    .btn-ghost { background: #1f2937; border: 1px solid #374151; }
    .btn-sm { padding: 8px 16px; font-size: 12px; }
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .room-card {
      background: rgba(13, 17, 32, 0.9);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 20px;
      padding: 20px;
    }
    .room-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #3b82f6;
    }
    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-waiting { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .badge-final { background: rgba(245, 200, 66, 0.2); color: #f5c842; }
    .badge-sp { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    .room-stats {
      display: flex;
      gap: 20px;
      margin: 16px 0;
      padding: 12px 0;
      border-top: 1px solid rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .stat-item { flex: 1; text-align: center; }
    .stat-number { font-size: 20px; font-weight: 700; color: #f59e0b; }
    .room-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0d1120;
      border: 1px solid #2d3b52;
      border-radius: 12px;
      padding: 12px 20px;
      z-index: 4000;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid #2d3b52;
      padding: 8px 20px;
      border-radius: 40px;
      cursor: pointer;
      color: #6b7a99;
      font-weight: 600;
    }
    .filter-btn.active {
      background: #3b82f6;
      color: white;
    }
    .hidden { display: none; }
    .dialog-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }
    .dialog-card {
      background: #0d1120;
      border: 2px solid rgba(59,130,246,0.3);
      border-radius: 24px;
      padding: 32px;
      max-width: 500px;
      width: 90%;
    }
  </style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <div class="login-title">Admin Access</div>
    <div class="login-sub">Default password: admin123</div>
    <input type="password" id="adminPassword" class="password-input" placeholder="Enter Password" onkeypress="if(event.key==='Enter') verifyAdminLogin()">
    <button class="login-btn" onclick="verifyAdminLogin()">Unlock Dashboard →</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<div id="appContainer" class="app-container">
  <div class="header">
    <div class="logo">PLAY<span style="color:#3b82f6">A</span>QUIZ</div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <div class="admin-badge">👑 ADMIN</div>
      <button class="btn btn-ghost" onclick="logout()">🚪 Logout</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-value" id="totalRooms">0</div><div class="stat-label">Total Rooms</div></div>
    <div class="stat-card"><div class="stat-value" id="activeRooms">0</div><div class="stat-label">Active Rooms</div></div>
    <div class="stat-card"><div class="stat-value" id="totalPlayers">0</div><div class="stat-label">Total Players</div></div>
    <div class="stat-card"><div class="stat-value" id="upcomingRooms">0</div><div class="stat-label">Upcoming</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('create')">✨ Create Room</button>
    <button class="tab" onclick="switchTab('manage')">📋 Manage Rooms</button>
    <button class="tab" onclick="switchTab('schedule')">📅 Schedule Room</button>
  </div>

  <div id="tabCreate" class="tab-content active">
    <div class="create-card">
      <h2 style="margin-bottom: 24px;">🏠 Create New Game Room</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Room Code</label>
          <input type="text" id="roomCode" placeholder="QUIZ" maxlength="8">
        </div>
        <div class="form-group">
          <label>Game Title</label>
          <input type="text" id="roomTitle" value="Quiz Game">
        </div>
        <div class="form-group">
          <label>Game Mode</label>
          <select id="gameType">
            <option value="self_paced">⚡ Self-Paced</option>
            <option value="final_round">🎯 Final Round (Buzzer)</option>
          </select>
        </div>
      </div>
      <div style="display: flex; gap: 12px;">
        <button class="btn btn-green" onclick="createRoom()">✨ Create Room</button>
        <button class="btn btn-purple" onclick="generateRandomCode()">🎲 Random Code</button>
      </div>
    </div>
  </div>

  <div id="tabManage" class="tab-content">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterRooms('all')">All</button>
      <button class="filter-btn" onclick="filterRooms('active')">Active</button>
      <button class="filter-btn" onclick="filterRooms('upcoming')">Upcoming</button>
    </div>
    <div class="rooms-grid" id="roomsGrid"></div>
  </div>

  <div id="tabSchedule" class="tab-content">
    <div class="create-card">
      <h2 style="margin-bottom: 24px;">📅 Schedule Room</h2>
      <div class="form-row">
        <div class="form-group"><label>Room Code</label><input type="text" id="schedRoomCode"></div>
        <div class="form-group"><label>Title</label><input type="text" id="schedTitle"></div>
        <div class="form-group"><label>Mode</label><select id="schedGameType"><option value="self_paced">Self-Paced</option><option value="final_round">Final Round</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Date</label><input type="date" id="schedDate"></div>
        <div class="form-group"><label>Time</label><input type="time" id="schedTime"></div>
      </div>
      <button class="btn btn-purple" onclick="scheduleRoom()">📅 Schedule</button>
    </div>
    <div class="rooms-grid" id="scheduledGrid"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let currentFilter = 'all';

async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function verifyAdminLogin() {
  const password = document.getElementById('adminPassword').value;
  const errorDiv = document.getElementById('loginError');
  const btn = document.querySelector('.login-btn');
  
  if (!password) {
    errorDiv.innerText = 'Please enter password';
    return;
  }
  
  btn.disabled = true;
  btn.innerText = 'Verifying...';
  errorDiv.innerText = '';
  
  try {
    const { data, error } = await sb.from('admin_settings').select('admin_password_hash').single();
    
    if (error) {
      errorDiv.innerText = 'Database error: ' + error.message;
      btn.disabled = false;
      btn.innerText = 'Unlock Dashboard →';
      return;
    }
    
    const hashedInput = await hashPassword(password);
    
    if (hashedInput === data.admin_password_hash) {
      localStorage.setItem('admin_auth', 'true');
      localStorage.setItem('admin_auth_time', Date.now().toString());
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appContainer').style.display = 'block';
      initApp();
    } else {
      errorDiv.innerText = 'Incorrect password! Try: admin123';
    }
  } catch (err) {
    errorDiv.innerText = 'Connection error: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.innerText = 'Unlock Dashboard →';
  }
}

function checkAuth() {
  const auth = localStorage.getItem('admin_auth');
  const authTime = localStorage.getItem('admin_auth_time');
  
  if (auth === 'true' && authTime) {
    const hoursSince = (Date.now() - parseInt(authTime)) / (1000 * 60 * 60);
    if (hoursSince < 24) {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appContainer').style.display = 'block';
      initApp();
      return true;
    }
  }
  return false;
}

function logout() {
  localStorage.removeItem('admin_auth');
  localStorage.removeItem('admin_auth_time');
  location.reload();
}

function generateRandomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('roomCode').value = code;
}

function generateHostToken() {
  return 'ht_' + crypto.randomUUID().replace(/-/g, '');
}

async function createRoom() {
  let roomCode = document.getElementById('roomCode').value.trim().toUpperCase();
  const title = document.getElementById('roomTitle').value.trim() || 'Quiz Game';
  const gameType = document.getElementById('gameType').value;
  
  if (!roomCode) {
    generateRandomCode();
    roomCode = document.getElementById('roomCode').value;
  }
  
  const hostToken = generateHostToken();
  const tokenExpires = new Date();
  tokenExpires.setDate(tokenExpires.getDate() + 30);
  
  const btn = event.target;
  btn.disabled = true;
  btn.innerText = 'Creating...';
  
  try {
    const { error } = await sb.from('game_sessions').insert({
      room_code: roomCode,
      title: title,
      status: 'waiting',
      game_type: gameType,
      host_token: hostToken,
      host_token_expires: tokenExpires.toISOString(),
      created_at: new Date().toISOString()
    });
    
    if (error) throw error;
    
    const hostLink = `${window.location.origin}/hostcontrol.html?room=${roomCode}&token=${hostToken}`;
    alert(`✅ Room "${roomCode}" created!\n\nHost Link: ${hostLink}\n\nPlayer Link: ${window.location.origin}/${gameType === 'final_round' ? 'finalroundplayer.html' : 'player-sp.html'}?room=${roomCode}`);
    
    await loadRooms();
    await updateStats();
    
  } catch (err) {
    alert('Error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = '✨ Create Room';
  }
}

async function scheduleRoom() {
  const roomCode = document.getElementById('schedRoomCode').value.trim().toUpperCase();
  const title = document.getElementById('schedTitle').value.trim() || 'Scheduled Quiz';
  const gameType = document.getElementById('schedGameType').value;
  const date = document.getElementById('schedDate').value;
  const time = document.getElementById('schedTime').value;
  
  if (!roomCode || !date) {
    alert('Enter room code and date');
    return;
  }
  
  let localDateTime;
  if (time) {
    const [year, month, day] = date.split('-');
    const [hour, minute] = time.split(':');
    localDateTime = new Date(year, month - 1, day, hour, minute, 0);
  } else {
    const [year, month, day] = date.split('-');
    localDateTime = new Date(year, month - 1, day, 0, 0, 0);
  }
  
  if (localDateTime < new Date()) {
    alert('Date must be in the future');
    return;
  }
  
  const utcDateTime = new Date(localDateTime.getTime() - (localDateTime.getTimezoneOffset() * 60000));
  const hostToken = generateHostToken();
  const tokenExpires = new Date();
  tokenExpires.setDate(tokenExpires.getDate() + 30);
  
  const btn = event.target;
  btn.disabled = true;
  btn.innerText = 'Scheduling...';
  
  try {
    const { error } = await sb.from('game_sessions').insert({
      room_code: roomCode,
      title: title,
      status: 'scheduled',
      game_type: gameType,
      host_token: hostToken,
      host_token_expires: tokenExpires.toISOString(),
      scheduled_date: utcDateTime.toISOString(),
      created_at: new Date().toISOString()
    });
    
    if (error) throw error;
    
    alert(`✅ Room "${roomCode}" scheduled for ${localDateTime.toLocaleString()}`);
    
    document.getElementById('schedRoomCode').value = '';
    document.getElementById('schedTitle').value = '';
    document.getElementById('schedDate').value = '';
    document.getElementById('schedTime').value = '';
    
    await loadRooms();
    await loadScheduledRooms();
    await updateStats();
    
  } catch (err) {
    alert('Error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = '📅 Schedule';
  }
}

async function loadRooms() {
  try {
    const { data: rooms, error } = await sb.from('game_sessions').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    
    let filtered = rooms;
    if (currentFilter === 'active') filtered = rooms.filter(r => r.status === 'active' || r.status === 'waiting');
    else if (currentFilter === 'upcoming') filtered = rooms.filter(r => r.status === 'scheduled');
    
    const roomsWithCounts = await Promise.all(filtered.map(async (room) => {
      const { count } = await sb.from('players').select('*', { count: 'exact', head: true }).eq('session_id', room.id);
      return { ...room, playerCount: count || 0 };
    }));
    
    const grid = document.getElementById('roomsGrid');
    if (roomsWithCounts.length === 0) {
      grid.innerHTML = '<div style="text-align:center;padding:40px;color:#6b7a99;">No rooms found</div>';
      return;
    }
    
    grid.innerHTML = roomsWithCounts.map(room => {
      const isFinal = room.game_type === 'final_round';
      const hostLink = `${window.location.origin}/hostcontrol.html?room=${room.room_code}&token=${room.host_token}`;
      
      return `
        <div class="room-card">
          <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
            <div class="room-code">${room.room_code}</div>
            <div>
              <span class="badge badge-waiting">${room.status?.toUpperCase() || 'WAITING'}</span>
              <span class="badge ${isFinal ? 'badge-final' : 'badge-sp'}">${isFinal ? '🎯 FINAL' : '⚡ SP'}</span>
            </div>
          </div>
          <div style="font-size:14px;color:#6b7a99;margin-bottom:12px;">${escapeHtml(room.title)}</div>
          <div class="room-stats">
            <div class="stat-item"><div class="stat-number">${room.playerCount}</div><div class="stat-label">Players</div></div>
          </div>
          <div class="room-actions">
            <button class="btn btn-sm btn-purple" onclick="window.open('${hostLink}', '_blank')">🎮 Open Host</button>
            <button class="btn btn-sm btn-red" onclick="deleteRoom('${room.id}', '${room.room_code}')">🗑️ Delete</button>
          </div>
        </div>
      `;
    }).join('');
    
  } catch (err) {
    console.error('Load rooms error:', err);
  }
}

async function loadScheduledRooms() {
  try {
    const { data: rooms, error } = await sb.from('game_sessions').select('*').eq('status', 'scheduled').order('scheduled_date', { ascending: true });
    if (error) throw error;
    
    const grid = document.getElementById('scheduledGrid');
    if (!rooms || rooms.length === 0) {
      grid.innerHTML = '<div style="text-align:center;padding:40px;color:#6b7a99;">No scheduled rooms</div>';
      return;
    }
    
    grid.innerHTML = rooms.map(room => {
      const schedDate = new Date(room.scheduled_date);
      return `
        <div class="room-card">
          <div class="room-code" style="margin-bottom:8px;">${room.room_code}</div>
          <div style="font-size:14px;">${escapeHtml(room.title)}</div>
          <div style="font-size:12px;color:#6b7a99;margin:8px 0;">📅 ${schedDate.toLocaleString()}</div>
          <button class="btn btn-sm btn-green" onclick="activateRoom('${room.id}', '${room.room_code}')">▶ Activate Now</button>
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error('Load scheduled error:', err);
  }
}

async function activateRoom(sessionId, roomCode) {
  if (!confirm(`Activate room "${roomCode}" now?`)) return;
  try {
    await sb.from('game_sessions').update({ status: 'waiting', scheduled_date: null }).eq('id', sessionId);
    alert(`✅ Room "${roomCode}" activated!`);
    await loadRooms();
    await loadScheduledRooms();
    await updateStats();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function deleteRoom(sessionId, roomCode) {
  if (!confirm(`Delete room "${roomCode}" and ALL data? This cannot be undone!`)) return;
  
  try {
    await sb.from('answers').delete().eq('session_id', sessionId);
    await sb.from('players').delete().eq('session_id', sessionId);
    await sb.from('questions').delete().eq('session_id', sessionId);
    await sb.from('categories').delete().eq('session_id', sessionId);
    await sb.from('game_sessions').delete().eq('id', sessionId);
    
    alert(`🗑️ Room "${roomCode}" deleted`);
    await loadRooms();
    await loadScheduledRooms();
    await updateStats();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function updateStats() {
  try {
    const { data: rooms } = await sb.from('game_sessions').select('status');
    const { data: players } = await sb.from('players').select('id');
    
    document.getElementById('totalRooms').innerText = rooms?.length || 0;
    document.getElementById('activeRooms').innerText = rooms?.filter(r => r.status === 'active' || r.status === 'waiting').length || 0;
    document.getElementById('totalPlayers').innerText = players?.length || 0;
    document.getElementById('upcomingRooms').innerText = rooms?.filter(r => r.status === 'scheduled').length || 0;
  } catch (err) {
    console.error('Stats error:', err);
  }
}

function filterRooms(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  if (event.target) event.target.classList.add('active');
  loadRooms();
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  if (tab === 'create') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('tabCreate').classList.add('active');
  } else if (tab === 'manage') {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('tabManage').classList.add('active');
    loadRooms();
  } else if (tab === 'schedule') {
    document.querySelectorAll('.tab')[2].classList.add('active');
    document.getElementById('tabSchedule').classList.add('active');
    loadScheduledRooms();
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

async function initApp() {
  await loadRooms();
  await loadScheduledRooms();
  await updateStats();
  generateRandomCode();
  
  setInterval(() => {
    if (document.getElementById('tabManage').classList.contains('active')) loadRooms();
    updateStats();
  }, 15000);
}

// Start
if (!checkAuth()) {
  // Show login overlay
  console.log('Showing login...');
}
</script>
