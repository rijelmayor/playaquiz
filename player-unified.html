<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #050410;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --gold: #f5c842;
      --gold-dim: rgba(245, 200, 66, 0.15);
      --green: #22d3a0;
      --green-dim: rgba(34, 211, 160, 0.15);
      --red: #f43f5e;
      --red-dim: rgba(244, 63, 94, 0.15);
      --text: #f0eeff;
      --muted: rgba(240, 238, 255, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      width: 100%;
    }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 100% 80% at 15% 0%, rgba(99, 102, 241, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 85% 100%, rgba(167, 139, 250, 0.14) 0%, transparent 50%),
        radial-gradient(ellipse 60% 50% at 50% 50%, rgba(245, 200, 66, 0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── SCREENS ───────────────────────────────────────────────────────────── */
    .screen {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.4s ease;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* ─── JOIN SCREEN ────────────────────────────────────────────────────────── */
    #joinScreen {
      padding: 20px 16px;
      gap: 16px;
      overflow-y: auto;
    }

    .login-logo {
      font-family: 'Syne', sans-serif;
      font-size: clamp(26px, 8vw, 36px);
      font-weight: 800;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #fff 20%, var(--gold) 70%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-tagline {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .form-group {
      width: 100%;
      max-width: 320px;
      margin: 12px 0;
    }

    .form-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    input,
    select {
      width: 100%;
      padding: 10px 14px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus,
    select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245, 200, 66, 0.1);
    }

    .btn {
      background: linear-gradient(135deg, var(--gold), #f0ad4e);
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      color: #000;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
      width: 100%;
      max-width: 320px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(245, 200, 66, 0.2);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ─── LOBBY SCREEN ──────────────────────────────────────────────────────── */
    #lobbyScreen {
      padding: 20px;
    }

    .lobby-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .lobby-title {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .player-list {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .player-item {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-avatar-lg {
      font-size: 24px;
    }

    .player-name-text {
      flex: 1;
      font-weight: 600;
    }

    .loading-text {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    /* ─── QUIZ SCREEN ───────────────────────────────────────────────────────── */
    #quizScreen {
      padding: 24px;
      justify-content: space-around;
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .question-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .question-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(18px, 5vw, 28px);
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 32px;
    }

    .quiz-options {
      width: 100%;
      max-width: 400px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option-btn {
      background: var(--glass);
      border: 2px solid var(--glass-border);
      padding: 16px;
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .option-btn:hover {
      border-color: var(--gold);
      background: rgba(245, 200, 66, 0.05);
    }

    .option-btn.selected {
      border-color: var(--gold);
      background: rgba(245, 200, 66, 0.15);
    }

    .option-letter {
      font-size: 20px;
      font-weight: 800;
      color: var(--gold);
    }

    .option-text {
      font-size: 12px;
    }

    .submit-btn {
      margin-top: 24px;
      width: 100%;
      max-width: 400px;
    }

    /* ─── FINAL ROUND SCREEN ────────────────────────────────────────────────── */
    #finalRoundScreen {
      padding: 20px;
      justify-content: flex-start;
    }

    .final-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .final-logo {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 6px;
      color: var(--gold);
      margin-bottom: 16px;
    }

    .final-status {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 16px;
    }

    .final-status.ready {
      background: var(--green-dim);
      color: var(--green);
    }

    .final-status.locked {
      background: var(--red-dim);
      color: var(--red);
    }

    .final-status.correct {
      background: var(--green-dim);
      color: var(--green);
    }

    .final-status.wrong {
      background: var(--red-dim);
      color: var(--red);
    }

    .buzzer-button {
      width: clamp(100px, 40vw, 180px);
      height: clamp(100px, 40vw, 180px);
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--green), #18b981);
      color: white;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 0 10px 30px rgba(34, 211, 160, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 24px 0;
    }

    .buzzer-button:active {
      transform: scale(0.95);
      box-shadow: 0 5px 15px rgba(34, 211, 160, 0.3);
    }

    .buzzer-button:disabled {
      background: #6b7280;
      cursor: not-allowed;
      box-shadow: none;
    }

    .final-score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      color: var(--gold);
      margin-top: 24px;
    }

    .score-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    /* ─── RESULTS SCREEN ────────────────────────────────────────────────────── */
    #resultsScreen {
      padding: 24px;
      text-align: center;
    }

    .results-title {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 24px;
    }

    .results-medal {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .results-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .results-score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      color: var(--gold);
      font-weight: 700;
    }

    /* ─── ANIMATIONS ────────────────────────────────────────────────────────── */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
<div class="app">
  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <!-- PHASE 1: JOIN SCREEN                                                     -->
  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <div class="screen active" id="joinScreen">
    <div style="text-align: center;">
      <div class="login-logo">PLAYAQUIZ</div>
      <div class="login-tagline">Final Round</div>
    </div>

    <div class="form-group">
      <label class="form-label">Room Code</label>
      <input
        type="text"
        id="roomCodeInput"
        placeholder="e.g., QUIZ1234"
        maxlength="10"
        autocomplete="off"
        style="text-transform: uppercase; letter-spacing: 2px; font-size: 18px; font-weight: 700;"
      />
    </div>

    <div class="form-group">
      <label class="form-label">Your Name</label>
      <input
        type="text"
        id="playerNameInput"
        placeholder="Enter your name"
        maxlength="30"
        autocomplete="off"
      />
    </div>

    <div class="form-group">
      <label class="form-label">Pick Your Avatar</label>
      <select id="avatarSelect" style="font-size: 16px;">
        <option value="🧑">🧑 Person</option>
        <option value="👨">👨 Man</option>
        <option value="👩">👩 Woman</option>
        <option value="🤵">🤵 Groom</option>
        <option value="👰">👰 Bride</option>
        <option value="🎭">🎭 Actor</option>
        <option value="🕺">🕺 Dancer</option>
        <option value="💃">💃 Dancer F</option>
      </select>
    </div>

    <button class="btn" onclick="joinGame()">Join the Game</button>

    <div class="loading-text" id="joinStatus" style="visibility: hidden;"></div>
  </div>

  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <!-- PHASE 2: LOBBY/WAITING SCREEN                                            -->
  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <div class="screen" id="lobbyScreen">
    <div class="lobby-header">
      <div class="lobby-title">🎊 Game Lobby</div>
      <p style="color: var(--muted); font-size: 12px; letter-spacing: 1px;">Waiting for host to start...</p>
    </div>

    <div class="player-list" id="lobbyPlayerList">
      <div class="player-item">
        <span class="player-avatar-lg">🧑</span>
        <div class="player-name-text">You (waiting)</div>
      </div>
    </div>

    <div class="loading-text">Host will start soon...</div>
  </div>

  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <!-- PHASE 3: QUIZ SCREEN (Self-Paced)                                       -->
  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <div class="screen" id="quizScreen">
    <div class="quiz-header">
      <div class="question-number">Question <span id="quizQuestionNumber">1</span>/<span id="quizTotalQuestions">10</span></div>
      <div class="question-title" id="quizQuestionText">What is your favorite color?</div>
    </div>

    <div class="quiz-options" id="quizOptions">
      <!-- Options will be inserted here -->
    </div>

    <button class="btn submit-btn" id="submitBtn" onclick="submitAnswer()" disabled>
      Submit Answer
    </button>
  </div>

  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <!-- PHASE 4: FINAL ROUND SCREEN (Buzzer)                                    -->
  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <div class="screen" id="finalRoundScreen">
    <div class="final-header">
      <div class="final-logo">⚡ FINAL ROUND</div>
      <div class="final-status ready" id="finalStatus">● READY TO BUZZ</div>
    </div>

    <div style="text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <button
        class="buzzer-button"
        id="buzzerBtn"
        onclick="pressuzzer()"
        disabled
      >
        🔔
      </button>

      <div style="margin-top: 24px;">
        <div class="score-label">Your Score</div>
        <div class="final-score" id="finalScore">0 pts</div>
      </div>
    </div>
  </div>

  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <!-- PHASE 5: RESULTS SCREEN                                                  -->
  <!-- ═════════════════════════════════════════════════════════════════════════ -->
  <div class="screen" id="resultsScreen">
    <div class="results-title">GAME OVER</div>
    <div class="results-medal" id="resultsMedal">🏆</div>
    <div class="results-name" id="resultsName">Player Name</div>
    <div class="results-score" id="resultsFinalScore">1,250 pts</div>
    <p style="margin-top: 32px; color: var(--muted); font-size: 12px;">Tap screen to close</p>
  </div>
</div>

<!-- ═════════════════════════════════════════════════════════════════════════ -->
<!-- SCRIPTS                                                                   -->
<!-- ═════════════════════════════════════════════════════════════════════════ -->
<script src="shared-utilities.js"></script>
<script>
  // ─── STATE ─────────────────────────────────────────────────────────────────
  const playerState = {
    phase: 'join', // join, lobby, quiz, final_round, results
    roomCode: null,
    playerId: null,
    playerName: null,
    avatar: null,
    score: 0,
    answers: [],
    selectedAnswer: null,
    gameState: {},
    
    updatePhase(newPhase) {
      this.phase = newPhase;
      renderPhase(newPhase);
    },
    
    persist() {
      Utils.saveToStorage('player_state', this);
    },
    
    restore() {
      const saved = Utils.getFromStorage('player_state', {});
      Object.assign(this, saved);
    }
  };

  // ─── PHASE RENDERING ───────────────────────────────────────────────────────
  function renderPhase(phase) {
    document.querySelectorAll('.screen').forEach(screen => {
      screen.classList.remove('active');
    });
    
    const screenMap = {
      join: 'joinScreen',
      lobby: 'lobbyScreen',
      quiz: 'quizScreen',
      final_round: 'finalRoundScreen',
      results: 'resultsScreen'
    };
    
    const screenId = screenMap[phase];
    const screen = document.getElementById(screenId);
    if (screen) {
      screen.classList.add('active');
      
      // Call phase-specific setup
      if (typeof window[`setup${phase.replace(/_/g, ' ').split(' ').map(w => w[0].toUpperCase() + w.slice(1)).join('')}`] === 'function') {
        window[`setup${phase.replace(/_/g, ' ').split(' ').map(w => w[0].toUpperCase() + w.slice(1)).join('')}`]();
      }
    }
  }

  // ─── PHASE 1: JOIN ─────────────────────────────────────────────────────────
  function joinGame() {
    const roomCode = document.getElementById('roomCodeInput').value.toUpperCase().trim();
    const playerName = document.getElementById('playerNameInput').value.trim();
    const avatar = document.getElementById('avatarSelect').value;
    
    // Validation
    if (!Utils.isValidRoomCode(roomCode)) {
      Utils.toast('❌ Invalid room code', 'error');
      return;
    }
    
    if (!Utils.isValidName(playerName)) {
      Utils.toast('❌ Invalid player name', 'error');
      return;
    }
    
    // Save state
    playerState.roomCode = roomCode;
    playerState.playerName = playerName;
    playerState.avatar = avatar;
    playerState.playerId = 'p_' + Math.random().toString(36).substring(7);
    playerState.persist();
    
    Utils.logEvent('player_joined', { roomCode, playerName });
    Utils.toast(`✅ Joined room ${roomCode}!`);
    
    // Transition to lobby
    playerState.updatePhase('lobby');
    
    // Simulate server sync
    setTimeout(() => {
      // Auto-transition to quiz (in real app, server would trigger this)
      playerState.updatePhase('quiz');
      setupQuiz();
    }, 3000);
  }

  // ─── PHASE 3: QUIZ ─────────────────────────────────────────────────────────
  function setupQuiz() {
    // Load mock questions
    const mockQuestions = [
      {
        id: 'q1',
        text: 'Where did Sarah and Mark first meet?',
        options: ['At university', 'At work', 'Through friends', 'At a wedding'],
        correct: 2
      },
      {
        id: 'q2',
        text: 'What is their favorite travel destination?',
        options: ['Japan', 'Italy', 'Spain', 'France'],
        correct: 1
      }
    ];
    
    const question = mockQuestions[0];
    document.getElementById('quizQuestionText').textContent = question.text;
    document.getElementById('quizQuestionNumber').textContent = '1';
    document.getElementById('quizTotalQuestions').textContent = mockQuestions.length;
    
    const optionsContainer = document.getElementById('quizOptions');
    optionsContainer.innerHTML = question.options.map((opt, i) => `
      <button class="option-btn" onclick="selectOption(${i})">
        <span class="option-letter">${String.fromCharCode(65 + i)}</span>
        <span class="option-text">${opt}</span>
      </button>
    `).join('');
  }

  function selectOption(index) {
    // Unselect previous
    document.querySelectorAll('.option-btn').forEach(btn => {
      btn.classList.remove('selected');
    });
    
    // Select new
    document.querySelectorAll('.option-btn')[index].classList.add('selected');
    playerState.selectedAnswer = index;
    
    // Enable submit
    document.getElementById('submitBtn').disabled = false;
  }

  function submitAnswer() {
    if (playerState.selectedAnswer === null) return;
    
    Utils.playSuccessSound();
    Utils.toast('✅ Answer submitted!');
    
    playerState.answers.push(playerState.selectedAnswer);
    playerState.score += Math.random() > 0.5 ? 100 : 0;
    
    Utils.logEvent('answer_submitted', { selectedAnswer: playerState.selectedAnswer });
    
    // Simulate transition to final round
    setTimeout(() => {
      playerState.updatePhase('final_round');
      setupFinalRound();
    }, 1500);
  }

  // ─── PHASE 4: FINAL ROUND ──────────────────────────────────────────────────
  function setupFinalRound() {
    document.getElementById('finalScore').textContent = playerState.score + ' pts';
    document.getElementById('buzzerBtn').disabled = false;
    document.getElementById('finalStatus').textContent = '● READY TO BUZZ';
    document.getElementById('finalStatus').className = 'final-status ready';
  }

  function pressBuzzer() {
    const buzzerBtn = document.getElementById('buzzerBtn');
    buzzerBtn.disabled = true;
    
    Utils.playBuzzerSound();
    
    document.getElementById('finalStatus').textContent = '🔔 BUZZED';
    document.getElementById('finalStatus').className = 'final-status';
    
    Utils.logEvent('buzzer_pressed');
    
    // Simulate host response (correct/wrong)
    setTimeout(() => {
      const isCorrect = Math.random() > 0.3;
      
      if (isCorrect) {
        Utils.playSuccessSound();
        Utils.fireConfetti();
        document.getElementById('finalStatus').textContent = '✅ CORRECT!';
        document.getElementById('finalStatus').className = 'final-status correct';
        playerState.score += 100;
        document.getElementById('finalScore').textContent = playerState.score + ' pts';
      } else {
        Utils.playErrorSound();
        document.getElementById('finalStatus').textContent = '❌ WRONG';
        document.getElementById('finalStatus').className = 'final-status wrong';
      }
      
      // Re-enable buzzer after 2 seconds
      setTimeout(() => {
        buzzerBtn.disabled = false;
        document.getElementById('finalStatus').textContent = '● READY TO BUZZ';
        document.getElementById('finalStatus').className = 'final-status ready';
      }, 2000);
    }, 500);
  }

  // ─── INITIALIZATION ────────────────────────────────────────────────────────
  function initPlayer() {
    console.log('🎮 Initializing Player Interface');
    
    // Request WakeLock
    Utils.requestWakeLock();
    
    // Restore state if available
    playerState.restore();
    
    // Focus room code input
    document.getElementById('roomCodeInput').focus();
    
    Utils.logEvent('player_initialized');
  }

  // ─── EXPOSE FUNCTIONS ──────────────────────────────────────────────────────
  window.joinGame = joinGame;
  window.selectOption = selectOption;
  window.submitAnswer = submitAnswer;
  window.pressBuzzer = pressBuzzer;

  // ─── STARTUP ────────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', initPlayer);
</script>
</body>
</html>
