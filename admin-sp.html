<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Admin Console (Self-Paced)</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0c15 0%, #06080f 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: #e8edf7;
      min-height: 100vh;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    
    /* Header with Connection Status */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(13,17,32,0.8);
      border-radius: 20px;
      border: 1px solid rgba(59,130,246,0.2);
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      background: linear-gradient(135deg, #fff, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .room-info {
      text-align: center;
    }
    .room-label {
      font-size: 10px;
      color: #6b7a99;
      letter-spacing: 2px;
    }
    .room-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 700;
      color: #3b82f6;
      letter-spacing: 4px;
    }
    .conn-status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 40px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    .status-dot.connected { background: #10b981; }
    .status-dot.reconnecting { background: #f59e0b; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    
    /* Rest of your existing styles */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: rgba(13,17,32,0.8);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .stat-number { font-size: 36px; font-weight: 800; color: #3b82f6; }
    .stat-label { font-size: 12px; color: #6b7a99; margin-top: 5px; }
    
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .card {
      background: rgba(13,17,32,0.8);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .category-card {
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(59,130,246,0.2);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      position: relative;
    }
    .category-icon { font-size: 32px; margin-bottom: 8px; }
    .category-name { font-size: 14px; font-weight: 600; }
    .category-count { font-size: 11px; color: #6b7a99; margin-top: 4px; }
    .category-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
    }
    .cat-action {
      background: rgba(0,0,0,0.5);
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    
    .question-list {
      max-height: 400px;
      overflow-y: auto;
    }
    .question-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .question-text { font-weight: 600; margin-bottom: 8px; }
    .question-meta {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: #6b7a99;
    }
    
    input, select, textarea {
      background: #06080f;
      border: 1px solid #2d3b52;
      border-radius: 10px;
      padding: 10px 14px;
      color: #e8edf7;
      width: 100%;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #3b82f6; }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #6b7a99;
      display: block;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .btn {
      background: #3b82f6;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-green { background: #10b981; }
    .btn-red { background: #ef4444; }
    .btn-ghost { background: #111827; border: 1px solid #2d3b52; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .flex { display: flex; gap: 10px; flex-wrap: wrap; }
    .mb-3 { margin-bottom: 12px; }
    .mt-3 { margin-top: 12px; }
    
    .player-list {
      max-height: 300px;
      overflow-y: auto;
    }
    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .player-rank { font-size: 18px; width: 40px; }
    .player-avatar { font-size: 28px; }
    .player-info { flex: 1; }
    .player-name { font-weight: 600; }
    .player-score { font-weight: 700; color: #f59e0b; }
    
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0d1120;
      border: 1px solid #2d3b52;
      border-radius: 10px;
      padding: 12px 20px;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    .info-badge {
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #3b82f6;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
<div class="container">
  
  <div class="header">
    <div class="logo">PLAY<span style="color:#3b82f6">A</span>QUIZ</div>
    <div class="room-info">
      <div class="room-label">ROOM CODE</div>
      <div class="room-code" id="roomCodeDisplay">——</div>
    </div>
    <div class="conn-status">
      <div class="status-dot connected" id="statusDot"></div>
      <span id="connStatus">Connected</span>
    </div>
  </div>
  
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-number" id="statQuestions">0</div>
      <div class="stat-label">Questions</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="statCategories">0</div>
      <div class="stat-label">Categories</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="statPlayers">0</div>
      <div class="stat-label">Players</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="statCompleted">0</div>
      <div class="stat-label">Completed</div>
    </div>
  </div>
  
  <div class="main-grid">
    
    <div>
      <div class="card">
        <div class="card-title">📁 Categories for This Room</div>
        <div class="info-badge">✅ Categories are unique to room code: <strong id="roomCodeForCategory">——</strong></div>
        <div class="category-grid" id="categoryGrid"></div>
        <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 16px; margin-top: 16px;">
          <div style="font-size: 13px; font-weight: 600; margin-bottom: 12px;">➕ Add New Category</div>
          <div class="grid-2 mb-3">
            <div>
              <label>Category Name</label>
              <input type="text" id="newCatName" placeholder="Science">
            </div>
            <div>
              <label>Icon (Emoji)</label>
              <input type="text" id="newCatIcon" placeholder="🧪" maxlength="2">
            </div>
          </div>
          <button class="btn btn-green" onclick="addCategory()">Add Category</button>
        </div>
      </div>
    </div>
    
    <div>
      <div class="card">
        <div class="card-title">❓ Questions for This Room</div>
        <div class="info-badge">✅ Questions are unique to room code: <strong id="roomCodeForQuestions">——</strong></div>
        <div class="flex mb-3">
          <button class="btn btn-sm" id="filterAllBtn" onclick="filterQuestions('all')">All Questions</button>
          <div id="categoryFilter"></div>
        </div>
        <div class="question-list" id="questionList"></div>
      </div>
    </div>
    
  </div>
  
  <div class="main-grid">
    
    <div>
      <div class="card">
        <div class="card-title">➕ Add Question</div>
        <div class="mb-3">
          <label>Question Text</label>
          <textarea id="qText" placeholder="What is the capital of France?" rows="2"></textarea>
        </div>
        <div class="grid-2 mb-3">
          <div>
            <label>Option A</label>
            <input type="text" id="optA" placeholder="Berlin">
          </div>
          <div>
            <label>Option B</label>
            <input type="text" id="optB" placeholder="Madrid">
          </div>
        </div>
        <div class="grid-2 mb-3">
          <div>
            <label>Option C</label>
            <input type="text" id="optC" placeholder="Paris">
          </div>
          <div>
            <label>Option D</label>
            <input type="text" id="optD" placeholder="Lisbon">
          </div>
        </div>
        <div class="grid-2 mb-3">
          <div>
            <label>Category</label>
            <select id="qCategory"></select>
          </div>
          <div>
            <label>Points</label>
            <input type="number" id="qPoints" value="100" min="10" max="1000">
          </div>
        </div>
        <div class="mb-3">
          <label>Correct Answer</label>
          <select id="qCorrect">
            <option value="">— Select —</option>
            <option value="0">A</option>
            <option value="1">B</option>
            <option value="2">C</option>
            <option value="3">D</option>
          </select>
        </div>
        <button class="btn btn-green" onclick="addQuestion()">Add Question</button>
        <button class="btn btn-purple" onclick="loadSampleQuestions()" style="margin-top:8px;">📚 Load Sample Questions</button>
      </div>
    </div>
    
    <div>
      <div class="card">
        <div class="card-title">👥 Players</div>
        <div class="player-list" id="playerList"></div>
      </div>
      
      <div class="card">
        <div class="card-title">⚙️ Actions</div>
        <button class="btn btn-green" onclick="activateGame()">🎮 Activate Game</button>
        <button class="btn btn-red mt-3" onclick="resetGame()">🔄 Reset Game</button>
        <button class="btn btn-ghost mt-3" onclick="exportScores()">📊 Export Scores</button>
      </div>
    </div>
    
  </div>
  
</div>

<script>
const supabaseUrl = 'https://your-supabase-url.supabase.co';
const supabaseKey = 'your-supabase-key';
const sb = supabase.createClient(supabaseUrl, supabaseKey);

let SESSION_ID = null;
let ROOM_CODE = null;
let categories = [];
let allQuestions = [];
let players = [];

// Initialize from URL params
const urlParams = new URLSearchParams(window.location.search);
SESSION_ID = urlParams.get('session');
ROOM_CODE = urlParams.get('room');

if (!SESSION_ID || !ROOM_CODE) {
  alert('Invalid session or room. Please access via Room Manager.');
  window.location.href = 'room-manager.html';
}

async function init() {
  document.getElementById('roomCodeDisplay').innerText = ROOM_CODE;
  document.getElementById('roomCodeForCategory').innerText = ROOM_CODE;
  document.getElementById('roomCodeForQuestions').innerText = ROOM_CODE;
  
  await loadCategories();
  await loadQuestions();
  await loadPlayers();
  setupRealtime();
  updateStats();
}

async function loadCategories() {
  try {
    const { data, error } = await sb
      .from('categories')
      .select('*')
      .eq('session_id', SESSION_ID)
      .order('created_at');
    
    if (error) throw error;
    categories = data || [];
    renderCategoryGrid();
    populateCategorySelects();
    updateStats();
  } catch (err) {
    console.error('Error loading categories:', err);
    toast('Error loading categories: ' + err.message, 'error');
  }
}

async function loadQuestions() {
  try {
    const { data, error } = await sb
      .from('questions')
      .select('*')
      .eq('session_id', SESSION_ID)
      .order('created_at');
    
    if (error) throw error;
    allQuestions = data || [];
    renderQuestionList();
    renderCategoryFilters();
    updateStats();
  } catch (err) {
    console.error('Error loading questions:', err);
    toast('Error loading questions: ' + err.message, 'error');
  }
}

async function loadPlayers() {
  try {
    const { data, error } = await sb
      .from('players')
      .select('*')
      .eq('session_id', SESSION_ID)
      .order('score', { ascending: false });
    
    if (error) throw error;
    players = data || [];
    updateStats();
    renderPlayerList();
  } catch (err) {
    console.error('Error loading players:', err);
  }
}

function updateStats() {
  document.getElementById('statQuestions').innerText = allQuestions.length;
  document.getElementById('statCategories').innerText = categories.length;
  document.getElementById('statPlayers').innerText = players.length;
  document.getElementById('statCompleted').innerText = players.filter(p => p.completed).length;
}

function renderCategoryGrid() {
  const grid = document.getElementById('categoryGrid');
  if (!categories.length) {
    grid.innerHTML = '<div style="text-align:center;padding:20px;color:#6b7a99;grid-column:1/-1;">No categories yet for this room</div>';
    return;
  }
  grid.innerHTML = categories.map(cat => `
    <div class="category-card">
      <div class="category-actions">
        <button class="cat-action" onclick="editCategory('${cat.id}', '${cat.name}', '${cat.icon}')">✏️</button>
        <button class="cat-action" onclick="deleteCategory('${cat.id}')">🗑️</button>
      </div>
      <div class="category-icon">${cat.icon || '📁'}</div>
      <div class="category-name">${escapeHtml(cat.name)}</div>
      <div class="category-count">${allQuestions.filter(q => q.category_id === cat.id).length} Q's</div>
    </div>
  `).join('');
}

function renderQuestionList() {
  const container = document.getElementById('questionList');
  if (!allQuestions.length) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#6b7a99;">No questions yet. Add some above!</div>';
    return;
  }
  container.innerHTML = allQuestions.map((q, i) => {
    const cat = categories.find(c => c.id === q.category_id);
    return `
      <div class="question-item">
        <div class="question-text">${i + 1}. ${escapeHtml(q.question_text)}</div>
        <div class="question-meta">
          <span>${cat?.icon || '📁'} ${cat?.name || 'Uncategorized'}</span>
          <span>⭐ ${q.points || 100} pts</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderPlayerList() {
  const container = document.getElementById('playerList');
  if (!players.length) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#6b7a99;">Waiting for players to join...</div>';
    return;
  }
  container.innerHTML = players.map((p, idx) => `
    <div class="player-row">
      <div class="player-rank">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx + 1}`}</div>
      <div class="player-avatar">${p.avatar_color || '👤'}</div>
      <div class="player-info">
        <div class="player-name">${escapeHtml(p.name)}</div>
        <div class="player-score">${p.score || 0} pts</div>
      </div>
      <div class="player-complete">${p.completed ? '✅' : `${p.current_q_index || 0}/${allQuestions.length}`}</div>
    </div>
  `).join('');
}

function renderCategoryFilters() {
  const cats = [{ id: 'all', name: 'All', icon: '📚' }, ...categories];
  document.getElementById('categoryFilter').innerHTML = cats.map(cat => `
    <button class="btn btn-sm btn-ghost" onclick="filterQuestions('${cat.id}')">${cat.icon} ${cat.name}</button>
  `).join('');
}

function filterQuestions(catId) {
  let filtered = allQuestions;
  if (catId !== 'all') filtered = allQuestions.filter(q => q.category_id === catId);
  const container = document.getElementById('questionList');
  container.innerHTML = filtered.map((q, i) => {
    const cat = categories.find(c => c.id === q.category_id);
    return `
      <div class="question-item">
        <div class="question-text">${i + 1}. ${escapeHtml(q.question_text)}</div>
        <div class="question-meta">
          <span>${cat?.icon || '📁'} ${cat?.name || 'Uncategorized'}</span>
          <span>⭐ ${q.points || 100} pts</span>
        </div>
      </div>
    `;
  }).join('');
}

function populateCategorySelects() {
  const options = '<option value="">— Select Category —</option>' + categories.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  document.getElementById('qCategory').innerHTML = options;
}

async function addCategory() {
  const name = document.getElementById('newCatName').value.trim();
  const icon = document.getElementById('newCatIcon').value.trim() || '📁';
  if (!name) { toast('Enter a category name', 'error'); return; }
  
  try {
    const { error } = await sb.from('categories').insert({ 
      name, 
      icon,
      session_id: SESSION_ID  // ✅ ROOM-SPECIFIC CATEGORY
    });
    if (error) throw error;
    
    document.getElementById('newCatName').value = '';
    document.getElementById('newCatIcon').value = '';
    await loadCategories();
    toast('✅ Category added to this room!', 'success');
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  }
}

async function editCategory(id, oldName, oldIcon) {
  const name = prompt('New category name:', oldName);
  if (!name) return;
  const icon = prompt('New icon (emoji):', oldIcon);
  
  try {
    await sb.from('categories').update({ name, icon: icon || oldIcon }).eq('id', id);
    await loadCategories();
    toast('✅ Category updated!', 'success');
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  }
}

async function deleteCategory(id) {
  if (!confirm('Delete this category and all its questions?')) return;
  
  try {
    await sb.from('questions').delete().eq('category_id', id);
    await sb.from('categories').delete().eq('id', id);
    await loadCategories();
    await loadQuestions();
    toast('✅ Category deleted!', 'success');
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  }
}

async function addQuestion() {
  const text = document.getElementById('qText').value.trim();
  const a = document.getElementById('optA').value.trim();
  const b = document.getElementById('optB').value.trim();
  const c = document.getElementById('optC').value.trim();
  const d = document.getElementById('optD').value.trim();
  const correct = parseInt(document.getElementById('qCorrect').value);
  const catId = document.getElementById('qCategory').value || null;
  const points = parseInt(document.getElementById('qPoints').value) || 100;
  
  if (!text || !a || !b || !c || !d) { toast('Fill all fields', 'error'); return; }
  
  try {
    const { error } = await sb.from('questions').insert({
      question_text: text, 
      option_a: a, 
      option_b: b, 
      option_c: c, 
      option_d: d,
      correct_option: correct, 
      category_id: catId, 
      points: points,
      session_id: SESSION_ID  // ✅ ROOM-SPECIFIC QUESTION
    });
    if (error) throw error;
    
    document.getElementById('qText').value = '';
    document.getElementById('optA').value = '';
    document.getElementById('optB').value = '';
    document.getElementById('optC').value = '';
    document.getElementById('optD').value = '';
    
    await loadQuestions();
    toast('✅ Question added to this room!', 'success');
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  }
}

async function loadSampleQuestions() {
  const samples = [
    { t: "What is the capital of France?", a: "Berlin", b: "Madrid", c: "Paris", d: "Lisbon", co: 2 },
    { t: "Which planet is known as the Red Planet?", a: "Mars", b: "Jupiter", c: "Venus", d: "Saturn", co: 0 },
    { t: "Who painted the Mona Lisa?", a: "Van Gogh", b: "Picasso", c: "Da Vinci", d: "Rembrandt", co: 2 }
  ];
  
  try {
    for (const s of samples) {
      await sb.from('questions').insert({
        question_text: s.t, 
        option_a: s.a, 
        option_b: s.b, 
        option_c: s.c, 
        option_d: s.d,
        correct_option: s.co, 
        points: 100,
        session_id: SESSION_ID  // ✅ ROOM-SPECIFIC
      });
    }
    await loadQuestions();
    toast('✅ Sample questions loaded for this room!', 'success');
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  }
}

async function activateGame() {
  if (allQuestions.length === 0) { toast('Add questions first!', 'error'); return; }
  
  try {
    await sb.from('game_sessions').update({ status: 'active' }).eq('id', SESSION_ID);
    await sb.from('game_events').insert({
      session_id: SESSION_ID,
      event_type: 'game_activated',
      payload: { questions: allQuestions, totalQuestions: allQuestions.length }
    });
    toast('🎮 Game activated! Players can now start!', 'success');
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  }
}

async function resetGame() {
  if (!confirm('Reset game? This clears all player progress.')) return;
  
  try {
    await sb.from('players').delete().eq('session_id', SESSION_ID);
    await sb.from('answers').delete().eq('session_id', SESSION_ID);
    await loadPlayers();
    toast('🔄 Game reset!', 'success');
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  }
}

function exportScores() {
  const csv = [['Rank', 'Name', 'Score', 'Correct', 'Total Questions', 'Completed']];
  players.forEach((p, i) => {
    csv.push([i + 1, p.name, p.score, p.correct_count, allQuestions.length, p.completed ? 'Yes' : 'No']);
  });
  const blob = new Blob([csv.map(row => row.join(',')).join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `scores_${ROOM_CODE}.csv`;
  a.click();
}

function setupRealtime() {
  sb.channel(`sp-admin-${SESSION_ID}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players', filter: `session_id=eq.${SESSION_ID}` }, () => loadPlayers())
    .subscribe();
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerText = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

// Expose functions
window.addCategory = addCategory;
window.editCategory = editCategory;
window.deleteCategory = deleteCategory;
window.addQuestion = addQuestion;
window.loadSampleQuestions = loadSampleQuestions;
window.activateGame = activateGame;
window.resetGame = resetGame;
window.exportScores = exportScores;
window.filterQuestions = filterQuestions;

// Initialize
init();
</script>
