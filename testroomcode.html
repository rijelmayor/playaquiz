<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Code Checker - PlayAQuiz</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        .result.show {
            display: block;
        }
        
        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }
        
        .result.warning {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }
        
        .result h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .result p {
            margin: 5px 0;
            font-size: 14px;
        }
        
        .room-details {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0,0,0,0.1);
        }
        
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .status-active {
            background: #28a745;
            color: white;
        }
        
        .status-inactive {
            background: #dc3545;
            color: white;
        }
        
        .quick-tests {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        .quick-tests h4 {
            color: #666;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .test-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .test-btn {
            background: #f0f0f0;
            color: #333;
            padding: 8px 15px;
            font-size: 12px;
            width: auto;
        }
        
        .test-btn:hover {
            background: #e0e0e0;
            transform: none;
            box-shadow: none;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Room Code Checker</h1>
        <div class="subtitle">Verify if a room code exists in the database</div>
        
        <div class="input-group">
            <label for="roomCode">Enter Room Code</label>
            <input type="text" id="roomCode" placeholder="e.g., FR7A2B" maxlength="8" autocomplete="off">
        </div>
        
        <button id="checkBtn" onclick="checkRoomCode()">✅ Check Room Code</button>
        
        <div id="result" class="result"></div>
        
        <div class="quick-tests">
            <h4>Quick Test Examples:</h4>
            <div class="test-buttons">
                <button class="test-btn" onclick="setTestCode('FR7A2B')">FR7A2B</button>
                <button class="test-btn" onclick="setTestCode('TEST01')">TEST01</button>
                <button class="test-btn" onclick="setTestCode('GAME123')">GAME123</button>
                <button class="test-btn" onclick="setTestCode('')">Clear</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase configuration - UPDATE THESE WITH YOUR ACTUAL CREDENTIALS
        const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';  // Your Supabase URL
        const SUPABASE_ANON_KEY = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';  // Your anon key
        
        // Initialize Supabase client
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Function to check room code
        async function checkRoomCode() {
            const roomCodeInput = document.getElementById('roomCode');
            const roomCode = roomCodeInput.value.trim().toUpperCase();
            const checkBtn = document.getElementById('checkBtn');
            const resultDiv = document.getElementById('result');
            
            // Clear previous result
            resultDiv.className = 'result';
            resultDiv.innerHTML = '';
            
            // Validate input
            if (!roomCode) {
                showResult('error', '❌ Error', 'Please enter a room code');
                return;
            }
            
            if (roomCode.length < 4 || roomCode.length > 8) {
                showResult('error', '❌ Invalid Format', 'Room code must be 4-8 characters long');
                return;
            }
            
            if (!/^[A-Z0-9]{4,8}$/.test(roomCode)) {
                showResult('error', '❌ Invalid Format', 'Use only letters A-Z and numbers 0-9');
                return;
            }
            
            // Show loading state
            checkBtn.disabled = true;
            checkBtn.innerHTML = '<span class="loader"></span> Checking...';
            
            try {
                console.log(`🔍 Checking room code: ${roomCode}`);
                
                // Query the database
                const { data, error } = await sb
                    .from('game_rooms')
                    .select('*')
                    .eq('room_code', roomCode)
                    .maybeSingle();  // Use maybeSingle to avoid 406 error when no rows found
                
                if (error) {
                    console.error('Database error:', error);
                    showResult('error', '❌ Database Error', `Error: ${error.message}`);
                    return;
                }
                
                // Check if room exists
                if (!data) {
                    showResult('warning', '❌ Room NOT Found', 
                        `Room code "${roomCode}" does not exist in the database.`,
                        null);
                    return;
                }
                
                // Room exists - show details
                const isActive = data.is_active === true;
                const statusText = isActive ? 'ACTIVE ✓' : 'INACTIVE ✗';
                const statusClass = isActive ? 'status-active' : 'status-inactive';
                
                // Format date
                const createdAt = data.created_at ? new Date(data.created_at).toLocaleString() : 'Unknown';
                
                showResult('success', '✅ Room FOUND!', 
                    `Room code "${roomCode}" exists in the database.`,
                    {
                        'Status': `<span class="status-badge ${statusClass}">${statusText}</span>`,
                        'Created At': createdAt,
                        'Control ID': data.control_id || 'Not set',
                        'Player Count': data.player_count || 0,
                        'Room Code': data.room_code
                    });
                
                console.log('Room data:', data);
                
            } catch (err) {
                console.error('Unexpected error:', err);
                showResult('error', '❌ Connection Error', 
                    `Failed to check room code: ${err.message}. Make sure your Supabase credentials are correct.`);
            } finally {
                // Reset button
                checkBtn.disabled = false;
                checkBtn.innerHTML = '✅ Check Room Code';
            }
        }
        
        // Helper function to show results
        function showResult(type, title, message, details = null) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type} show`;
            
            let html = `<h3>${title}</h3><p>${message}</p>`;
            
            if (details) {
                html += '<div class="room-details">';
                for (const [key, value] of Object.entries(details)) {
                    html += `<p><strong>${key}:</strong> ${value}</p>`;
                }
                html += '</div>';
            }
            
            resultDiv.innerHTML = html;
        }
        
        // Helper function to set test code
        function setTestCode(code) {
            const input = document.getElementById('roomCode');
            input.value = code;
            input.focus();
            if (code) {
                checkRoomCode();
            }
        }
        
        // Allow Enter key to trigger check
        document.getElementById('roomCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkRoomCode();
            }
        });
        
        // Optional: Create a test room for demonstration
        async function createTestRoom(roomCode) {
            try {
                const { data, error } = await sb
                    .from('game_rooms')
                    .upsert({
                        room_code: roomCode,
                        is_active: true,
                        control_id: 'test_checker',
                        created_at: new Date(),
                        player_count: 0
                    });
                
                if (error) throw error;
                console.log(`Test room "${roomCode}" created`);
                return true;
            } catch (err) {
                console.error('Failed to create test room:', err);
                return false;
            }
        }
        
        // Optional: Delete a room
        async function deleteRoom(roomCode) {
            try {
                const { error } = await sb
                    .from('game_rooms')
                    .delete()
                    .eq('room_code', roomCode);
                
                if (error) throw error;
                console.log(`Room "${roomCode}" deleted`);
                return true;
            } catch (err) {
                console.error('Failed to delete room:', err);
                return false;
            }
        }
        
        // Expose functions to console for testing
        window.checkRoomCode = checkRoomCode;
        window.setTestCode = setTestCode;
        window.createTestRoom = createTestRoom;
        window.deleteRoom = deleteRoom;
        
        console.log('Room Checker Ready! Use checkRoomCode() to verify a room');
        console.log('Tip: Use createTestRoom("TEST01") to create a test room');
    </script>
</body>
</html>
