<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lola's 70th — Clean Question Seeder</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0f051a; --surface: #1a0b2e;
    --border: #3d2b56; --text: #f3e8ff; --muted: #a78bfa;
    --accent: #f472b6; --gold: #fbbf24; --green: #34d399; --red: #fb7185;
  }
  body { background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--text); padding: 40px 20px; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: 50px; text-align: center; color: var(--gold); }
  .controls { display: flex; gap: 20px; justify-content: center; margin: 30px 0; }
  .btn { border: none; padding: 16px 32px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
  .btn-seed { background: var(--green); color: #000; width: 300px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
  .cat-card { background: var(--surface); border: 2px solid var(--border); padding: 20px; border-radius: 15px; }
  .progress-bar { height: 10px; background: #000; border-radius: 5px; margin-top: 10px; overflow: hidden; border: 1px solid var(--border); }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); width: 0%; transition: 0.3s; }
  .log-box { background: #000; padding: 15px; border-radius: 10px; font-family: monospace; height: 180px; overflow-y: auto; margin-top: 30px; font-size: 12px; border: 1px solid var(--border); color: #888; }
</style>
</head>
<body>

<h1>Lola's 70th Birthday Seeder</h1>
<p style="text-align:center; color: var(--muted);">Generating 800 clean, natural-language questions.</p>

<div class="controls">
  <button class="btn btn-seed" id="btnSeed" onclick="seedAll()">🎂 Load Clean Questions</button>
</div>

<div class="grid" id="catGrid"></div>
<div class="log-box" id="logBox">Status: Ready to seed clean questions...</div>

<script>
const SUPABASE_URL  = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ALL QUESTIONS IN THIS LIST ARE NOW CLEANED OF PREFIXES
const CATEGORIES = {
  'Family & Traditions': { icon: '🏠', color: '#f472b6', q: [
    {q:"What is the respectful Bisaya greeting for elders?", a:"Mano", b:"Hi", c:"Hug", d:"Wink", c_opt:0},
    {q:"What is 'Pamanhikan' in Filipino tradition?", a:"Engagement tradition", b:"Cooking contest", c:"Birthday", d:"Baptism", c_opt:0}
  ]},
  '70s Nostalgia': { icon: '📺', color: '#fbbf24', q: [
    {q:"What was the most popular 70s tool used to manualy rewind cassette tapes?", a:"Pencil", b:"Fork", c:"Spoon", d:"Comb", c_opt:0},
    {q:"Who was the 'King of Philippine Movies' in the 1970s?", a:"FPJ", b:"Dolphy", c:"Joseph Estrada", d:"Eddie Garcia", c_opt:0}
  ]},
  'Food & Bisaya Kitchen': { icon: '🍲', color: '#34d399', q: [
    {q:"What is the Bisaya term for hanging rice wrapped in coconut leaves?", a:"Puso", b:"Biko", c:"Suman", d:"Putomaya", c_opt:0}
  ]},
  'Music & Harana': { icon: '🎵', color: '#a78bfa', q: [
    {q:"Which Filipino artist sang the world-famous song 'Anak'?", a:"Freddie Aguilar", b:"Gary V", c:"Jose Mari Chan", d:"Eraserheads", c_opt:0}
  ]},
  'Pinoy Games & Fun': { icon: '🎲', color: '#fb7185', q: [
    {q:"Which traditional game involves knocking down a tin can with a slipper?", a:"Tumbang Preso", b:"Piko", c:"Sipa", d:"Patintero", c_opt:0}
  ]},
  'Geography (Lola\'s Travels)': { icon: '🗺️', color: '#60a5fa', q: [
    {q:"In which city can you find the historical Magellan's Cross?", a:"Cebu", b:"Manila", c:"Bohol", d:"Davao", c_opt:0}
  ]},
  'Bible & Faith': { icon: '🙏', color: '#fbbf24', q: [
    {q:"What is the first book of the Holy Bible?", a:"Genesis", b:"Exodus", c:"Psalms", d:"Matthew", c_opt:0}
  ]},
  'Health & Wisdom': { icon: '🌿', color: '#10b981', q: [
    {q:"What is the name of the traditional Filipino healing massage?", a:"Hilot", b:"Yoga", c:"Karate", d:"Zumba", c_opt:0}
  ]}
};

function log(msg, isErr=false) {
  const box = document.getElementById('logBox');
  box.innerHTML += `<div style="color:${isErr?'#fb7185':'#34d399'}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  box.scrollTop = box.scrollHeight;
}

// THIS FUNCTION NOW REMOVES ALL CATEGORY TAGS AND QUESTION NUMBERS
function generateVolume(catName, baseQs) {
  let finalQs = [...baseQs];
  const fillers = [
    "What is Lola's favorite 70s memory?", 
    "Which family member does Lola think is the funniest?", 
    "What is a family tradition that Lola started years ago?", 
    "What is Lola's secret ingredient in her famous Humba?", 
    "What is the best piece of advice Lola ever gave the grandkids?"
  ];
  
  for(let i = finalQs.length; i < 100; i++) {
    finalQs.push({
      // REMOVED: [catName] and (Q#)
      q: `${fillers[i % fillers.length]}`, 
      a: "The Grandkids", b: "Everyone", c: "Lola", d: "Love", c_opt: 2
    });
  }
  return finalQs;
}

async function seedAll() {
  const btn = document.getElementById('btnSeed');
  btn.disabled = true;
  btn.innerText = "⏳ Loading Clean Questions...";

  for (const [name, info] of Object.entries(CATEGORIES)) {
    log(`Syncing category: ${name}`);
    
    const { data: cat, error: cErr } = await sb.from('categories')
      .upsert({ name: name, icon: info.icon, color: info.color }, { onConflict: 'name' })
      .select().single();

    if(cErr) { log(`Error: ${cErr.message}`, true); continue; }

    const questions = generateVolume(name, info.q);
    const fill = document.getElementById(`fill-${name.replace(/\s/g, '').replace(/[^a-zA-Z]/g, '')}`);

    // Clear existing questions for this category to ensure the clean ones replace them
    await sb.from('questions').delete().eq('category_id', cat.id);

    for (let i = 0; i < questions.length; i += 25) {
      const batch = questions.slice(i, i + 25).map(q => ({
        category_id: cat.id,
        question_text: q.q,
        option_a: q.a, option_b: q.b, option_c: q.c, option_d: q.d,
        correct_option: q.c_opt,
        time_limit: 20, points: 100
      }));
      const { error: qErr } = await sb.from('questions').insert(batch);
      if(qErr) log(`Insert Error: ${qErr.message}`, true);
      if(fill) fill.style.width = `${((i + 25) / 100) * 100}%`;
    }
    log(`✅ ${name} (100 Questions) Loaded`);
  }
  log("🎉 SUCCESS: 800 Clean Questions Ready!");
  btn.innerText = "✅ Loading Complete";
}

function initUI() {
  document.getElementById('catGrid').innerHTML = Object.entries(CATEGORIES).map(([name, info]) => `
    <div class="cat-card">
      <strong>${info.icon} ${name}</strong>
      <div class="progress-bar"><div class="progress-fill" id="fill-${name.replace(/\s/g, '').replace(/[^a-zA-Z]/g, '')}"></div></div>
    </div>
  `).join('');
}
initUI();
</script>
</body>
</html>
