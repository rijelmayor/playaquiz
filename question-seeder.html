  .status-line.err { color: var(--red); }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 32px; }
  .btn { background: var(--accent); border: none; padding: 12px 24px; border-radius: 10px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; color: white; cursor: pointer; font-size: 14px; transition: all .15s; display: inline-flex; align-items: center; gap: 8px; }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; filter: none; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
  .btn-green { background: var(--green); }
  .btn-red { background: var(--red); }

// Helpers + UI rendering / seeding logic
function safeName(n) { return n.replace(/[^a-zA-Z]/g,''); }
function log(msg, type='') { const box = document.getElementById('logBox'); const line = document.createElement('div'); line.className = type; line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`; box.appendChild(line); box.scrollTop = box.scrollHeight; }
function clearLog() { document.getElementById('logBox').innerHTML = ''; }
function setStatus(name, msg, type='') { const el = document.getElementById(`status-${safeName(name)}`); if (el) { el.innerText = msg; el.className = `status-line ${type}`; } }
function setBar(name, pct) { const el = document.getElementById(`bar-${safeName(name)}`); if (el) el.style.width = pct + '%'; }
function bumpTotal(n) { totalSeeded += n; document.getElementById('totalNum').innerText = totalSeeded; document.getElementById('totalBadge').style.display = 'block'; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function seedCategory(catName) {
  const data = QUESTION_BANK[catName];
  if (!data) return;
  log(`Starting: ${catName} (${data.questions.length} questions)`, 'info');
  setStatus(catName, 'Finding/creating category...');
  setBar(catName, 0);
  let catId;
  const { data: existing } = await sb.from('categories').select('id').eq('name', catName).maybeSingle();
  if (existing) catId = existing.id;
  else {
    const { data: created, error: createErr } = await sb.from('categories').insert({ name: catName, icon: data.icon, color: data.color }).select().single();
    if (createErr) { log(`  ERROR creating category: ${createErr.message}`, 'err'); setStatus(catName, '❌ Failed', 'err'); return; }
    catId = created.id;
    log(`  Created category "${catName}"`, 'ok');
  }
  const { data: existingQs } = await sb.from('questions').select('question_text').eq('category_id', catId);
  const existingSet = new Set((existingQs||[]).map(q => q.question_text.trim().toLowerCase()));
  const toInsert = data.questions.filter(q => !existingSet.has(q.q.trim().toLowerCase()));
  if (!toInsert.length) {
    log(`  All ${data.questions.length} questions exist`, 'ok');
    setStatus(catName, `✅ Complete (${data.questions.length})`, 'ok');
    setBar(catName, 100);
    return;
  }
  log(`  Inserting ${toInsert.length} new questions...`);
  setStatus(catName, `Inserting ${toInsert.length}...`);
  let inserted = 0;
  for (let i = 0; i < toInsert.length; i += 10) {
    const batch = toInsert.slice(i, i+10).map(q => ({ question_text: q.q, option_a: q.a, option_b: q.b, option_c: q.c, option_d: q.d, correct_option: q.c_opt, category_id: catId, time_limit: 20, points: 100, explanation: '' }));
    const { error } = await sb.from('questions').insert(batch);
    if (error) log(`  Batch error: ${error.message}`, 'err');
    else { inserted += batch.length; setBar(catName, Math.round((inserted / toInsert.length)*100)); setStatus(catName, `${inserted}/${toInsert.length}`); }
    await sleep(100);
  }
  setBar(catName, 100);
  setStatus(catName, `✅ ${inserted} added`, 'ok');
  log(`  "${catName}" complete: +${inserted} questions`, 'ok');
  bumpTotal(inserted);
}

async function seedAll() {
  const btn = document.getElementById('btnSeedAll');
  btn.disabled = true; btn.innerText = '⏳ Seeding 8 cats...';
  log('═══ FULL SEED (8 categories, 50 Q each) ═══', 'info');
  for (const catName of Object.keys(QUESTION_BANK)) await seedCategory(catName);
  log('═══ ALL DONE! 400 possible questions. ═══', 'ok');
  btn.disabled = false; btn.innerText = '🚀 Seed ALL Categories';
}

async function checkCounts() {
  log('Checking counts per category...', 'info');
  for (const catName of Object.keys(QUESTION_BANK)) {
    const { data: cat } = await sb.from('categories').select('id').eq('name', catName).maybeSingle();
    if (!cat) { log(`  ${catName}: category missing`, 'err'); continue; }
    const { count } = await sb.from('questions').select('*', { count:'exact', head:true }).eq('category_id', cat.id);
    const total = QUESTION_BANK[catName].questions.length;
    log(`  ${QUESTION_BANK[catName].icon} ${catName}: ${count}/${total}`, count >= total ? 'ok' : '');
    setStatus(catName, `${count}/${total} in DB`, count >= total ? 'ok' : '');
    setBar(catName, Math.min(100, Math.round((count/total)*100)));
  }
}
function renderCards() {
  const grid = document.getElementById('catGrid');
  grid.innerHTML = Object.entries(QUESTION_BANK).map(([name, data]) => `<div class="cat-card" id="card-${safeName(name)}"><div class="cat-header"><div class="cat-icon">${data.icon}</div><div><div class="cat-name">${name}</div><div class="cat-count">${data.questions.length} unique</div></div></div><div class="progress-wrap"><div class="progress-bar" id="bar-${safeName(name)}" style="width:0%;background:${data.color}"></div></div><div class="status-line" id="status-${safeName(name)}">ready</div><button class="btn btn-ghost" style="margin-top:12px;width:100%;font-size:13px" onclick="seedCategory('${name}')">➕ Seed "${name}" only</button></div>`).join('');
}
renderCards();
