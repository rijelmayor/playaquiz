  .cat-count { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .progress-wrap { height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .progress-bar { height: 100%; border-radius: 10px; transition: width .4s ease; }
  .status-line { font-size: 12px; font-family: 'JetBrains Mono', monospace; color: var(--muted); min-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-line.ok { color: var(--green); }
  .status-line.err { color: var(--red); }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 32px; }
  .btn { background: var(--accent); border: none; padding: 12px 24px; border-radius: 10px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; color: white; cursor: pointer; font-size: 14px; transition: all .15s; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; filter: none; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
  .btn-green { background: var(--green); }
  .btn-red { background: var(--red); }
  .log-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px; max-height: 260px; overflow-y: auto; color: var(--muted); }

  .log-box .err { color: var(--red); }
  .log-box .info { color: var(--accent); }
  .total-badge { background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 600; }

// ─── Render category cards ───────────────────────────────────────────────────
const catColors = {
  'General Knowledge': '#3b82f6',
  'Science & Tech':    '#10b981',
  'History':           '#f59e0b',
  'Geography':         '#8b5cf6',
};

function renderCards() {
  const grid = document.getElementById('catGrid');
  grid.innerHTML = Object.entries(QUESTION_BANK).map(([name, data]) => {
    const count = data.questions.length;
    const color = catColors[name] || '#3b82f6';
    return `
    <div class="cat-card" id="card-${safeName(name)}">
      <div class="cat-header">
        <div class="cat-icon">${data.icon}</div>
        <div>
          <div class="cat-name">${name}</div>
          <div class="cat-count">${count} questions ready</div>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="bar-${safeName(name)}" style="width:0%;background:${color}"></div>
      </div>
      <div class="status-line" id="status-${safeName(name)}">Waiting...</div>
      <button class="btn btn-ghost" style="margin-top:12px;width:100%;font-size:13px" onclick="seedCategory('${name}')">
        ➕ Seed "${name}" only
      </button>
    </div>`;
  }).join('');
}

function safeName(n) { return n.replace(/[^a-zA-Z]/g,''); }

// ─── Logging ──────────────────────────────────────────────────────────────────
function log(msg, type='') {
  const box = document.getElementById('logBox');
  const line = document.createElement('div');
  line.className = type;
  line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}
function clearLog() { document.getElementById('logBox').innerHTML = ''; }
function setStatus(name, msg, type='') {
  const el = document.getElementById(`status-${safeName(name)}`);
  if (el) { el.innerText = msg; el.className = `status-line ${type}`; }
}
function setBar(name, pct) {
  const el = document.getElementById(`bar-${safeName(name)}`);
  if (el) el.style.width = pct + '%';
}
function bumpTotal(n) {
  totalSeeded += n;
  document.getElementById('totalNum').innerText = totalSeeded;
  document.getElementById('totalBadge').style.display = 'block';
}

// ─── Seed one category ───────────────────────────────────────────────────────
async function seedCategory(catName) {
  const data = QUESTION_BANK[catName];
  if (!data) { log(`Unknown category: ${catName}`, 'err'); return; }

  log(`Starting: ${catName} (${data.questions.length} questions)`, 'info');
  setStatus(catName, 'Finding or creating category…');
  setBar(catName, 0);

  // 1. Find or create the category row
  let catId;
  const { data: existing } = await sb.from('categories').select('id').eq('name', catName).maybeSingle();
  if (existing) {
    catId = existing.id;
    log(`  Category "${catName}" found: ${catId}`);
  } else {
    const { data: created, error: createErr } = await sb.from('categories').insert({
      name: catName,
      icon: data.icon,
      color: catColors[catName] || '#3b82f6'
    }).select().single();
    if (createErr) {
      log(`  ERROR creating category: ${createErr.message}`, 'err');
      setStatus(catName, '❌ Failed to create category', 'err');
      return;
    }
    catId = created.id;
    log(`  Created category "${catName}": ${catId}`, 'ok');
  }

  // 2. Check existing questions to avoid exact duplicates
  const { data: existingQs } = await sb.from('questions').select('question_text').eq('category_id', catId);
  const existingSet = new Set((existingQs||[]).map(q => q.question_text.trim().toLowerCase()));
  const toInsert = data.questions.filter(q => !existingSet.has(q.q.trim().toLowerCase()));

  if (!toInsert.length) {
    log(`  All ${data.questions.length} questions already exist for "${catName}"`, 'ok');
    setStatus(catName, `✅ Already complete (${data.questions.length}/${data.questions.length})`, 'ok');
    setBar(catName, 100);
    bumpTotal(0);
    return;
  }

  log(`  Inserting ${toInsert.length} new questions (${data.questions.length - toInsert.length} already exist)…`);
  setStatus(catName, `Inserting ${toInsert.length} questions…`);

  // 3. Insert in batches of 10
  const BATCH = 10;
  let inserted = 0;
  for (let i = 0; i < toInsert.length; i += BATCH) {
    const batch = toInsert.slice(i, i + BATCH).map(q => ({
      question_text: q.q,
      option_a: q.a,
      option_b: q.b,
      option_c: q.c,
      option_d: q.d,
      correct_option: q.c_opt,
      category_id: catId,
      time_limit: 20,
      points: 100,
      explanation: '',
      sort_order: existingSet.size + i,
    }));

    const { error } = await sb.from('questions').insert(batch);
    if (error) {
      log(`  Batch error at ${i}: ${error.message}`, 'err');
    } else {
      inserted += batch.length;
      const pct = Math.round((inserted / toInsert.length) * 100);
      setBar(catName, pct);
      setStatus(catName, `Inserting… ${inserted}/${toInsert.length}`);
      log(`  ✓ Batch ${Math.floor(i/BATCH)+1}: inserted ${batch.length}`);
    }
    await sleep(120); // small delay to avoid rate limiting
  }

  setBar(catName, 100);
  setStatus(catName, `✅ Done! ${inserted} inserted`, 'ok');
  log(`  ✅ "${catName}" complete — ${inserted} questions added`, 'ok');
  bumpTotal(inserted);
}

// ─── Seed all ─────────────────────────────────────────────────────────────────
async function seedAll() {
  const btn = document.getElementById('btnSeedAll');
  btn.disabled = true;
  btn.innerText = '⏳ Seeding…';
  log('═══ Starting full seed ═══', 'info');
  for (const catName of Object.keys(QUESTION_BANK)) {
    await seedCategory(catName);
  }
  log('═══ All categories seeded! ═══', 'ok');
  btn.disabled = false;
  btn.innerText = '🚀 Seed ALL Categories';
}

// ─── Check current counts ─────────────────────────────────────────────────────
async function checkCounts() {
  log('Checking current question counts…', 'info');
  for (const catName of Object.keys(QUESTION_BANK)) {
    const { data: existing } = await sb.from('categories').select('id').eq('name', catName).maybeSingle();
    if (!existing) { log(`  "${catName}": category not found`, 'err'); continue; }
    const { count } = await sb.from('questions').select('*', { count:'exact', head:true }).eq('category_id', existing.id);
    const total = QUESTION_BANK[catName].questions.length;
    log(`  ${QUESTION_BANK[catName].icon} ${catName}: ${count}/${total} questions in DB`, count >= total ? 'ok' : '');
    setStatus(catName, `${count}/${total} in DB`, count >= total ? 'ok' : '');
    setBar(catName, Math.min(100, Math.round((count/total)*100)));
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

renderCards();
