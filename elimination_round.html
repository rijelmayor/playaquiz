<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOY Turns 70 • Elimination Round</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff3b9a;
      --accent: #00f5ff;
      --gold: #ffd700;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      color: white;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #1a0033, #2a0055, #440077);
      position: relative;
    }

    /* Floating Balloons Background */
    .balloons {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      font-size: 60px;
      animation: floatUp linear infinite;
      opacity: 0.9;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }

    @keyframes floatUp {
      0% { transform: translateY(110vh) rotate(0deg); }
      100% { transform: translateY(-120px) rotate(25deg); }
    }

    .content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 800;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #ff3b9a, #ffd700, #00f5ff, #ff3b9a);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleGlow 3s ease-in-out infinite alternate;
      margin-bottom: 10px;
      line-height: 0.9;
    }

    @keyframes titleGlow {
      from { filter: brightness(1) hue-rotate(0deg); }
      to { filter: brightness(1.3) hue-rotate(15deg); }
    }

    .subtitle {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
    }

    .tagline {
      font-size: 1.5rem;
      color: #a0f0ff;
      margin-bottom: 40px;
      font-weight: 500;
    }

    .qr-container {
      background: white;
      padding: 25px;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                  0 0 0 12px rgba(255, 59, 154, 0.3);
      margin: 30px 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .qr-container:hover {
      transform: scale(1.08) rotate(2deg);
    }

    .qr-code {
      width: 380px;
      height: 380px;
      border: 8px solid #111;
      border-radius: 20px;
      background: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-code img {
      width: 100%;
      height: 100%;
      image-rendering: crisp-edges;
    }

    .scan-text {
      margin-top: 15px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
    }

    .instructions {
      margin: 30px 0;
      font-size: 1.3rem;
      color: #ddd;
      max-width: 480px;
    }

    .start-btn {
      margin-top: 20px;
      padding: 22px 60px;
      font-size: 2rem;
      font-weight: 800;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ff3b9a, #ff6b00);
      color: white;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 15px 40px rgba(255, 59, 154, 0.4);
      transition: all 0.3s;
      text-transform: uppercase;
    }

    .start-btn:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 25px 60px rgba(255, 59, 154, 0.6);
    }

    .footer {
      position: absolute;
      bottom: 30px;
      font-size: 1.1rem;
      color: rgba(255,255,255,0.7);
      z-index: 3;
    }

    .confetti {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      z-index: 4;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Floating Balloons -->
  <div class="balloons" id="balloons"></div>

  <div class="content">
    <h1 class="title">JOY</h1>
    <div class="subtitle">TURNS 70</div>
    <div class="tagline">ELIMINATION ROUND 🎉</div>

    <div class="qr-container">
      <div class="qr-code">
        <img src="Elimination_Round.png" alt="Scan to Join Game" id="qrImage">
      </div>
      <div class="scan-text">📱 SCAN TO JOIN THE GAME</div>
    </div>

    <div class="instructions">
      Open your camera app or browser and scan the QR code above<br>
      <strong>Join as a player</strong> and get ready for the ultimate showdown!
    </div>

    <button class="start-btn" onclick="startGame()">
      🚀 START THE GAME
    </button>

    <div class="footer">
      Hosted with ❤️ for Joy's 70th Birthday Celebration
    </div>
  </div>

  <script>
    // Create floating balloons
    function createBalloon() {
      const balloonsContainer = document.getElementById('balloons');
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      
      const emojis = ['🎈', '🎉', '🦄', '🌈', '⭐', '🍾', '🎊', '💖'];
      balloon.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      
      const leftPos = Math.random() * 100;
      balloon.style.left = `${leftPos}vw`;
      
      const duration = Math.random() * 8 + 12;
      balloon.style.animationDuration = `${duration}s`;
      
      const delay = Math.random() * -15;
      balloon.style.animationDelay = `${delay}s`;
      
      const scale = Math.random() * 0.6 + 0.7;
      balloon.style.transform = `scale(${scale})`;
      
      balloonsContainer.appendChild(balloon);
      
      // Remove after animation
      setTimeout(() => {
        balloon.remove();
      }, (duration + Math.abs(delay)) * 1000);
    }

    // Launch confetti
    function launchConfetti() {
      for (let i = 0; i < 80; i++) {
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.top = '-20px';
        conf.style.background = ['#ff3b9a', '#ffd700', '#00f5ff', '#ff6b00'][Math.floor(Math.random()*4)];
        conf.style.animation = `fall ${Math.random()*3 + 2}s linear forwards`;
        document.body.appendChild(conf);
        
        setTimeout(() => conf.remove(), 6000);
      }
    }

    // Button handler
    function startGame() {
      launchConfetti();
      setTimeout(() => {
        window.open('https://www.playaquiz.xyz/foh.html', '_blank');
      }, 600);
    }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        startGame();
      }
    });

    // Initialize
    function init() {
      // Spawn balloons continuously
      setInterval(createBalloon, 280);
      
      // Initial balloons
      for (let i = 0; i < 18; i++) {
        setTimeout(createBalloon, i * 120);
      }
      
      // Occasional confetti
      setInterval(() => {
        if (Math.random() > 0.6) launchConfetti();
      }, 4500);
      
      // Make QR bigger on load
      const qrImg = document.getElementById('qrImage');
      qrImg.style.transition = 'all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
      
      // Hover effect on title
      console.log('%c🎉 JOY TURNS 70 - Elimination Round Ready!', 'color:#ff3b9a; font-size:18px; font-weight:bold');
    }

    // Add falling animation for confetti
    const style = document.createElement('style');
    style.innerHTML = `
      @keyframes fall {
        to {
          transform: translateY(110vh) rotate(720deg);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);

    window.onload = init;
  </script>
</body>
</html>
