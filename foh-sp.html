<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — FOH Display (Self-Paced)</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0c15 0%, #03050b 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      min-height: 100vh;
    }
    
    .qr-section {
      background: linear-gradient(135deg, #0d1120, #06080f);
      border: 2px solid rgba(59,130,246,0.3);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      margin: 20px;
    }
    .qr-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      background: linear-gradient(135deg, #fff, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .qr-subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 24px;
    }
    .qr-container {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
    .qr-placeholder {
      background: white;
      border-radius: 20px;
      padding: 20px;
      display: inline-block;
    }
    .room-code-big {
      font-family: 'JetBrains Mono', monospace;
      font-size: 48px;
      font-weight: 700;
      color: #3b82f6;
      letter-spacing: 8px;
      margin: 20px 0;
    }
    
    .stats-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .stat-card {
      background: rgba(13,17,32,0.8);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
    }
    .stat-value {
      font-size: 48px;
      font-weight: 800;
      color: #3b82f6;
    }
    .stat-label {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      margin-top: 8px;
    }
    
    .leaderboard-container {
      background: rgba(13,17,32,0.8);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 24px;
      padding: 24px;
      margin: 20px;
      max-width: 800px;
      margin: 20px auto;
    }
    .leaderboard-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      margin-bottom: 20px;
      text-align: center;
    }
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .leaderboard-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
    }
    .rank {
      font-size: 24px;
      width: 50px;
      text-align: center;
    }
    .avatar { font-size: 32px; }
    .name { flex: 1; font-weight: 600; }
    .score { font-size: 20px; font-weight: 700; color: #f59e0b; }
    .status { font-size: 12px; padding: 4px 12px; border-radius: 20px; }
    .status-active { background: rgba(16,185,129,0.2); color: #10b981; }
    .status-complete { background: rgba(59,130,246,0.2); color: #3b82f6; }
    
    .btn {
      background: #3b82f6;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      color: white;
      cursor: pointer;
    }
    .btn-ghost {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .room-entry {
      position: fixed;
      inset: 0;
      background: rgba(3,5,11,0.98);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .entry-card {
      background: rgba(13,17,32,0.95);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 32px;
      padding: 48px;
      text-align: center;
      max-width: 450px;
    }
    .entry-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(59,130,246,0.4);
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 28px;
      font-family: monospace;
      text-align: center;
      letter-spacing: 6px;
      color: #fff;
      width: 100%;
      margin: 20px 0;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="roomEntry" class="room-entry">
  <div class="entry-card">
    <div style="font-size: 36px; font-weight: 800; margin-bottom: 8px;">PLAY<span style="color:#3b82f6">A</span>QUIZ</div>
    <div style="font-size: 14px; color: rgba(255,255,255,0.5);">Enter Room Code to Display</div>
    <input type="text" id="roomInput" class="entry-input" placeholder="CODE" maxlength="8">
    <button class="btn" onclick="connectToRoom()">Connect →</button>
    <div id="roomError" style="color: #ef4444; margin-top: 16px;"></div>
  </div>
</div>

<div id="mainContent" class="hidden">
  <div class="qr-section">
    <div class="qr-title">SCAN TO JOIN</div>
    <div class="qr-subtitle">Use your phone to scan the QR code and start playing</div>
    <div class="qr-container" id="qrCode"></div>
    <div class="room-code-big" id="roomCodeDisplay">——</div>
    <div style="font-size:14px; color:rgba(255,255,255,0.5);">Or enter code manually on your device</div>
  </div>

  <div class="stats-container">
    <div class="stat-card"><div class="stat-value" id="statPlayers">0</div><div class="stat-label">Total Players</div></div>
    <div class="stat-card"><div class="stat-value" id="statActive">0</div><div class="stat-label">Playing Now</div></div>
    <div class="stat-card"><div class="stat-value" id="statCompleted">0</div><div class="stat-label">Completed</div></div>
  </div>

  <div class="leaderboard-container">
    <div class="leaderboard-title">🏆 LIVE LEADERBOARD</div>
    <div class="leaderboard-list" id="leaderboardList"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let SESSION_ID = null;
let ROOM_CODE = null;
let refreshInterval = null;

const urlParams = new URLSearchParams(window.location.search);
const sessionFromUrl = urlParams.get('session');
const roomFromUrl = urlParams.get('room');

if (sessionFromUrl && roomFromUrl) {
  SESSION_ID = sessionFromUrl;
  ROOM_CODE = roomFromUrl;
  document.getElementById('roomEntry').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = ROOM_CODE;
  init();
}

async function connectToRoom() {
  const code = document.getElementById('roomInput').value.trim().toUpperCase();
  if (!code) { showError('Enter room code'); return; }
  
  const { data: session, error } = await sb
    .from('game_sessions')
    .select('id, room_code')
    .eq('room_code', code)
    .maybeSingle();
  
  if (error || !session) {
    showError('Room not found');
    return;
  }
  
  SESSION_ID = session.id;
  ROOM_CODE = session.room_code;
  document.getElementById('roomEntry').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = ROOM_CODE;
  
  // Generate QR code display
  const joinUrl = `${window.location.origin}/player-sp.html?room=${ROOM_CODE}`;
  const qrContainer = document.getElementById('qrCode');
  qrContainer.innerHTML = `
    <div style="background:#fff; border-radius:16px; padding:20px;">
      <div style="width:180px; height:180px; background: repeating-linear-gradient(45deg, #000 0px, #000 4px, #fff 4px, #fff 12px); border-radius:8px;"></div>
      <div style="margin-top:12px; font-family:monospace; font-size:11px; color:#000; word-break:break-all;">${joinUrl}</div>
    </div>
  `;
  
  init();
}

function showError(msg) {
  const err = document.getElementById('roomError');
  err.innerText = msg;
  setTimeout(() => err.innerText = '', 3000);
}

async function init() {
  await loadStats();
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(loadStats, 5000);
  setupRealtime();
}

async function loadStats() {
  if (!SESSION_ID) return;
  
  // Get all players for this session
  const { data: players, error } = await sb
    .from('players')
    .select('*')
    .eq('session_id', SESSION_ID);
  
  if (error) {
    console.error('Error loading players:', error);
    return;
  }
  
  if (!players) return;
  
  // Calculate stats safely (check if completed column exists, if not use fallback)
  const totalPlayers = players.length;
  const activePlayers = players.filter(p => {
    // If completed column doesn't exist, assume all are active
    if (p.completed === undefined) return true;
    return !p.completed && !p.is_eliminated;
  }).length;
  const completedPlayers = players.filter(p => p.completed === true).length;
  
  document.getElementById('statPlayers').innerText = totalPlayers;
  document.getElementById('statActive').innerText = activePlayers;
  document.getElementById('statCompleted').innerText = completedPlayers;
  
  // Sort by score
  const sorted = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));
  
  document.getElementById('leaderboardList').innerHTML = sorted.slice(0, 10).map((p, i) => {
    let statusText = 'Playing';
    let statusClass = 'status-active';
    if (p.completed === true) {
      statusText = '✓ Completed';
      statusClass = 'status-complete';
    } else if (p.is_eliminated) {
      statusText = '❌ Eliminated';
      statusClass = 'status-active';
    }
    
    return `
      <div class="leaderboard-row">
        <div class="rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}`}</div>
        <div class="avatar">${p.avatar_color || '👤'}</div>
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="score">${p.score || 0}</div>
        <div class="status ${statusClass}">${statusText}</div>
      </div>
    `;
  }).join('');
}

function setupRealtime() {
  if (!SESSION_ID) return;
  
  const channel = sb.channel(`foh-${SESSION_ID}`);
  channel
    .on('postgres_changes', { 
      event: '*', 
      schema: 'public', 
      table: 'players', 
      filter: `session_id=eq.${SESSION_ID}` 
    }, () => loadStats())
    .subscribe();
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

// Check for saved session in URL
if (!SESSION_ID && !roomFromUrl && !sessionFromUrl) {
  // Show entry screen - do nothing, wait for input
}
</script>
</body>
</html>
