<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — FOH Display (Self-Paced)</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0c15 0%, #03050b 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      min-height: 100vh;
    }
    
    /* QR Display */
    .qr-section {
      background: linear-gradient(135deg, #0d1120, #06080f);
      border: 2px solid rgba(59,130,246,0.3);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      margin: 20px;
    }
    .qr-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      background: linear-gradient(135deg, #fff, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .qr-subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 24px;
    }
    .qr-container {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }
    .qr-placeholder {
      background: white;
      border-radius: 20px;
      padding: 20px;
      display: inline-block;
    }
    .room-code-big {
      font-family: 'JetBrains Mono', monospace;
      font-size: 48px;
      font-weight: 700;
      color: #3b82f6;
      letter-spacing: 8px;
      margin: 20px 0;
    }
    
    /* Stats */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .stat-card {
      background: rgba(13,17,32,0.8);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
    }
    .stat-value {
      font-size: 48px;
      font-weight: 800;
      color: #3b82f6;
    }
    .stat-label {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      margin-top: 8px;
    }
    
    /* Leaderboard */
    .leaderboard-container {
      background: rgba(13,17,32,0.8);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 24px;
      padding: 24px;
      margin: 20px;
      max-width: 800px;
      margin: 20px auto;
    }
    .leaderboard-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      margin-bottom: 20px;
      text-align: center;
    }
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .leaderboard-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
    }
    .rank {
      font-size: 24px;
      width: 50px;
      text-align: center;
    }
    .avatar { font-size: 32px; }
    .name { flex: 1; font-weight: 600; }
    .score { font-size: 20px; font-weight: 700; color: #f59e0b; }
    .status { font-size: 12px; padding: 4px 12px; border-radius: 20px; }
    .status-active { background: rgba(16,185,129,0.2); color: #10b981; }
    .status-complete { background: rgba(59,130,246,0.2); color: #3b82f6; }
    
    /* Room Entry Overlay */
    #roomEntryOverlay {
      position: fixed;
      inset: 0;
      background: rgba(3,5,11,0.98);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .entry-card {
      background: rgba(13,17,32,0.95);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 32px;
      padding: 48px;
      text-align: center;
      max-width: 450px;
    }
    .entry-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(59,130,246,0.4);
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 28px;
      font-family: monospace;
      text-align: center;
      letter-spacing: 6px;
      color: #fff;
      width: 100%;
      margin: 20px 0;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div id="roomEntryOverlay">
  <div class="entry-card">
    <div class="qr-title">PLAY<span style="color:#3b82f6">A</span>QUIZ</div>
    <div style="font-size:14px; color:rgba(255,255,255,0.5);">Enter Room Code</div>
    <input type="text" id="roomInput" class="entry-input" placeholder="ROOM" maxlength="8">
    <button class="btn" onclick="connectToRoom()" style="background:#3b82f6; border:none; padding:14px 28px; border-radius:12px; color:white; font-weight:700; cursor:pointer;">Connect →</button>
  </div>
</div>

<div id="mainContent" class="hidden">
  <div class="qr-section">
    <div class="qr-title">SCAN TO JOIN</div>
    <div class="qr-subtitle">Use your phone to scan the QR code and start playing</div>
    <div class="qr-container">
      <div class="qr-placeholder" id="qrCode"></div>
    </div>
    <div class="room-code-big" id="roomCodeDisplay">——</div>
    <div style="font-size:14px; color:rgba(255,255,255,0.5);">Or enter code manually on your device</div>
  </div>

  <div class="stats-container">
    <div class="stat-card"><div class="stat-value" id="statPlayers">0</div><div class="stat-label">Total Players</div></div>
    <div class="stat-card"><div class="stat-value" id="statActive">0</div><div class="stat-label">Playing Now</div></div>
    <div class="stat-card"><div class="stat-value" id="statCompleted">0</div><div class="stat-label">Completed</div></div>
  </div>

  <div class="leaderboard-container">
    <div class="leaderboard-title">🏆 LIVE LEADERBOARD</div>
    <div class="leaderboard-list" id="leaderboardList"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let SESSION_ID = null;
let roomCode = null;

async function connectToRoom() {
  const code = document.getElementById('roomInput').value.trim().toUpperCase();
  if (!code) return;
  
  const { data: session } = await sb
    .from('game_sessions')
    .select('id, room_code, status')
    .eq('room_code', code)
    .eq('type', 'self_paced')
    .maybeSingle();
  
  if (!session) {
    alert('Room not found!');
    return;
  }
  
  SESSION_ID = session.id;
  roomCode = session.room_code;
  localStorage.setItem('sp_foh_session', SESSION_ID);
  
  document.getElementById('roomEntryOverlay').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = roomCode;
  
  // Generate QR code
  const joinUrl = `${window.location.origin}/player-sp.html?room=${roomCode}`;
  const qrContainer = document.getElementById('qrCode');
  qrContainer.innerHTML = '';
  
  // Simple QR representation
  qrContainer.innerHTML = `
    <div style="background:#fff; border-radius:16px; padding:20px;">
      <div style="width:180px; height:180px; background: repeating-linear-gradient(45deg, #000 0px, #000 4px, #fff 4px, #fff 12px); border-radius:8px;"></div>
      <div style="margin-top:12px; font-family:monospace; font-size:12px; color:#000;">${joinUrl.substring(0, 40)}...</div>
    </div>
  `;
  
  loadStats();
  setupRealtime();
}

async function loadStats() {
  if (!SESSION_ID) return;
  
  const { data: players } = await sb.from('players').select('*').eq('session_id', SESSION_ID);
  if (players) {
    document.getElementById('statPlayers').innerText = players.length;
    document.getElementById('statActive').innerText = players.filter(p => !p.completed && !p.is_eliminated).length;
    document.getElementById('statCompleted').innerText = players.filter(p => p.completed).length;
    
    const sorted = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));
    document.getElementById('leaderboardList').innerHTML = sorted.slice(0, 10).map((p, i) => `
      <div class="leaderboard-row">
        <div class="rank">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}`}</div>
        <div class="avatar">${p.avatar_color || '👤'}</div>
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="score">${p.score || 0}</div>
        <div class="status ${p.completed ? 'status-complete' : 'status-active'}">${p.completed ? '✓ Completed' : 'Playing'}</div>
      </div>
    `).join('');
  }
}

function setupRealtime() {
  if (!SESSION_ID) return;
  
  sb.channel(`sp-foh-${SESSION_ID}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players', filter: `session_id=eq.${SESSION_ID}` }, () => loadStats())
    .subscribe();
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

// Check for saved session
const savedSession = localStorage.getItem('sp_foh_session');
if (savedSession) {
  sb.from('game_sessions').select('id, room_code').eq('id', savedSession).eq('type', 'self_paced').maybeSingle()
    .then(({ data }) => {
      if (data) {
        SESSION_ID = data.id;
        roomCode = data.room_code;
        document.getElementById('roomEntryOverlay').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        document.getElementById('roomCodeDisplay').innerText = roomCode;
        loadStats();
        setupRealtime();
      }
    });
}
</script>
</body>
</html>
