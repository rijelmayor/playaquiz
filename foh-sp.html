<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — FOH Display (Self-Paced)</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0c15 0%, #03050b 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      min-height: 100vh;
    }
    
    .qr-section {
      background: linear-gradient(135deg, #0d1120, #06080f);
      border: 2px solid rgba(59,130,246,0.3);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      margin: 20px;
    }
    .qr-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      background: linear-gradient(135deg, #fff, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .qr-subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 24px;
    }
    .qr-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
      min-height: 220px;
    }
    #qrcode {
      background: white;
      padding: 16px;
      border-radius: 20px;
      display: inline-block;
    }
    #qrcode canvas, #qrcode img {
      display: block;
      margin: 0 auto;
    }
    .room-code-big {
      font-family: 'JetBrains Mono', monospace;
      font-size: 56px;
      font-weight: 700;
      color: #3b82f6;
      letter-spacing: 8px;
      margin: 20px 0;
      background: rgba(0,0,0,0.3);
      padding: 16px 32px;
      border-radius: 20px;
      display: inline-block;
    }
    .join-link {
      font-family: monospace;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      word-break: break-all;
      margin-top: 16px;
      padding: 8px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
    }
    
    .stats-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .stat-card {
      background: rgba(13,17,32,0.8);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
    }
    .stat-value {
      font-size: 48px;
      font-weight: 800;
      color: #3b82f6;
    }
    .stat-label {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      margin-top: 8px;
    }
    
    .leaderboard-container {
      background: rgba(13,17,32,0.8);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 24px;
      padding: 24px;
      margin: 20px auto;
      max-width: 800px;
    }
    .leaderboard-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      margin-bottom: 20px;
      text-align: center;
    }
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
    }
    .leaderboard-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
    }
    .rank {
      font-size: 24px;
      width: 50px;
      text-align: center;
    }
    .avatar { font-size: 32px; }
    .name { flex: 1; font-weight: 600; }
    .score { font-size: 20px; font-weight: 700; color: #f59e0b; }
    .status { font-size: 12px; padding: 4px 12px; border-radius: 20px; }
    .status-active { background: rgba(16,185,129,0.2); color: #10b981; }
    .status-complete { background: rgba(59,130,246,0.2); color: #3b82f6; }
    
    .timezone-badge {
      background: rgba(59,130,246,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }
    
    .btn {
      background: #3b82f6;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      color: white;
      cursor: pointer;
    }
    .btn-ghost {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    .room-entry {
      position: fixed;
      inset: 0;
      background: rgba(3,5,11,0.98);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .entry-card {
      background: rgba(13,17,32,0.95);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 32px;
      padding: 48px;
      text-align: center;
      max-width: 450px;
    }
    .entry-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(59,130,246,0.4);
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 28px;
      font-family: monospace;
      text-align: center;
      letter-spacing: 6px;
      color: #fff;
      width: 100%;
      margin: 20px 0;
    }
    .error-msg {
      color: #ef4444;
      font-size: 13px;
      margin-top: 12px;
    }
    .hidden { display: none !important; }
    
    .footer {
      text-align: center;
      padding: 20px;
      color: rgba(255,255,255,0.3);
      font-size: 12px;
    }
  </style>
</head>
<body>
<div id="roomEntry" class="room-entry">
  <div class="entry-card">
    <div style="font-size: 36px; font-weight: 800; margin-bottom: 8px;">PLAY<span style="color:#3b82f6">A</span>QUIZ</div>
    <div style="font-size: 14px; color: rgba(255,255,255,0.5);">Enter Room Code to Display</div>
    <input type="text" id="roomInput" class="entry-input" placeholder="CODE" maxlength="8" autocomplete="off">
    <button class="btn" id="connectBtn" onclick="connectToRoom()">Connect →</button>
    <div id="roomError" class="error-msg"></div>
  </div>
</div>

<div id="mainContent" class="hidden">
  <div class="qr-section">
    <div class="qr-title">📱 SCAN TO JOIN</div>
    <div class="qr-subtitle">Use your phone to scan the QR code and start playing</div>
    <div class="qr-container">
      <div id="qrcode"></div>
    </div>
    <div>
      <div class="room-code-big" id="roomCodeDisplay">——</div>
    </div>
    <div class="join-link" id="joinUrlDisplay"></div>
    <div class="timezone-badge" id="timezoneDisplay"></div>
    <div style="font-size:14px; color:rgba(255,255,255,0.5); margin-top: 16px;">
      Or enter code manually on your device
    </div>
  </div>

  <div class="stats-container">
    <div class="stat-card"><div class="stat-value" id="statPlayers">0</div><div class="stat-label">Total Players</div></div>
    <div class="stat-card"><div class="stat-value" id="statActive">0</div><div class="stat-label">Playing Now</div></div>
    <div class="stat-card"><div class="stat-value" id="statCompleted">0</div><div class="stat-label">Completed</div></div>
  </div>

  <div class="leaderboard-container">
    <div class="leaderboard-title">🏆 LIVE LEADERBOARD</div>
    <div class="leaderboard-list" id="leaderboardList">
      <div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.5);">Waiting for players...</div>
    </div>
  </div>
  
  <div class="footer">
    PlayAQuiz — Self-Paced Mode | Room active until game ends
  </div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let SESSION_ID = null;
let ROOM_CODE = null;
let refreshInterval = null;
let realtimeChannel = null;

// Timezone utilities
function getUserTimezone() {
  return Intl.DateTimeFormat().resolvedOptions().timeZone;
}

function getTimezoneOffset() {
  const offset = new Date().getTimezoneOffset();
  const hours = Math.abs(Math.floor(offset / 60));
  const minutes = Math.abs(offset % 60);
  const sign = offset <= 0 ? '+' : '-';
  return `UTC ${sign}${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
}

function displayTimezoneInfo() {
  const tz = getUserTimezone();
  const offset = getTimezoneOffset();
  const display = document.getElementById('timezoneDisplay');
  if (display) {
    display.innerHTML = `🌍 ${tz} (${offset})`;
  }
}

// Check room status before connecting
async function checkAndConnectToRoom(code) {
  try {
    const { data: session, error } = await sb
      .from('game_sessions')
      .select('id, room_code, status, scheduled_date, title')
      .eq('room_code', code)
      .maybeSingle();
    
    if (error || !session) {
      return { available: false, reason: '❌ Room not found' };
    }
    
    // Check if room is scheduled for future
    if (session.status === 'scheduled') {
      const scheduledDate = new Date(session.scheduled_date);
      const now = new Date();
      if (scheduledDate > now) {
        const formattedDate = scheduledDate.toLocaleString();
        return { 
          available: false, 
          reason: `📅 This room is scheduled for ${formattedDate}. FOH display will activate at that time.` 
        };
      }
    }
    
    // Allow FOH for waiting, active, and ended rooms
    let warning = null;
    if (session.status === 'ended') {
      warning = '🏁 This game has ended. Displaying final results.';
    } else if (session.status === 'waiting') {
      console.log('🎮 Room is ready! Players can join.');
    } else if (session.status === 'active') {
      console.log('⚡ Game in progress!');
    }
    
    return { 
      available: true, 
      sessionId: session.id, 
      roomCode: session.room_code,
      status: session.status,
      warning: warning
    };
    
  } catch (err) {
    console.error('Connection check error:', err);
    return { available: false, reason: '🔌 Connection error. Please try again.' };
  }
}

// Main connect function
async function connectToRoom() {
  const code = document.getElementById('roomInput').value.trim().toUpperCase();
  if (!code) { showError('Enter room code'); return; }
  
  const btn = document.getElementById('connectBtn');
  btn.disabled = true;
  btn.innerText = 'Checking...';
  
  const result = await checkAndConnectToRoom(code);
  if (!result.available) {
    showError(result.reason);
    btn.disabled = false;
    btn.innerText = 'Connect →';
    return;
  }
  
  SESSION_ID = result.sessionId;
  ROOM_CODE = result.roomCode;
  
  btn.innerText = 'Connecting...';
  
  // Show warning if any
  if (result.warning) {
    showError(result.warning);
    setTimeout(() => {
      const errDiv = document.getElementById('roomError');
      if (errDiv) errDiv.innerText = '';
    }, 4000);
  }
  
  // Proceed to display
  document.getElementById('roomEntry').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = ROOM_CODE;
  
  displayTimezoneInfo();
  generateQRCode();
  init();
  
  btn.disabled = false;
  btn.innerText = 'Connect →';
}

function generateQRCode() {
  const joinUrl = `${window.location.origin}/player-sp.html?room=${ROOM_CODE}`;
  document.getElementById('joinUrlDisplay').innerText = joinUrl;
  
  const qrContainer = document.getElementById('qrcode');
  qrContainer.innerHTML = '';
  
  if (typeof QRCode !== 'undefined') {
    try {
      new QRCode(qrContainer, {
        text: joinUrl,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
      console.log('QR Code generated for:', joinUrl);
    } catch(e) {
      console.error('QRCode error:', e);
      fallbackQRDisplay(qrContainer, joinUrl);
    }
  } else {
    console.warn('QRCode library not loaded, using fallback');
    fallbackQRDisplay(qrContainer, joinUrl);
  }
}

function fallbackQRDisplay(container, url) {
  container.innerHTML = `
    <div style="background: white; border-radius: 16px; padding: 16px; text-align: center;">
      <div style="width: 180px; height: 180px; background: repeating-linear-gradient(45deg, #000 0px, #000 4px, #fff 4px, #fff 12px); border-radius: 8px; margin: 0 auto;"></div>
      <div style="margin-top: 12px; font-family: monospace; font-size: 10px; color: #000; word-break: break-all;">${url}</div>
      <div style="margin-top: 8px; font-size: 11px; color: #666;">Enter code: ${ROOM_CODE}</div>
    </div>
  `;
}

function showError(msg) {
  const err = document.getElementById('roomError');
  err.innerText = msg;
  setTimeout(() => {
    if (err.innerText === msg) err.innerText = '';
  }, 5000);
}

async function init() {
  await loadStats();
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(loadStats, 5000);
  setupRealtime();
}

async function loadStats() {
  if (!SESSION_ID) return;
  
  try {
    const { data: players, error } = await sb
      .from('players')
      .select('*')
      .eq('session_id', SESSION_ID);
    
    if (error) throw error;
    
    if (!players || players.length === 0) {
      document.getElementById('statPlayers').innerText = '0';
      document.getElementById('statActive').innerText = '0';
      document.getElementById('statCompleted').innerText = '0';
      document.getElementById('leaderboardList').innerHTML = '<div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.5);">Waiting for players to join...</div>';
      return;
    }
    
    const totalPlayers = players.length;
    const activePlayers = players.filter(p => !p.completed && !p.is_eliminated).length;
    const completedPlayers = players.filter(p => p.completed === true).length;
    
    document.getElementById('statPlayers').innerText = totalPlayers;
    document.getElementById('statActive').innerText = activePlayers;
    document.getElementById('statCompleted').innerText = completedPlayers;
    
    const sorted = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));
    
    document.getElementById('leaderboardList').innerHTML = sorted.slice(0, 10).map((p, i) => {
      let statusText = 'Playing';
      let statusClass = 'status-active';
      if (p.completed === true) {
        statusText = '✓ Completed';
        statusClass = 'status-complete';
      } else if (p.is_eliminated) {
        statusText = '❌ Eliminated';
      }
      
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}`;
      
      return `
        <div class="leaderboard-row">
          <div class="rank">${medal}</div>
          <div class="avatar">${p.avatar_color || '👤'}</div>
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="score">${p.score || 0}</div>
          <div class="status ${statusClass}">${statusText}</div>
        </div>
      `;
    }).join('');
    
  } catch (err) {
    console.error('Error loading stats:', err);
  }
}

function setupRealtime() {
  if (realtimeChannel) {
    try { sb.removeChannel(realtimeChannel); } catch(e) {}
  }
  
  if (!SESSION_ID) return;
  
  realtimeChannel = sb.channel(`foh-${SESSION_ID}`);
  realtimeChannel
    .on('postgres_changes', { 
      event: '*', 
      schema: 'public', 
      table: 'players', 
      filter: `session_id=eq.${SESSION_ID}` 
    }, () => loadStats())
    .subscribe();
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

// Check URL parameters for direct access
const urlParams = new URLSearchParams(window.location.search);
const sessionFromUrl = urlParams.get('session');
const roomFromUrl = urlParams.get('room');

if (sessionFromUrl && roomFromUrl) {
  SESSION_ID = sessionFromUrl;
  ROOM_CODE = roomFromUrl;
  document.getElementById('roomEntry').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = ROOM_CODE;
  displayTimezoneInfo();
  generateQRCode();
  init();
}

// Auto-refresh QR code every 30 seconds
setInterval(() => {
  if (ROOM_CODE && document.getElementById('mainContent').classList.contains('hidden') === false) {
    generateQRCode();
  }
}, 30000);

// Display timezone info on page load even before connection
displayTimezoneInfo();
</script>
</body>
</html>
