<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — FOH Display (Self-Paced)</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent !important;
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
    }
    
    /* Branding image - full screen, no overlay, no glass */
    #brandingBgLayer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #brandingBgLayer.active { opacity: 1; }
    
    /* No background, no blur, no glass - completely transparent */
    .qr-section {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 32px;
      padding: 40px 32px;
      text-align: center;
      margin: 20px;
    }
    .qr-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      background: linear-gradient(135deg, #ffffff, #7ab7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .qr-subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.85);
      margin-bottom: 24px;
      font-weight: 400;
    }
    .qr-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
      min-height: 220px;
    }
    #qrcode {
      background: rgba(255,255,255,0.95);
      padding: 16px;
      border-radius: 24px;
      display: inline-block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    #qrcode canvas, #qrcode img {
      display: block;
      margin: 0 auto;
    }
    .room-code-big {
      font-family: 'JetBrains Mono', monospace;
      font-size: 56px;
      font-weight: 700;
      color: #7ab7ff;
      letter-spacing: 8px;
      margin: 20px 0;
      background: transparent !important;
      backdrop-filter: none !important;
      padding: 16px 32px;
      border-radius: 20px;
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.1);
      text-shadow: 0 0 40px rgba(59,130,246,0.2);
    }
    .join-link {
      font-family: monospace;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      word-break: break-all;
      margin-top: 16px;
      padding: 10px 16px;
      background: transparent !important;
      backdrop-filter: none !important;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
    }
    
    .stats-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .stat-card {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 24px 16px;
      text-align: center;
    }
    .stat-value {
      font-size: 48px;
      font-weight: 800;
      color: #7ab7ff;
      text-shadow: 0 0 40px rgba(59,130,246,0.15);
    }
    .stat-label {
      font-size: 14px;
      color: rgba(255,255,255,0.65);
      margin-top: 8px;
      letter-spacing: 0.5px;
    }
    
    .leaderboard-container {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 28px 24px;
      margin: 20px auto;
      max-width: 800px;
    }
    .leaderboard-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 1px;
      color: #fff;
    }
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .leaderboard-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.04);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .rank {
      font-size: 24px;
      width: 50px;
      text-align: center;
      font-weight: 600;
    }
    .avatar { font-size: 32px; }
    .name { flex: 1; font-weight: 600; color: #fff; }
    .score { font-size: 20px; font-weight: 700; color: #fbbf24; }
    .status { font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 500; }
    .status-active { background: rgba(16,185,129,0.15); color: #6ee7b7; }
    .status-complete { background: rgba(59,130,246,0.1); color: #7ab7ff; }
    
    .timezone-badge {
      background: transparent !important;
      backdrop-filter: none !important;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      border: 1px solid rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.7);
    }
    
    .btn {
      background: #3b82f6;
      border: none;
      padding: 12px 28px;
      border-radius: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.15s;
      box-shadow: 0 6px 20px rgba(59,130,246,0.25);
    }
    .btn:hover { background: #2563eb; transform: scale(1.02); }
    .btn:active { transform: scale(0.96); }
    
    .room-entry {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .entry-card {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 40px;
      padding: 48px 40px;
      text-align: center;
      max-width: 440px;
      width: 90%;
    }
    .entry-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 28px;
      font-family: monospace;
      text-align: center;
      letter-spacing: 6px;
      color: #fff;
      width: 100%;
      margin: 24px 0;
      transition: border 0.2s;
    }
    .entry-input:focus {
      border-color: #3b82f6;
      outline: none;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .error-msg {
      color: #f87171;
      font-size: 13px;
      margin-top: 12px;
      min-height: 20px;
    }
    .hidden { display: none !important; }
    
    .footer {
      text-align: center;
      padding: 24px 20px 30px;
      color: rgba(255,255,255,0.2);
      font-size: 12px;
      letter-spacing: 0.3px;
    }

    .leaderboard-list::-webkit-scrollbar { width: 5px; }
    .leaderboard-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
    .leaderboard-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

    @media (max-width: 640px) {
      .qr-section { padding: 24px 16px; margin: 12px; }
      .qr-title { font-size: 34px; }
      .stats-container { grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
      .stat-card { padding: 16px; }
      .stat-value { font-size: 36px; }
      .room-code-big { font-size: 38px; letter-spacing: 4px; padding: 12px 20px; }
      .entry-card { padding: 32px 20px; }
      .leaderboard-container { padding: 20px 16px; margin: 12px; }
      .leaderboard-row { flex-wrap: wrap; gap: 8px; }
      .rank { width: 36px; font-size: 20px; }
    }
  </style>
</head>
<body>

  <div id="brandingBgLayer"></div>

  <div id="roomEntry" class="room-entry">
    <div class="entry-card">
      <div style="font-size: 36px; font-weight: 800; margin-bottom: 6px; letter-spacing: 1px;">PLAY<span style="color:#7ab7ff;">A</span>QUIZ</div>
      <div style="font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 8px;">FOH Display – Self-Paced</div>
      <input type="text" id="roomInput" class="entry-input" placeholder="CODE" maxlength="8" autocomplete="off">
      <button class="btn" id="connectBtn" onclick="connectToRoom()">Connect →</button>
      <div id="roomError" class="error-msg"></div>
    </div>
  </div>

  <div id="mainContent" class="hidden">
    <div class="qr-section">
      <div class="qr-title">📱 SCAN TO JOIN</div>
      <div class="qr-subtitle">Use your phone to scan the QR code and start playing</div>
      <div class="qr-container">
        <div id="qrcode"></div>
      </div>
      <div>
        <div class="room-code-big" id="roomCodeDisplay">——</div>
      </div>
      <div class="join-link" id="joinUrlDisplay"></div>
      <div class="timezone-badge" id="timezoneDisplay"></div>
      <div style="font-size:14px; color:rgba(255,255,255,0.45); margin-top: 18px;">
        Or enter code manually on your device
      </div>
    </div>

    <div class="stats-container">
      <div class="stat-card"><div class="stat-value" id="statPlayers">0</div><div class="stat-label">Total Players</div></div>
      <div class="stat-card"><div class="stat-value" id="statActive">0</div><div class="stat-label">Playing Now</div></div>
      <div class="stat-card"><div class="stat-value" id="statCompleted">0</div><div class="stat-label">Completed</div></div>
    </div>

    <div class="leaderboard-container">
      <div class="leaderboard-title">🏆 LIVE LEADERBOARD</div>
      <div class="leaderboard-list" id="leaderboardList">
        <div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.35);">Waiting for players...</div>
      </div>
    </div>
    
    <div class="footer">
      PlayAQuiz — Self-Paced Mode • Room active until game ends
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let SESSION_ID = null;
let ROOM_CODE = null;
let refreshInterval = null;
let realtimeChannel = null;

function getUserTimezone() {
  return Intl.DateTimeFormat().resolvedOptions().timeZone;
}
function getTimezoneOffset() {
  const offset = new Date().getTimezoneOffset();
  const hours = Math.abs(Math.floor(offset / 60));
  const minutes = Math.abs(offset % 60);
  const sign = offset <= 0 ? '+' : '-';
  return `${sign}${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
}
function UTCToLocal(utcDate) {
  const date = new Date(utcDate);
  return new Date(date.getTime() + (date.getTimezoneOffset() * 60000));
}
function formatLocalDate(date) {
  return date.toLocaleString(undefined, {
    year: 'numeric', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: true
  });
}
function displayTimezoneInfo() {
  const tz = getUserTimezone();
  const offset = getTimezoneOffset();
  const display = document.getElementById('timezoneDisplay');
  if (display) {
    display.innerHTML = `🌍 ${tz} (UTC ${offset})`;
  }
}

async function checkAndConnectToRoom(code) {
  try {
    const { data: session, error } = await sb
      .from('game_sessions')
      .select('id, room_code, status, scheduled_date, title, branding_image')
      .eq('room_code', code)
      .maybeSingle();
    
    if (error || !session) {
      return { available: false, reason: '❌ Room not found' };
    }
    
    if (session.status === 'scheduled') {
      const scheduledDate = new Date(session.scheduled_date);
      const now = new Date();
      if (scheduledDate > now) {
        const localDate = UTCToLocal(session.scheduled_date);
        const formattedDate = formatLocalDate(localDate);
        const tz = getUserTimezone();
        const offset = getTimezoneOffset();
        return { 
          available: false, 
          reason: `📅 Scheduled for ${formattedDate} (${tz} UTC${offset})` 
        };
      }
    }
    
    let warning = null;
    if (session.status === 'ended') {
      warning = '🏁 This game has ended. Displaying final results.';
    }
    
    return { 
      available: true, 
      sessionId: session.id, 
      roomCode: session.room_code,
      status: session.status,
      warning: warning,
      branding: session.branding_image
    };
    
  } catch (err) {
    console.error('Connection check error:', err);
    return { available: false, reason: '🔌 Connection error. Please try again.' };
  }
}

async function connectToRoom() {
  const code = document.getElementById('roomInput').value.trim().toUpperCase();
  if (!code) { showError('Enter room code'); return; }
  
  const btn = document.getElementById('connectBtn');
  btn.disabled = true;
  btn.innerText = 'Checking...';
  
  const result = await checkAndConnectToRoom(code);
  if (!result.available) {
    showError(result.reason);
    btn.disabled = false;
    btn.innerText = 'Connect →';
    return;
  }
  
  SESSION_ID = result.sessionId;
  ROOM_CODE = result.roomCode;
  
  btn.innerText = 'Connecting...';
  
  if (result.warning) {
    showError(result.warning);
    setTimeout(() => {
      const errDiv = document.getElementById('roomError');
      if (errDiv) errDiv.innerText = '';
    }, 5000);
  }
  
  document.getElementById('roomEntry').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = ROOM_CODE;
  
  displayTimezoneInfo();
  generateQRCode();
  
  if (result.branding) {
    applyBrandingImage(result.branding);
  } else {
    loadBranding();
  }
  
  init();
  
  btn.disabled = false;
  btn.innerText = 'Connect →';
}

function applyBrandingImage(url) {
  const layer = document.getElementById('brandingBgLayer');
  if (url) {
    layer.style.backgroundImage = `url('${url}')`;
    layer.classList.add('active');
  } else {
    layer.classList.remove('active');
    layer.style.backgroundImage = '';
  }
}

async function loadBranding() {
  if (!SESSION_ID) return;
  const { data } = await sb.from('game_sessions').select('branding_image').eq('id', SESSION_ID).maybeSingle();
  if (data && data.branding_image) {
    applyBrandingImage(data.branding_image);
  }
}

function generateQRCode() {
  const joinUrl = `${window.location.origin}/player-sp.html?room=${ROOM_CODE}`;
  document.getElementById('joinUrlDisplay').innerText = joinUrl;
  
  const qrContainer = document.getElementById('qrcode');
  qrContainer.innerHTML = '';
  
  if (typeof QRCode !== 'undefined') {
    try {
      new QRCode(qrContainer, {
        text: joinUrl,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    } catch(e) {
      fallbackQRDisplay(qrContainer, joinUrl);
    }
  } else {
    fallbackQRDisplay(qrContainer, joinUrl);
  }
}

function fallbackQRDisplay(container, url) {
  container.innerHTML = `
    <div style="background: white; border-radius: 20px; padding: 16px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.3);">
      <div style="width: 180px; height: 180px; background: repeating-linear-gradient(45deg, #000 0px, #000 4px, #fff 4px, #fff 12px); border-radius: 12px; margin: 0 auto;"></div>
      <div style="margin-top: 12px; font-family: monospace; font-size: 10px; color: #000; word-break: break-all;">${url}</div>
      <div style="margin-top: 8px; font-size: 11px; color: #444;">Enter code: ${ROOM_CODE}</div>
    </div>
  `;
}

function showError(msg) {
  const err = document.getElementById('roomError');
  err.innerText = msg;
  setTimeout(() => {
    if (err.innerText === msg) err.innerText = '';
  }, 6000);
}

async function init() {
  await loadStats();
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(loadStats, 5000);
  setupRealtime();
}

async function loadStats() {
  if (!SESSION_ID) return;
  
  try {
    const { data: players, error } = await sb
      .from('players')
      .select('*')
      .eq('session_id', SESSION_ID);
    
    if (error) throw error;
    
    if (!players || players.length === 0) {
      document.getElementById('statPlayers').innerText = '0';
      document.getElementById('statActive').innerText = '0';
      document.getElementById('statCompleted').innerText = '0';
      document.getElementById('leaderboardList').innerHTML = '<div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.35);">Waiting for players to join...</div>';
      return;
    }
    
    const totalPlayers = players.length;
    const activePlayers = players.filter(p => !p.completed && !p.is_eliminated).length;
    const completedPlayers = players.filter(p => p.completed === true).length;
    
    document.getElementById('statPlayers').innerText = totalPlayers;
    document.getElementById('statActive').innerText = activePlayers;
    document.getElementById('statCompleted').innerText = completedPlayers;
    
    const sorted = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));
    
    document.getElementById('leaderboardList').innerHTML = sorted.slice(0, 10).map((p, i) => {
      let statusText = 'Playing';
      let statusClass = 'status-active';
      if (p.completed === true) {
        statusText = '✓ Completed';
        statusClass = 'status-complete';
      } else if (p.is_eliminated) {
        statusText = '❌ Eliminated';
      }
      
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}`;
      
      return `
        <div class="leaderboard-row">
          <div class="rank">${medal}</div>
          <div class="avatar">${p.avatar_color || '👤'}</div>
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="score">${p.score || 0}</div>
          <div class="status ${statusClass}">${statusText}</div>
        </div>
      `;
    }).join('');
    
  } catch (err) {
    console.error('Error loading stats:', err);
  }
}

function setupRealtime() {
  if (realtimeChannel) {
    try { sb.removeChannel(realtimeChannel); } catch(e) {}
  }
  if (!SESSION_ID) return;
  
  realtimeChannel = sb.channel(`foh-${SESSION_ID}`);
  realtimeChannel
    .on('postgres_changes', {
      event: 'UPDATE',
      schema: 'public',
      table: 'game_sessions',
      filter: `id=eq.${SESSION_ID}`
    }, (payload) => {
      if (payload.new.branding_image) {
        applyBrandingImage(payload.new.branding_image);
      }
    })
    .subscribe();
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

const urlParams = new URLSearchParams(window.location.search);
const sessionFromUrl = urlParams.get('session');
const roomFromUrl = urlParams.get('room');

if (sessionFromUrl && roomFromUrl) {
  SESSION_ID = sessionFromUrl;
  ROOM_CODE = roomFromUrl;
  document.getElementById('roomEntry').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = ROOM_CODE;
  displayTimezoneInfo();
  generateQRCode();
  loadBranding().then(() => init());
}

setInterval(() => {
  if (ROOM_CODE && document.getElementById('mainContent').classList.contains('hidden') === false) {
    generateQRCode();
  }
}, 30000);

displayTimezoneInfo();
</script>
</body>
</html>
