<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — FOH Display (Self-Paced)</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent !important;
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
    }
    
    #brandingBgLayer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: -2;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #brandingBgLayer.active { opacity: 1; }
    
    /* Very subtle gradient overlay for readability */
    #brandingOverlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.25) 70%, rgba(0,0,0,0.45) 100%);
    }
    #brandingOverlay.active { opacity: 1; }
    
    .qr-section {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      border-radius: 0;
      padding: 40px 32px;
      text-align: center;
      margin: 20px;
    }
    
    /* SCAN TO JOIN - with transparent background + border */
    .qr-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 32px;
      border: 2px solid rgba(122, 183, 255, 0.35);
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 12px;
      letter-spacing: 1px;
      box-shadow: 0 0 40px rgba(122, 183, 255, 0.05);
    }
    .qr-title .gradient-text {
      background: linear-gradient(135deg, #ffffff, #7ab7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .qr-subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.85);
      margin-bottom: 24px;
      font-weight: 400;
      text-shadow: 0 2px 20px rgba(0,0,0,0.4);
      margin-top: 16px;
    }
    .qr-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
      min-height: 220px;
    }
    
    /* QR Code - with transparent background + border */
    #qrcode {
      background: rgba(255, 255, 255, 0.92);
      padding: 16px;
      border-radius: 24px;
      display: inline-block;
      border: 2px solid rgba(122, 183, 255, 0.35);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3), 0 0 40px rgba(122, 183, 255, 0.05);
    }
    #qrcode canvas, #qrcode img {
      display: block;
      margin: 0 auto;
    }
    
    /* Room Code - with transparent background + border */
    .room-code-big {
      font-family: 'JetBrains Mono', monospace;
      font-size: 56px;
      font-weight: 700;
      color: #7ab7ff;
      letter-spacing: 8px;
      margin: 20px 0;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 16px 32px;
      border-radius: 20px;
      display: inline-block;
      border: 2px solid rgba(122, 183, 255, 0.3);
      text-shadow: 0 0 40px rgba(59,130,246,0.15);
      box-shadow: 0 0 30px rgba(122, 183, 255, 0.05);
    }
    
    /* Website Link - with transparent background + border */
    .join-link {
      font-family: monospace;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      word-break: break-all;
      margin-top: 16px;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1.5px solid rgba(122, 183, 255, 0.2);
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 0 20px rgba(122, 183, 255, 0.03);
    }
    
    .leaderboard-toggle {
      text-align: center;
      margin: 10px auto 30px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: all 0.3s;
      user-select: none;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 12px 40px;
      display: inline-block;
      background: rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .leaderboard-toggle:hover {
      color: #7ab7ff;
      border-color: rgba(122, 183, 255, 0.3);
      background: rgba(0, 0, 0, 0.2);
    }
    .toggle-wrapper {
      text-align: center;
    }

    /* Leaderboard Modal */
    #leaderboardModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    #leaderboardModal.open {
      display: flex;
    }
    .leaderboard-modal-content {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 32px 28px;
      max-width: 700px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .modal-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: #fff;
    }
    .modal-close {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .modal-close:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .leaderboard-list-modal {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .leaderboard-row-modal {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .leaderboard-row-modal .rank {
      font-size: 24px;
      width: 50px;
      text-align: center;
      font-weight: 600;
    }
    .leaderboard-row-modal .avatar { font-size: 32px; }
    .leaderboard-row-modal .name { flex: 1; font-weight: 600; color: #fff; }
    .leaderboard-row-modal .score { font-size: 20px; font-weight: 700; color: #fbbf24; }
    .leaderboard-row-modal .status { font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: 500; }
    .leaderboard-row-modal .status-active { background: rgba(16,185,129,0.15); color: #6ee7b7; }
    .leaderboard-row-modal .status-complete { background: rgba(59,130,246,0.1); color: #7ab7ff; }
    .empty-leaderboard {
      text-align: center;
      padding: 40px;
      color: rgba(255,255,255,0.35);
    }
    
    .timezone-badge {
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      border: 1px solid rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.7);
    }
    
    .btn {
      background: #3b82f6;
      border: none;
      padding: 12px 28px;
      border-radius: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.15s;
      box-shadow: 0 6px 20px rgba(59,130,246,0.25);
    }
    .btn:hover { background: #2563eb; transform: scale(1.02); }
    .btn:active { transform: scale(0.96); }
    
    .room-entry {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
    }
    .entry-card {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 40px;
      padding: 48px 40px;
      text-align: center;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }
    .entry-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 28px;
      font-family: monospace;
      text-align: center;
      letter-spacing: 6px;
      color: #fff;
      width: 100%;
      margin: 24px 0;
      transition: border 0.2s;
    }
    .entry-input:focus {
      border-color: #3b82f6;
      outline: none;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .error-msg {
      color: #f87171;
      font-size: 13px;
      margin-top: 12px;
      min-height: 20px;
    }
    .hidden { display: none !important; }
    
    .footer {
      text-align: center;
      padding: 24px 20px 30px;
      color: rgba(255,255,255,0.2);
      font-size: 12px;
      letter-spacing: 0.3px;
    }

    .leaderboard-list-modal::-webkit-scrollbar,
    .leaderboard-modal-content::-webkit-scrollbar { width: 5px; }
    .leaderboard-list-modal::-webkit-scrollbar-track,
    .leaderboard-modal-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 10px; }
    .leaderboard-list-modal::-webkit-scrollbar-thumb,
    .leaderboard-modal-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

    @media (max-width: 640px) {
      .qr-section { padding: 24px 16px; margin: 12px; }
      .qr-title { font-size: 34px; padding: 6px 20px; }
      .room-code-big { font-size: 38px; letter-spacing: 4px; padding: 12px 20px; }
      .entry-card { padding: 32px 20px; }
      .leaderboard-modal-content { padding: 24px 16px; max-height: 85vh; }
      .leaderboard-row-modal { flex-wrap: wrap; gap: 8px; }
      .leaderboard-row-modal .rank { width: 36px; font-size: 20px; }
      .leaderboard-toggle { font-size: 22px; padding: 10px 24px; }
      .join-link { font-size: 11px; padding: 10px 14px; }
    }
  </style>
</head>
<body>

  <div id="brandingBgLayer"></div>
  <div id="brandingOverlay"></div>

  <div id="roomEntry" class="room-entry">
    <div class="entry-card">
      <div style="font-size: 36px; font-weight: 800; margin-bottom: 6px; letter-spacing: 1px;">PLAY<span style="color:#7ab7ff;">A</span>QUIZ</div>
      <div style="font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 8px;">FOH Display – Self-Paced</div>
      <input type="text" id="roomInput" class="entry-input" placeholder="CODE" maxlength="8" autocomplete="off">
      <button class="btn" id="connectBtn" onclick="connectToRoom()">Connect →</button>
      <div id="roomError" class="error-msg"></div>
    </div>
  </div>

  <div id="mainContent" class="hidden">
    <div class="qr-section">
      <div class="qr-title">
        <span class="gradient-text">📱 SCAN TO JOIN</span>
      </div>
      <div class="qr-subtitle">Use your phone to scan the QR code and start playing</div>
      <div class="qr-container">
        <div id="qrcode"></div>
      </div>
      <div>
        <div class="room-code-big" id="roomCodeDisplay">——</div>
      </div>
      <div class="join-link" id="joinUrlDisplay"></div>
      <div class="timezone-badge" id="timezoneDisplay"></div>
      <div style="font-size:14px; color:rgba(255,255,255,0.45); margin-top: 18px;">
        Or enter code manually on your device
      </div>
    </div>

    <div class="toggle-wrapper">
      <div class="leaderboard-toggle" id="leaderboardToggle" onclick="toggleLeaderboard()">
        🏆 LEADERBOARD
      </div>
    </div>

    <div class="footer">
      PlayAQuiz — Self-Paced Mode • Room active until game ends
    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div id="leaderboardModal" onclick="if(event.target===this) toggleLeaderboard()">
    <div class="leaderboard-modal-content">
      <div class="modal-header">
        <div class="modal-title">🏆 LEADERBOARD</div>
        <div class="modal-close" onclick="toggleLeaderboard()">✕</div>
      </div>
      <div class="leaderboard-list-modal" id="leaderboardListModal">
        <div class="empty-leaderboard">Loading players...</div>
      </div>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let SESSION_ID = null;
let ROOM_CODE = null;
let refreshInterval = null;
let realtimeChannel = null;
let cachedPlayers = [];

function getUserTimezone() {
  return Intl.DateTimeFormat().resolvedOptions().timeZone;
}
function getTimezoneOffset() {
  const offset = new Date().getTimezoneOffset();
  const hours = Math.abs(Math.floor(offset / 60));
  const minutes = Math.abs(offset % 60);
  const sign = offset <= 0 ? '+' : '-';
  return `${sign}${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
}
function UTCToLocal(utcDate) {
  const date = new Date(utcDate);
  return new Date(date.getTime() + (date.getTimezoneOffset() * 60000));
}
function formatLocalDate(date) {
  return date.toLocaleString(undefined, {
    year: 'numeric', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: true
  });
}
function displayTimezoneInfo() {
  const tz = getUserTimezone();
  const offset = getTimezoneOffset();
  const display = document.getElementById('timezoneDisplay');
  if (display) {
    display.innerHTML = `🌍 ${tz} (UTC ${offset})`;
  }
}

function toggleLeaderboard() {
  const modal = document.getElementById('leaderboardModal');
  modal.classList.toggle('open');
  if (modal.classList.contains('open')) {
    renderModalLeaderboard();
  }
}

function renderModalLeaderboard() {
  const container = document.getElementById('leaderboardListModal');
  if (!cachedPlayers || cachedPlayers.length === 0) {
    container.innerHTML = '<div class="empty-leaderboard">Waiting for players...</div>';
    return;
  }
  
  const sorted = [...cachedPlayers].sort((a, b) => (b.score || 0) - (a.score || 0));
  
  container.innerHTML = sorted.slice(0, 20).map((p, i) => {
    let statusText = 'Playing';
    let statusClass = 'status-active';
    if (p.completed === true) {
      statusText = '✓ Completed';
      statusClass = 'status-complete';
    } else if (p.is_eliminated) {
      statusText = '❌ Eliminated';
    }
    
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}`;
    
    return `
      <div class="leaderboard-row-modal">
        <div class="rank">${medal}</div>
        <div class="avatar">${p.avatar_color || '👤'}</div>
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="score">${p.score || 0}</div>
        <div class="status ${statusClass}">${statusText}</div>
      </div>
    `;
  }).join('');
}

async function checkAndConnectToRoom(code) {
  try {
    const { data: session, error } = await sb
      .from('game_sessions')
      .select('id, room_code, status, scheduled_date, title, branding_image')
      .eq('room_code', code)
      .maybeSingle();
    
    if (error || !session) {
      return { available: false, reason: '❌ Room not found' };
    }
    
    if (session.status === 'scheduled') {
      const scheduledDate = new Date(session.scheduled_date);
      const now = new Date();
      if (scheduledDate > now) {
        const localDate = UTCToLocal(session.scheduled_date);
        const formattedDate = formatLocalDate(localDate);
        const tz = getUserTimezone();
        const offset = getTimezoneOffset();
        return { 
          available: false, 
          reason: `📅 Scheduled for ${formattedDate} (${tz} UTC${offset})` 
        };
      }
    }
    
    let warning = null;
    if (session.status === 'ended') {
      warning = '🏁 This game has ended. Displaying final results.';
    }
    
    return { 
      available: true, 
      sessionId: session.id, 
      roomCode: session.room_code,
      status: session.status,
      warning: warning,
      branding: session.branding_image
    };
    
  } catch (err) {
    console.error('Connection check error:', err);
    return { available: false, reason: '🔌 Connection error. Please try again.' };
  }
}

async function connectToRoom() {
  const code = document.getElementById('roomInput').value.trim().toUpperCase();
  if (!code) { showError('Enter room code'); return; }
  
  const btn = document.getElementById('connectBtn');
  btn.disabled = true;
  btn.innerText = 'Checking...';
  
  const result = await checkAndConnectToRoom(code);
  if (!result.available) {
    showError(result.reason);
    btn.disabled = false;
    btn.innerText = 'Connect →';
    return;
  }
  
  SESSION_ID = result.sessionId;
  ROOM_CODE = result.roomCode;
  
  btn.innerText = 'Connecting...';
  
  if (result.warning) {
    showError(result.warning);
    setTimeout(() => {
      const errDiv = document.getElementById('roomError');
      if (errDiv) errDiv.innerText = '';
    }, 5000);
  }
  
  document.getElementById('roomEntry').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = ROOM_CODE;
  
  displayTimezoneInfo();
  generateQRCode();
  
  if (result.branding) {
    applyBrandingImage(result.branding);
  } else {
    loadBranding();
  }
  
  init();
  
  btn.disabled = false;
  btn.innerText = 'Connect →';
}

function applyBrandingImage(url) {
  const layer = document.getElementById('brandingBgLayer');
  const overlay = document.getElementById('brandingOverlay');
  if (url) {
    layer.style.backgroundImage = `url('${url}')`;
    layer.classList.add('active');
    overlay.classList.add('active');
  } else {
    layer.classList.remove('active');
    overlay.classList.remove('active');
    layer.style.backgroundImage = '';
  }
}

async function loadBranding() {
  if (!SESSION_ID) return;
  const { data } = await sb.from('game_sessions').select('branding_image').eq('id', SESSION_ID).maybeSingle();
  if (data && data.branding_image) {
    applyBrandingImage(data.branding_image);
  }
}

function generateQRCode() {
  const joinUrl = `${window.location.origin}/player-sp.html?room=${ROOM_CODE}`;
  document.getElementById('joinUrlDisplay').innerText = joinUrl;
  
  const qrContainer = document.getElementById('qrcode');
  qrContainer.innerHTML = '';
  
  if (typeof QRCode !== 'undefined') {
    try {
      new QRCode(qrContainer, {
        text: joinUrl,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    } catch(e) {
      fallbackQRDisplay(qrContainer, joinUrl);
    }
  } else {
    fallbackQRDisplay(qrContainer, joinUrl);
  }
}

function fallbackQRDisplay(container, url) {
  container.innerHTML = `
    <div style="background: white; border-radius: 20px; padding: 16px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.3);">
      <div style="width: 180px; height: 180px; background: repeating-linear-gradient(45deg, #000 0px, #000 4px, #fff 4px, #fff 12px); border-radius: 12px; margin: 0 auto;"></div>
      <div style="margin-top: 12px; font-family: monospace; font-size: 10px; color: #000; word-break: break-all;">${url}</div>
      <div style="margin-top: 8px; font-size: 11px; color: #444;">Enter code: ${ROOM_CODE}</div>
    </div>
  `;
}

function showError(msg) {
  const err = document.getElementById('roomError');
  err.innerText = msg;
  setTimeout(() => {
    if (err.innerText === msg) err.innerText = '';
  }, 6000);
}

async function init() {
  await loadStats();
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(loadStats, 5000);
  setupRealtime();
}

async function loadStats() {
  if (!SESSION_ID) return;
  
  try {
    const { data: players, error } = await sb
      .from('players')
      .select('*')
      .eq('session_id', SESSION_ID);
    
    if (error) throw error;
    
    cachedPlayers = players || [];
    
    if (document.getElementById('leaderboardModal').classList.contains('open')) {
      renderModalLeaderboard();
    }
    
  } catch (err) {
    console.error('Error loading stats:', err);
  }
}

function setupRealtime() {
  if (realtimeChannel) {
    try { sb.removeChannel(realtimeChannel); } catch(e) {}
  }
  if (!SESSION_ID) return;
  
  realtimeChannel = sb.channel(`foh-${SESSION_ID}`);
  realtimeChannel
    .on('postgres_changes', {
      event: 'UPDATE',
      schema: 'public',
      table: 'game_sessions',
      filter: `id=eq.${SESSION_ID}`
    }, (payload) => {
      if (payload.new.branding_image) {
        applyBrandingImage(payload.new.branding_image);
      }
    })
    .subscribe();
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

const urlParams = new URLSearchParams(window.location.search);
const sessionFromUrl = urlParams.get('session');
const roomFromUrl = urlParams.get('room');

if (sessionFromUrl && roomFromUrl) {
  SESSION_ID = sessionFromUrl;
  ROOM_CODE = roomFromUrl;
  document.getElementById('roomEntry').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = ROOM_CODE;
  displayTimezoneInfo();
  generateQRCode();
  loadBranding().then(() => init());
}

setInterval(() => {
  if (ROOM_CODE && document.getElementById('mainContent').classList.contains('hidden') === false) {
    generateQRCode();
  }
}, 30000);

displayTimezoneInfo();
</script>
</body>
</html>
