<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PlayAQuiz — Host Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #03050b;
      --s1: #0d1120;
      --s2: #111827;
      --b1: #1f2a3c;
      --b2: #2d3b52;
      --text: #e8edf7;
      --muted: #6b7a99;
      --accent: #3b82f6;
      --green: #10b981;
      --gold: #fbbf24;
      --red: #ef4444;
      --purple: #8b5cf6;
      --orange: #f97316;
      --radius: 14px;
      --radius-sm: 10px;
    }

    html, body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      width: 100%;
      overflow: hidden;
    }
    .screen.active {
      display: flex;
    }

    /* Join Screen */
    #joinScreen {
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .join-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 44px;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #fff 30%, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }
    .join-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .join-card {
      background: var(--s1);
      border: 1px solid var(--b1);
      border-radius: 28px;
      padding: 28px 20px;
      width: 100%;
      max-width: 340px;
    }
    @media (max-width: 360px) {
      .join-logo { font-size: 34px; }
      .join-card { padding: 20px 14px; border-radius: 20px; }
      .big-input { font-size: 20px; padding: 12px; }
    }
    .field-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }
    .big-input {
      width: 100%;
      background: var(--bg);
      border: 2px solid var(--b2);
      border-radius: var(--radius);
      padding: 14px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 5px;
      text-transform: uppercase;
      outline: none;
      margin-bottom: 8px;
    }
    .big-input:focus {
      border-color: var(--accent);
    }
    .join-hint {
      font-size: 11px;
      color: #4a5568;
      text-align: center;
      margin-bottom: 20px;
    }

    /* Top Bar */
    .topbar {
      background: var(--s1);
      border-bottom: 1px solid var(--b1);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      min-height: 0;
      overflow: hidden;
    }
    .topbar-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(16px, 4vw, 22px);
      letter-spacing: 3px;
      background: linear-gradient(135deg, #fff, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    .topbar-title {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .room-chip {
      background: var(--s2);
      border: 1px solid var(--b1);
      border-radius: 30px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .live-dot.on {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }
    .room-chip-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(12px, 3.5vw, 16px);
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    /* Tab Bar */
    .tabbar {
      background: var(--s1);
      border-bottom: 1px solid var(--b1);
      display: flex;
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 2px;
      font-size: clamp(8px, 2.2vw, 10px);
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.1s;
      min-width: 0;
      overflow: hidden;
    }
    .tab-btn .tab-icon {
      font-size: 18px;
    }
    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--gold);
    }

    /* Panels */
    .tabs-content {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .tab-panel {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 14px 12px 80px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .tab-panel.active {
      display: flex;
    }

    /* Cards */
    .card {
      background: var(--s1);
      border: 1px solid var(--b1);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .card-hd {
      padding: 12px 14px;
      border-bottom: 1px solid var(--b1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-hd-title {
      font-size: 10px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .card-bd {
      padding: 14px;
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.08s linear, opacity 0.15s;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn:disabled {
      opacity: 0.4;
      transform: none;
      cursor: not-allowed;
    }
    .btn-full {
      width: 100%;
    }
    .btn-md {
      padding: 10px 14px;
      font-size: 13px;
    }
    .btn-lg {
      padding: 14px;
      font-size: 15px;
      border-radius: var(--radius);
    }
    .btn-xl {
      padding: 18px;
      font-size: 17px;
      font-weight: 800;
      border-radius: var(--radius);
    }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-orange { background: var(--orange); color: #fff; }
    .btn-purple { background: var(--purple); color: #fff; }
    .btn-ghost { background: var(--s2); color: var(--text); border: 1px solid var(--b2); }
    .btn-danger-ghost { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
    .btn-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 320px) {
      .btn-grid-2 { grid-template-columns: 1fr; }
    }

    /* Room display */
    .big-room-display {
      text-align: center;
      padding: 12px 0 8px;
    }
    .big-room-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(26px, 8vw, 40px);
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 4px;
    }

    /* Player list */
    .player-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: min(260px, 30vh);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .player-row {
      background: var(--s2);
      border: 1px solid var(--b1);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .player-row.buzzed {
      border-color: var(--gold);
      background: rgba(251,191,36,0.06);
    }
    .player-row.eliminated {
      opacity: 0.35;
      filter: grayscale(1);
    }
    .player-row-avatar { font-size: 28px; }
    .player-row-info { flex: 1; }
    .player-row-name { font-size: 13px; font-weight: 700; }
    .player-row-score {
      font-family: monospace;
      font-size: 13px;
      color: var(--gold);
      font-weight: 700;
    }
    .conn-pip {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .conn-pip.live { background: var(--green); }
    .conn-pip.dc { background: var(--red); }

    /* Question selector */
    .q-pick-btn {
      width: 100%;
      background: var(--s2);
      border: 2px dashed var(--b2);
      border-radius: var(--radius);
      padding: 14px;
      color: var(--muted);
      font-size: 13px;
      text-align: left;
      display: flex;
      gap: 8px;
      cursor: pointer;
    }
    .q-pick-btn.selected {
      border-color: var(--accent);
      background: rgba(59,130,246,0.05);
      color: var(--text);
    }
    .q-box {
      background: linear-gradient(135deg, rgba(59,130,246,0.07), rgba(139,92,246,0.04));
      border-radius: var(--radius);
      padding: 14px;
      margin-top: 12px;
    }
    .q-text {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .q-opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    @media (max-width: 340px) {
      .q-opts { grid-template-columns: 1fr; }
    }
    .q-opt {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--b1);
      border-radius: 8px;
      padding: 8px;
      font-size: 11px;
    }
    .q-opt.correct {
      border-color: var(--green);
      background: rgba(16,185,129,0.08);
    }
    .q-opt-letter {
      color: var(--accent);
      font-weight: 800;
      margin-right: 4px;
    }

    /* Buzzer banner */
    .buzz-banner {
      display: none;
      background: rgba(251,191,36,0.08);
      border: 2px solid var(--gold);
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
    }
    .buzz-banner.visible {
      display: block;
      animation: fadePop 0.2s ease;
    }
    @keyframes fadePop {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .buzz-banner-name {
      font-size: clamp(16px, 5vw, 22px);
      font-weight: 800;
    }
    .buzz-banner-answer {
      font-size: 11px;
      color: var(--green);
      margin-top: 6px;
    }

    /* Players grid */
    .players-big-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .pbg-card {
      background: var(--s2);
      border: 2px solid var(--b1);
      border-radius: var(--radius);
      padding: 10px 5px;
      text-align: center;
      cursor: pointer;
    }
    .pbg-card.buzzed {
      border-color: var(--gold);
      background: rgba(251,191,36,0.1);
    }
    .pbg-card.eliminated {
      opacity: 0.3;
      pointer-events: none;
    }
    .pbg-avatar { font-size: clamp(22px, 6vw, 30px); }
    .pbg-name { font-size: 11px; font-weight: 700; word-break: break-word; }
    .pbg-score { font-family: monospace; font-size: 14px; color: var(--gold); margin-top: 4px; }

    /* Override rows */
    .ov-row {
      background: var(--s2);
      border: 1px solid var(--b1);
      border-radius: var(--radius-sm);
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      min-width: 0;
    }
    .ov-info { flex: 1; min-width: 0; }
    .ov-name { font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* ov-info and ov-name defined within ov-row block above */
    .ov-score { font-family: monospace; font-size: 13px; color: var(--gold); }
    .ov-actions { display: flex; gap: 5px; }

    /* Modal */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 300;
      padding: 12px;
    }
    .modal-bg.open {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: var(--s1);
      border: 1px solid var(--b1);
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .modal-hd {
      padding: 14px 16px;
      border-bottom: 1px solid var(--b1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-cats {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 12px;
      border-bottom: 1px solid var(--b1);
    }
    .cat-pill {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      border: 1px solid var(--b2);
      background: var(--s2);
      cursor: pointer;
      color: var(--text);
    }
    .cat-pill.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .modal-qlist {
      overflow-y: auto;
      flex: 1;
    }
    .mq-item {
      padding: 12px;
      border-bottom: 1px solid var(--b1);
      display: flex;
      gap: 8px;
      cursor: pointer;
      align-items: center;
    }
    .mq-item.used { opacity: 0.4; }
    .mq-q { font-size: 12px; font-weight: 600; flex: 1; }
    .empty-msg { color: var(--muted); text-align: center; padding: 24px; }
    .hidden { display: none !important; }

    /* Toast */
    #toastWrap {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 500;
    }
    .toast {
      background: rgba(13,17,32,0.96);
      backdrop-filter: blur(8px);
      border: 1px solid var(--b2);
      border-radius: 40px;
      padding: 8px 20px;
      font-size: 12px;
      font-weight: 600;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div id="loadingScreen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:14px;">
  <div style="width:34px;height:34px;border:3px solid #2d3b52;border-top-color:#fbbf24;border-radius:50%;animation:spin 0.7s linear infinite;"></div>
  <div style="color:#6b7a99;">Loading...</div>
</div>

<div id="joinScreen" class="screen">
  <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:20px;">
    <div class="join-logo">PLAYAQUIZ</div>
    <div class="join-sub">Host Control</div>
    <div class="join-card">
      <label class="field-label">Room Code</label>
      <input class="big-input" id="joinInput" type="text" placeholder="FR####" maxlength="8" autocomplete="off" autocapitalize="characters">
      <div class="join-hint">Enter the room code from Final Round setup</div>
      <button class="btn btn-gold btn-lg btn-full" onclick="joinRoom()">🎮 Connect</button>
    </div>
  </div>
</div>

<div id="appScreen" class="screen">
  <div class="topbar">
    <div>
      <div class="topbar-logo">PLAYAQUIZ</div>
      <div class="topbar-title">Host Control</div>
    </div>
    <div class="room-chip">
      <div class="live-dot" id="liveDot"></div>
      <div class="room-chip-code" id="chipCode">——</div>
    </div>
  </div>
  <div class="tabbar">
    <button class="tab-btn active" onclick="switchTab('setup')"><span class="tab-icon">⚙️</span>Setup</button>
    <button class="tab-btn" onclick="switchTab('game')"><span class="tab-icon">⚡</span>Game</button>
    <button class="tab-btn" onclick="switchTab('players')"><span class="tab-icon">👥</span>Players</button>
    <button class="tab-btn" onclick="switchTab('foh')"><span class="tab-icon">📺</span>FOH</button>
  </div>
  <div class="tabs-content">
    <!-- Setup Panel -->
    <div class="tab-panel active" id="panel-setup">
      <div class="card">
        <div class="card-hd"><div class="card-hd-title">🏠 Room</div><span id="connLabel" style="font-size:9px;">Offline</span></div>
        <div class="card-bd">
          <div class="big-room-display"><div class="big-room-code" id="bigRoomCode">——</div></div>
          <div class="btn-grid-2">
            <button class="btn btn-ghost btn-md" onclick="copyJoinLink()">🔗 Copy Link</button>
            <button class="btn btn-ghost btn-md" onclick="newRoomCode()">🔄 New Code</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-hd"><div class="card-hd-title">👥 Players</div><span id="playerCountBadge" style="color:var(--gold);">0</span></div>
        <div class="card-bd"><div class="player-list" id="setupPlayerList"><div class="empty-msg">Waiting for players...</div></div></div>
      </div>
      <div class="card">
        <div class="card-hd"><div class="card-hd-title">⚙️ Settings</div></div>
        <div class="card-bd" style="display:flex; flex-direction:column; gap:12px;">
          <input type="number" id="pointsInput" value="100" step="10" style="background:var(--bg);border:1px solid var(--b2);border-radius:10px;padding:12px;color:white;font-weight:700;">
          <input type="number" id="minPlayersInput" value="2" min="1" style="background:var(--bg);border:1px solid var(--b2);border-radius:10px;padding:12px;color:white;">
          <button class="btn btn-gold btn-xl btn-full" onclick="startRound()">🚀 START ROUND</button>
          <button class="btn btn-danger-ghost btn-md btn-full" onclick="fullReset()">🔄 Full Reset</button>
        </div>
      </div>
    </div>

    <!-- Game Panel -->
    <div class="tab-panel" id="panel-game">
      <div class="card">
        <div class="card-hd"><div class="card-hd-title">📚 Question</div><span id="qNumBadge">Q#0</span></div>
        <div class="card-bd">
          <button class="q-pick-btn" id="qPickBtn" onclick="openQModal()"><span>📋</span><span id="qPickLabel">Tap to select question</span></button>
          <div id="qDisplay" class="hidden"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-hd"><div class="card-hd-title">🔔 Buzzer Control</div></div>
        <div class="card-bd" style="display:flex; flex-direction:column; gap:8px;">
          <button class="btn btn-accent btn-xl btn-full" id="openBuzzBtn" onclick="openQuestion()" disabled>🔔 OPEN BUZZERS</button>
          <div class="btn-grid-2">
            <button class="btn btn-ghost" id="resetBuzzBtn" onclick="resetBuzzers()" disabled>↺ Reset</button>
            <button class="btn btn-orange" id="buzzerToggleBtn" onclick="toggleBuzzer()">🔔 ON</button>
          </div>
        </div>
      </div>
      <div class="buzz-banner" id="buzzBanner">
        <div class="buzz-banner-name" id="buzzBannerName">—</div>
        <div class="buzz-banner-answer" id="buzzAnswerHint"></div>
      </div>
      <div class="btn-grid-2">
        <button class="btn btn-green btn-lg" id="correctBtn" onclick="markCorrect()" disabled>✅ CORRECT</button>
        <button class="btn btn-red btn-lg" id="wrongBtn" onclick="markWrong()" disabled>❌ WRONG</button>
      </div>
      <div class="card">
        <div class="card-bd">
          <div style="display:flex; gap:8px;">
            <input type="number" id="timerInput" value="10" style="width:80px;background:var(--bg);border:1px solid var(--b2);border-radius:8px;text-align:center;padding:10px;">
            <button class="btn btn-accent" style="flex:1;" onclick="startTimer()">⏱️ Start Timer</button>
          </div>
        </div>
      </div>
      <button class="btn btn-ghost btn-md btn-full" onclick="nextQuestion()">⏭ Next Question</button>
    </div>

    <!-- Players Panel -->
    <div class="tab-panel" id="panel-players">
      <div class="card">
        <div class="card-hd"><div class="card-hd-title">🎯 Manual Buzz</div></div>
        <div class="card-bd"><div class="players-big-grid" id="manualBuzzGrid"></div></div>
      </div>
      <div class="card">
        <div class="card-hd"><div class="card-hd-title">⚡ Player Override</div></div>
        <div class="card-bd" id="overrideList"></div>
      </div>
    </div>

    <!-- FOH Panel -->
    <div class="tab-panel" id="panel-foh">
      <div class="card">
        <div class="card-bd" style="display:flex; flex-direction:column; gap:8px;">
          <button class="btn btn-accent btn-lg" onclick="fohShowRoomCode()">📡 Show Room Code</button>
          <button class="btn btn-purple btn-lg" onclick="fohShowCategories()">🎨 Show Categories</button>
          <button class="btn btn-gold btn-lg" onclick="fohShowLeaderboard()">🏆 Show Leaderboard</button>
          <button class="btn btn-green btn-lg" onclick="fohEndRound()">🏁 End Round & Winner</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Question Modal -->
<div class="modal-bg" id="qModal">
  <div class="modal-box">
    <div class="modal-hd"><span>📖 Select Question</span><button class="btn btn-ghost" style="padding:5px 12px;" onclick="closeQModal()">✕</button></div>
    <div class="modal-cats" id="modalCats"></div>
    <div class="modal-qlist" id="modalQList"></div>
  </div>
</div>

<div id="toastWrap"></div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// State
let roomCode = '';
let channel = null;
let players = new Map();
let eliminated = new Set();
let locked = new Set();
let buzzedId = null;
let isOpen = false;
let buzzerEnabled = true;
let selectedQ = null;
let allQuestions = [];
let categories = [];
let filterCat = 'all';
let usedQIds = new Set();
let qCounter = 0;

// UI Elements
const loadingScreen = document.getElementById('loadingScreen');
const joinScreen = document.getElementById('joinScreen');
const appScreen = document.getElementById('appScreen');

// Initialize
window.addEventListener('load', () => {
  loadingScreen.style.display = 'none';
  const urlRoom = new URLSearchParams(location.search).get('room');
  if (urlRoom) {
    document.getElementById('joinInput').value = urlRoom.toUpperCase();
    connectRoom(urlRoom.toUpperCase());
  } else {
    joinScreen.classList.add('active');
  }
});

async function joinRoom() {
  const code = document.getElementById('joinInput').value.trim().toUpperCase();
  if (!code || code.length < 4) {
    toast('Enter a valid room code (e.g., FRXXXX)');
    return;
  }
  await connectRoom(code);
}

async function connectRoom(code) {
  roomCode = code;
  localStorage.setItem('hc_room', code);
  
  loadingScreen.style.display = 'flex';
  joinScreen.classList.remove('active');
  appScreen.classList.remove('active');
  
  try {
    // Register room in database
    await sb.from('game_rooms').delete().neq('room_code', code);
    await sb.from('game_rooms').upsert({
      room_code: code,
      is_active: true,
      control_id: 'hc_' + Date.now(),
      created_at: new Date(),
      player_count: 0
    });
    
    await loadQuestions();
    setupRealtime();
    
    document.getElementById('chipCode').innerText = roomCode;
    document.getElementById('bigRoomCode').innerText = roomCode;
    
    loadingScreen.style.display = 'none';
    appScreen.classList.add('active');
    toast(`Connected to room ${roomCode}`);
  } catch (err) {
    console.error('Connection error:', err);
    loadingScreen.style.display = 'none';
    joinScreen.classList.add('active');
    toast('Failed to connect. Check room code.');
  }
}

async function loadQuestions() {
  try {
    const { data: cats } = await sb.from('categories').select('*').order('name');
    categories = cats || [];
    const { data: qs } = await sb.from('questions').select('*, categories(name, icon)').order('created_at');
    allQuestions = qs || [];
    renderCategoryFilters();
    renderQList();
  } catch (err) {
    console.error('Load questions error:', err);
  }
}

function renderCategoryFilters() {
  const html = `<button class="cat-pill active" onclick="setFilter('all',this)">📚 All (${allQuestions.length})</button>` +
    categories.map(c => {
      const count = allQuestions.filter(q => q.category_id === c.id).length;
      return `<button class="cat-pill" onclick="setFilter('${c.id}',this)">${c.icon || '📁'} ${c.name} (${count})</button>`;
    }).join('');
  document.getElementById('modalCats').innerHTML = html;
}

function setFilter(id, btn) {
  filterCat = id;
  document.querySelectorAll('#modalCats .cat-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderQList();
}

function renderQList() {
  const filtered = filterCat === 'all' ? allQuestions : allQuestions.filter(q => q.category_id === filterCat);
  const html = filtered.map(q => `
    <div class="mq-item ${usedQIds.has(q.id) ? 'used' : ''}" onclick="selectQuestion('${q.id}')">
      <div class="mq-q">${escapeHtml(q.question_text.substring(0, 70))}</div>
      <button class="btn btn-red" style="padding:4px 12px; font-size:10px;" onclick="event.stopPropagation(); fireQuestion('${q.id}')">🔥</button>
    </div>
  `).join('');
  document.getElementById('modalQList').innerHTML = html || '<div class="empty-msg">No questions available</div>';
}

function selectQuestion(id) {
  selectedQ = allQuestions.find(q => q.id === id);
  if (selectedQ) {
    document.getElementById('qPickLabel').innerText = selectedQ.question_text.substring(0, 50) + '…';
    document.getElementById('qPickBtn').classList.add('selected');
    renderSelectedQDisplay();
    document.getElementById('openBuzzBtn').disabled = false;
    document.getElementById('resetBuzzBtn').disabled = false;
    closeQModal();
    toast('Question selected');
  }
}

function renderSelectedQDisplay() {
  if (!selectedQ) return;
  const opts = [selectedQ.option_a, selectedQ.option_b, selectedQ.option_c, selectedQ.option_d];
  const letters = ['A', 'B', 'C', 'D'];
  const html = `
    <div class="q-box">
      <div class="q-text">${escapeHtml(selectedQ.question_text)}</div>
      <div class="q-opts">
        ${opts.map((o, i) => `<div class="q-opt ${i === selectedQ.correct_option ? 'correct' : ''}"><span class="q-opt-letter">${letters[i]}</span> ${escapeHtml(o)}</div>`).join('')}
      </div>
      <div style="font-size:10px; color:var(--green); margin-top:8px;">✅ Answer: ${letters[selectedQ.correct_option]} — ${escapeHtml(opts[selectedQ.correct_option])}</div>
    </div>
  `;
  document.getElementById('qDisplay').innerHTML = html;
  document.getElementById('qDisplay').classList.remove('hidden');
}

function fireQuestion(id) {
  selectQuestion(id);
  setTimeout(() => openQuestion(), 100);
}

function setupRealtime() {
  if (channel) sb.removeChannel(channel);
  
  channel = sb.channel(`fr-${roomCode}`);
  channel
    .on('broadcast', { event: 'player_join' }, ({ payload }) => handlePlayerJoin(payload))
    .on('broadcast', { event: 'player_heartbeat' }, ({ payload }) => handleHeartbeat(payload))
    .on('broadcast', { event: 'buzz' }, ({ payload }) => handleBuzz(payload))
    .on('broadcast', { event: 'correct' }, ({ payload }) => handleExternalCorrect(payload))
    .on('broadcast', { event: 'wrong' }, ({ payload }) => handleExternalWrong(payload))
    .on('broadcast', { event: 'eliminated' }, ({ payload }) => handleExternalEliminated(payload))
    .on('broadcast', { event: 'full_game_reset' }, ({ payload }) => handleFullReset(payload))
    .on('broadcast', { event: 'player_list_update' }, ({ payload }) => syncPlayers(payload.players))
    .on('broadcast', { event: 'foh_requesting_sync' }, () => {
      // FOH reconnected — push current player list immediately
      broadcast('player_list_update', { players: Array.from(players.values()) });
    })
    .subscribe((status) => {
      const dot = document.getElementById('liveDot');
      const lbl = document.getElementById('connLabel');
      if (status === 'SUBSCRIBED') {
        dot.classList.add('on');
        if (lbl) lbl.innerText = 'Live';
      } else {
        dot.classList.remove('on');
        if (lbl) lbl.innerText = 'Offline';
      }
    });
    
  // Health check interval
  if (window._hcInterval) clearInterval(window._hcInterval);
  window._hcInterval = setInterval(() => {
    let changed = false;
    const now = Date.now();
    players.forEach(p => {
      const was = p.connected;
      p.connected = p.lastSeen ? (now - p.lastSeen < 18000) : true;
      if (was !== p.connected) changed = true;
    });
    if (changed) renderAll();
  }, 5000);
}

function handlePlayerJoin(payload) {
  // Check if same name reconnected with a new ID (tab reload, etc.)
  const existing = Array.from(players.values()).find(p => p.name === payload.name);
  if (existing && existing.id !== payload.id) {
    const oldId = existing.id;
    players.delete(oldId);
    if (eliminated.has(oldId)) { eliminated.delete(oldId); eliminated.add(payload.id); }
    if (locked.has(oldId)) { locked.delete(oldId); locked.add(payload.id); }
    if (buzzedId === oldId) buzzedId = payload.id;
    existing.id = payload.id;
    existing.connected = true;
    existing.lastSeen = Date.now();
    players.set(payload.id, existing);
    // Send state back to reconnected player
    broadcast('state_sync', {
      playerId: payload.id,
      score: existing.score,
      status: existing.status,
      isEliminated: eliminated.has(payload.id),
      isQuestionOpen: isOpen,
      questionText: selectedQ?.question_text || null,
      questionOptions: selectedQ
        ? [selectedQ.option_a, selectedQ.option_b, selectedQ.option_c, selectedQ.option_d]
        : []
    });
    broadcast('player_list_update', { players: Array.from(players.values()) });
    renderAll();
    toast(`🔄 ${payload.avatar} ${payload.name} reconnected`);
    return;
  }

  if (players.has(payload.id)) {
    const p = players.get(payload.id);
    p.connected = true;
    p.lastSeen = Date.now();
  } else {
    players.set(payload.id, {
      id: payload.id,
      name: payload.name,
      avatar: payload.avatar,
      score: 0,
      status: 'waiting',
      connected: true,
      lastSeen: Date.now()
    });
    toast(`✨ ${payload.avatar} ${payload.name} joined`);
  }
  broadcast('player_list_update', { players: Array.from(players.values()) });
  renderAll();
}

function handleHeartbeat(payload) {
  const p = players.get(payload.id);
  if (p) {
    p.lastSeen = Date.now();
    p.connected = true;
  }
}

function handleBuzz(payload) {
  if (!isOpen || buzzedId || !buzzerEnabled) return;
  if (locked.has(payload.id) || eliminated.has(payload.id)) return;
  
  const player = players.get(payload.id);
  if (!player) return;
  
  buzzedId = payload.id;
  isOpen = false;
  player.status = 'buzzed';
  
  players.forEach((p, id) => {
    if (id !== payload.id && !eliminated.has(id)) p.status = 'locked';
  });
  
  document.getElementById('buzzBanner').classList.add('visible');
  document.getElementById('buzzBannerName').innerHTML = `${player.avatar} ${escapeHtml(player.name)}`;
  if (selectedQ) {
    const opts = [selectedQ.option_a, selectedQ.option_b, selectedQ.option_c, selectedQ.option_d];
    const letters = ['A', 'B', 'C', 'D'];
    document.getElementById('buzzAnswerHint').innerHTML = `✅ ${letters[selectedQ.correct_option]}: ${escapeHtml(opts[selectedQ.correct_option])}`;
  }
  document.getElementById('correctBtn').disabled = false;
  document.getElementById('wrongBtn').disabled = false;
  broadcast('buzz_confirmed', { playerId: payload.id, playerName: player.name, playerAvatar: player.avatar });
  renderAll();
  toast(`🔔 ${player.name} buzzed!`);
}

function handleExternalCorrect(payload) {
  const player = players.get(payload.playerId);
  if (player) {
    player.score = payload.newScore || (player.score + (parseInt(document.getElementById('pointsInput').value) || 100));
    player.status = 'correct';
  }
  hideBuzzBanner();
  buzzedId = null;
  isOpen = false;
  renderAll();
}

function handleExternalWrong(payload) {
  const player = players.get(payload.playerId);
  if (player) {
    player.status = 'wrong';
    locked.add(payload.playerId);
  }
  hideBuzzBanner();
  buzzedId = null;
  renderAll();
}

function handleExternalEliminated(payload) {
  eliminated.add(payload.playerId);
  const player = players.get(payload.playerId);
  if (player) player.status = 'eliminated';
  if (buzzedId === payload.playerId) {
    buzzedId = null;
    hideBuzzBanner();
  }
  renderAll();
}

function handleFullReset(payload) {
  if (payload && payload.newRoomCode && payload.newRoomCode !== roomCode) {
    toast(`🔄 Game reset. New room: ${payload.newRoomCode}`);
    setTimeout(() => connectRoom(payload.newRoomCode), 1500);
  } else {
    resetLocalState();
    renderAll();
    toast('🔄 Game was reset');
  }
}

function syncPlayers(playerList) {
  if (!playerList) return;
  playerList.forEach(p => {
    if (players.has(p.id)) {
      const existing = players.get(p.id);
      existing.score = p.score ?? existing.score;
      existing.status = p.status ?? existing.status;
    } else {
      players.set(p.id, { ...p, lastSeen: Date.now() });
    }
  });
  renderAll();
}

function broadcast(event, payload) {
  if (channel) {
    channel.send({ type: 'broadcast', event, payload });
  }
}

function openQuestion() {
  if (!selectedQ) {
    toast('Select a question first!');
    return;
  }
  
  isOpen = true;
  buzzedId = null;
  locked.clear();
  buzzerEnabled = true;
  
  document.getElementById('buzzerToggleBtn').innerHTML = '🔔 ON';
  document.getElementById('buzzerToggleBtn').className = 'btn btn-orange';
  document.getElementById('openBuzzBtn').disabled = true;
  document.getElementById('resetBuzzBtn').disabled = false;
  hideBuzzBanner();
  document.getElementById('correctBtn').disabled = true;
  document.getElementById('wrongBtn').disabled = true;
  
  players.forEach((p, id) => {
    if (!eliminated.has(id)) p.status = 'waiting';
  });
  
  qCounter++;
  document.getElementById('qNumBadge').innerHTML = `Q#${qCounter}`;
  usedQIds.add(selectedQ.id);
  
  const opts = [selectedQ.option_a, selectedQ.option_b, selectedQ.option_c, selectedQ.option_d];
  broadcast('question_open', {
    question: selectedQ.question_text,
    questionNumber: qCounter,
    options: opts
  });
  
  renderAll();
  renderQList();
  toast('🔔 Buzzers OPEN!');
}

function resetBuzzers() {
  if (!selectedQ) return;
  buzzedId = null;
  locked.clear();
  isOpen = true;
  buzzerEnabled = true;
  players.forEach((p, id) => {
    if (!eliminated.has(id)) p.status = 'waiting';
  });
  hideBuzzBanner();
  document.getElementById('correctBtn').disabled = true;
  document.getElementById('wrongBtn').disabled = true;
  broadcast('reset_buzzers', {});
  renderAll();
  toast('↺ Buzzers reset');
}

function markCorrect() {
  if (!buzzedId) return;
  const player = players.get(buzzedId);
  const points = parseInt(document.getElementById('pointsInput').value) || 100;
  if (player) {
    player.score += points;
    player.status = 'correct';
  }
  hideBuzzBanner();
  document.getElementById('correctBtn').disabled = true;
  document.getElementById('wrongBtn').disabled = true;
  broadcast('correct', {
    playerId: buzzedId,
    playerName: player?.name,
    playerAvatar: player?.avatar,
    newScore: player?.score,
    points: points
  });
  buzzedId = null;
  isOpen = false;
  renderAll();
  toast(`✅ +${points} points!`);
  setTimeout(() => broadcast('reset_for_next_question', {}), 500);
}

function markWrong() {
  if (!buzzedId) return;
  const player = players.get(buzzedId);
  if (player) {
    player.status = 'wrong';
    locked.add(buzzedId);
  }
  hideBuzzBanner();
  document.getElementById('correctBtn').disabled = true;
  document.getElementById('wrongBtn').disabled = true;
  broadcast('wrong', { playerId: buzzedId, playerName: player?.name });
  buzzedId = null;
  renderAll();
  toast(`❌ Wrong answer - player locked`);
  
  // Check if any players are still available to buzz
  const remaining = Array.from(players.keys()).filter(id => !locked.has(id) && !eliminated.has(id));
  if (remaining.length > 0) {
    setTimeout(() => {
      isOpen = true;
      buzzerEnabled = true;
      broadcast('buzzers_reopen', {});
      toast('🔔 Buzzers re-opened');
    }, 3000);
  }
}

function nextQuestion() {
  buzzedId = null;
  isOpen = false;
  selectedQ = null;
  document.getElementById('qPickBtn').classList.remove('selected');
  document.getElementById('qPickLabel').innerText = 'Tap to select question';
  document.getElementById('qDisplay').classList.add('hidden');
  document.getElementById('openBuzzBtn').disabled = true;
  document.getElementById('resetBuzzBtn').disabled = true;
  hideBuzzBanner();
  document.getElementById('correctBtn').disabled = true;
  document.getElementById('wrongBtn').disabled = true;
  players.forEach(p => {
    if (!eliminated.has(p.id)) p.status = 'waiting';
  });
  locked.clear();
  broadcast('next_question', {});
  renderAll();
  toast('⏭ Ready for next question');
}

function startTimer() {
  const seconds = parseInt(document.getElementById('timerInput').value) || 10;
  broadcast('timer_start', { seconds });
  toast(`⏱️ Timer: ${seconds}s`);
}

function toggleBuzzer() {
  buzzerEnabled = !buzzerEnabled;
  const btn = document.getElementById('buzzerToggleBtn');
  if (buzzerEnabled) {
    btn.innerHTML = '🔔 ON';
    btn.className = 'btn btn-orange';
  } else {
    btn.innerHTML = '🔕 OFF';
    btn.className = 'btn btn-red';
  }
  broadcast('buzzer_toggle', { enabled: buzzerEnabled });
  toast(`Buzzers ${buzzerEnabled ? 'ON' : 'OFF'}`);
}

function forceBuzz(playerId) {
  const player = players.get(playerId);
  if (!player || eliminated.has(playerId)) return;
  if (!isOpen) {
    toast('Buzzers are not open');
    return;
  }
  if (buzzedId) {
    toast('Someone already buzzed');
    return;
  }
  
  buzzedId = playerId;
  isOpen = false;
  player.status = 'buzzed';
  players.forEach((p, id) => {
    if (id !== playerId && !eliminated.has(id)) p.status = 'locked';
  });
  
  document.getElementById('buzzBanner').classList.add('visible');
  document.getElementById('buzzBannerName').innerHTML = `${player.avatar} ${escapeHtml(player.name)}`;
  if (selectedQ) {
    const opts = [selectedQ.option_a, selectedQ.option_b, selectedQ.option_c, selectedQ.option_d];
    const letters = ['A', 'B', 'C', 'D'];
    document.getElementById('buzzAnswerHint').innerHTML = `✅ ${letters[selectedQ.correct_option]}: ${escapeHtml(opts[selectedQ.correct_option])}`;
  }
  document.getElementById('correctBtn').disabled = false;
  document.getElementById('wrongBtn').disabled = false;
  broadcast('buzz_confirmed', { playerId, playerName: player.name, playerAvatar: player.avatar });
  renderAll();
  toast(`🎯 Manually buzzed: ${player.name}`);
}

function unlockPlayer(playerId) {
  locked.delete(playerId);
  const player = players.get(playerId);
  if (player && !eliminated.has(playerId)) player.status = 'waiting';
  broadcast('reset_buzzers', {});
  renderAll();
  toast(`🔓 ${player?.name} unlocked`);
}

function eliminatePlayer(playerId) {
  const player = players.get(playerId);
  if (!player) return;
  if (!confirm(`Eliminate ${player.name}?`)) return;
  
  eliminated.add(playerId);
  player.status = 'eliminated';
  if (buzzedId === playerId) {
    buzzedId = null;
    hideBuzzBanner();
    document.getElementById('correctBtn').disabled = true;
    document.getElementById('wrongBtn').disabled = true;
  }
  broadcast('eliminated', { playerId, playerName: player.name });
  renderAll();
  toast(`⚡ ${player.name} eliminated`);
}

function startRound() {
  const minPlayers = parseInt(document.getElementById('minPlayersInput').value) || 2;
  if (players.size < minPlayers) {
    toast(`Need at least ${minPlayers} players to start`);
    return;
  }
  const points = parseInt(document.getElementById('pointsInput').value) || 100;
  broadcast('round_started', { roomCode, pointsPerBuzz: points });
  broadcast('show_room_code', { roomCode });
  // Both FOH ('show_category_picker') and player ('show_categories') event names
  broadcast('show_category_picker', { categories });
  broadcast('show_categories', { categories });
  switchTab('game');
  toast('🚀 Round started!');
}

function fohShowRoomCode() {
  broadcast('show_room_code', { roomCode });
  toast('📡 Room code sent to FOH');
}

function fohShowCategories() {
  // FOH listens to 'show_category_picker'; player listens to 'show_categories' — broadcast both
  broadcast('show_category_picker', { categories });
  broadcast('show_categories', { categories });
  toast('🎨 Categories shown on FOH & players');
}

function fohShowLeaderboard() {
  broadcast('player_list_update', { players: Array.from(players.values()) });
  toast('🏆 Leaderboard pushed to FOH');
}

function fohEndRound() {
  const sorted = Array.from(players.values()).filter(p => !eliminated.has(p.id)).sort((a, b) => b.score - a.score);
  const winner = sorted[0];
  broadcast('round_ended', { winner });
  toast(`🏁 Round ended! Winner: ${winner?.name || 'N/A'}`);
}

async function newRoomCode() {
  if (!confirm('Generate new room code? All players must re-join.')) return;
  const code = 'FR' + Math.random().toString(36).substring(2, 6).toUpperCase();
  broadcast('full_game_reset', { newRoomCode: code });
  await sb.from('game_rooms').delete().neq('room_code', code);
  await sb.from('game_rooms').upsert({ room_code: code, is_active: true, control_id: 'hc_' + Date.now(), created_at: new Date() });
  setTimeout(() => connectRoom(code), 600);
}

async function fullReset() {
  if (!confirm('⚠️ FULL RESET: This will clear all players and create a new room.')) return;
  const code = 'FR' + Math.random().toString(36).substring(2, 6).toUpperCase();
  broadcast('full_game_reset', { newRoomCode: code });
  await sb.from('game_rooms').delete().neq('room_code', code);
  await sb.from('game_rooms').upsert({ room_code: code, is_active: true, control_id: 'hc_' + Date.now(), created_at: new Date() });
  setTimeout(() => connectRoom(code), 600);
}

function copyJoinLink() {
  const url = `${window.location.origin}/finalroundplayer.html?room=${roomCode}`;
  navigator.clipboard.writeText(url);
  toast('🔗 Join link copied!');
}

function renderAll() {
  const sorted = Array.from(players.values()).sort((a, b) => b.score - a.score);
  const count = players.size;
  document.getElementById('playerCountBadge').innerHTML = count;
  
  // Setup tab player list
  const setupList = document.getElementById('setupPlayerList');
  if (sorted.length === 0) {
    setupList.innerHTML = '<div class="empty-msg">Waiting for players...</div>';
  } else {
    setupList.innerHTML = sorted.map(p => `
      <div class="player-row ${eliminated.has(p.id) ? 'eliminated' : ''} ${p.status === 'buzzed' ? 'buzzed' : ''}">
        <div class="player-row-avatar">${p.avatar}</div>
        <div class="player-row-info">
          <div class="player-row-name">${escapeHtml(p.name)}</div>
          <div class="player-row-score">${p.score} pts</div>
        </div>
        <div class="conn-pip ${p.connected ? 'live' : 'dc'}"></div>
      </div>
    `).join('');
  }
  
  // Manual buzz grid
  const manualGrid = document.getElementById('manualBuzzGrid');
  if (sorted.length === 0) {
    manualGrid.innerHTML = '<div class="empty-msg">No players yet</div>';
  } else {
    manualGrid.innerHTML = sorted.map(p => `
      <div class="pbg-card ${buzzedId === p.id ? 'buzzed' : ''} ${eliminated.has(p.id) ? 'eliminated' : ''}" onclick="forceBuzz('${p.id}')">
        <div class="pbg-avatar">${p.avatar}</div>
        <div class="pbg-name">${escapeHtml(p.name)}</div>
        <div class="pbg-score">${p.score}</div>
      </div>
    `).join('');
  }
  
  // Override list
  const overrideList = document.getElementById('overrideList');
  if (sorted.length === 0) {
    overrideList.innerHTML = '<div class="empty-msg">No players yet</div>';
  } else {
    overrideList.innerHTML = sorted.map(p => {
      let statusText = '';
      if (p.status === 'buzzed') statusText = '<span style="color:var(--gold);">🔔 Buzzed</span>';
      else if (p.status === 'correct') statusText = '<span style="color:var(--green);">✅ Correct</span>';
      else if (p.status === 'wrong') statusText = '<span style="color:var(--red);">❌ Wrong</span>';
      else if (eliminated.has(p.id)) statusText = '<span style="color:var(--muted);">⚡ Eliminated</span>';
      else if (locked.has(p.id)) statusText = '<span style="color:var(--muted);">🔒 Locked</span>';
      else statusText = '<span>● Ready</span>';
      
      return `
        <div class="ov-row">
          <span style="font-size:26px;">${p.avatar}</span>
          <div class="ov-info">
            <div class="ov-name">${escapeHtml(p.name)}</div>
            <div style="font-size:10px;">${statusText}</div>
          </div>
          <div class="ov-score">${p.score}</div>
          <div class="ov-actions">
            <button class="btn" style="background:var(--gold);color:#000;padding:5px 8px;" onclick="forceBuzz('${p.id}')">🔔</button>
            ${locked.has(p.id) ? `<button class="btn" style="background:var(--green);padding:5px 8px;" onclick="unlockPlayer('${p.id}')">🔓</button>` : ''}
            <button class="btn" style="background:var(--red);padding:5px 8px;" onclick="eliminatePlayer('${p.id}')">⚡</button>
          </div>
        </div>
      `;
    }).join('');
  }
}

function hideBuzzBanner() {
  document.getElementById('buzzBanner').classList.remove('visible');
}

function resetLocalState() {
  players.clear();
  eliminated.clear();
  locked.clear();
  buzzedId = null;
  isOpen = false;
  selectedQ = null;
  qCounter = 0;
  usedQIds.clear();
  hideBuzzBanner();
  document.getElementById('correctBtn').disabled = true;
  document.getElementById('wrongBtn').disabled = true;
  document.getElementById('openBuzzBtn').disabled = true;
  document.getElementById('resetBuzzBtn').disabled = true;
  document.getElementById('qPickBtn').classList.remove('selected');
  document.getElementById('qPickLabel').innerText = 'Tap to select question';
  document.getElementById('qDisplay').classList.add('hidden');
  document.getElementById('qNumBadge').innerHTML = 'Q#0';
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`tab-${tab}`)?.classList.add('active');
  document.getElementById(`panel-${tab}`)?.classList.add('active');
}

function openQModal() {
  renderQList();
  document.getElementById('qModal').classList.add('open');
}

function closeQModal() {
  document.getElementById('qModal').classList.remove('open');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerText = msg;
  document.getElementById('toastWrap').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// Make functions global for onclick handlers
window.joinRoom = joinRoom;
window.switchTab = switchTab;
window.startRound = startRound;
window.openQuestion = openQuestion;
window.resetBuzzers = resetBuzzers;
window.markCorrect = markCorrect;
window.markWrong = markWrong;
window.nextQuestion = nextQuestion;
window.startTimer = startTimer;
window.toggleBuzzer = toggleBuzzer;
window.forceBuzz = forceBuzz;
window.unlockPlayer = unlockPlayer;
window.eliminatePlayer = eliminatePlayer;
window.newRoomCode = newRoomCode;
window.fullReset = fullReset;
window.copyJoinLink = copyJoinLink;
window.openQModal = openQModal;
window.closeQModal = closeQModal;
window.fohShowRoomCode = fohShowRoomCode;
window.fohShowCategories = fohShowCategories;
window.fohShowLeaderboard = fohShowLeaderboard;
window.fohEndRound = fohEndRound;
window.setFilter = setFilter;
window.selectQuestion = selectQuestion;
window.fireQuestion = fireQuestion;
</script>
