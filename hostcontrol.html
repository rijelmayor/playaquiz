<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>PlayAQuiz — Host Control (Clean)</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0e0f11;
      --surface: #161819;
      --surface-alt: #1c1e21;
      --border: #2a2d32;
      --text: #eef2f8;
      --text-muted: #7e8799;
      --accent: #f59e0b;
      --green: #22c55e;
      --red: #f43f5e;
      --purple: #818cf8;
      --orange: #fb923c;
      --radius: 16px;
      --radius-sm: 10px;
    }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Screen states */
    .screen {
      display: none;
      width: 100%;
      min-height: 100dvh;
    }
    .screen.active {
      display: block;
    }

    /* Join Screen – minimal */
    #joinScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .join-card {
      background: var(--surface);
      border-radius: 32px;
      padding: 28px 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }
    .join-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 46px;
      text-align: center;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .join-sub {
      font-size: 12px;
      text-align: center;
      color: var(--text-muted);
      letter-spacing: 2px;
      margin-bottom: 28px;
    }
    .big-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 16px;
      font-size: 28px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      text-align: center;
      letter-spacing: 4px;
      color: var(--text);
      margin-bottom: 20px;
    }
    .btn {
      border: none;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.08s linear;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-full { width: 100%; }
    .btn-lg { padding: 14px 18px; font-size: 15px; }
    .btn-xl { padding: 16px; font-size: 16px; font-weight: 800; }
    .btn-accent { background: var(--accent); color: #000; }
    .btn-green { background: var(--green); color: #000; }
    .btn-red { background: var(--red); color: white; }
    .btn-gold { background: var(--gold, #f59e0b); color: #000; }
    .btn-orange { background: var(--orange); color: #000; }
    .btn-purple { background: var(--purple); color: #000; }
    .btn-ghost { background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); }

    /* App container – simple column scroll */
    #appScreen {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    /* Top bar – compact */
    .topbar {
      background: var(--surface);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .room-chip {
      background: var(--surface-alt);
      padding: 6px 14px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 8px;
      background: var(--red);
    }
    .live-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .room-chip-code {
      font-family: monospace;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1px;
    }

    /* Tab bar – horizontal scroll on mobile, but works */
    .tabbar {
      background: var(--surface);
      display: flex;
      gap: 4px;
      padding: 8px 12px;
      overflow-x: auto;
      scrollbar-width: thin;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      white-space: nowrap;
      background: transparent;
      border: none;
      padding: 10px 0;
      font-weight: 800;
      font-size: 13px;
      color: var(--text-muted);
      border-radius: 40px;
      transition: 0.1s;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: rgba(245,158,11,0.15);
      color: var(--accent);
    }

    /* Tab content – simple scrollable area */
    .tabs-content {
      flex: 1;
      padding: 16px 14px 32px;
    }
    .tab-panel {
      display: none;
      flex-direction: column;
      gap: 18px;
    }
    .tab-panel.active {
      display: flex;
    }

    /* Simplified cards – just light background, no heavy borders */
    .card {
      background: var(--surface);
      border-radius: 24px;
      overflow: hidden;
    }
    .card-hd {
      padding: 14px 18px;
      background: rgba(0,0,0,0.2);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .card-bd {
      padding: 18px;
    }
    .player-list, .players-big-grid, .override-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .player-row {
      background: var(--surface-alt);
      border-radius: 60px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .player-row-name { font-weight: 700; flex: 1; }
    .player-row-score { font-family: monospace; font-weight: 800; color: var(--accent); }
    .conn-pip { width: 8px; height: 8px; border-radius: 8px; background: var(--green); }
    .conn-pip.dc { background: var(--red); }

    /* Player grid for manual buzz */
    .players-big-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
      gap: 12px;
    }
    .pbg-card {
      background: var(--surface-alt);
      border-radius: 20px;
      padding: 12px 5px;
      text-align: center;
      cursor: pointer;
      transition: 0.05s linear;
    }
    .pbg-card:active { transform: scale(0.96); }
    .pbg-card.buzzed { background: rgba(245,158,11,0.2); }
    .pbg-avatar { font-size: 28px; }
    .pbg-name { font-size: 12px; font-weight: 700; word-break: break-word; }
    .pbg-score { font-size: 13px; font-weight: 800; color: var(--accent); }

    /* Override row */
    .ov-row {
      background: var(--surface-alt);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ov-name { font-weight: 700; flex: 1; }
    .ov-actions { display: flex; gap: 6px; }
    .btn-icon { padding: 6px 12px; border-radius: 40px; font-size: 13px; }

    /* Question picker */
    .q-pick-btn {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 60px;
      padding: 14px 16px;
      width: 100%;
      text-align: left;
      display: flex;
      gap: 10px;
      cursor: pointer;
    }
    .q-box {
      background: rgba(255,255,255,0.03);
      border-radius: 20px;
      padding: 16px;
      margin-top: 12px;
    }
    .q-opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .q-opt {
      background: var(--surface-alt);
      border-radius: 16px;
      padding: 8px 10px;
      font-size: 12px;
    }
    .buzz-banner {
      background: rgba(245,158,11,0.1);
      border-radius: 28px;
      padding: 16px;
      text-align: center;
      display: none;
    }
    .buzz-banner.visible { display: block; }
    .buzz-banner-name { font-size: 20px; font-weight: 800; }

    /* FOH controls simple row */
    .foh-control-row {
      background: var(--surface-alt);
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Modals */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.94);
      z-index: 200;
      padding: 16px;
      overflow-y: auto;
    }
    .modal-bg.open { display: flex; align-items: center; justify-content: center; }
    .modal-box {
      background: var(--surface);
      border-radius: 32px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-hd {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }
    .modal-tabs { display: flex; gap: 4px; padding: 8px 12px; background: var(--surface-alt); }
    .modal-tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 10px;
      border-radius: 40px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }
    .modal-tab-btn.active { background: var(--accent); color: #000; }
    .modal-pane { display: none; padding: 12px; }
    .modal-pane.active { display: block; }
    .aq-form { display: flex; flex-direction: column; gap: 12px; }
    .aq-input, select.aq-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px;
      color: var(--text);
      width: 100%;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 16px;
      right: 16px;
      background: #1e293b;
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 60px;
      font-weight: 600;
      z-index: 300;
      animation: fadeUp 0.2s;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hidden { display: none; }
    .btn-grid-2 { display: flex; gap: 10px; }
    .btn-grid-2 .btn { flex: 1; }
    .empty-msg { color: var(--text-muted); text-align: center; padding: 20px; }
  </style>
</head>
<body>

<div id="loadingScreen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:12px;">
  <div style="width:32px;height:32px;border:2px solid #f59e0b; border-top-color:transparent; border-radius:50%; animation:spin 0.7s infinite;"></div>
  <div style="color:#aaa;">Loading...</div>
</div>

<div id="joinScreen" class="screen">
  <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100dvh;">
    <div class="join-logo">PLAYAQUIZ</div>
    <div class="join-sub">Host Control</div>
    <div class="join-card">
      <input class="big-input" id="joinInput" placeholder="FRXXXX" maxlength="8" autocomplete="off">
      <button class="btn btn-accent btn-lg btn-full" onclick="joinRoom()">🎮 Connect</button>
    </div>
  </div>
</div>

<div id="appScreen" class="screen">
  <div class="topbar">
    <div class="topbar-logo">PLAYAQUIZ</div>
    <div class="room-chip"><div class="live-dot" id="liveDot"></div><div class="room-chip-code" id="chipCode">——</div></div>
  </div>
  <div class="tabbar">
    <button class="tab-btn active" onclick="switchTab('setup')">⚙️ Setup</button>
    <button class="tab-btn" onclick="switchTab('game')">⚡ Game</button>
    <button class="tab-btn" onclick="switchTab('players')">👥 Players</button>
    <button class="tab-btn" onclick="switchTab('foh')">📺 FOH</button>
  </div>
  <div class="tabs-content">
    <!-- SETUP PANEL -->
    <div class="tab-panel active" id="panel-setup">
      <div class="card"><div class="card-hd">🏠 Room</div><div class="card-bd"><div class="big-room-code" id="bigRoomCode" style="font-size:32px;font-family:monospace;font-weight:800;color:var(--accent);text-align:center;">——</div></div></div>
      <div class="card"><div class="card-hd">👥 Players <span id="playerCountBadge">0</span></div><div class="card-bd"><div class="player-list" id="setupPlayerList"><div class="empty-msg">Waiting...</div></div></div></div>
      <div class="card"><div class="card-hd">⚙️ Settings</div><div class="card-bd" style="display:flex; flex-direction:column; gap:12px;"><input type="number" id="pointsInput" value="100" placeholder="Points" style="background:var(--bg);border-radius:40px;padding:12px;border:1px solid var(--border);color:var(--text);"><input type="number" id="minPlayersInput" value="2" placeholder="Min players" style="background:var(--bg);border-radius:40px;padding:12px;border:1px solid var(--border);"><button class="btn btn-accent btn-xl btn-full" onclick="startRound()">🚀 START ROUND</button></div></div>
    </div>

    <!-- GAME PANEL -->
    <div class="tab-panel" id="panel-game">
      <div class="card"><div class="card-hd">📚 Question <span id="qNumBadge">Q#0</span></div><div class="card-bd"><button class="q-pick-btn" onclick="openQModal()"><span>🔍</span><span id="qPickLabel">Pick question...</span></button><div id="qDisplay" class="hidden"></div><button class="btn btn-ghost btn-full" style="margin-top:12px;" onclick="document.getElementById('importCsvInput').click()">📂 Import CSV</button><input type="file" id="importCsvInput" accept=".csv" style="display:none;" onchange="handleCsvImport(event)"></div></div>
      <div class="card"><div class="card-hd">🔔 Buzzer</div><div class="card-bd" style="gap:12px;display:flex;flex-direction:column;"><button class="btn btn-accent btn-xl" id="openBuzzBtn" onclick="openQuestion()" disabled>🔔 OPEN BUZZERS</button><div class="btn-grid-2"><button class="btn btn-ghost" id="resetBuzzBtn" onclick="resetBuzzers()" disabled>↺ Reset</button><button class="btn btn-orange" id="buzzerToggleBtn" onclick="toggleBuzzer()">🔔 ON</button></div></div></div>
      <div class="buzz-banner" id="buzzBanner"><div class="buzz-banner-name" id="buzzBannerName">—</div><div id="buzzAnswerHint" style="font-size:12px;"></div></div>
      <div class="btn-grid-2"><button class="btn btn-green btn-lg" id="correctBtn" onclick="markCorrect()" disabled>✅ CORRECT</button><button class="btn btn-red btn-lg" id="wrongBtn" onclick="markWrong()" disabled>❌ WRONG</button></div>
      <div class="card"><div class="card-hd">⏱️ Timer</div><div class="card-bd" style="display:flex; gap:12px; align-items:center;"><input type="number" id="timerInput" value="10" style="width:80px;background:var(--bg);border-radius:40px;padding:10px;"><button class="btn btn-accent" style="flex:1;" onclick="startTimer()">Start Timer</button></div></div>
      <button class="btn btn-purple btn-full" onclick="randomQuestion()">🎲 Random Question</button>
    </div>

    <!-- PLAYERS PANEL -->
    <div class="tab-panel" id="panel-players">
      <div class="card"><div class="card-hd">🎯 Manual Buzz</div><div class="card-bd"><div class="players-big-grid" id="manualBuzzGrid"></div></div></div>
      <div class="card"><div class="card-hd">⚡ Override</div><div class="card-bd"><div id="overrideList"></div></div></div>
    </div>

    <!-- FOH PANEL -->
    <div class="tab-panel" id="panel-foh">
      <div class="card"><div class="card-hd">📺 Display</div><div class="card-bd" style="display:flex;flex-direction:column;gap:10px;"><div class="foh-control-row"><span>📡 Room Code</span><div><button class="btn btn-accent btn-icon" onclick="fohShowRoomCode()">Show</button><button class="btn btn-ghost btn-icon" onclick="fohHide('room_code')" style="margin-left:6px;">Hide</button></div></div><div class="foh-control-row"><span>🎨 Categories</span><div><button class="btn btn-purple btn-icon" onclick="fohShowCategories()">Show</button><button class="btn btn-ghost btn-icon" onclick="fohHide('categories')">Hide</button></div></div><div class="foh-control-row"><span>🏆 Leaderboard</span><div><button class="btn btn-gold btn-icon" onclick="fohShowLeaderboard()">Show</button><button class="btn btn-ghost btn-icon" onclick="fohHide('leaderboard')">Hide</button></div></div><div class="foh-control-row"><span>🏁 End Round</span><div><button class="btn btn-green btn-icon" onclick="fohEndRound()">Show</button><button class="btn btn-ghost btn-icon" onclick="fohHide('end_round')">Hide</button></div></div></div></div>
    </div>
  </div>
</div>

<!-- Question Modal -->
<div class="modal-bg" id="qModal"><div class="modal-box"><div class="modal-hd"><span>📖 Questions</span><button onclick="closeQModal()" style="background:none;border:none;color:#fff;">✕</button></div><div class="modal-tabs"><button class="modal-tab-btn active" id="mTabSelect" onclick="switchModalTab('select')">Select</button><button class="modal-tab-btn" id="mTabAdd" onclick="switchModalTab('add')">Add</button></div><div class="modal-pane active" id="mPaneSelect"><div id="modalCats" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;"></div><div id="modalQList"></div></div><div class="modal-pane" id="mPaneAdd"><div class="aq-cat-strip" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;" id="aqCatStrip"></div><div class="aq-cat-add" style="display:flex;gap:6px;margin-bottom:12px;"><input id="aqNewCatName" placeholder="Category" class="aq-input"><input id="aqNewCatIcon" placeholder="📁" style="width:60px;" class="aq-input"><button class="btn btn-accent" onclick="aqAddCategory()">+</button></div><div class="aq-form"><select id="aqCategory" class="aq-input"><option value="">No category</option></select><textarea id="aqText" placeholder="Question" rows="2" class="aq-input"></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><input id="aqOptA" placeholder="A" class="aq-input"><input id="aqOptB" placeholder="B" class="aq-input"><input id="aqOptC" placeholder="C" class="aq-input"><input id="aqOptD" placeholder="D" class="aq-input"></div><select id="aqCorrect" class="aq-input"><option value="0">A correct</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><input id="aqPoints" type="number" value="100" class="aq-input"><button class="btn btn-gold btn-full" onclick="aqAddQuestion()">Save Question</button></div></div></div></div>

<div id="toastWrap"></div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let roomCode = '', sessionId = null, channel = null, players = new Map(), eliminated = new Set(), locked = new Set(), buzzedId = null, isOpen = false, buzzerEnabled = true, selectedQ = null, allQuestions = [], categories = [], usedQIds = new Set(), qCounter = 0, availableQuestions = [], gameStarted = false;
let filterCat = 'all';

function toast(msg) { const t=document.createElement('div');t.className='toast';t.innerText=msg;document.getElementById('toastWrap').appendChild(t);setTimeout(()=>t.remove(),2500);}
async function joinRoom(){ let code=document.getElementById('joinInput').value.trim().toUpperCase(); if(!code) return toast('Enter code'); await connectRoom(code);}
async function connectRoom(code){
  roomCode=code; document.getElementById('loadingScreen').style.display='flex'; document.getElementById('joinScreen').classList.remove('active'); document.getElementById('appScreen').classList.remove('active');
  try{
    let {data:sRow}=await sb.from('game_sessions').insert({room_code:code,status:'active',type:'final_round'}).select('id').single();
    if(sRow) sessionId=sRow.id;
    else {let {data:exist}=await sb.from('game_sessions').select('id').eq('room_code',code).order('created_at',{ascending:false}).limit(1).single(); sessionId=exist?.id;}
    await sb.from('game_rooms').upsert({room_code:code,is_active:true,control_id:'hc_'+Date.now()});
    await loadQuestions(); setupRealtime();
    document.getElementById('chipCode').innerText=roomCode; document.getElementById('bigRoomCode').innerText=roomCode;
    document.getElementById('loadingScreen').style.display='none'; document.getElementById('appScreen').classList.add('active'); toast(`Connected ${roomCode}`);
  }catch(e){ console.error(e); toast('Connection failed'); document.getElementById('loadingScreen').style.display='none'; document.getElementById('joinScreen').classList.add('active');}
}
async function loadQuestions(){ if(!sessionId) return; let {data:cats}=await sb.from('categories').select('*').eq('session_id',sessionId); categories=cats||[]; let {data:qs}=await sb.from('questions').select('*, categories(name, icon)').eq('session_id',sessionId); allQuestions=qs||[]; renderCatFilters(); renderQList(); renderAqCategoryStrip();}
function renderCatFilters(){ let html=`<button class="cat-pill active" style="padding:6px 12px;border-radius:40px;background:var(--surface-alt);" onclick="setFilter('all',this)">📚 All (${allQuestions.length})</button>`+categories.map(c=>{let c2=allQuestions.filter(q=>q.category_id===c.id).length; return `<button style="padding:6px 12px;border-radius:40px;background:var(--surface-alt);" onclick="setFilter('${c.id}',this)">${c.icon||'📁'} ${c.name} (${c2})</button>`;}).join(''); document.getElementById('modalCats').innerHTML=html;}
function setFilter(id,btn){ filterCat=id; document.querySelectorAll('#modalCats button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderQList();}
function renderQList(){ let filtered=filterCat==='all'?allQuestions:allQuestions.filter(q=>q.category_id===filterCat); let html=filtered.map(q=>{ let cat=categories.find(c=>c.id===q.category_id); let tag=cat?`${cat.icon||'📁'} ${escapeHtml(cat.name)}`:''; return `<div class="mq-item" style="padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;" onclick="selectQuestion('${q.id}')"><div><div>${escapeHtml(q.question_text.substring(0,60))}</div><div style="font-size:10px;color:#aaa;">${tag}</div></div><div><button class="btn btn-red" style="padding:4px 10px;" onclick="event.stopPropagation();fireQuestion('${q.id}')">🔥</button><button class="btn btn-ghost" style="margin-left:5px;" onclick="event.stopPropagation();aqDeleteQuestion('${q.id}')">🗑</button></div></div>`;}).join(''); document.getElementById('modalQList').innerHTML=html||'<div class="empty-msg">No questions</div>';}
function selectQuestion(id){ selectedQ=allQuestions.find(q=>q.id===id); if(selectedQ){ document.getElementById('qPickLabel').innerText=selectedQ.question_text.substring(0,45)+'…'; document.getElementById('qPickBtn').classList.add('selected'); renderSelectedQDisplay(); document.getElementById('openBuzzBtn').disabled=false; document.getElementById('resetBuzzBtn').disabled=false; closeQModal(); toast('Question selected');}}
function renderSelectedQDisplay(){ if(!selectedQ)return; let opts=[selectedQ.option_a,selectedQ.option_b,selectedQ.option_c,selectedQ.option_d]; let letters=['A','B','C','D']; let html=`<div class="q-box"><div>${escapeHtml(selectedQ.question_text)}</div><div class="q-opts">${opts.map((o,i)=>`<div class="q-opt">${letters[i]}: ${escapeHtml(o)}</div>`).join('')}</div><div style="font-size:11px;color:var(--green);margin-top:6px;">✅ ${letters[selectedQ.correct_option]}</div></div>`; document.getElementById('qDisplay').innerHTML=html; document.getElementById('qDisplay').classList.remove('hidden');}
function fireQuestion(id){ selectQuestion(id); setTimeout(()=>openQuestion(),100);}
function setupRealtime(){ if(channel)sb.removeChannel(channel); channel=sb.channel(`fr-${roomCode}`); channel.on('broadcast',{event:'player_join'},({payload})=>{ if(!players.has(payload.id)) players.set(payload.id,{id:payload.id,name:payload.name,avatar:payload.avatar,score:0,status:'waiting',connected:true,lastSeen:Date.now()}); else players.get(payload.id).connected=true; renderAll(); broadcast('player_list_update',{players:Array.from(players.values())}); }).on('broadcast',{event:'buzz'},({payload})=>{ if(!isOpen||buzzedId||!buzzerEnabled||eliminated.has(payload.id)||locked.has(payload.id))return; let p=players.get(payload.id); if(p){ buzzedId=payload.id; isOpen=false; p.status='buzzed'; players.forEach((_,id)=>{if(id!==payload.id && !eliminated.has(id)) locked.add(id);}); document.getElementById('buzzBanner').classList.add('visible'); document.getElementById('buzzBannerName').innerHTML=`${p.avatar} ${escapeHtml(p.name)}`; if(selectedQ){ let opts=[selectedQ.option_a,selectedQ.option_b,selectedQ.option_c,selectedQ.option_d]; let l=['A','B','C','D']; document.getElementById('buzzAnswerHint').innerHTML=`✅ ${l[selectedQ.correct_option]}: ${escapeHtml(opts[selectedQ.correct_option])}`; } document.getElementById('correctBtn').disabled=false; document.getElementById('wrongBtn').disabled=false; renderAll(); toast(`${p.name} buzzed!`); }}).on('broadcast',{event:'player_list_update'},({payload})=>{ if(payload.players) syncPlayers(payload.players); }).subscribe(()=>{ let dot=document.getElementById('liveDot'); dot.classList.add('on');}); renderAll();}
function syncPlayers(list){ list.forEach(p=>{ if(players.has(p.id)){ let ex=players.get(p.id); ex.score=p.score??ex.score; ex.status=p.status??ex.status; }else players.set(p.id,{...p,lastSeen:Date.now()}); }); renderAll();}
function broadcast(ev,pl){ if(channel)channel.send({type:'broadcast',event:ev,payload:pl});}
function renderAll(){ let sorted=Array.from(players.values()).sort((a,b)=>b.score-a.score); document.getElementById('playerCountBadge').innerHTML=sorted.length; let setupHtml=sorted.map(p=>`<div class="player-row"><div>${p.avatar}</div><div class="player-row-name">${escapeHtml(p.name)}</div><div class="player-row-score">${p.score}</div><div class="conn-pip ${p.connected?'live':'dc'}"></div></div>`).join(''); document.getElementById('setupPlayerList').innerHTML=setupHtml||'<div class="empty-msg">No players</div>'; let gridHtml=sorted.map(p=>`<div class="pbg-card ${buzzedId===p.id?'buzzed':''}" onclick="forceBuzz('${p.id}')"><div class="pbg-avatar">${p.avatar}</div><div class="pbg-name">${escapeHtml(p.name)}</div><div class="pbg-score">${p.score}</div><div style="font-size:9px;">${buzzedId===p.id?'🔔':''}</div></div>`).join(''); document.getElementById('manualBuzzGrid').innerHTML=gridHtml||'<div class="empty-msg">—</div>'; let ovHtml=sorted.map(p=>`<div class="ov-row"><div>${p.avatar}</div><div class="ov-name">${escapeHtml(p.name)}</div><div class="ov-actions"><button class="btn btn-accent btn-icon" onclick="forceBuzz('${p.id}')">🔔</button>${locked.has(p.id)?`<button class="btn btn-green btn-icon" onclick="unlockPlayer('${p.id}')">🔓</button>`:''}<button class="btn btn-red btn-icon" onclick="eliminatePlayer('${p.id}')">⚡</button></div></div>`).join(''); document.getElementById('overrideList').innerHTML=ovHtml||'<div class="empty-msg">No players</div>';}
function randomQuestion(){ if(!gameStarted){ toast('Start round first'); return; } if(!allQuestions.length){ toast('No questions'); return; } if(!availableQuestions.length){ let remaining=allQuestions.filter(q=>!usedQIds.has(q.id)); if(!remaining.length){ toast('All used, reshuffle'); initAvailableQuestions(); }else{ availableQuestions=[...remaining]; shuffleArray(availableQuestions); } } if(availableQuestions.length){ let next=availableQuestions.shift(); selectedQ=next; usedQIds.add(selectedQ.id); qCounter++; document.getElementById('qPickLabel').innerText=selectedQ.question_text.substring(0,45)+'…'; document.getElementById('qPickBtn').classList.add('selected'); renderSelectedQDisplay(); document.getElementById('qNumBadge').innerHTML=`Q#${qCounter}`; document.getElementById('openBuzzBtn').disabled=false; document.getElementById('resetBuzzBtn').disabled=false; toast('Question loaded'); }else{ toast('No questions left'); }}
function openQuestion(){ if(!selectedQ){ toast('Select a question first'); return; } if(!gameStarted){ toast('Round not started'); return; } isOpen=true; buzzedId=null; locked.clear(); buzzerEnabled=true; document.getElementById('buzzerToggleBtn').innerHTML='🔔 ON'; document.getElementById('openBuzzBtn').disabled=true; document.getElementById('resetBuzzBtn').disabled=false; hideBuzzBanner(); document.getElementById('correctBtn').disabled=true; document.getElementById('wrongBtn').disabled=true; players.forEach((p,id)=>{if(!eliminated.has(id))p.status='waiting';}); broadcast('question_open',{question:selectedQ.question_text,options:[selectedQ.option_a,selectedQ.option_b,selectedQ.option_c,selectedQ.option_d]}); renderAll(); toast('Buzzers OPEN');}
function resetBuzzers(){ if(!selectedQ)return; buzzedId=null; locked.clear(); isOpen=true; buzzerEnabled=true; players.forEach((p,id)=>{if(!eliminated.has(id))p.status='waiting';}); hideBuzzBanner(); document.getElementById('correctBtn').disabled=true; document.getElementById('wrongBtn').disabled=true; broadcast('reset_buzzers',{}); renderAll(); toast('Buzzers reset');}
function markCorrect(){ if(!buzzedId)return; let p=players.get(buzzedId); let pts=parseInt(document.getElementById('pointsInput').value)||100; if(p){ p.score+=pts; p.status='correct'; } hideBuzzBanner(); document.getElementById('correctBtn').disabled=true; document.getElementById('wrongBtn').disabled=true; broadcast('correct',{playerId:buzzedId,newScore:p?.score,points:pts}); buzzedId=null; isOpen=false; renderAll(); toast(`+${pts} pts`); setTimeout(()=>broadcast('reset_for_next_question',{}),300);}
function markWrong(){ if(!buzzedId)return; let p=players.get(buzzedId); if(p){ p.status='wrong'; locked.add(buzzedId); } hideBuzzBanner(); document.getElementById('correctBtn').disabled=true; document.getElementById('wrongBtn').disabled=true; broadcast('wrong',{playerId:buzzedId}); buzzedId=null; renderAll(); toast('Wrong – locked'); let remaining=Array.from(players.keys()).filter(id=>!locked.has(id)&&!eliminated.has(id)); if(remaining.length>0) setTimeout(()=>{ isOpen=true; buzzerEnabled=true; broadcast('buzzers_reopen',{}); toast('Buzzers reopened'); },2500);}
function startRound(){ let min=parseInt(document.getElementById('minPlayersInput').value)||2; if(players.size<min){ toast(`Need ${min} players (${players.size})`); return; } gameStarted=true; initAvailableQuestions(); broadcast('round_started',{roomCode}); toast('Round started!'); switchTab('game');}
function initAvailableQuestions(){ usedQIds.clear(); availableQuestions=[...allQuestions]; shuffleArray(availableQuestions); qCounter=0; document.getElementById('qNumBadge').innerHTML='Q#0'; selectedQ=null; document.getElementById('qPickBtn').classList.remove('selected'); document.getElementById('qPickLabel').innerText='Pick question...'; document.getElementById('qDisplay').classList.add('hidden'); document.getElementById('openBuzzBtn').disabled=true; document.getElementById('resetBuzzBtn').disabled=true;}
function shuffleArray(arr){ for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}}
function toggleBuzzer(){ buzzerEnabled=!buzzerEnabled; let btn=document.getElementById('buzzerToggleBtn'); btn.innerHTML=buzzerEnabled?'🔔 ON':'🔕 OFF'; btn.className=buzzerEnabled?'btn btn-orange':'btn btn-red'; broadcast('buzzer_toggle',{enabled:buzzerEnabled});}
function forceBuzz(id){ let p=players.get(id); if(!p||eliminated.has(id)||!isOpen||buzzedId)return; buzzedId=id; isOpen=false; p.status='buzzed'; players.forEach((_,pid)=>{if(pid!==id&&!eliminated.has(pid))locked.add(pid);}); document.getElementById('buzzBanner').classList.add('visible'); document.getElementById('buzzBannerName').innerHTML=`${p.avatar} ${escapeHtml(p.name)}`; if(selectedQ){let opts=[selectedQ.option_a,selectedQ.option_b,selectedQ.option_c,selectedQ.option_d];let l=['A','B','C','D']; document.getElementById('buzzAnswerHint').innerHTML=`✅ ${l[selectedQ.correct_option]}: ${escapeHtml(opts[selectedQ.correct_option])}`;} document.getElementById('correctBtn').disabled=false; document.getElementById('wrongBtn').disabled=false; renderAll(); toast(`Manual buzz: ${p.name}`);}
function unlockPlayer(id){ locked.delete(id); let p=players.get(id); if(p&&!eliminated.has(id))p.status='waiting'; renderAll(); toast(`${p?.name} unlocked`);}
function eliminatePlayer(id){ if(!confirm('Eliminate?'))return; eliminated.add(id); let p=players.get(id); if(p)p.status='eliminated'; if(buzzedId===id){buzzedId=null;hideBuzzBanner();} renderAll(); toast(`${p?.name} eliminated`);}
function fohHide(t){ broadcast('foh_hide',{target:t}); toast(`Hide ${t}`);}
function fohShowRoomCode(){ broadcast('show_room_code',{roomCode}); toast('Room code shown');}
function fohShowCategories(){ broadcast('show_categories',{categories}); toast('Categories shown');}
function fohShowLeaderboard(){ broadcast('player_list_update',{players:Array.from(players.values())}); toast('Leaderboard updated');}
function fohEndRound(){ let sorted=Array.from(players.values()).filter(p=>!eliminated.has(p.id)).sort((a,b)=>b.score-a.score); let winner=sorted[0]; broadcast('round_ended',{winner}); toast(`Winner: ${winner?.name||'?'}`); gameStarted=false;}
function startTimer(){ let sec=parseInt(document.getElementById('timerInput').value)||10; broadcast('timer_start',{seconds:sec}); toast(`Timer ${sec}s`);}
function hideBuzzBanner(){ document.getElementById('buzzBanner').classList.remove('visible');}
function switchTab(t){ document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active')); document.getElementById(`panel-${t}`)?.classList.add('active'); document.querySelector(`.tab-btn[onclick="switchTab('${t}')"]`)?.classList.add('active');}
function openQModal(){ renderQList(); document.getElementById('qModal').classList.add('open');}
function closeQModal(){ document.getElementById('qModal').classList.remove('open');}
function switchModalTab(tab){ document.getElementById('mTabSelect').classList.toggle('active',tab==='select'); document.getElementById('mTabAdd').classList.toggle('active',tab==='add'); document.getElementById('mPaneSelect').classList.toggle('active',tab==='select'); document.getElementById('mPaneAdd').classList.toggle('active',tab==='add'); if(tab==='add')renderAqCategoryStrip();}
function renderAqCategoryStrip(){ let strip=document.getElementById('aqCatStrip'); strip.innerHTML=categories.map(c=>`<span style="background:var(--surface-alt);border-radius:40px;padding:6px 12px;">${c.icon||'📁'} ${escapeHtml(c.name)} <button onclick="aqDeleteCategory('${c.id}','${escapeHtml(c.name)}')" style="background:none;border:none;color:red;">×</button></span>`).join('')||'<span>No categories</span>'; let sel=document.getElementById('aqCategory'); sel.innerHTML='<option value="">— None —</option>'+categories.map(c=>`<option value="${c.id}">${c.icon||'📁'} ${c.name}</option>`).join('');}
async function aqAddCategory(){ let name=document.getElementById('aqNewCatName').value.trim(); if(!name)return toast('Enter name'); let icon=document.getElementById('aqNewCatIcon').value.trim()||'📁'; await sb.from('categories').upsert({name,icon,session_id:sessionId}); await loadQuestions(); document.getElementById('aqNewCatName').value=''; toast('Category added');}
async function aqDeleteCategory(id,name){ if(!confirm(`Delete ${name}?`))return; await sb.from('questions').update({category_id:null}).eq('category_id',id); await sb.from('categories').delete().eq('id',id); await loadQuestions();}
async function aqAddQuestion(){ let text=document.getElementById('aqText').value.trim(),a=document.getElementById('aqOptA').value.trim(),b=document.getElementById('aqOptB').value.trim(),c=document.getElementById('aqOptC').value.trim(),d=document.getElementById('aqOptD').value.trim(),correct=parseInt(document.getElementById('aqCorrect').value),catId=document.getElementById('aqCategory').value||null,points=parseInt(document.getElementById('aqPoints').value)||100; if(!text||!a||!b||!c||!d)return toast('All fields required'); await sb.from('questions').insert({question_text:text,option_a:a,option_b:b,option_c:c,option_d:d,correct_option:correct,category_id:catId,points:points,session_id:sessionId}); await loadQuestions(); toast('Saved'); document.getElementById('aqText').value='';document.getElementById('aqOptA').value='';document.getElementById('aqOptB').value='';document.getElementById('aqOptC').value='';document.getElementById('aqOptD').value='';}
async function aqDeleteQuestion(id){ if(!confirm('Delete question?'))return; await sb.from('questions').delete().eq('id',id); if(selectedQ?.id===id){selectedQ=null;document.getElementById('qPickBtn').classList.remove('selected');document.getElementById('qPickLabel').innerText='Pick question...';document.getElementById('qDisplay').classList.add('hidden');document.getElementById('openBuzzBtn').disabled=true;} await loadQuestions(); toast('Deleted');}
async function handleCsvImport(e){ const file=e.target.files[0];if(!file)return; if(!sessionId){toast('No session');return;} let text=await file.text(); let rows=text.split(/\r?\n/).filter(r=>r.trim()); let headers=rows[0].split(',').map(h=>h.toLowerCase().replace(/"/g,'').trim()); let qIdx=headers.findIndex(h=>h==='question'),optA=headers.findIndex(h=>h==='option a'),optB=headers.findIndex(h=>h==='option b'),optC=headers.findIndex(h=>h==='option c'),optD=headers.findIndex(h=>h==='option d'),corrIdx=headers.findIndex(h=>h==='correct option'); if(qIdx===-1||optA===-1||optB===-1||optC===-1||optD===-1||corrIdx===-1){toast('Missing columns');return;} for(let i=1;i<rows.length;i++){ let cols=rows[i].split(',').map(c=>c.replace(/^"|"$/g,'').trim()); let q=cols[qIdx]||'',a=cols[optA]||'',b=cols[optB]||'',c=cols[optC]||'',d=cols[optD]||'',corr=parseInt(cols[corrIdx])||0; if(q&&a&&b&&c&&d){await sb.from('questions').insert({question_text:q,option_a:a,option_b:b,option_c:c,option_d:d,correct_option:corr,points:100,session_id:sessionId});}} await loadQuestions(); toast('CSV imported'); e.target.value='';}
function escapeHtml(s){ if(!s)return''; return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);}
window.joinRoom=joinRoom; window.switchTab=switchTab; window.startRound=startRound; window.openQuestion=openQuestion; window.resetBuzzers=resetBuzzers; window.markCorrect=markCorrect; window.markWrong=markWrong; window.randomQuestion=randomQuestion; window.startTimer=startTimer; window.toggleBuzzer=toggleBuzzer; window.forceBuzz=forceBuzz; window.unlockPlayer=unlockPlayer; window.eliminatePlayer=eliminatePlayer; window.openQModal=openQModal; window.closeQModal=closeQModal; window.fohHide=fohHide; window.fohShowRoomCode=fohShowRoomCode; window.fohShowCategories=fohShowCategories; window.fohShowLeaderboard=fohShowLeaderboard; window.fohEndRound=fohEndRound; window.setFilter=setFilter; window.selectQuestion=selectQuestion; window.fireQuestion=fireQuestion; window.switchModalTab=switchModalTab; window.aqAddCategory=aqAddCategory; window.aqDeleteCategory=aqDeleteCategory; window.aqAddQuestion=aqAddQuestion; window.aqDeleteQuestion=aqDeleteQuestion; window.handleCsvImport=handleCsvImport;
</script>
</body>
</html>
