<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Live Display with Bubble Burst Animations</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --bg: #04060e;
      --surface: rgba(13, 17, 32, 0.95);
      --accent: #3b82f6;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.5);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(59, 130, 246, 0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(59, 130, 246, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .foh {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    /* TOP BAR with bubble counter */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      background: rgba(4, 6, 14, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(59, 130, 246, 0.15);
      z-index: 20;
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #fff 40%, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 14px;
      color: var(--green);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .room-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 8px 20px;
      border-radius: 40px;
      letter-spacing: 4px;
    }

    /* Animated Player Counter with bubble effect */
    .player-counter-area {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 20px;
      border-radius: 80px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(59, 130, 246, 0.3);
      transition: all 0.2s ease;
    }

    .counter-icon {
      font-size: 22px;
      animation: subtleFloat 2s infinite;
    }

    @keyframes subtleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .counter-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--green), #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      transition: transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
      display: inline-block;
    }

    .counter-pop {
      transform: scale(1.25);
      text-shadow: 0 0 8px var(--green);
    }

    .counter-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
    }

    .display-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Screens */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 1;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }

    /* Waiting screen */
    .waiting-content { text-align: center; }
    .waiting-emoji {
      font-size: 100px;
      display: block;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .waiting-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 80px;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #fff 40%, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .big-room-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 10px;
      background: rgba(59, 130, 246, 0.12);
      border: 2px solid rgba(59, 130, 246, 0.3);
      padding: 20px 48px;
      border-radius: 24px;
      display: inline-block;
      margin-top: 20px;
    }
    .player-count-bar {
      margin-top: 32px;
      font-size: 22px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .player-count-num {
      font-size: 48px;
      font-weight: 800;
      color: var(--green);
    }

    /* Bubble burst animation container */
    .bubble-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      bottom: -80px;
      background: radial-gradient(circle at 30% 30%, rgba(59, 130, 246, 0.9), rgba(139, 92, 246, 0.7));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      color: white;
      text-shadow: 0 2px 8px black;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.6), inset 0 -5px 0 rgba(0,0,0,0.1);
      backdrop-filter: blur(2px);
      animation: bubbleRise 1.8s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
      white-space: nowrap;
      padding: 0 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      letter-spacing: 1px;
      border: 1px solid rgba(255,255,255,0.4);
    }

    @keyframes bubbleRise {
      0% {
        bottom: -80px;
        opacity: 0;
        transform: scale(0.3) rotate(0deg);
      }
      15% {
        opacity: 1;
        transform: scale(1.1) rotate(2deg);
      }
      40% {
        transform: scale(1.05) rotate(-1deg);
      }
      70% {
        opacity: 1;
        transform: scale(1) rotate(1deg);
      }
      100% {
        bottom: 110%;
        opacity: 0;
        transform: scale(1.3) rotate(8deg);
        filter: blur(6px);
      }
    }

    .burst-particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: radial-gradient(circle, #ffd966, #f59e0b);
      border-radius: 50%;
      pointer-events: none;
      animation: burstFly 0.8s ease-out forwards;
      z-index: 1000;
    }

    @keyframes burstFly {
      0% {
        opacity: 1;
        transform: scale(1) translate(0, 0);
      }
      100% {
        opacity: 0;
        transform: scale(0) translate(var(--tx, 40px), var(--ty, -60px));
      }
    }

    /* rest of existing styles compact */
    .q-wrapper, .lb-wrapper, .resp-wrapper, .end-content { width: min(90%, 1100px); }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .opt-item { display: flex; align-items: center; gap: 20px; padding: 20px 28px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 20px; backdrop-filter: blur(10px); font-weight: 600; transition: all 0.3s; }
    .opt-letter { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; flex-shrink: 0; }
    .opt-a .opt-letter { background: rgba(59,130,246,0.3); }
    .opt-b .opt-letter { background: rgba(139,92,246,0.3); }
    .opt-c .opt-letter { background: rgba(245,158,11,0.3); }
    .opt-d .opt-letter { background: rgba(236,72,153,0.3); }
    .opt-item.correct { border-color: var(--green); background: rgba(16,185,129,0.2); box-shadow: 0 0 40px rgba(16,185,129,0.3); }
    .opt-item.wrong { opacity: 0.35; filter: grayscale(0.6); }
    .timer-container { position: relative; width: 100px; height: 100px; }
    .timer-svg { transform: rotate(-90deg); }
    .timer-ring { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.95s linear; }
    .reveal-banner { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: var(--green); padding: 16px 48px; border-radius: 60px; font-weight: 800; opacity: 0; transition: all 0.4s; white-space: nowrap; z-index: 150; }
    .reveal-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .cat-overlay { position: fixed; inset: 0; background: rgba(4,6,14,0.96); backdrop-filter: blur(30px); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.5s; }
    .cat-overlay.show { opacity: 1; }
    .footer { padding: 10px 32px; display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.05); font-size: 13px; color: rgba(255,255,255,0.2); flex-shrink: 0; }
    .q-progress-bar { height: 4px; background: rgba(255,255,255,0.08); position: relative; flex-shrink: 0; }
    .q-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); transition: width .5s; }
    @keyframes catBounce { from{transform:scale(0)} to{transform:scale(1)} }
  </style>
</head>
<body>
<div class="foh">
  <div class="top-bar">
    <div class="logo">PLAY<span>A</span>QUIZ</div>
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
    <div style="display: flex; gap: 20px; align-items: center;">
      <div class="player-counter-area" id="playerCounterArea">
        <span class="counter-icon">🧑‍🎤</span>
        <span class="counter-number" id="animatedCounter">0</span>
        <span class="counter-label">players</span>
      </div>
      <div class="room-badge" id="roomCode">——</div>
    </div>
  </div>
  <div class="q-progress-bar"><div class="q-progress-fill" id="qProgressFill" style="width:0%"></div></div>
  <div class="display-area">
    <div id="screen-waiting" class="screen active">
      <div class="waiting-content">
        <span class="waiting-emoji">🎈</span>
        <div class="waiting-title">READY TO POP!</div>
        <div class="waiting-sub">Players join and bubbles will rise ✨</div>
        <div class="big-room-code" id="waitingRoomCode">——</div>
        <div class="player-count-bar">🔥 Players ready: <span class="player-count-num" id="playerCountDisplay">0</span></div>
      </div>
    </div>
    <div id="screen-question" class="screen"> <div class="q-wrapper"> <div class="q-header"><div class="q-meta-left"><div class="q-num-badge" id="qNumBadge">Q1/1</div><div class="cat-badge" id="qCatBadge"><span>📋</span><span>Quiz</span></div></div><div class="timer-container"><svg class="timer-svg" width="100" height="100" viewBox="0 0 100 100"><circle class="timer-track" cx="50" cy="50" r="42"/><circle class="timer-ring" id="timerRing" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="0"/></svg><div class="timer-num" id="timerNum">—</div></div></div><div class="q-text-area"><div class="q-text" id="qText">Loading...</div></div><div class="options-grid" id="optionsGrid"></div></div> </div>
    <div id="screen-leaderboard" class="screen"><div class="lb-wrapper"><div class="lb-title">🏆 LEADERBOARD</div><div class="lb-list" id="lbList"></div></div></div>
    <div id="screen-responses" class="screen"><div class="resp-wrapper"><div class="resp-title">📊 Response Distribution</div><div id="respBarsContainer"></div></div></div>
    <div id="screen-ended" class="screen"><div class="end-content"><div class="end-icon">🏁</div><div class="end-title">GAME OVER!</div><div style="font-size:24px;color:var(--muted);margin-top:16px">Thanks for playing!</div></div></div>
  </div>
  <div class="footer"><span>PlayAQuiz — Bubble Party</span><span id="footerStatus">Waiting for host</span><span id="footerTime"></span></div>
</div>
<div id="catOverlay" class="cat-overlay"><div class="cat-content"><span class="cat-icon-big" id="catIconBig">🎯</span><div class="cat-label">CATEGORY</div><div class="cat-name-big" id="catNameBig">General</div><div class="cat-line"></div></div></div>
<div class="reveal-banner" id="revealBanner"></div>
<div id="bubbleContainer" class="bubble-canvas"></div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// Audio engine
const AC = window.AudioContext || window.webkitAudioContext;
let ac;
function getAC() { if (!ac) ac = new AC(); if (ac.state === 'suspended') ac.resume(); return ac; }
function playPopSound() {
  try { 
    const ctx = getAC();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = 620 + Math.random() * 150;
    gain.gain.value = 0.3;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start();
    osc.stop(ctx.currentTime + 0.25);
  } catch(e) {}
}

// State
let SESSION_ID = null;
let currentQuestion = null;
let timerInterval = null;
let timeLeft = 0, totalTime = 0;
let playerCountInterval = null;
let lastKnownPlayerCount = 0;
let processedPlayerIds = new Set(); // to avoid duplicate bubble for same player per session

// DOM elements
const animatedCounterSpan = document.getElementById('animatedCounter');
const playerCountDisplaySpan = document.getElementById('playerCountDisplay');

// Helper: Animate counter number with pop effect
function animateCounterNumber(newCount) {
  const el = animatedCounterSpan;
  if (!el) return;
  el.classList.add('counter-pop');
  el.innerText = newCount;
  setTimeout(() => el.classList.remove('counter-pop'), 280);
}

// BUBBLE BURST SYSTEM with name & emoji
function createBubbleWithBurst(playerName, avatarEmoji = '🎈') {
  const container = document.getElementById('bubbleContainer');
  if (!container) return;
  
  // Random position across screen width
  const leftPos = 20 + Math.random() * 70; // vw units
  const bubbleSize = 70 + Math.random() * 40;
  const durationSec = 1.6 + Math.random() * 0.8;
  
  const bubbleDiv = document.createElement('div');
  bubbleDiv.className = 'bubble';
  bubbleDiv.style.left = `${leftPos}%`;
  bubbleDiv.style.width = `${bubbleSize}px`;
  bubbleDiv.style.height = `${bubbleSize}px`;
  bubbleDiv.style.fontSize = `${Math.max(18, bubbleSize * 0.32)}px`;
  bubbleDiv.style.animationDuration = `${durationSec}s`;
  // content: emoji + short name
  const displayName = playerName.length > 12 ? playerName.slice(0, 10) + '..' : playerName;
  bubbleDiv.innerHTML = `${avatarEmoji} ${displayName}`;
  container.appendChild(bubbleDiv);
  
  // Play pop sound on creation (bubble rise sound)
  playPopSound();
  
  // Wait for bubble to finish rising, then burst effect & remove
  setTimeout(() => {
    if (bubbleDiv && bubbleDiv.parentNode) {
      // Create burst particles at bubble position
      const rect = bubbleDiv.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      for (let i = 0; i < 12; i++) {
        const particle = document.createElement('div');
        particle.className = 'burst-particle';
        const angle = (i / 12) * Math.PI * 2 + Math.random();
        const speed = 50 + Math.random() * 70;
        const tx = Math.cos(angle) * speed;
        const ty = Math.sin(angle) * speed - 40;
        particle.style.left = `${centerX}px`;
        particle.style.top = `${centerY}px`;
        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);
        particle.style.background = `radial-gradient(circle, ${['#fbbf24','#f59e0b','#34d399','#60a5fa'][Math.floor(Math.random()*4)]}, #ec4899)`;
        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 800);
      }
      bubbleDiv.remove();
    }
  }, durationSec * 950);
  
  // Also remove if not removed after timeout fallback
  setTimeout(() => { if(bubbleDiv && bubbleDiv.parentNode) bubbleDiv.remove(); }, durationSec * 1100);
}

// Show welcome bubble for new player with avatar
function onNewPlayerJoined(playerData) {
  if (!playerData || !playerData.name) return;
  const playerId = playerData.id || playerData.player_id;
  if (playerId && processedPlayerIds.has(playerId)) return;
  if (playerId) processedPlayerIds.add(playerId);
  const emoji = playerData.avatar_emoji || playerData.avatar_color || '🎉';
  const name = playerData.name || 'Mystery Player';
  createBubbleWithBurst(name, emoji);
}

// Poll players and detect new ones (diff logic to show bubble on join)
let previousPlayerList = new Map(); // id -> {name, emoji}

async function fetchAndDetectNewPlayers() {
  if (!SESSION_ID) return;
  const { data: players, error } = await sb
    .from('players')
    .select('id, name, avatar_color, avatar_emoji, is_eliminated')
    .eq('session_id', SESSION_ID)
    .eq('is_eliminated', false);
  if (error || !players) return;
  
  const currentCount = players.length;
  // update UI count
  if (playerCountDisplaySpan) playerCountDisplaySpan.innerText = currentCount;
  
  // Animate counter number if changed
  if (currentCount !== lastKnownPlayerCount) {
    animateCounterNumber(currentCount);
    lastKnownPlayerCount = currentCount;
  }
  
  // detect new players by ID
  const newPlayers = [];
  for (const p of players) {
    if (!previousPlayerList.has(p.id)) {
      newPlayers.push(p);
    }
  }
  
  // update map
  for (const p of players) {
    previousPlayerList.set(p.id, { name: p.name, emoji: p.avatar_emoji || p.avatar_color || '🧸' });
  }
  
  // For each new player → trigger bubble animation
  for (const np of newPlayers) {
    onNewPlayerJoined({
      id: np.id,
      name: np.name || 'Player',
      avatar_emoji: np.avatar_emoji || np.avatar_color || '🎈',
      avatar_color: np.avatar_color
    });
  }
}

// Real-time subscription to players table INSERT for instant bubble!
function setupRealtimePlayerInsert() {
  if (!SESSION_ID) return;
  const channel = sb.channel(`player-insert-${SESSION_ID}`);
  channel
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'players',
      filter: `session_id=eq.${SESSION_ID}`
    }, async (payload) => {
      const newPlayer = payload.new;
      if (newPlayer && !newPlayer.is_eliminated) {
        // fetch name if needed
        let displayName = newPlayer.name || 'Explorer';
        const avatarIcon = newPlayer.avatar_emoji || newPlayer.avatar_color || '🌟';
        onNewPlayerJoined({ id: newPlayer.id, name: displayName, avatar_emoji: avatarIcon });
        // update count will happen in polling, but also increment counter smoothly
        if (playerCountDisplaySpan) {
          const curr = parseInt(playerCountDisplaySpan.innerText) || 0;
          playerCountDisplaySpan.innerText = curr + 1;
          animateCounterNumber(curr + 1);
          lastKnownPlayerCount = curr + 1;
        }
        // also refresh previous list to avoid duplication
        previousPlayerList.set(newPlayer.id, { name: displayName, emoji: avatarIcon });
      }
    })
    .subscribe();
}

// Init session
async function init() {
  setInterval(updateFooterTime, 1000);
  const params = new URLSearchParams(window.location.search);
  let sid = params.get('session') || localStorage.getItem('paq_session_id');
  if (!sid) {
    const { data } = await sb.from('game_sessions').select('id,room_code').eq('status','waiting').order('created_at',{ascending:false}).limit(1);
    if (data?.[0]) sid = data[0].id;
  }
  if (!sid) { document.getElementById('roomCode').innerText = 'NO SESSION'; return; }
  SESSION_ID = sid;
  localStorage.setItem('paq_session_id', sid);
  await loadSessionInfo();
  await fetchAndDetectNewPlayers(); // initial sync
  setupRealtimePlayerInsert();
  startPlayerCountPolling(); // fallback polling for count consistency
  setupGameEvents();
}

async function loadSessionInfo() {
  const { data } = await sb.from('game_sessions').select('*').eq('id', SESSION_ID).single();
  if (data) {
    document.getElementById('roomCode').innerText = data.room_code;
    document.getElementById('waitingRoomCode').innerText = data.room_code;
    document.getElementById('footerStatus').innerText = data.status;
  }
}

function setupGameEvents() {
  sb.channel(`foh-events-${SESSION_ID}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'game_events', filter: `session_id=eq.${SESSION_ID}` }, p => handleEvent(p.new))
    .subscribe();
  sb.channel(`foh-session-update-${SESSION_ID}`)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_sessions', filter: `id=eq.${SESSION_ID}` }, p => {
      document.getElementById('footerStatus').innerText = p.new.status;
      if (p.new.status === 'ended') showScreen('ended');
      if (p.new.status === 'waiting') showScreen('waiting');
    })
    .subscribe();
}

function handleEvent(evt) {
  switch(evt.event_type) {
    case 'new_question': currentQuestion = evt.payload.question; totalTime = currentQuestion?.time_limit || 20; updateQProgress(evt.payload.qIdx, evt.payload.total); break;
    case 'show_question_view': displayQuestion(evt.payload.question || currentQuestion); showScreen('question'); startTimer(totalTime); break;
    case 'answer_reveal': revealAnswer(evt.payload.correctOption, evt.payload.options); break;
    case 'show_leaderboard': displayLeaderboard(evt.payload.leaders); showScreen('leaderboard'); break;
    case 'show_responses': displayResponseDist(evt.payload.distribution, evt.payload.totalPlayers); showScreen('responses'); break;
    case 'show_waiting_screen': showScreen('waiting'); break;
    case 'game_ended': stopTimer(); launchConfetti(); showScreen('ended'); break;
    case 'category_banner': showCategoryOverlay(evt.payload.icon, evt.payload.name); break;
  }
}

function displayQuestion(q) {
  if (!q) return;
  document.getElementById('qText').innerText = q.question_text;
  const letters = ['A','B','C','D'];
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = [q.option_a, q.option_b, q.option_c, q.option_d].map((opt, i) => `<div class="opt-item opt-${letters[i].toLowerCase()}"><div class="opt-letter">${letters[i]}</div><div>${opt}</div></div>`).join('');
}
function revealAnswer(correctIdx) {
  stopTimer();
  document.querySelectorAll('.opt-item').forEach((el,i) => { if(i===correctIdx) el.classList.add('correct'); else el.classList.add('wrong'); });
  const banner = document.getElementById('revealBanner');
  banner.innerHTML = `✅ Correct Answer: ${String.fromCharCode(65+correctIdx)}`;
  banner.classList.add('show'); setTimeout(()=>banner.classList.remove('show'),4000);
}
function displayLeaderboard(leaders) {
  const medals = ['🥇','🥈','🥉'];
  document.getElementById('lbList').innerHTML = (leaders||[]).slice(0,10).map((p,i)=>`<div class="lb-row"><div class="lb-rank-num">${medals[i]||`#${i+1}`}</div><div class="lb-name">${p.name}</div><div class="lb-pts">${p.score} pts</div></div>`).join('');
}
function displayResponseDist(dist, total) {
  if (!dist) dist = [0,0,0,0];
  const colors = ['#3b82f6','#8b5cf6','#f59e0b','#ec4899'];
  const letters = ['A','B','C','D'];
  const max = Math.max(...dist,1);
  document.getElementById('respBarsContainer').innerHTML = dist.map((c,i)=>`<div class="resp-bar-row"><div class="resp-ltr" style="background:${colors[i]}30">${letters[i]}</div><div class="resp-track"><div class="resp-fill" style="width:${(c/max)*100}%;background:${colors[i]}">${Math.round((c/(total||1))*100)}%</div></div><div class="resp-votes">${c}</div></div>`).join('');
}
function startTimer(dur) {
  stopTimer(); timeLeft = dur; totalTime = dur; updateTimerUI();
  timerInterval = setInterval(()=>{ timeLeft--; updateTimerUI(); if(timeLeft<=0) stopTimer(); },1000);
}
function stopTimer() { clearInterval(timerInterval); timerInterval=null; }
function updateTimerUI() {
  const circum = 263.9; const progress = timeLeft/totalTime; document.getElementById('timerRing').style.strokeDashoffset = circum*(1-progress);
  document.getElementById('timerNum').innerText = timeLeft;
}
function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(`screen-${id}`)?.classList.add('active'); }
function updateQProgress(idx,total) { document.getElementById('qProgressFill').style.width = `${((idx+1)/total)*100}%`; document.getElementById('qNumBadge').innerText = `Q${idx+1}/${total}`; }
function showCategoryOverlay(icon,name) { const ov=document.getElementById('catOverlay'); document.getElementById('catIconBig').innerText=icon||'🎯'; document.getElementById('catNameBig').innerText=name||'Category'; ov.classList.add('show'); setTimeout(()=>ov.classList.remove('show'),2500); }
function launchConfetti() { for(let i=0;i<80;i++){ const c=document.createElement('div'); c.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:-10px;background:${['#3b82f6','#10b981','#f59e0b'][Math.floor(Math.random()*3)]};width:8px;height:8px;animation:confettiFall 2s linear forwards;z-index:1000;`; document.body.appendChild(c); setTimeout(()=>c.remove(),2000); } }
function startPlayerCountPolling() { setInterval(fetchAndDetectNewPlayers, 4000); fetchAndDetectNewPlayers(); }
function updateFooterTime() { document.getElementById('footerTime').innerText = new Date().toLocaleTimeString(); }
init();
</script>
</body>
