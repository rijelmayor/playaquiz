<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayAQuiz — FOH Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05070f;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
    }
    /* Fullscreen layout */
    .foh-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    /* Header bar */
    .top-bar {
      background: rgba(10, 12, 21, 0.85);
      backdrop-filter: blur(20px);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
      z-index: 20;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo span { color: #3b82f6; }
    .room-badge {
      background: #1e293b;
      padding: 6px 18px;
      border-radius: 40px;
      font-family: monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }
    
    /* Main content area */
    .display-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* Base screen */
    .screen {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, transform 0.4s ease;
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }
    .screen.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
      z-index: 10;
    }
    /* Waiting Screen */
    .waiting-content {
      text-align: center;
      animation: fadeInUp 0.6s ease;
    }
    .waiting-icon {
      font-size: 80px;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 20px rgba(59,130,246,0.4));
    }
    .waiting-title {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .waiting-sub {
      font-size: 18px;
      color: #8b92a8;
    }
    /* Question Screen */
    .question-card {
      max-width: 800px;
      width: 90%;
      background: rgba(17, 19, 31, 0.9);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 48px;
      padding: 48px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      animation: scaleIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    .category-tag {
      display: inline-block;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.4);
      border-radius: 40px;
      padding: 6px 18px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .question-text {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 36px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }
    .option-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 18px 24px;
      font-size: 18px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.2s;
    }
    .option-letter {
      width: 40px;
      height: 40px;
      background: rgba(59,130,246,0.2);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
    }
    .option-item.correct {
      background: rgba(16,185,129,0.2);
      border-color: #10b981;
      box-shadow: 0 0 20px rgba(16,185,129,0.2);
    }
    .option-item.wrong {
      opacity: 0.4;
    }
    .timer-ring {
      position: absolute;
      top: 30px;
      right: 40px;
      width: 80px;
      height: 80px;
    }
    /* Leaderboard Screen */
    .leaderboard-card {
      background: rgba(17, 19, 31, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 48px;
      padding: 40px;
      min-width: 500px;
      max-width: 700px;
      width: 80%;
      border: 1px solid rgba(59,130,246,0.3);
      animation: slideUp 0.5s ease;
    }
    .leaderboard-title {
      font-size: 42px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 32px;
    }
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      background: rgba(255,255,255,0.03);
      border-radius: 20px;
      border-left: 4px solid #3b82f6;
    }
    .lb-rank {
      font-size: 24px;
      font-weight: 800;
      width: 50px;
    }
    .lb-name {
      flex: 1;
      font-size: 20px;
      font-weight: 600;
    }
    .lb-score {
      font-size: 28px;
      font-weight: 800;
      color: #f59e0b;
    }
    /* Response Distribution Screen */
    .response-card {
      background: rgba(17,19,31,0.95);
      backdrop-filter: blur(20px);
      border-radius: 48px;
      padding: 40px;
      max-width: 700px;
      width: 85%;
    }
    .response-bars {
      margin-top: 24px;
    }
    .resp-bar-item {
      margin-bottom: 20px;
    }
    .resp-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .bar-bg {
      background: #1e2432;
      border-radius: 20px;
      height: 32px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      font-weight: 700;
      transition: width 0.6s ease;
    }
    /* Category Banner (full screen splash) */
    .category-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
 backdrop-filter: blur(30px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    .category-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .category-banner {
      text-align: center;
      transform: scale(0.8);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .category-overlay.active .category-banner {
      transform: scale(1);
    }
    .category-icon {
      font-size: 100px;
      margin-bottom: 20px;
      animation: bounce 0.5s ease;
    }
    .category-name {
      font-size: 56px;
      font-weight: 900;
      background: linear-gradient(135deg, #fff, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* Eliminated Screen */
    .eliminated-card {
      text-align: center;
      background: rgba(220,38,38,0.1);
      border: 2px solid #dc2626;
      border-radius: 48px;
      padding: 48px 64px;
    }
    .eliminated-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    /* Bottom footer */
    .footer {
      padding: 12px 32px;
      text-align: center;
      font-size: 12px;
      color: #4a5568;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    @keyframes scaleIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeInUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .timer-number {
      position: absolute;
      top: 55px;
      right: 65px;
      font-size: 28px;
      font-weight: 800;
      font-family: monospace;
    }
  </style>
</head>
<body>
<div class="foh-container">
  <div class="top-bar">
    <div class="logo">PLAY<span>A</span>QUIZ</div>
    <div class="status-indicator">
      <div class="live-dot"></div>
      <span>LIVE</span>
    </div>
    <div class="room-badge" id="roomCodeDisplay">——</div>
  </div>
  
  <div class="display-area">
    <!-- WAITING SCREEN -->
    <div id="screen-waiting" class="screen active">
      <div class="waiting-content">
        <div class="waiting-icon">🎮</div>
        <div class="waiting-title">Ready to Play?</div>
        <div class="waiting-sub">Waiting for host to start the quiz...</div>
        <div style="margin-top: 32px;"><div class="room-badge" id="waitingRoomCode">——</div></div>
      </div>
    </div>
    
    <!-- QUESTION SCREEN -->
    <div id="screen-question" class="screen">
      <div class="question-card">
        <div class="category-tag" id="questionCategory">🌍 General</div>
        <div class="question-text" id="questionText">Loading...</div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="timer-ring">
          <svg width="80" height="80" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6"/>
            <circle id="timerCircle" cx="40" cy="40" r="34" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="0" transform="rotate(-90 40 40)"/>
          </svg>
          <div class="timer-number" id="timerNumber">0</div>
        </div>
      </div>
    </div>
    
    <!-- LEADERBOARD SCREEN -->
    <div id="screen-leaderboard" class="screen">
      <div class="leaderboard-card">
        <div class="leaderboard-title">🏆 LEADERBOARD</div>
        <div class="leaderboard-list" id="leaderboardList"></div>
      </div>
    </div>
    
    <!-- RESPONSE DISTRIBUTION SCREEN -->
    <div id="screen-responses" class="screen">
      <div class="response-card">
        <h2 style="text-align:center;margin-bottom:16px">📊 Response Distribution</h2>
        <div id="responseBarsContainer"></div>
      </div>
    </div>
    
    <!-- ELIMINATED SCREEN (special) -->
    <div id="screen-eliminated" class="screen">
      <div class="eliminated-card">
        <div class="eliminated-icon">⚡</div>
        <h2 style="font-size:36px;margin-bottom:12px">Player Eliminated!</h2>
        <p style="font-size:18px;color:#8b92a8">A player has been removed from the game</p>
      </div>
    </div>
    
    <!-- GAME END SCREEN -->
    <div id="screen-ended" class="screen">
      <div class="waiting-content">
        <div class="waiting-icon">🏁</div>
        <div class="waiting-title">Game Over!</div>
        <div class="waiting-sub">Thanks for playing. Quiz has ended.</div>
      </div>
    </div>
  </div>
  
  <div class="footer">
    <span>Powered by PlayAQuiz — FOH Display</span>
  </div>
</div>

<!-- CATEGORY OVERLAY (global) -->
<div id="categoryOverlay" class="category-overlay">
  <div class="category-banner">
    <div class="category-icon" id="catIcon">🎯</div>
    <div class="category-name" id="catName">Category</div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  let SESSION_ID = null;
  let currentQuestion = null;
  let timerInterval = null;
  let timeLeft = 0;
  let totalTime = 0;
  
  // Get session from URL or localStorage
  async function init() {
    // Try to get session from admin storage (or URL param)
    const urlParams = new URLSearchParams(window.location.search);
    let sessionId = urlParams.get('session');
    if (!sessionId) sessionId = localStorage.getItem('paq_session_id');
    if (sessionId) {
      SESSION_ID = sessionId;
    } else {
      // auto-fetch latest active session
      let { data } = await sb.from('game_sessions').select('id, room_code').order('created_at', { ascending: false }).limit(1);
      if (data && data[0]) SESSION_ID = data[0].id;
    }
    if (SESSION_ID) {
      localStorage.setItem('paq_session_id', SESSION_ID);
      await loadSessionInfo();
      setupRealtimeEvents();
      showScreen('waiting');
    } else {
      document.getElementById('roomCodeDisplay').innerText = 'NO SESSION';
    }
  }
  
  async function loadSessionInfo() {
    let { data } = await sb.from('game_sessions').select('*').eq('id', SESSION_ID).single();
    if (data) {
      document.getElementById('roomCodeDisplay').innerText = data.room_code;
      document.getElementById('waitingRoomCode').innerText = data.room_code;
    }
  }
  
  // Handle incoming events from admin
  function setupRealtimeEvents() {
    sb.channel('foh-events')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'game_events', filter: `session_id=eq.${SESSION_ID}` },
        (payload) => { handleEvent(payload.new); })
      .subscribe();
      
    // Also listen to session updates for game status
    sb.channel('foh-session')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_sessions', filter: `id=eq.${SESSION_ID}` },
        (payload) => { 
          if (payload.new.status === 'ended') showScreen('ended');
          if (payload.new.status === 'waiting') showScreen('waiting');
        })
      .subscribe();
  }
  
  function handleEvent(event) {
    console.log('FOH Event:', event.event_type, event.payload);
    switch(event.event_type) {
      case 'category_banner':
        showCategoryOverlay(event.payload.icon || '🎯', event.payload.name || 'Category');
        break;
      case 'new_question':
        // store question data
        currentQuestion = event.payload.question;
        totalTime = currentQuestion.time_limit || 20;
        break;
      case 'show_question_view':
        displayQuestion(currentQuestion);
        startTimer(totalTime);
        showScreen('question');
        break;
      case 'answer_reveal':
        revealAnswer(event.payload.correctOption, event.payload.options);
        break;
      case 'show_leaderboard':
        displayLeaderboard(event.payload.leaders);
        showScreen('leaderboard');
        break;
      case 'show_responses':
        displayResponseDistribution(event.payload.distribution, event.payload.totalPlayers, event.payload.correctIdx);
        showScreen('responses');
        break;
      case 'show_eliminated_screen':
        showScreen('eliminated');
        setTimeout(() => { if (document.getElementById('screen-eliminated').classList.contains('active')) showScreen('waiting'); }, 3000);
        break;
      case 'game_ended':
        showScreen('ended');
        break;
      case 'game_reset':
        resetDisplay();
        break;
      case 'player_eliminated':
        // brief eliminated flash
        showScreen('eliminated');
        setTimeout(() => { if (document.getElementById('screen-eliminated').classList.contains('active')) showScreen('waiting'); }, 2500);
        break;
    }
  }
  
  function displayQuestion(question) {
    if (!question) return;
    document.getElementById('questionText').innerHTML = question.question_text;
    // set category if any
    if (question.category_name) {
      document.getElementById('questionCategory').innerHTML = `${question.category_icon || '🎯'} ${question.category_name}`;
    } else {
      document.getElementById('questionCategory').innerHTML = '📋 Quiz Question';
    }
    const options = [question.option_a, question.option_b, question.option_c, question.option_d];
    const letters = ['A', 'B', 'C', 'D'];
    const grid = document.getElementById('optionsGrid');
    grid.innerHTML = '';
    options.forEach((opt, idx) => {
      const div = document.createElement('div');
      div.className = 'option-item';
      div.innerHTML = `<div class="option-letter">${letters[idx]}</div><div>${opt}</div>`;
      div.setAttribute('data-opt', idx);
      grid.appendChild(div);
    });
    // reset any reveal classes
    document.querySelectorAll('.option-item').forEach(el => {
      el.classList.remove('correct', 'wrong');
    });
  }
  
  function revealAnswer(correctIdx, optionsArray) {
    if (timerInterval) clearInterval(timerInterval);
    const letters = ['A', 'B', 'C', 'D'];
    document.querySelectorAll('.option-item').forEach((el, idx) => {
      if (idx === correctIdx) {
        el.classList.add('correct');
      } else {
        el.classList.add('wrong');
      }
    });
    // show correct answer highlight banner
    const correctLetter = letters[correctIdx];
    const correctText = optionsArray ? optionsArray[correctIdx] : '';
    const toast = document.createElement('div');
    toast.style.position = 'fixed';
    toast.style.bottom = '100px';
    toast.style.left = '50%';
    toast.style.transform = 'translateX(-50%)';
    toast.style.background = '#10b981';
    toast.style.color = 'white';
    toast.style.padding = '12px 28px';
    toast.style.borderRadius = '60px';
    toast.style.fontWeight = 'bold';
    toast.style.zIndex = '200';
    toast.style.fontSize = '20px';
    toast.innerHTML = `✅ Correct Answer: ${correctLetter} - ${correctText}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }
  
  function displayLeaderboard(leaders) {
    const container = document.getElementById('leaderboardList');
    if (!leaders || leaders.length === 0) {
      container.innerHTML = '<div style="text-align:center">No players yet</div>';
      return;
    }
    container.innerHTML = leaders.map((p, idx) => `
      <div class="lb-row">
        <div class="lb-rank">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx+1}`}</div>
        <div class="lb-name">${p.avatar_color || '👤'} ${p.name}</div>
        <div class="lb-score">${p.score} pts</div>
      </div>
    `).join('');
  }
  
  function displayResponseDistribution(distribution, totalPlayers, correctIdx) {
    const letters = ['A', 'B', 'C', 'D'];
    const colors = ['#3b82f6', '#8b5cf6', '#f59e0b', '#10b981'];
    const container = document.getElementById('responseBarsContainer');
    if (!distribution) distribution = [0,0,0,0];
    const maxCount = Math.max(...distribution, 1);
    container.innerHTML = distribution.map((count, idx) => {
      const percent = totalPlayers > 0 ? Math.round((count / totalPlayers) * 100) : 0;
      const isCorrect = (idx === correctIdx);
      return `
        <div class="resp-bar-item">
          <div class="resp-label">
            <span><strong style="background:${colors[idx]}20;padding:4px 12px;border-radius:20px">${letters[idx]}</strong></span>
            <span>${count} votes (${percent}%) ${isCorrect ? '✓ CORRECT' : ''}</span>
          </div>
          <div class="bar-bg">
            <div class="bar-fill" style="width:${percent}%; background:${colors[idx]};"></div>
          </div>
        </div>
      `;
    }).join('');
  }
  
  function startTimer(duration) {
    if (timerInterval) clearInterval(timerInterval);
    timeLeft = duration;
    totalTime = duration;
    updateTimerUI();
    timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        updateTimerUI();
      } else {
        clearInterval(timerInterval);
      }
    }, 1000);
  }
  
  function updateTimerUI() {
    const circle = document.getElementById('timerCircle');
    const timerNum = document.getElementById('timerNumber');
    if (!circle) return;
    const circumference = 2 * Math.PI * 34; // ~213.6
    const progress = timeLeft / totalTime;
    const dashoffset = circumference * (1 - progress);
    circle.style.strokeDashoffset = dashoffset;
    timerNum.innerText = timeLeft;
    // change color based on urgency
    if (timeLeft <= 5) circle.style.stroke = '#ef4444';
    else if (timeLeft <= 10) circle.style.stroke = '#f59e0b';
    else circle.style.stroke = '#3b82f6';
  }
  
  async function showCategoryOverlay(icon, name) {
    const overlay = document.getElementById('categoryOverlay');
    document.getElementById('catIcon').innerHTML = icon || '🎯';
    document.getElementById('catName').innerHTML = name || 'Get Ready';
    overlay.classList.add('active');
    setTimeout(() => {
      overlay.classList.remove('active');
    }, 2800);
  }
  
  function showScreen(screenId) {
    const screens = ['waiting', 'question', 'leaderboard', 'responses', 'eliminated', 'ended'];
    screens.forEach(id => {
      const el = document.getElementById(`screen-${id}`);
      if (el) el.classList.remove('active');
    });
    const activeScreen = document.getElementById(`screen-${screenId}`);
    if (activeScreen) activeScreen.classList.add('active');
  }
  
  function resetDisplay() {
    if (timerInterval) clearInterval(timerInterval);
    showScreen('waiting');
    currentQuestion = null;
    document.getElementById('optionsGrid').innerHTML = '';
  }
  
  // Start
  init();
</script>
</body>
</html>
