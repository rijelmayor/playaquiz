<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PlayAQuiz · Live Display | Persistent Bubbles & Live Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --bg: #0a0c15;
      --surface: rgba(16, 20, 38, 0.96);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.5);
      --green: #10b981;
      --yellow: #fbbf24;
      --red: #ef4444;
      --purple: #a855f7;
      --pink: #ec4899;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.55);
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 30% 40%, #1a1f35 0%, #070a14 90%);
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
    }

    /* animated background mesh */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(59,130,246,0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(168,85,247,0.07) 0%, transparent 45%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 12px);
      pointer-events: none;
      z-index: 0;
      animation: slowDrift 25s infinite alternate ease-in-out;
    }

    @keyframes slowDrift {
      0% { opacity: 0.7; transform: scale(1) translate(0, 0); }
      100% { opacity: 1; transform: scale(1.05) translate(-2%, 1%); }
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.2) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .foh {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 5;
      backdrop-filter: blur(2px);
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 32px;
      background: rgba(6, 8, 18, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 2px solid rgba(59, 130, 246, 0.25);
      z-index: 30;
      flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 34px;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #ffffff, #8bb5fe);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(59,130,246,0.5));
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.45);
      padding: 6px 20px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 13px;
      color: #10b981;
      letter-spacing: 0.5px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
      box-shadow: 0 0 12px #10b981;
    }

    @keyframes pulse { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.6; transform:scale(0.9);} }

    .room-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.7);
      padding: 6px 22px;
      border-radius: 32px;
      letter-spacing: 3px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }

    .player-counter-area {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(0, 0, 0, 0.55);
      padding: 5px 22px;
      border-radius: 60px;
      border: 1px solid #3b82f6;
      box-shadow: 0 0 18px rgba(59,130,246,0.3);
    }

    .counter-icon { font-size: 24px; filter: drop-shadow(0 0 5px #3b82f6); }
    
    .counter-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #facc15, #10b981);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      transition: transform 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
      display: inline-block;
    }

    .counter-pop { transform: scale(1.25); text-shadow: 0 0 12px #facc15; }

    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .center-stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* RIGHT LIVE LEADERBOARD PANEL */
    .live-leaderboard-panel {
      width: 330px;
      background: rgba(6, 8, 18, 0.8);
      backdrop-filter: blur(24px);
      border-left: 2px solid rgba(59, 130, 246, 0.25);
      display: flex;
      flex-direction: column;
      z-index: 20;
      flex-shrink: 0;
    }

    .live-lb-header {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(139,92,246,0.05));
    }

    .live-lb-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-lb-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }

    .live-lb-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      scrollbar-width: thin;
    }

    .live-lb-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.02);
      border-radius: 18px;
      transition: all 0.2s;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .live-lb-item:hover { background: rgba(59,130,246,0.12); transform: translateX(-3px); }

    .live-lb-rank { width: 34px; font-size: 22px; font-weight: 800; text-align: center; }
    .live-lb-avatar { font-size: 34px; }
    .live-lb-info { flex: 1; overflow: hidden; }
    .live-lb-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live-lb-score { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 20px; color: var(--yellow); }

    /* FLOATING BUBBLES */
    .floating-bubbles {
      position: fixed;
      bottom: 24px;
      left: 24px;
      right: 360px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      z-index: 120;
      pointer-events: none;
      max-height: 180px;
      overflow-y: auto;
    }

    .persistent-bubble {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.85), rgba(139, 92, 246, 0.75));
      backdrop-filter: blur(12px);
      border-radius: 50px;
      padding: 6px 18px 6px 10px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      animation: bubbleFloatIn 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
      pointer-events: auto;
    }

    @keyframes bubbleFloatIn {
      from { opacity: 0; transform: scale(0.7) translateY(25px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ── SPLIT SCREEN (question + responses side by side) ── */
    .split-view {
      display: flex;
      width: 100%;
      height: 100%;
      gap: 24px;
      padding: 24px;
      align-items: center;
      justify-content: center;
    }

    .question-panel {
      flex: 1 1 50%;
      background: rgba(12, 16, 30, 0.75);
      backdrop-filter: blur(20px);
      border-radius: 36px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 25px 50px -10px rgba(0,0,0,0.6);
      height: fit-content;
      max-height: 90%;
      overflow-y: auto;
    }

    .responses-panel {
      flex: 1 1 50%;
      background: rgba(6, 8, 20, 0.8);
      backdrop-filter: blur(22px);
      border-radius: 36px;
      border: 1px solid rgba(59,130,246,0.25);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.5);
      animation: slideInRight 0.45s cubic-bezier(0.23, 1, 0.32, 1);
      height: fit-content;
      max-height: 90%;
      overflow-y: auto;
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .responses-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff, #93c5fd);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .resp-bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .resp-ltr {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      background: rgba(255,255,255,0.08);
    }
    .resp-track {
      flex: 1;
      height: 44px;
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      overflow: hidden;
    }
    .resp-fill {
      height: 100%;
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: 700;
      transition: width 0.7s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .timer-container { width: 100px; height: 100px; }
    .timer-ring { fill: none; stroke: var(--accent); stroke-width: 7; }
    .timer-num { font-family: 'JetBrains Mono', monospace; font-size: 32px; }

    .q-text {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.4;
      text-align: center;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .opt-item {
      background: rgba(255,255,255,0.04);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 14px 18px;
      display: flex;
      gap: 14px;
      font-weight: 600;
      align-items: center;
    }

    .opt-letter {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: rgba(59,130,246,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 24px;
    }

    .opt-item.correct { border-color: #10b981; background: rgba(16,185,129,0.2); }
    .opt-item.wrong { opacity: 0.35; }

    .footer {
      padding: 8px 28px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      border-top: 1px solid #1e293b;
      background: rgba(0,0,0,0.6);
      z-index: 25;
    }
  </style>
</head>
<body>
<div class="foh">
  <div class="top-bar">
    <div class="logo">PLAY<span style="color:var(--accent)">A</span>QUIZ</div>
    <div class="live-badge"><div class="live-dot"></div> LIVE</div>
    <div style="display: flex; gap: 24px; align-items: center;">
      <div class="player-counter-area">
        <span class="counter-icon">🎮</span>
        <span class="counter-number" id="animatedCounter">0</span>
        <span style="font-size:14px; color:#a0aec0;">PLAYERS</span>
      </div>
      <div class="room-badge" id="roomCode">——</div>
    </div>
  </div>
  <div class="q-progress-bar" style="height:4px; background:#1e293b;"><div id="qProgressFill" style="height:100%; width:0%; background:linear-gradient(90deg,#3b82f6,#a855f7);"></div></div>

  <div class="main-layout">
    <div class="center-stage" id="centerStage">
      <!-- Dynamic split view injected here -->
    </div>

    <div class="live-leaderboard-panel">
      <div class="live-lb-header">
        <div class="live-lb-title"><span>🏆</span> RANKINGS</div>
        <div class="live-lb-sub">Real-time leaderboard</div>
      </div>
      <div class="live-lb-list" id="liveLeaderboardList"></div>
    </div>
  </div>

  <div class="floating-bubbles" id="floatingBubbles"></div>
  <div class="footer"><span>PlayAQuiz ARCADE</span><span id="footerStatus">waiting</span><span id="footerTime"></span></div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let SESSION_ID = null;
let currentQuestion = null;
let timerInterval = null;
let timeLeft = 0, totalTime = 0;
let lastKnownPlayerCount = 0;
let gameActive = false;
let realtimeChannels = [];
let currentPlayers = new Map();

const centerStage = document.getElementById('centerStage');
const animatedCounter = document.getElementById('animatedCounter');
const floatingBubbles = document.getElementById('floatingBubbles');
const liveLeaderboardList = document.getElementById('liveLeaderboardList');

function animateCounterNumber(count) {
  if (!animatedCounter) return;
  animatedCounter.classList.add('counter-pop');
  animatedCounter.innerText = count;
  setTimeout(() => animatedCounter.classList.remove('counter-pop'), 250);
}

function escapeHtml(str) { return String(str || '').replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]||m); }

function addPersistentBubble(id, name, avatar, score=0) {
  if (!floatingBubbles || document.getElementById(`bubble-${id}`) || gameActive) return;
  const bubble = document.createElement('div');
  bubble.className = 'persistent-bubble new-player';
  bubble.id = `bubble-${id}`;
  bubble.innerHTML = `<span style="font-size:30px;">${avatar||'🎮'}</span><span style="font-weight:700;">${escapeHtml(name)}</span><span style="background:#00000040;padding:2px 10px;border-radius:20px;">${score}pts</span>`;
  floatingBubbles.appendChild(bubble);
}

function updateLiveLeaderboard() {
  if (!liveLeaderboardList) return;
  const players = Array.from(currentPlayers.values()).filter(p => !p.is_eliminated).sort((a,b) => b.score - a.score);
  liveLeaderboardList.innerHTML = players.length ? players.map((p,i) => `
    <div class="live-lb-item">
      <div class="live-lb-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
      <div class="live-lb-avatar">${p.avatar||'🎮'}</div>
      <div class="live-lb-info"><div class="live-lb-name">${escapeHtml(p.name)}</div></div>
      <div class="live-lb-score">${p.score}</div>
    </div>`).join('') : '<div style="padding:30px;color:var(--muted);">Waiting...</div>';
}

async function syncPlayers() {
  if (!SESSION_ID) return;
  const { data: players } = await sb.from('players').select('id,name,avatar_emoji,score,correct_count,is_eliminated').eq('session_id', SESSION_ID);
  if (!players) return;
  players.forEach(p => {
    const emoji = p.avatar_emoji || '🎮';
    if (!currentPlayers.has(p.id)) { if(!gameActive) addPersistentBubble(p.id, p.name, emoji, p.score); }
    currentPlayers.set(p.id, { name: p.name, avatar: emoji, score: p.score||0, correct_count: p.correct_count||0, is_eliminated: p.is_eliminated||false });
  });
  animateCounterNumber(currentPlayers.size);
  updateLiveLeaderboard();
}

function setupRealtimePlayers() {
  if (!SESSION_ID) return;
  realtimeChannels.forEach(c => { try { sb.removeChannel(c); } catch(e) {} });
  realtimeChannels = [];
  const insertCh = sb.channel(`pl-insert-${SESSION_ID}`).on('postgres_changes', {event:'INSERT', schema:'public', table:'players', filter:`session_id=eq.${SESSION_ID}`}, payload => {
    if (payload.new && !payload.new.is_eliminated) { syncPlayers(); }
  }).subscribe();
  realtimeChannels.push(insertCh);
  const updateCh = sb.channel(`pl-update-${SESSION_ID}`).on('postgres_changes', {event:'UPDATE', schema:'public', table:'players', filter:`session_id=eq.${SESSION_ID}`}, payload => {
    if (payload.new) { const p = payload.new; currentPlayers.set(p.id, {...currentPlayers.get(p.id), score:p.score, is_eliminated:p.is_eliminated}); updateLiveLeaderboard(); }
  }).subscribe();
  realtimeChannels.push(updateCh);
}

function renderSplitView(questionData, distribution, totalPlayers, correctIdx, options) {
  if (!centerStage) return;
  const dist = distribution || [0,0,0,0];
  const letters = ['A','B','C','D'];
  const colors = ['#3b82f6','#8b5cf6','#f59e0b','#ec4899'];
  const maxCount = Math.max(...dist, 1);
  
  centerStage.innerHTML = `
    <div class="split-view">
      <div class="question-panel">
        <div style="display:flex; justify-content:space-between;">
          <span style="background:rgba(255,255,255,0.1); padding:6px 18px; border-radius:20px;">Q${questionData?.index||''}</span>
          <div class="timer-container"><svg width="100" height="100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="7"/><circle id="timerRing" cx="50" cy="50" r="42" fill="none" stroke="var(--accent)" stroke-width="7" stroke-dasharray="263.9" stroke-dashoffset="0"/></svg><div class="timer-num" id="timerNum">0</div></div>
        </div>
        <div class="q-text">${escapeHtml(questionData?.question_text||'')}</div>
        <div class="options-grid">${(options||['','','','']).map((opt,i) => `
          <div class="opt-item ${correctIdx===i?'correct':(correctIdx!==null&&correctIdx!==undefined?'wrong':'')}">
            <div class="opt-letter">${letters[i]}</div><div>${escapeHtml(opt)}</div>
          </div>`).join('')}</div>
      </div>
      <div class="responses-panel">
        <div class="responses-title"><span>📊</span> LIVE RESPONSES</div>
        ${dist.map((count,i) => {
          const pct = totalPlayers>0 ? Math.round((count/totalPlayers)*100) : 0;
          return `<div class="resp-bar-row">
            <div class="resp-ltr" style="color:${colors[i]}">${letters[i]}</div>
            <div class="resp-track"><div class="resp-fill" style="width:${(count/maxCount)*100}%; background:${correctIdx===i?'var(--green)':colors[i]}"><span style="margin-right:8px;">${pct}%</span></div></div>
            <span style="font-weight:700;">${count}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function handleEvent(evt) {
  if (evt.event_type === 'show_question_view' && evt.payload?.question) {
    currentQuestion = evt.payload.question;
    totalTime = currentQuestion.time_limit || 20;
    renderSplitView(currentQuestion, [0,0,0,0], 0, null, [currentQuestion.option_a,currentQuestion.option_b,currentQuestion.option_c,currentQuestion.option_d]);
  }
  else if (evt.event_type === 'answer_reveal' || evt.event_type === 'show_responses') {
    if (currentQuestion) {
      sb.from('answers').select('chosen_option').eq('session_id',SESSION_ID).eq('question_id',currentQuestion.id).then(({data:ans})=>{
        const dist=[0,0,0,0]; ans?.forEach(a=>{if(a.chosen_option>=0&&a.chosen_option<4)dist[a.chosen_option]++;});
        const correctIdx = evt.payload?.correctOption ?? evt.payload?.correctIdx;
        renderSplitView(currentQuestion, dist, currentPlayers.size, correctIdx, [currentQuestion.option_a,currentQuestion.option_b,currentQuestion.option_c,currentQuestion.option_d]);
      });
    }
  }
}

function setupGameEvents() {
  const ch = sb.channel(`foh-events-${SESSION_ID}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'game_events',filter:`session_id=eq.${SESSION_ID}`},p=>handleEvent(p.new)).subscribe();
  realtimeChannels.push(ch);
}

async function init() {
  setInterval(()=>{ document.getElementById('footerTime').innerText = new Date().toLocaleTimeString(); },1000);
  const params = new URLSearchParams(window.location.search);
  let sid = params.get('session') || localStorage.getItem('paq_session_id');
  if(!sid) { const {data}=await sb.from('game_sessions').select('id').eq('status','waiting').limit(1); if(data?.[0]) sid=data[0].id; }
  if(!sid) return;
  SESSION_ID=sid; localStorage.setItem('paq_session_id',sid);
  const {data:session}=await sb.from('game_sessions').select('*').eq('id',SESSION_ID).single();
  if(session){ document.getElementById('roomCode').innerText=session.room_code; document.getElementById('footerStatus').innerText=session.status; }
  await syncPlayers();
  setupRealtimePlayers();
  setupGameEvents();
  setInterval(syncPlayers, 4000);
}

init();
</script>
</body>
</html>
