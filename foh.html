<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayAQuiz — Front of House (Category FX)</title>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700;800;900&family=Cabinet+Grotesk:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#030308;--accent:#00f0ff;--v:#7c3aed;--amber:#f59e0b;--rose:#f43f5e;
  --green:#10b981;--text:#fff;--muted:rgba(255,255,255,0.4);
  --font-d:'Clash Display',sans-serif;--font-b:'Cabinet Grotesk',sans-serif;--font-m:'JetBrains Mono',monospace;
}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-b)}
#bg{position:fixed;inset:0;z-index:0}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,240,255,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,0.018) 1px,transparent 1px);background-size:56px 56px}
.orb{position:fixed;border-radius:50%;filter:blur(130px);opacity:0.07;pointer-events:none;z-index:0;animation:od 14s ease-in-out infinite alternate}
.o1{width:700px;height:700px;background:var(--accent);top:-200px;left:20%}
.o2{width:600px;height:600px;background:var(--v);bottom:-200px;right:-100px}
@keyframes od{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,40px) scale(1.1)}}
.foh{position:relative;z-index:10;height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 44px;border-bottom:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.35);backdrop-filter:blur(24px)}
.hdr-logo{font-family:var(--font-d);font-size:24px;font-weight:800;letter-spacing:-0.5px}
.hdr-logo em{color:var(--accent);font-style:normal}
.hdr-cat{font-size:14px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.hdr-cat span{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:99px;padding:4px 14px}
.hdr-right{display:flex;align-items:center;gap:16px}
.player-pill{display:flex;align-items:center;gap:8px;padding:6px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);border-radius:99px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 8px var(--green)}50%{opacity:0.2;box-shadow:none}}
.player-txt{font-size:13px;font-family:var(--font-m)}
.room-badge{padding:6px 18px;background:rgba(0,240,255,0.08);border:1px solid rgba(0,240,255,0.22);border-radius:99px;font-size:14px;font-family:var(--font-m);font-weight:700;color:var(--accent)}
.center{position:relative;overflow:hidden}
.phase{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity 0.7s ease,transform 0.7s ease}
.phase.out{opacity:0;pointer-events:none;transform:scale(0.95)}

/* ── CATEGORY BANNER (full screen splash) ── */
.category-overlay{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(20px);
  opacity:0;
  visibility:hidden;
  transition:opacity 0.4s ease, visibility 0.4s;
}
.category-overlay.active{
  opacity:1;
  visibility:visible;
}
.category-card{
  text-align:center;
  transform:scale(0.8) translateY(30px);
  transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
  padding:48px 72px;
  border-radius:48px;
  background:rgba(0,0,0,0.6);
  border:2px solid var(--cat-color, var(--accent));
  box-shadow:0 0 80px rgba(0,240,255,0.2);
}
.category-overlay.active .category-card{
  transform:scale(1) translateY(0);
}
.category-icon{
  font-size:80px;
  margin-bottom:16px;
  animation:catBounce 0.6s ease;
}
.category-name{
  font-family:var(--font-d);
  font-size:52px;
  font-weight:900;
  letter-spacing:-2px;
  background:linear-gradient(135deg, var(--cat-color, #fff), var(--cat-color-light, var(--accent)));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin-bottom:8px;
}
.category-sub{
  font-size:16px;
  color:var(--muted);
  font-family:var(--font-m);
  letter-spacing:3px;
}
@keyframes catBounce{
  0%{transform:scale(0) rotate(-10deg);opacity:0}
  50%{transform:scale(1.2) rotate(2deg)}
  100%{transform:scale(1) rotate(0)}
}

/* ── QUESTION SCENE ── */
.q-scene{width:100%;height:100%;display:flex;flex-direction:column;padding:36px 56px;gap:22px}
.q-topbar{display:flex;align-items:center;gap:18px}
.q-badge{padding:8px 20px;background:rgba(124,58,237,0.18);border:1px solid rgba(124,58,237,0.28);border-radius:99px;font-size:14px;font-weight:700;color:#c4b5fd;font-family:var(--font-m)}
.q-prog-track{flex:1;height:6px;background:rgba(255,255,255,0.07);border-radius:99px;overflow:hidden}
.q-prog-bar{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--v),var(--accent));transition:width 0.5s}
.q-timer-wrap{width:72px;height:72px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.q-timer-wrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.q-timer-n{font-family:var(--font-d);font-size:24px;font-weight:900;position:relative;z-index:1}
.q-text{font-family:var(--font-d);font-size:clamp(26px,3.8vw,52px);font-weight:800;line-height:1.18;letter-spacing:-0.5px;flex:1;display:flex;align-items:center}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.q-opt{display:flex;align-items:center;gap:14px;padding:20px 26px;border-radius:18px;border:1.5px solid rgba(255,255,255,0.09);font-size:clamp(14px,1.8vw,22px);font-weight:700;transition:all 0.4s;animation:oa 0.5s cubic-bezier(.34,1.56,.64,1) backwards}
.q-opt:nth-child(1){animation-delay:.1s;background:rgba(0,240,255,0.05)}
.q-opt:nth-child(2){animation-delay:.2s;background:rgba(124,58,237,0.05)}
.q-opt:nth-child(3){animation-delay:.3s;background:rgba(245,158,11,0.05)}
.q-opt:nth-child(4){animation-delay:.4s;background:rgba(16,185,129,0.05)}
@keyframes oa{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
.q-opt.revealed.correct{background:rgba(16,185,129,0.25);border-color:var(--green);box-shadow:0 0 40px rgba(16,185,129,0.2)}
.q-opt.revealed.wrong{background:rgba(255,255,255,0.02);border-color:rgba(255,255,255,0.04);opacity:0.35}
.opt-letter{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;font-family:var(--font-m)}
.q-opt:nth-child(1) .opt-letter{background:rgba(0,240,255,0.2);color:var(--accent)}
.q-opt:nth-child(2) .opt-letter{background:rgba(124,58,237,0.2);color:#c4b5fd}
.q-opt:nth-child(3) .opt-letter{background:rgba(245,158,11,0.2);color:var(--amber)}
.q-opt:nth-child(4) .opt-letter{background:rgba(16,185,129,0.2);color:var(--green)}
.resp-section{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.resp-row{display:flex;align-items:center;gap:12px}
.resp-lbl{font-size:13px;font-family:var(--font-m);width:22px;color:var(--muted)}
.resp-track{flex:1;height:10px;background:rgba(255,255,255,0.06);border-radius:99px;overflow:hidden}
.resp-bar{height:10px;border-radius:99px;transition:width 0.8s cubic-bezier(.4,0,.2,1)}
.resp-cnt{font-size:12px;font-family:var(--font-m);color:var(--muted);min-width:26px;text-align:right}
.resp-progress-pill{position:absolute;top:16px;right:44px;display:none;align-items:center;gap:10px;padding:6px 18px;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.25);border-radius:99px;z-index:20}
.resp-progress-pill.visible{display:flex}
.rpill-bar{width:80px;height:5px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden}
.rpill-fill{height:5px;background:var(--green);border-radius:99px}
.rpill-txt{font-size:13px;font-family:var(--font-m);font-weight:700;color:var(--green)}
.timeup-banner{display:none;align-items:center;justify-content:center;gap:14px;padding:12px;background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.25);border-radius:14px;font-size:16px;font-weight:700;color:var(--rose);margin-top:12px}
.timeup-banner.show{display:flex;animation:popIn 0.4s}
@keyframes popIn{from{transform:scale(0.85);opacity:0}to{transform:scale(1);opacity:1}}
.lb-scene{width:100%;height:100%;display:flex;flex-direction:column;padding:40px 60px}
.lb-title{font-family:var(--font-d);font-size:clamp(36px,5vw,62px);font-weight:900;margin-bottom:32px}
.lb-title em{color:var(--amber);font-style:normal}
.lb-list{display:flex;flex-direction:column;gap:10px;flex:1}
.lb-row{display:flex;align-items:center;gap:18px;padding:16px 24px;border-radius:18px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);animation:lr 0.5s backwards}
.lb-row.r1{background:rgba(245,158,11,0.07);border-color:rgba(245,158,11,0.22)}
.lb-rank{font-size:26px;font-weight:900;width:38px;text-align:center}
.lb-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.lb-name{flex:1;font-family:var(--font-d);font-size:clamp(18px,2.2vw,28px);font-weight:800}
.lb-score{font-family:var(--font-d);font-size:clamp(22px,2.8vw,34px);font-weight:900}
.lb-score.gold{color:var(--amber)}
.result-scene{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.r-trophy{font-size:80px;animation:bounce 1s infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-22px)}}
.r-headline{font-family:var(--font-d);font-size:clamp(52px,7vw,90px);font-weight:900;margin:18px 0 8px}
.r-winner{font-family:var(--font-d);font-size:clamp(28px,3.5vw,48px);color:var(--amber);font-weight:800}
.r-score{font-family:var(--font-d);font-size:clamp(68px,9vw,110px);font-weight:900;color:var(--accent);line-height:1}
.ftr{padding:13px 44px;border-top:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.35);backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:space-between}
.ftr-tip{font-size:13px;color:var(--muted);font-family:var(--font-m)}
.ftr-brand em{color:var(--accent);font-style:normal}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="grid"></div>
<div class="orb o1"></div><div class="orb o2"></div>

<!-- CATEGORY REVEAL OVERLAY -->
<div id="categoryOverlay" class="category-overlay">
  <div class="category-card">
    <div class="category-icon" id="catIcon">🎯</div>
    <div class="category-name" id="catName">General Knowledge</div>
    <div class="category-sub" id="catSub">GET READY</div>
  </div>
</div>

<div class="foh">
  <div class="hdr">
    <div class="hdr-logo">Play<em>A</em>Quiz</div>
    <div class="hdr-cat"><span id="hdr-cat">🎯 General</span></div>
    <div class="hdr-right">
      <div class="player-pill"><div class="live-dot"></div><span class="player-txt"><span id="hdr-player-count">0</span> players</span></div>
      <div class="room-badge" id="hdr-room">——</div>
    </div>
  </div>
  <div class="center">
    <div class="resp-progress-pill" id="resp-pill"><div class="rpill-bar"><div class="rpill-fill" id="rpill-fill"></div></div><span class="rpill-txt" id="rpill-txt">0%</span></div>
    
    <!-- WAITING -->
    <div class="phase" id="phase-waiting">
      <div style="text-align:center"><div style="font-family:var(--font-d);font-size:clamp(52px,7vw,90px);font-weight:900">Get Ready</div><div class="room-badge" style="font-size:32px;margin-top:20px" id="wait-room-code">——</div><div style="margin-top:20px;color:var(--muted)">Join with code above</div></div>
    </div>
    
    <!-- QUESTION -->
    <div class="phase out" id="phase-question">
      <div class="q-scene">
        <div class="q-topbar">
          <div class="q-badge" id="q-badge">Q 1 / 8</div>
          <div class="q-prog-track"><div class="q-prog-bar" id="q-prog-bar" style="width:0%"></div></div>
          <div class="q-timer-wrap"><svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="31" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5"/><circle id="q-timer-ring" cx="36" cy="36" r="31" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="195" stroke-dashoffset="0"/></svg><div class="q-timer-n" id="q-timer-n">15</div></div>
        </div>
        <div class="q-text" id="q-text">Question text</div>
        <div class="q-opts" id="q-opts"></div>
        <div class="timeup-banner" id="timeup-banner">⏱ Time's Up! — Waiting for host...</div>
        <div class="resp-section" id="resp-section" style="display:none"><div id="resp-bars"></div></div>
      </div>
    </div>
    
    <!-- LEADERBOARD -->
    <div class="phase out" id="phase-leaderboard"><div class="lb-scene"><div class="lb-title">🏆 <em>Leaderboard</em></div><div class="lb-list" id="lb-list"></div></div></div>
    
    <!-- RESULT -->
    <div class="phase out" id="phase-result"><div class="result-scene"><div class="r-trophy">🏆</div><div class="r-headline">Quiz Complete!</div><div class="r-winner" id="r-winner">—</div><div class="r-score" id="r-score">0 pts</div></div></div>
  </div>
  <div class="ftr"><div class="ftr-tip" id="ftr-tip">Waiting for players...</div><div class="ftr-brand">Powered by <em>PlayAQuiz.xyz</em></div></div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let SESSION_ID = null, sessionData = null, questions = [], players = [], answers = {}, categories = [];
let currentQ = null, timerInterval = null, timeLeft = 0, answerRevealedFlag = false;
let pendingQuestionAfterCategory = null;
let categoryOverlayActive = false;

async function init() {
  SESSION_ID = localStorage.getItem('paq_session_id');
  if(!SESSION_ID) { document.getElementById('ftr-tip').textContent = 'No session — open admin first'; return; }
  const {data} = await sb.from('game_sessions').select('*').eq('id',SESSION_ID).maybeSingle();
  sessionData = data; if(!sessionData) return;
  await loadAll();
  updateHeader();
  syncPhase();
  setupRealtime();
}
async function loadAll(){
  const [qRes, pRes, aRes, cRes] = await Promise.all([sb.from('questions').select('*').eq('session_id',SESSION_ID).order('sort_order'),sb.from('players').select('*').eq('session_id',SESSION_ID),sb.from('answers').select('*').eq('session_id',SESSION_ID),sb.from('categories').select('*')]);
  questions = qRes.data||[]; players = pRes.data||[]; categories = cRes.data||[];
  answers={}; (aRes.data||[]).forEach(a=>{ if(!answers[a.question_id]) answers[a.question_id]={}; answers[a.question_id][a.player_id]=a; });
}
async function reloadPlayers(){ const {data}=await sb.from('players').select('*').eq('session_id',SESSION_ID); players=data||[]; updateHeader(); }
async function reloadAnswers(){ const {data}=await sb.from('answers').select('*').eq('session_id',SESSION_ID); answers={}; data?.forEach(a=>{ if(!answers[a.question_id]) answers[a.question_id]={}; answers[a.question_id][a.player_id]=a; }); updateRespProgress(); }
function setupRealtime(){
  sb.channel('foh').on('postgres_changes',{event:'*',schema:'public',table:'game_sessions',filter:`id=eq.${SESSION_ID}`},(p)=>{ sessionData=p.new; updateHeader(); syncPhase(); }).subscribe();
  sb.channel('foh2').on('postgres_changes',{event:'*',schema:'public',table:'players',filter:`session_id=eq.${SESSION_ID}`},()=>{ reloadPlayers(); }).subscribe();
  sb.channel('foh3').on('postgres_changes',{event:'*',schema:'public',table:'answers',filter:`session_id=eq.${SESSION_ID}`},()=>{ reloadAnswers(); }).subscribe();
  sb.channel('foh4').on('postgres_changes',{event:'INSERT',schema:'public',table:'game_events',filter:`session_id=eq.${SESSION_ID}`},(p)=>{ handleEvent(p.new); }).subscribe();
}
function handleEvent(evt){
  if(evt.event_type === 'category_reveal'){
    const {name, icon, color} = evt.payload;
    showCategoryOverlay(icon, name, color);
  }
  else if(evt.event_type === 'new_question'){
    if(categoryOverlayActive){
      pendingQuestionAfterCategory = evt.payload;
    } else {
      loadFOHQuestion(evt.payload.question, evt.payload.qIdx, evt.payload.total);
    }
  }
  else if(evt.event_type === 'answer_revealed') revealAnswerFOH();
  else if(evt.event_type === 'show_leaderboard') showFOHLeaderboard();
  else if(evt.event_type === 'hide_leaderboard') showPhase('question');
  else if(evt.event_type === 'game_ended') showFOHResult();
  else if(evt.event_type === 'game_reset') resetUI();
  else if(evt.event_type === 'time_up'){ clearInterval(timerInterval); document.getElementById('timeup-banner').classList.add('show'); document.getElementById('resp-pill').classList.remove('visible'); }
  else if(evt.event_type === 'category_mode_change'){ /* mode changed, ignore on FOH */ }
}
function showCategoryOverlay(icon, name, color){
  if(categoryOverlayActive) return;
  const overlay = document.getElementById('categoryOverlay');
  document.getElementById('catIcon').textContent = icon || '🎯';
  document.getElementById('catName').textContent = name || 'Category';
  document.getElementById('catSub').textContent = 'NEXT QUESTION';
  const card = overlay.querySelector('.category-card');
  card.style.setProperty('--cat-color', color || '#00f0ff');
  card.style.setProperty('--cat-color-light', color || '#7c3aed');
  overlay.classList.add('active');
  categoryOverlayActive = true;
  // Auto-hide after 2.8 seconds
  setTimeout(() => {
    overlay.classList.remove('active');
    setTimeout(() => { categoryOverlayActive = false; 
      if(pendingQuestionAfterCategory){
        const pq = pendingQuestionAfterCategory;
        pendingQuestionAfterCategory = null;
        loadFOHQuestion(pq.question, pq.qIdx, pq.total);
      }
    }, 400);
  }, 2800);
}
function syncPhase(){
  const status = sessionData?.status || 'waiting';
  if(status === 'waiting') showPhase('waiting');
  else if(status === 'active' || status === 'reveal') showPhase('question');
  else if(status === 'leaderboard') showFOHLeaderboard();
  else if(status === 'ended') showFOHResult();
}
function showPhase(name){
  document.querySelectorAll('.phase').forEach(p=>p.classList.add('out'));
  document.getElementById('phase-'+name).classList.remove('out');
}
function loadFOHQuestion(q, idx, total){
  currentQ = q;
  answerRevealedFlag = false;
  clearInterval(timerInterval);
  document.getElementById('timeup-banner').classList.remove('show');
  document.getElementById('resp-section').style.display = 'none';
  document.getElementById('resp-pill').classList.remove('visible');
  showPhase('question');
  document.getElementById('q-badge').textContent = `Q ${idx+1} / ${total}`;
  document.getElementById('q-prog-bar').style.width = `${((idx+1)/total)*100}%`;
  document.getElementById('q-text').textContent = q.question_text;
  const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
  document.getElementById('q-opts').innerHTML = opts.map((o,i)=>`<div class="q-opt" id="foh-opt-${i}"><span class="opt-letter">${'ABCD'[i]}</span>${o}</div>`).join('');
  // reset styles
  for(let i=0;i<4;i++){ let el = document.getElementById(`foh-opt-${i}`); if(el){ el.classList.remove('correct','wrong','revealed'); } }
  timeLeft = q.time_limit || 30;
  updateTimerUI(timeLeft, q.time_limit);
  timerInterval = setInterval(()=>{ timeLeft--; updateTimerUI(timeLeft, q.time_limit); updateRespProgress(); if(timeLeft<=0){ clearInterval(timerInterval); document.getElementById('timeup-banner').classList.add('show'); document.getElementById('resp-pill').classList.remove('visible'); } },1000);
  setFtr(`Answer within ${q.time_limit}s!`);
}
function updateTimerUI(current, max){
  const n=document.getElementById('q-timer-n'); const ring=document.getElementById('q-timer-ring');
  n.textContent=Math.max(0,current);
  const pct=Math.max(0,current)/max;
  ring.style.strokeDashoffset=195*(1-pct);
  ring.style.stroke= pct>0.4?'#00f0ff':pct>0.2?'#f59e0b':'#f43f5e';
}
function updateRespProgress(){
  if(!currentQ) return;
  const curAns = answers[currentQ.id]||{};
  const totalAns = Object.keys(curAns).length;
  const active = players.filter(p=>!p.is_eliminated).length;
  if(active===0) return;
  const pct = Math.round((totalAns/active)*100);
  const pill=document.getElementById('resp-pill');
  pill.classList.add('visible');
  document.getElementById('rpill-fill').style.width=pct+'%';
  document.getElementById('rpill-txt').textContent=pct+'%';
  setFtr(`${totalAns}/${active} players answered (${pct}%)`);
}
function revealAnswerFOH(){
  if(!currentQ) return;
  clearInterval(timerInterval);
  document.getElementById('timeup-banner').classList.remove('show');
  for(let i=0;i<4;i++){
    const el = document.getElementById(`foh-opt-${i}`);
    if(el){
      el.classList.add('revealed');
      if(i === currentQ.correct_option) el.classList.add('correct');
      else el.classList.add('wrong');
    }
  }
  // show response bars
  const curAns = answers[currentQ.id]||{};
  const counts=[0,0,0,0];
  Object.values(curAns).forEach(a=>{ if(a.chosen_option>=0 && a.chosen_option<4) counts[a.chosen_option]++; });
  const maxC = Math.max(...counts,1);
  const colors=['#00f0ff','#7c3aed','#f59e0b','#10b981'];
  const respDiv = document.getElementById('resp-section');
  respDiv.style.display = 'flex';
  document.getElementById('resp-bars').innerHTML = counts.map((c,i)=>`<div class="resp-row"><span class="resp-lbl">${'ABCD'[i]}</span><div class="resp-track"><div class="resp-bar" style="width:${Math.round(c/maxC*100)}%;background:${i===currentQ.correct_option?'var(--green)':colors[i]}"></div></div><span class="resp-cnt">${c}</span></div>`).join('');
  setFtr(`Answer: ${[currentQ.option_a,currentQ.option_b,currentQ.option_c,currentQ.option_d][currentQ.correct_option]} — ${Object.keys(curAns).length} responses`);
}
function showFOHLeaderboard(){
  clearInterval(timerInterval);
  const top = [...players].filter(p=>!p.is_eliminated).sort((a,b)=>b.score-a.score).slice(0,8);
  const maxScore = top[0]?.score||1;
  document.getElementById('lb-list').innerHTML = top.map((p,i)=>`<div class="lb-row ${i===0?'r1':''}" style="animation-delay:${i*0.05}s"><span class="lb-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`}</span><div class="lb-av" style="background:${p.avatar_color}22;color:${p.avatar_color}">${p.name.substring(0,2).toUpperCase()}</div><span class="lb-name">${p.name}</span><span class="lb-score ${i===0?'gold':''}">${p.score}</span></div>`).join('');
  showPhase('leaderboard');
  setFtr('Current standings');
}
function showFOHResult(){
  clearInterval(timerInterval);
  const active = [...players].filter(p=>!p.is_eliminated).sort((a,b)=>b.score-a.score);
  const winner = active[0];
  document.getElementById('r-winner').textContent = winner ? winner.name : 'No winner';
  document.getElementById('r-score').textContent = `${winner?.score||0} pts`;
  showPhase('result');
  setFtr('Game Over! Thanks for playing');
}
function resetUI(){
  clearInterval(timerInterval);
  document.getElementById('phase-waiting').classList.remove('out');
  document.getElementById('phase-question').classList.add('out');
  document.getElementById('phase-leaderboard').classList.add('out');
  document.getElementById('phase-result').classList.add('out');
  document.getElementById('resp-pill').classList.remove('visible');
  document.getElementById('timeup-banner').classList.remove('show');
  setFtr('Waiting for players to join...');
}
function updateHeader(){
  document.getElementById('hdr-player-count').textContent = players.length;
  document.getElementById('hdr-room').textContent = sessionData?.room_code||'——';
  document.getElementById('wait-room-code').textContent = sessionData?.room_code||'——';
  const cat = categories.find(c=>c.id===sessionData?.category_id);
  document.getElementById('hdr-cat').innerHTML = cat ? `${cat.icon} ${cat.name}` : '🎯 General';
}
function setFtr(txt){ document.getElementById('ftr-tip').textContent = txt; }

init();
</script>
</body>
