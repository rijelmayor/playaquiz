<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Live Display | Console Style Player Join Animations</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --bg: #0a0c15;
      --surface: rgba(18, 22, 40, 0.96);
      --accent: #3b82f6;
      --green: #10b981;
      --yellow: #fbbf24;
      --red: #ef4444;
      --purple: #a855f7;
      --pink: #ec4899;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.5);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 30%, #0f1222, #03050b);
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 6px);
      pointer-events: none;
      z-index: 2;
    }

    .foh {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 3;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 32px;
      background: rgba(6, 8, 18, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 2px solid rgba(59, 130, 246, 0.3);
      z-index: 20;
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #fff, #60a5fa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
      padding: 5px 16px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 13px;
      color: var(--green);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
      box-shadow: 0 0 5px #10b981;
    }

    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

    .room-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      background: rgba(59,130,246,0.15);
      border: 1px solid #3b82f680;
      padding: 6px 18px;
      border-radius: 32px;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .player-counter-area {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.7);
      padding: 5px 20px;
      border-radius: 60px;
      border: 1px solid #3b82f6;
      box-shadow: 0 0 12px rgba(59,130,246,0.3);
    }

    .counter-icon { font-size: 24px; filter: drop-shadow(0 0 4px #3b82f6); }
    
    .counter-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 34px;
      font-weight: 800;
      background: linear-gradient(135deg, #facc15, #10b981);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      transition: transform 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
      display: inline-block;
    }

    .counter-pop { transform: scale(1.3); text-shadow: 0 0 8px #facc15; }

    /* Console-style notification cards */
    .notification-area {
      position: fixed;
      right: 24px;
      top: 100px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
      max-width: 320px;
    }

    .player-join-card {
      background: linear-gradient(135deg, rgba(18, 25, 45, 0.98), rgba(10, 14, 30, 0.98));
      backdrop-filter: blur(12px);
      border-left: 6px solid #3b82f6;
      border-radius: 20px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5), 0 0 0 1px rgba(59,130,246,0.3);
      transform: translateX(100%);
      animation: slideInConsole 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards, fadeOutConsole 0.5s ease 3s forwards;
    }

    @keyframes slideInConsole {
      0% { transform: translateX(100%); opacity: 0; }
      80% { transform: translateX(-8px); }
      100% { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeOutConsole {
      to { opacity: 0; transform: translateX(20px); visibility: hidden; }
    }

    .console-avatar {
      font-size: 38px;
      filter: drop-shadow(0 0 6px #3b82f6);
      background: rgba(59,130,246,0.2);
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .console-info { flex: 1; }
    .console-name { font-weight: 800; font-size: 18px; color: white; }
    .console-badge { font-size: 12px; color: #a5f3c3; background: rgba(16,185,129,0.2); display: inline-block; padding: 2px 10px; border-radius: 20px; margin-top: 4px; }

    .display-area { flex: 1; position: relative; overflow: hidden; }
    .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; z-index: 1; }
    .screen.active { opacity: 1; pointer-events: auto; z-index: 10; }
    
    .waiting-content { text-align: center; }
    .waiting-emoji { font-size: 90px; filter: drop-shadow(0 0 20px #3b82f6); animation: float 2.5s infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }
    .waiting-title { font-family: 'Bebas Neue', sans-serif; font-size: 70px; background: linear-gradient(135deg,#fff,#60a5fa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .big-room-code { font-family: 'JetBrains Mono', monospace; font-size: 48px; background: rgba(59,130,246,0.15); border: 2px solid #3b82f6; border-radius: 28px; padding: 16px 40px; display: inline-block; margin-top: 24px; letter-spacing: 8px; }
    .player-count-bar { margin-top: 28px; font-size: 22px; display: flex; gap: 12px; justify-content: center; }
    .player-count-num { font-size: 48px; font-weight: 800; color: #facc15; }

    .q-wrapper { width: min(90%, 1100px); display: grid; gap: 24px; height: 85%; padding: 16px; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .opt-item { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 20px 26px; backdrop-filter: blur(8px); transition: all 0.2s; display: flex; gap: 20px; font-weight: 600; cursor: default; }
    .opt-letter { width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; background: #3b82f630; }
    .opt-item.correct { border-color: #10b981; background: #10b98120; box-shadow: 0 0 28px #10b98160; }
    .opt-item.wrong { opacity: 0.3; filter: grayscale(0.6); }
    .timer-container { width: 100px; height: 100px; position: relative; }
    .timer-ring { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.95s linear; }
    .timer-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700; }
    .reveal-banner { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #10b981; padding: 14px 42px; border-radius: 60px; font-weight: 800; opacity: 0; transition: all 0.3s; white-space: nowrap; z-index: 150; box-shadow: 0 0 30px #10b981; }
    .reveal-banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .footer { padding: 8px 30px; display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.3); border-top: 1px solid #1e293b; flex-shrink: 0; }
    .q-progress-bar { height: 4px; background: #1e293b; flex-shrink: 0; }
    .q-progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #a855f7); transition: width 0.4s; }
    .cat-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; transition: 0.4s; pointer-events: none; }
    .cat-overlay.show { opacity: 1; }
    .cat-name-big { font-family: 'Bebas Neue', sans-serif; font-size: 80px; background: linear-gradient(135deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .lb-wrapper, .resp-wrapper { background: rgba(0,0,0,0.6); border-radius: 40px; padding: 30px; backdrop-filter: blur(12px); width: 80%; max-width: 800px; }
    .lb-title { font-family: 'Bebas Neue', sans-serif; font-size: 60px; text-align: center; background: linear-gradient(135deg, var(--yellow), var(--pink)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .lb-list { display: flex; flex-direction: column; gap: 12px; }
    .lb-row { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: rgba(0,0,0,0.4); border-radius: 16px; }
    .resp-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .resp-ltr { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; }
    .resp-track { flex: 1; height: 40px; background: rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; }
    .resp-fill { height: 100%; border-radius: 12px; display: flex; align-items: center; padding: 0 12px; font-weight: 700; transition: width 0.5s ease; }
    .confetti-piece { position: fixed; width: 10px; height: 10px; border-radius: 2px; opacity: 0; animation: confettiFall linear forwards; z-index: 1000; pointer-events: none; }
    @keyframes confettiFall { 0%{opacity:1;transform:translateY(-50px) rotate(0deg)} 100%{opacity:0;transform:translateY(100vh) rotate(720deg)} }
    .end-content { text-align: center; }
    .end-icon { font-size: 100px; margin-bottom: 24px; }
    .end-title { font-family: 'Bebas Neue', sans-serif; font-size: 96px; background: linear-gradient(135deg, var(--yellow), var(--pink)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body>
<div class="foh">
  <div class="top-bar">
    <div class="logo">PLAY<span style="color:var(--accent)">A</span>QUIZ</div>
    <div class="live-badge"><div class="live-dot"></div> LIVE SESSION</div>
    <div style="display: flex; gap: 20px; align-items: center;">
      <div class="player-counter-area">
        <span class="counter-icon">🎮</span>
        <span class="counter-number" id="animatedCounter">0</span>
        <span style="font-size:14px; color:#a0aec0;">PLAYERS</span>
      </div>
      <div class="room-badge" id="roomCode">——</div>
    </div>
  </div>
  <div class="q-progress-bar"><div class="q-progress-fill" id="qProgressFill" style="width:0%"></div></div>
  <div class="display-area">
    <div id="screen-waiting" class="screen active">
      <div class="waiting-content">
        <div class="waiting-emoji">🎮</div>
        <div class="waiting-title">READY TO PLAY!</div>
        <div class="waiting-sub">Players are joining the arena</div>
        <div class="big-room-code" id="waitingRoomCode">——</div>
        <div class="player-count-bar">👾 ACTIVE PLAYERS <span class="player-count-num" id="playerCountDisplay">0</span></div>
      </div>
    </div>
    <div id="screen-question" class="screen">
      <div class="q-wrapper">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div><div class="q-num-badge" id="qNumBadge" style="background:rgba(255,255,255,0.1);padding:6px 16px;border-radius:20px;">Q1/1</div><div class="cat-badge" id="qCatBadge" style="margin-top:8px;display:flex;align-items:center;gap:8px;"><span>📋</span><span>Quiz</span></div></div>
          <div class="timer-container"><svg width="100" height="100" viewBox="0 0 100 100"><circle class="timer-track" cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/><circle class="timer-ring" id="timerRing" cx="50" cy="50" r="42" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="0"/></svg><div class="timer-num" id="timerNum">—</div></div>
        </div>
        <div style="text-align:center; padding:20px 0;"><div class="q-text" id="qText" style="font-size:32px; font-weight:800;">Loading...</div></div>
        <div class="options-grid" id="optionsGrid"></div>
      </div>
    </div>
    <div id="screen-leaderboard" class="screen"><div class="lb-wrapper"><div class="lb-title">🏆 LEADERBOARD</div><div class="lb-list" id="lbList"></div></div></div>
    <div id="screen-responses" class="screen"><div class="resp-wrapper"><div class="lb-title">📊 RESPONSE DISTRIBUTION</div><div id="respBarsContainer"></div></div></div>
    <div id="screen-ended" class="screen"><div class="end-content"><div class="end-icon">🏁</div><div class="end-title">GAME OVER!</div><div style="font-size:24px;color:var(--muted);margin-top:16px">Thanks for playing!</div></div></div>
  </div>
  <div class="footer"><span>PlayAQuiz — ARCADE MODE</span><span id="footerStatus">waiting</span><span id="footerTime"></span></div>
</div>
<div id="catOverlay" class="cat-overlay"><div class="cat-content" style="text-align:center;"><span id="catIconBig" style="font-size:80px;">🎯</span><div class="cat-name-big" id="catNameBig">CATEGORY</div><div style="height:3px;width:100px;background:linear-gradient(90deg,var(--accent),var(--purple));margin:20px auto 0;"></div></div></div>
<div class="reveal-banner" id="revealBanner"></div>
<div id="notificationArea" class="notification-area"></div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// Audio
const AC = window.AudioContext || window.webkitAudioContext;
let ac;
function getAC() { if (!ac) ac = new AC(); if (ac.state === 'suspended') ac.resume(); return ac; }
function playPopSound() { try { const ctx = getAC(); const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.type = 'sine'; o.frequency.value = 600 + Math.random() * 150; g.gain.value = 0.25; g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3); o.start(); o.stop(ctx.currentTime + 0.25); } catch(e) {} }
function playJoinChime() { try { const ctx = getAC(); [[523,0],[659,0.08],[784,0.16]].forEach(([f,d]) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = f; o.type = 'sine'; g.gain.value = 0.2; g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d + 0.2); o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.2); }); } catch(e) {} }

// State
let SESSION_ID = null;
let currentQuestion = null;
let timerInterval = null;
let timeLeft = 0, totalTime = 0;
let lastKnownPlayerCount = 0;
let processedPlayerIds = new Set();

// DOM
const animatedCounterSpan = document.getElementById('animatedCounter');
const playerCountDisplaySpan = document.getElementById('playerCountDisplay');
const notificationContainer = document.getElementById('notificationArea');

function animateCounterNumber(newCount) {
  if (!animatedCounterSpan) return;
  animatedCounterSpan.classList.add('counter-pop');
  animatedCounterSpan.innerText = newCount;
  setTimeout(() => animatedCounterSpan.classList.remove('counter-pop'), 250);
}

// Console-style join notification (game controller style)
function showPlayerJoinNotification(name, avatarEmoji = '🎮') {
  if (!notificationContainer) return;
  const card = document.createElement('div');
  card.className = 'player-join-card';
  card.innerHTML = `
    <div class="console-avatar">${avatarEmoji}</div>
    <div class="console-info">
      <div class="console-name">${escapeHtml(name)}</div>
      <div class="console-badge">🎮 joined the game</div>
    </div>
    <div style="font-size:28px;">🎯</div>
  `;
  notificationContainer.appendChild(card);
  playJoinChime();
  playPopSound();
  setTimeout(() => { if (card && card.parentNode) card.remove(); }, 3800);
}

function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&')return '&amp;';if(m==='<')return '&lt;';if(m==='>')return '&gt;';return m;}); }

// Fetch players and detect new joins
let previousPlayerMap = new Map();

async function fetchAndDetectNewPlayers() {
  if (!SESSION_ID) return;
  const { data: players, error } = await sb
    .from('players')
    .select('id, name, avatar_color, avatar_emoji, is_eliminated')
    .eq('session_id', SESSION_ID)
    .eq('is_eliminated', false);
  if (error || !players) return;
  
  const currentCount = players.length;
  if (playerCountDisplaySpan) playerCountDisplaySpan.innerText = currentCount;
  
  if (currentCount !== lastKnownPlayerCount) {
    animateCounterNumber(currentCount);
    lastKnownPlayerCount = currentCount;
  }
  
  // Detect new players
  for (const p of players) {
    if (!previousPlayerMap.has(p.id)) {
      const emoji = p.avatar_emoji || p.avatar_color || '🎮';
      showPlayerJoinNotification(p.name || 'Player', emoji);
    }
    previousPlayerMap.set(p.id, { name: p.name, emoji: p.avatar_emoji || p.avatar_color || '🎮' });
  }
}

// Real-time player insert subscription
function setupRealtimePlayerInsert() {
  if (!SESSION_ID) return;
  const channel = sb.channel(`foh-player-insert-${SESSION_ID}`);
  channel
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'players', filter: `session_id=eq.${SESSION_ID}` }, async (payload) => {
      const newPlayer = payload.new;
      if (newPlayer && !newPlayer.is_eliminated) {
        const displayName = newPlayer.name || 'Explorer';
        const avatarIcon = newPlayer.avatar_emoji || newPlayer.avatar_color || '🎮';
        showPlayerJoinNotification(displayName, avatarIcon);
        if (playerCountDisplaySpan) {
          const curr = parseInt(playerCountDisplaySpan.innerText) || 0;
          playerCountDisplaySpan.innerText = curr + 1;
          animateCounterNumber(curr + 1);
          lastKnownPlayerCount = curr + 1;
        }
        previousPlayerMap.set(newPlayer.id, { name: displayName, emoji: avatarIcon });
      }
    })
    .subscribe();
}

// Main initialization
async function init() {
  setInterval(updateFooterTime, 1000);
  const params = new URLSearchParams(window.location.search);
  let sid = params.get('session') || localStorage.getItem('paq_session_id');
  if (!sid) {
    const { data } = await sb.from('game_sessions').select('id,room_code').eq('status','waiting').order('created_at',{ascending:false}).limit(1);
    if (data?.[0]) sid = data[0].id;
  }
  if (!sid) { document.getElementById('roomCode').innerText = 'NO SESSION'; return; }
  SESSION_ID = sid;
  localStorage.setItem('paq_session_id', sid);
  await loadSessionInfo();
  await fetchAndDetectNewPlayers();
  setupRealtimePlayerInsert();
  startPlayerCountPolling();
  setupGameEvents();
}

async function loadSessionInfo() {
  const { data } = await sb.from('game_sessions').select('*').eq('id', SESSION_ID).single();
  if (data) {
    document.getElementById('roomCode').innerText = data.room_code;
    document.getElementById('waitingRoomCode').innerText = data.room_code;
    document.getElementById('footerStatus').innerText = data.status;
  }
}

function setupGameEvents() {
  // Listen for game_events
  sb.channel(`foh-events-${SESSION_ID}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'game_events', filter: `session_id=eq.${SESSION_ID}` }, p => handleEvent(p.new))
    .subscribe();
  // Listen for session updates
  sb.channel(`foh-session-${SESSION_ID}`)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_sessions', filter: `id=eq.${SESSION_ID}` }, p => {
      document.getElementById('footerStatus').innerText = p.new.status;
      if (p.new.status === 'ended') { stopTimer(); launchConfetti(); showScreen('ended'); }
      if (p.new.status === 'waiting') showScreen('waiting');
    })
    .subscribe();
}

function handleEvent(evt) {
  console.log('FOH event:', evt.event_type, evt.payload);
  
  switch(evt.event_type) {
    case 'category_banner':
      if (evt.payload) {
        showCategoryOverlay(evt.payload.icon, evt.payload.name);
      }
      break;
    case 'new_question':
      if (evt.payload && evt.payload.question) {
        currentQuestion = evt.payload.question;
        totalTime = currentQuestion.time_limit || 20;
        updateQProgress(evt.payload.qIdx, evt.payload.total);
      }
      break;
    case 'show_question_view':
      if (evt.payload && evt.payload.question) {
        displayQuestion(evt.payload.question);
        showScreen('question');
        startTimer(totalTime);
      }
      break;
    case 'answer_reveal':
      if (evt.payload) {
        revealAnswer(evt.payload.correctOption, evt.payload.options, evt.payload.explanation);
      }
      break;
    case 'show_leaderboard':
      if (evt.payload && evt.payload.leaders) {
        displayLeaderboard(evt.payload.leaders);
        showScreen('leaderboard');
      }
      break;
    case 'show_responses':
      if (evt.payload) {
        displayResponseDist(evt.payload.distribution, evt.payload.totalPlayers, evt.payload.correctIdx, evt.payload.options);
        showScreen('responses');
      }
      break;
    case 'show_waiting_screen':
      showScreen('waiting');
      break;
    case 'player_eliminated':
      flashEliminated();
      break;
    case 'game_ended':
      stopTimer();
      launchConfetti();
      showScreen('ended');
      break;
    case 'game_reset':
      stopTimer();
      showScreen('waiting');
      break;
  }
}

function displayQuestion(q) {
  if (!q) return;
  document.getElementById('qText').innerText = q.question_text;
  
  // Category display
  const catEl = document.getElementById('qCatBadge');
  if (q.category_name || q.category_id) {
    catEl.innerHTML = `<span>${q.category_icon || '📋'}</span><span>${q.category_name || 'Quiz'}</span>`;
  } else {
    catEl.innerHTML = `<span>📋</span><span>Quiz</span>`;
  }
  
  const letters = ['A', 'B', 'C', 'D'];
  const optColors = ['opt-a', 'opt-b', 'opt-c', 'opt-d'];
  const grid = document.getElementById('optionsGrid');
  const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
  grid.innerHTML = opts.map((opt, i) => `
    <div class="opt-item ${optColors[i]}" data-idx="${i}">
      <div class="opt-letter">${letters[i]}</div>
      <div>${opt || ''}</div>
    </div>
  `).join('');
}

function startTimer(duration) {
  stopTimer();
  timeLeft = duration;
  totalTime = duration;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      stopTimer();
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
}

function updateTimerUI() {
  const ring = document.getElementById('timerRing');
  const num = document.getElementById('timerNum');
  const circum = 2 * Math.PI * 42;
  const progress = Math.max(0, timeLeft) / totalTime;
  const offset = circum * (1 - progress);
  ring.style.strokeDashoffset = offset;
  num.innerText = timeLeft >= 0 ? timeLeft : 0;
  
  if (timeLeft <= 5) ring.style.stroke = 'var(--red)';
  else if (timeLeft <= 10) ring.style.stroke = 'var(--yellow)';
  else ring.style.stroke = 'var(--accent)';
}

function revealAnswer(correctIdx, options, explanation) {
  stopTimer();
  
  // Play fanfare
  try {
    const ctx = getAC();
    [[523,0],[659,0.12],[784,0.24],[1047,0.4]].forEach(([f,d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f; o.type = 'sine';
      g.gain.value = 0.3;
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d + 0.2);
      o.start(ctx.currentTime + d);
      o.stop(ctx.currentTime + d + 0.2);
    });
  } catch(e) {}
  
  const letters = ['A', 'B', 'C', 'D'];
  document.querySelectorAll('.opt-item').forEach((el, i) => {
    if (i === correctIdx) el.classList.add('correct');
    else el.classList.add('wrong');
  });
  
  const banner = document.getElementById('revealBanner');
  banner.innerHTML = `✅ Correct Answer: <strong>${letters[correctIdx]}</strong>${options && options[correctIdx] ? ` — ${options[correctIdx]}` : ''}`;
  if (explanation) banner.innerHTML += `<div style="font-size:14px;opacity:.8;margin-top:4px">${explanation}</div>`;
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 5000);
}

function displayLeaderboard(leaders) {
  const medals = ['🥇', '🥈', '🥉'];
  const listEl = document.getElementById('lbList');
  if (!leaders || leaders.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px;">No players yet</div>';
    return;
  }
  listEl.innerHTML = leaders.slice(0, 10).map((p, i) => `
    <div class="lb-row" style="animation-delay:${i * 0.08}s">
      <div style="font-size:28px;width:52px;text-align:center;">${medals[i] || `#${i + 1}`}</div>
      <div style="font-size:32px;">${p.avatar_color || '👤'}</div>
      <div style="flex:1;font-size:18px;font-weight:700;">${escapeHtml(p.name)}</div>
      <div style="font-family:monospace;font-size:24px;font-weight:800;color:var(--yellow);">${p.score}</div>
    </div>
  `).join('');
}

function displayResponseDist(dist, totalPlayers, correctIdx, options) {
  if (!dist) dist = [0, 0, 0, 0];
  const colors = ['#3b82f6', '#8b5cf6', '#f59e0b', '#ec4899'];
  const letters = ['A', 'B', 'C', 'D'];
  const maxCount = Math.max(...dist, 1);
  const container = document.getElementById('respBarsContainer');
  
  container.innerHTML = dist.map((count, i) => {
    const percentage = totalPlayers > 0 ? Math.round((count / totalPlayers) * 100) : 0;
    const barWidth = maxCount > 0 ? (count / maxCount) * 100 : 0;
    const isCorrect = i === correctIdx;
    const optionText = options && options[i] ? options[i].substring(0, 40) : '';
    return `
      <div class="resp-bar-row">
        <div class="resp-ltr" style="background:${colors[i]}30;color:${colors[i]}">${letters[i]}</div>
        <div class="resp-track">
          <div class="resp-fill" style="width:0%;background:${isCorrect ? 'var(--green)' : colors[i]}" data-target="${barWidth}">
            <span style="margin-right:auto;">${optionText.length > 25 ? optionText.substring(0, 22) + '...' : optionText}</span>
            <span style="margin-left:auto;font-weight:800;">${percentage}%</span>
          </div>
        </div>
        <div style="width:60px;text-align:right;font-weight:600;">${count}</div>
      </div>
    `;
  }).join('');
  
  setTimeout(() => {
    document.querySelectorAll('.resp-fill').forEach(el => {
      el.style.width = el.dataset.target + '%';
    });
  }, 100);
}

function showCategoryOverlay(icon, name) {
  const overlay = document.getElementById('catOverlay');
  document.getElementById('catIconBig').innerText = icon || '🎯';
  document.getElementById('catNameBig').innerText = name || 'Category';
  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 3000);
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(`screen-${screenId}`);
  if (el) el.classList.add('active');
}

function updateQProgress(idx, total) {
  const pct = total > 0 ? ((idx + 1) / total) * 100 : 0;
  document.getElementById('qProgressFill').style.width = pct + '%';
  document.getElementById('qNumBadge').innerHTML = `Q${idx + 1}/${total}`;
}

function flashEliminated() {
  const flash = document.createElement('div');
  flash.style.cssText = 'position:fixed;inset:0;background:rgba(239,68,68,0.3);z-index:999;animation:fadeOut 1s forwards;pointer-events:none;';
  const style = document.createElement('style');
  style.innerText = '@keyframes fadeOut{0%{opacity:1}100%{opacity:0}}';
  document.head.appendChild(style);
  document.body.appendChild(flash);
  setTimeout(() => { flash.remove(); style.remove(); }, 1000);
}

function launchConfetti() {
  const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
  for (let i = 0; i < 100; i++) {
    const conf = document.createElement('div');
    conf.className = 'confetti-piece';
    conf.style.left = Math.random() * 100 + 'vw';
    conf.style.top = '-10px';
    conf.style.background = colors[Math.floor(Math.random() * colors.length)];
    conf.style.width = 6 + Math.random() * 10 + 'px';
    conf.style.height = 6 + Math.random() * 10 + 'px';
    conf.style.animationDuration = 2 + Math.random() * 3 + 's';
    conf.style.animationDelay = Math.random() * 2 + 's';
    conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(conf);
    setTimeout(() => conf.remove(), 6000);
  }
}

function startPlayerCountPolling() {
  const refresh = async () => {
    if (!SESSION_ID) return;
    const { count } = await sb.from('players').select('*', { count: 'exact', head: true }).eq('session_id', SESSION_ID).eq('is_eliminated', false);
    if (playerCountDisplaySpan) playerCountDisplaySpan.innerText = count || 0;
  };
  refresh();
  setInterval(refresh, 3000);
}

function updateFooterTime() {
  document.getElementById('footerTime').innerText = new Date().toLocaleTimeString();
}

init();
</script>
