<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOY Turns 70 • FINAL ROUND</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #ffd700;
      --pink: #ff3b9a;
      --cyan: #00f5ff;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      color: white;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #0f0022, #2a0044, #4a0077);
      position: relative;
    }

    /* Floating Balloons */
    .balloons {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      font-size: 55px;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 10px 15px rgba(255, 215, 0, 0.4));
    }

    @keyframes floatUp {
      0% { transform: translateY(110vh) rotate(-15deg); }
      100% { transform: translateY(-150px) rotate(25deg); }
    }

    .content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      text-align: center;
    }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.8rem, 11vw, 8.5rem);
      font-weight: 800;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #ffd700, #ff3b9a, #00f5ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleGlow 4s ease-in-out infinite alternate;
      margin-bottom: 8px;
      line-height: 0.9;
    }

    @keyframes titleGlow {
      from { filter: brightness(1); }
      to { filter: brightness(1.35); }
    }

    .subtitle {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 30px;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
    }

    .qr-container {
      background: white;
      padding: 25px;
      border-radius: 32px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6),
                  0 0 0 16px rgba(255, 215, 0, 0.4);
      margin: 20px 0 30px;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      max-width: 420px;
      width: 100%;
    }

    .qr-container:hover {
      transform: scale(1.06) rotate(3deg);
    }

    .qr-code {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;
      border: 10px solid #111;
      border-radius: 24px;
      background: white;
      padding: 15px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-code img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }

    .scan-text {
      margin-top: 18px;
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--gold);
      text-shadow: 0 4px 20px rgba(255, 215, 0, 0.6);
    }

    .instructions {
      font-size: 1.3rem;
      color: #ddd;
      max-width: 520px;
      margin-bottom: 30px;
    }

    .start-btn {
      padding: 22px 65px;
      font-size: 2rem;
      font-weight: 800;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ffd700, #ff6b00, #ff3b9a);
      color: #111;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 20px 50px rgba(255, 215, 0, 0.5);
      transition: all 0.3s;
      text-transform: uppercase;
    }

    .start-btn:hover {
      transform: translateY(-8px) scale(1.05);
    }

    .footer {
      position: absolute;
      bottom: 25px;
      font-size: 1.1rem;
      color: rgba(255,255,255,0.7);
      z-index: 3;
    }
  </style>
</head>
<body>
  <!-- Floating Balloons -->
  <div class="balloons" id="balloons"></div>

  <div class="content">
    <h1 class="title">JOY</h1>
    <div class="subtitle">TURNS 70</div>
    <div class="subtitle" style="font-size: clamp(1.6rem, 4.5vw, 2.2rem); margin-top: -10px;">
      GRAND FINALE • FINAL ROUND
    </div>

    <!-- Prominent QR Code -->
    <div class="qr-container" onclick="window.open('https://www.playaquiz.xyz/finalroundfoh.html', '_blank')">
      <div class="qr-code">
        <img src="Final_Round.png" alt="Scan to Join Final Round">
      </div>
      <div class="scan-text">📱 TAP or SCAN TO JOIN FINAL ROUND</div>
    </div>

    <div class="instructions">
      Scan the QR code above with your phone camera to join as a player
    </div>

    <button class="start-btn" onclick="startGame()">
      🔥 START FINAL ROUND
    </button>

    <div class="footer">
      Celebrating 70 Years of Joy ✨
    </div>
  </div>

  <script>
    function createBalloon() {
      const container = document.getElementById('balloons');
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      
      const emojis = ['🎈','🎉','🌟','🦄','💖','🍾','✨','🥂'];
      balloon.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      
      balloon.style.left = Math.random() * 100 + 'vw';
      balloon.style.animationDuration = (Math.random() * 9 + 13) + 's';
      balloon.style.animationDelay = '-' + Math.random() * 20 + 's';
      balloon.style.opacity = Math.random() * 0.5 + 0.65;
      
      container.appendChild(balloon);
      setTimeout(() => balloon.remove(), 32000);
    }

    function launchConfetti() {
      for (let i = 0; i < 80; i++) {
        const conf = document.createElement('div');
        conf.style.position = 'fixed';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.top = '-30px';
        conf.style.width = conf.style.height = (8 + Math.random() * 12) + 'px';
        conf.style.background = ['#ffd700', '#ff3b9a', '#00f5ff', '#ff69b4'][Math.floor(Math.random()*4)];
        conf.style.borderRadius = '3px';
        conf.style.zIndex = '4';
        conf.style.pointerEvents = 'none';
        conf.style.animation = `fall ${Math.random()*4 + 2.5}s linear forwards`;
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 10000);
      }
    }

    function startGame() {
      launchConfetti();
      setTimeout(() => {
        window.open('https://www.playaquiz.xyz/finalroundfoh.html', '_blank');
      }, 500);
    }

    // Initialize
    function init() {
      setInterval(createBalloon, 300);
      for (let i = 0; i < 22; i++) {
        setTimeout(createBalloon, i * 110);
      }
    }

    const style = document.createElement('style');
    style.innerHTML = `@keyframes fall { to { transform: translateY(120vh) rotate(720deg); opacity: 0; } }`;
    document.head.appendChild(style);

    window.onload = init;
  </script>
</body>
</html>
