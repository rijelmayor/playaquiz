<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOY Turns 70 • FINAL ROUND</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #ffd700;
      --pink: #ff3b9a;
      --cyan: #00f5ff;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      color: white;
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #0f0022, #2a0044, #4a0077);
      position: relative;
    }

    /* Elegant Floating Balloons + Sparkles */
    .balloons {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      font-size: 65px;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 10px 15px rgba(255, 215, 0, 0.4));
    }

    @keyframes floatUp {
      0% { transform: translateY(110vh) rotate(-15deg); }
      100% { transform: translateY(-150px) rotate(25deg); }
    }

    .content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4.5rem, 13vw, 10rem);
      font-weight: 800;
      letter-spacing: 6px;
      background: linear-gradient(90deg, #ffd700, #ff3b9a, #00f5ff, #ffd700);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleGlow 4s ease-in-out infinite alternate;
      margin-bottom: 8px;
      line-height: 0.85;
    }

    @keyframes titleGlow {
      from { filter: brightness(1) hue-rotate(-10deg); }
      to { filter: brightness(1.4) hue-rotate(10deg); }
    }

    .subtitle {
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--gold);
      text-shadow: 0 0 40px rgba(255, 215, 0, 0.7);
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 1.6rem;
      color: #b0fffc;
      font-weight: 600;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .well-wishes {
      font-size: 1.5rem;
      color: #ffe066;
      margin: 20px 0 40px;
      font-style: italic;
      max-width: 600px;
      line-height: 1.4;
    }

    .qr-container {
      background: white;
      padding: 28px;
      border-radius: 32px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6),
                  0 0 0 15px rgba(255, 215, 0, 0.4);
      margin: 30px 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .qr-container:hover {
      transform: scale(1.1) rotate(4deg);
      box-shadow: 0 35px 90px rgba(255, 59, 154, 0.5);
    }

    .qr-code {
      width: 400px;
      height: 400px;
      border: 10px solid #111;
      border-radius: 24px;
      background: white;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-code img {
      width: 100%;
      height: 100%;
      border-radius: 12px;
    }

    .scan-text {
      margin-top: 18px;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--gold);
      text-shadow: 0 4px 20px rgba(255, 215, 0, 0.6);
    }

    .instructions {
      margin: 35px 0;
      font-size: 1.35rem;
      color: #ddd;
      max-width: 520px;
    }

    .start-btn {
      margin-top: 10px;
      padding: 24px 70px;
      font-size: 2.1rem;
      font-weight: 800;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #ffd700, #ff6b00, #ff3b9a);
      color: #111;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 20px 50px rgba(255, 215, 0, 0.5);
      transition: all 0.3s;
      text-transform: uppercase;
    }

    .start-btn:hover {
      transform: translateY(-10px) scale(1.08);
      box-shadow: 0 30px 70px rgba(255, 215, 0, 0.7);
    }

    .footer {
      position: absolute;
      bottom: 35px;
      font-size: 1.2rem;
      color: rgba(255,255,255,0.75);
      z-index: 3;
    }

    .confetti {
      position: fixed;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      z-index: 4;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Floating Balloons -->
  <div class="balloons" id="balloons"></div>

  <div class="content">
    <h1 class="title">JOY</h1>
    <div class="subtitle">TURNS 70</div>
    <div class="tagline">GRAND FINALE • FINAL ROUND</div>

    <div class="well-wishes">
      🎉 Happy 70th Birthday Joy! <br>
      Wishing you endless joy, love, and beautiful memories!
    </div>

    <!-- Clickable QR Code -->
    <div class="qr-container" onclick="window.open('https://www.playaquiz.xyz/finalroundfoh.html', '_blank')">
      <div class="qr-code">
        <img src="Final_Round.png" alt="Scan to Join Final Round - Joy Turns 70">
      </div>
      <div class="scan-text">📱 TAP or SCAN TO JOIN THE FINAL ROUND</div>
    </div>

    <div class="instructions">
      Players: Scan the QR code to join the <strong>Grand Finale</strong><br>
      Let’s crown the ultimate champion!
    </div>

    <button class="start-btn" onclick="startGame()">
      🔥 START FINAL ROUND
    </button>

    <div class="footer">
      Celebrating 70 Years of Joy ✨
    </div>
  </div>

  <script>
    // Floating Balloons
    function createBalloon() {
      const container = document.getElementById('balloons');
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      
      const emojis = ['🎈','🎉','🌟','🦄','💖','🎀','🍾','✨','🥂'];
      balloon.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      
      balloon.style.left = Math.random() * 100 + 'vw';
      balloon.style.animationDuration = (Math.random() * 10 + 14) + 's';
      balloon.style.animationDelay = '-' + Math.random() * 18 + 's';
      balloon.style.opacity = Math.random() * 0.5 + 0.6;
      
      container.appendChild(balloon);
      
      setTimeout(() => balloon.remove(), 30000);
    }

    function launchConfetti() {
      for (let i = 0; i < 90; i++) {
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.top = '-30px';
        conf.style.background = ['#ffd700', '#ff3b9a', '#00f5ff', '#ff69b4'][Math.floor(Math.random()*4)];
        conf.style.width = conf.style.height = (10 + Math.random() * 12) + 'px';
        conf.style.animation = `fall ${Math.random()*4 + 3}s linear forwards`;
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 10000);
      }
    }

    function startGame() {
      launchConfetti();
      setTimeout(() => {
        window.open('https://www.playaquiz.xyz/finalroundfoh.html', '_blank');
      }, 600);
    }

    // Initialize
    function init() {
      setInterval(createBalloon, 320);
      for (let i = 0; i < 25; i++) {
        setTimeout(createBalloon, i * 90);
      }
      
      setInterval(() => {
        if (Math.random() > 0.4) launchConfetti();
      }, 4000);
    }

    const style = document.createElement('style');
    style.innerHTML = `
      @keyframes fall {
        to { transform: translateY(120vh) rotate(800deg); opacity: 0; }
      }
    `;
    document.head.appendChild(style);

    window.onload = init;
  </script>
</body>
</html>
