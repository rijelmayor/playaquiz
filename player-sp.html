<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>PlayAQuiz — Player (Self-Paced)</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: linear-gradient(135deg, #06080f 0%, #03050b 100%);
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      min-height: 100vh;
      padding: 16px;
    }
    
    .container { max-width: 600px; margin: 0 auto; }
    
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: rgba(13,17,32,0.8);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(59,130,246,0.2);
    }
    .player-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .player-avatar { font-size: 32px; }
    .player-name { font-weight: 700; font-size: 14px; }
    .score-chip {
      background: rgba(245,158,11,0.15);
      border: 1px solid rgba(245,158,11,0.3);
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: 800;
      color: #f59e0b;
      font-size: 14px;
    }
    
    /* Progress Section */
    .progress-section {
      background: rgba(13,17,32,0.8);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(59,130,246,0.2);
    }
    .progress-bar {
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      border-radius: 10px;
      transition: width 0.3s ease;
    }
    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }
    
    /* Question Card */
    .question-card {
      background: rgba(13,17,32,0.9);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .timer-bar {
      background: rgba(0,0,0,0.5);
      border-radius: 40px;
      padding: 10px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .timer-label { font-size: 12px; color: rgba(255,255,255,0.5); }
    .timer-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      color: #f59e0b;
    }
    .question-text {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 24px;
    }
    
    /* Options */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
      text-align: left;
    }
    .option-btn:active { transform: scale(0.98); }
    .option-btn.disabled, .option-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .option-letter {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(59,130,246,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      flex-shrink: 0;
    }
    .option-text { flex: 1; line-height: 1.3; }
    
    /* Feedback */
    .feedback {
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      text-align: center;
      font-weight: 600;
      animation: fadeIn 0.3s ease;
    }
    .feedback-correct {
      background: rgba(16,185,129,0.15);
      border: 2px solid rgba(16,185,129,0.4);
      color: #10b981;
    }
    .feedback-wrong {
      background: rgba(239,68,68,0.1);
      border: 2px solid rgba(239,68,68,0.3);
      color: #ef4444;
    }
    .next-btn {
      background: #3b82f6;
      border: none;
      border-radius: 40px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
    }
    
    /* Completion Screen */
    .completion-card {
      text-align: center;
      padding: 48px 24px;
    }
    .completion-icon { font-size: 80px; margin-bottom: 20px; }
    .completion-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      margin-bottom: 16px;
    }
    .final-stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 24px 0;
    }
    .final-stat {
      text-align: center;
    }
    .final-stat-value {
      font-size: 36px;
      font-weight: 800;
      color: #f59e0b;
    }
    .final-stat-label {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }
    
    /* Join Screen */
    .join-card {
      background: rgba(13,17,32,0.9);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 32px;
      padding: 40px 24px;
      text-align: center;
    }
    .join-logo {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .join-logo span { color: #3b82f6; }
    .join-sub {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 24px;
    }
    .join-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      color: #fff;
      font-size: 18px;
      text-align: center;
      margin: 12px 0;
    }
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin: 16px 0;
      max-height: 180px;
      overflow-y: auto;
    }
    .avatar-opt {
      font-size: 28px;
      padding: 8px;
      text-align: center;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.1s;
    }
    .avatar-opt.selected {
      background: rgba(59,130,246,0.3);
      border: 2px solid #3b82f6;
      transform: scale(1.05);
    }
    .btn {
      background: #3b82f6;
      border: none;
      border-radius: 16px;
      padding: 14px 24px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      transition: all 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .error-msg {
      color: #ef4444;
      font-size: 13px;
      margin-top: 12px;
    }
    
    .hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Connection Status */
    .conn-status {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 100;
    }
    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .conn-dot.connected { background: #10b981; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  </style>
</head>
<body>
<div class="container">
  <!-- Join Screen -->
  <div id="joinScreen">
    <div class="join-card">
      <div class="join-logo">PLAY<span>A</span>QUIZ</div>
      <div class="join-sub">Self-Paced Quiz Challenge</div>
      
      <input type="text" id="roomInput" class="join-input" placeholder="Room Code" maxlength="8" autocomplete="off">
      <input type="text" id="nameInput" class="join-input" placeholder="Your Name" maxlength="20">
      
      <div style="font-size: 12px; color: rgba(255,255,255,0.5); margin: 16px 0 8px; text-align: left;">Choose Avatar</div>
      <div class="avatar-grid" id="avatarGrid"></div>
      
      <button class="btn" onclick="joinGame()">🚀 Join Game</button>
      <div id="joinError" class="error-msg"></div>
    </div>
  </div>
  
  <!-- Quiz Screen -->
  <div id="quizScreen" class="hidden">
    <div class="header">
      <div class="player-info">
        <div class="player-avatar" id="playerAvatar">😎</div>
        <div class="player-name" id="playerName">Player</div>
      </div>
      <div class="score-chip" id="scoreDisplay">0 pts</div>
    </div>
    
    <div class="progress-section">
      <div class="progress-text">
        <span>📊 Progress</span>
        <span id="progressText">0 / 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
    </div>
    
    <div class="question-card">
      <div class="timer-bar">
        <span class="timer-label">⚡ SPEED BONUS</span>
        <span class="timer-value" id="timerDisplay">—</span>
      </div>
      <div class="question-text" id="questionText">Loading...</div>
      <div class="options-list" id="optionsList"></div>
      <div id="feedback" class="hidden"></div>
      <button class="next-btn hidden" id="nextBtn" onclick="loadNextQuestion()">Next Question →</button>
    </div>
  </div>
  
  <!-- Completion Screen -->
  <div id="completionScreen" class="hidden">
    <div class="join-card completion-card">
      <div class="completion-icon">🏆</div>
      <div class="completion-title">QUIZ COMPLETE!</div>
      <div class="final-stats">
        <div class="final-stat">
          <div class="final-stat-value" id="finalScore">0</div>
          <div class="final-stat-label">Total Points</div>
        </div>
        <div class="final-stat">
          <div class="final-stat-value" id="finalCorrect">0</div>
          <div class="final-stat-label">Correct</div>
        </div>
        <div class="final-stat">
          <div class="final-stat-value" id="finalAccuracy">0%</div>
          <div class="final-stat-label">Accuracy</div>
        </div>
      </div>
      <div style="display: flex; gap: 12px;">
        <button class="btn" onclick="viewLeaderboard()">🏆 View Leaderboard</button>
        <button class="btn btn-secondary" onclick="playAgain()">🔄 Play Again</button>
      </div>
    </div>
  </div>
  
  <!-- Connection Status -->
  <div class="conn-status" id="connStatus">
    <div class="conn-dot" id="connDot"></div>
    <span id="connText">Connecting...</span>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const AVATARS = ['😎','🦁','🐯','🐱','🐶','🐺','🦊','🐸','🐧','🐙','🦄','🐲','🚀','⭐','🔥','⚡','🎮','🏆','💎','🌈'];

let SESSION_ID = null;
let myPlayer = null;
let questions = [];
let currentIndex = 0;
let score = 0;
let correctCount = 0;
let questionStartTime = null;
let answered = false;
let timerInterval = null;
let reconnectAttempts = 0;
let realtimeChannel = null;

// Build avatar grid
function buildAvatarGrid() {
  const grid = document.getElementById('avatarGrid');
  grid.innerHTML = AVATARS.map(a => `<div class="avatar-opt" onclick="selectAvatar(this, '${a}')">${a}</div>`).join('');
}
let selectedAvatar = '😎';
function selectAvatar(el, avatar) {
  document.querySelectorAll('.avatar-opt').forEach(opt => opt.classList.remove('selected'));
  el.classList.add('selected');
  selectedAvatar = avatar;
}

// Update connection status
function updateConnectionStatus(connected, message) {
  const dot = document.getElementById('connDot');
  const text = document.getElementById('connText');
  if (connected) {
    dot.classList.add('connected');
    text.innerText = message || 'Connected';
  } else {
    dot.classList.remove('connected');
    text.innerText = message || 'Reconnecting...';
  }
}

// Check connection
async function checkConnection() {
  try {
    const { error } = await sb.from('game_sessions').select('id').limit(1);
    if (!error) {
      updateConnectionStatus(true, 'Connected');
      reconnectAttempts = 0;
      return true;
    }
    throw error;
  } catch(e) {
    updateConnectionStatus(false, 'Reconnecting...');
    return false;
  }
}

// Join game
async function joinGame() {
  const roomCode = document.getElementById('roomInput').value.trim().toUpperCase();
  const playerName = document.getElementById('nameInput').value.trim();
  
  if (!roomCode) { showError('Enter room code'); return; }
  if (!playerName || playerName.length < 2) { showError('Enter your name (min 2 chars)'); return; }
  
  const joinBtn = document.querySelector('#joinScreen .btn');
  joinBtn.disabled = true;
  joinBtn.innerText = 'Joining...';
  
  try {
    // Find session
    const { data: session, error: sessionError } = await sb
      .from('game_sessions')
      .select('id, status')
      .eq('room_code', roomCode)
      .maybeSingle();
    
    if (sessionError || !session) {
      showError('Room not found');
      joinBtn.disabled = false;
      joinBtn.innerText = '🚀 Join Game';
      return;
    }
    
    SESSION_ID = session.id;
    
    // Check if name exists
    const { data: existing, error: existingError } = await sb
      .from('players')
      .select('id')
      .eq('session_id', SESSION_ID)
      .eq('name', playerName)
      .maybeSingle();
    
    if (existing) {
      showError('Name already taken');
      joinBtn.disabled = false;
      joinBtn.innerText = '🚀 Join Game';
      return;
    }
    
    // Create player
    const { data: player, error: playerError } = await sb
      .from('players')
      .insert({
        session_id: SESSION_ID,
        name: playerName,
        avatar_color: selectedAvatar,
        score: 0,
        correct_count: 0,
        current_q_index: 0
      })
      .select()
      .single();
    
    if (playerError) {
      showError('Could not join: ' + playerError.message);
      joinBtn.disabled = false;
      joinBtn.innerText = '🚀 Join Game';
      return;
    }
    
    myPlayer = player;
    localStorage.setItem('sp_player', JSON.stringify({ 
      id: myPlayer.id, 
      session: SESSION_ID, 
      name: playerName,
      avatar: selectedAvatar 
    }));
    
    // Load questions
    const { data: qs, error: qError } = await sb
      .from('questions')
      .select('*')
      .order('created_at');
    
    if (qError) {
      showError('Error loading questions');
      return;
    }
    
    questions = qs || [];
    
    if (questions.length === 0) {
      showError('No questions available. Please wait for admin to add questions.');
      return;
    }
    
    // Show quiz screen
    document.getElementById('joinScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');
    document.getElementById('playerAvatar').innerText = selectedAvatar;
    document.getElementById('playerName').innerText = playerName;
    document.getElementById('scoreDisplay').innerText = '0 pts';
    
    // Start from saved progress or beginning
    const savedIndex = myPlayer.current_q_index || 0;
    await loadQuestion(savedIndex);
    
    // Setup realtime for score updates
    setupRealtime();
    
  } catch (err) {
    console.error('Join error:', err);
    showError('Connection error. Please try again.');
  } finally {
    joinBtn.disabled = false;
    joinBtn.innerText = '🚀 Join Game';
  }
}

async function loadQuestion(index) {
  if (index >= questions.length) {
    await completeQuiz();
    return;
  }
  
  currentIndex = index;
  answered = false;
  if (timerInterval) clearInterval(timerInterval);
  
  const q = questions[index];
  document.getElementById('questionText').innerHTML = escapeHtml(q.question_text);
  document.getElementById('progressText').innerHTML = `${index + 1} / ${questions.length}`;
  document.getElementById('progressFill').style.width = `${((index) / questions.length) * 100}%`;
  document.getElementById('scoreDisplay').innerHTML = `${score} pts`;
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
  
  const letters = ['A', 'B', 'C', 'D'];
  const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
  document.getElementById('optionsList').innerHTML = opts.map((opt, i) => `
    <button class="option-btn" onclick="submitAnswer(${i})">
      <div class="option-letter">${letters[i]}</div>
      <div class="option-text">${escapeHtml(opt)}</div>
    </button>
  `).join('');
  
  // Start timer for speed bonus
  questionStartTime = Date.now();
  const baseTime = 30;
  updateTimerDisplay(baseTime);
  
  timerInterval = setInterval(() => {
    const elapsed = (Date.now() - questionStartTime) / 1000;
    const remaining = Math.max(0, baseTime - elapsed);
    updateTimerDisplay(remaining);
  }, 100);
}

function updateTimerDisplay(remaining) {
  const display = document.getElementById('timerDisplay');
  if (remaining <= 0) {
    display.innerText = '0s';
    display.style.color = '#ef4444';
  } else {
    display.innerText = `${Math.ceil(remaining)}s`;
    if (remaining <= 5) display.style.color = '#ef4444';
    else if (remaining <= 10) display.style.color = '#f59e0b';
    else display.style.color = '#10b981';
  }
}

async function submitAnswer(selectedIdx) {
  if (answered) return;
  answered = true;
  if (timerInterval) clearInterval(timerInterval);
  
  const q = questions[currentIndex];
  const isCorrect = (selectedIdx === q.correct_option);
  const elapsed = (Date.now() - questionStartTime) / 1000;
  const basePoints = q.points || 100;
  
  // Speed bonus: faster = more points
  let pointsEarned = 0;
  if (isCorrect) {
    const speedBonus = Math.max(0.3, Math.min(1.0, 1 - (elapsed / 35)));
    pointsEarned = Math.round(basePoints * speedBonus);
    score += pointsEarned;
    correctCount++;
  }
  
  // Update player progress in DB
  try {
    await sb.from('players').update({
      score: score,
      correct_count: correctCount,
      current_q_index: currentIndex + 1
    }).eq('id', myPlayer.id);
  } catch(e) {
    console.log('Score update error (may not affect gameplay):', e);
  }
  
  // Save answer
  try {
    await sb.from('answers').insert({
      session_id: SESSION_ID,
      question_id: q.id,
      player_id: myPlayer.id,
      chosen_option: selectedIdx,
      is_correct: isCorrect,
      points_earned: pointsEarned,
      time_taken_ms: elapsed * 1000
    });
  } catch(e) {
    console.log('Answer save error:', e);
  }
  
  // Show feedback
  const letters = ['A', 'B', 'C', 'D'];
  const feedbackDiv = document.getElementById('feedback');
  feedbackDiv.classList.remove('hidden');
  if (isCorrect) {
    feedbackDiv.className = 'feedback feedback-correct';
    const bonusText = elapsed < 10 ? ' ⚡ Speed bonus!' : '';
    feedbackDiv.innerHTML = `✅ Correct! +${pointsEarned} points${bonusText}`;
    
    // Play correct sound effect (simple beep)
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g);
      g.connect(ctx.destination);
      o.frequency.value = 880;
      g.gain.value = 0.1;
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      o.start();
      o.stop(ctx.currentTime + 0.3);
    } catch(e) {}
  } else {
    feedbackDiv.className = 'feedback feedback-wrong';
    const correctLetter = letters[q.correct_option];
    const correctText = q[`option_${String.fromCharCode(97 + q.correct_option)}`];
    feedbackDiv.innerHTML = `❌ Wrong! Correct answer: ${correctLetter}. ${escapeHtml(correctText)}`;
  }
  
  // Disable options
  document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
  
  // Show next button
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('scoreDisplay').innerHTML = `${score} pts`;
}

async function loadNextQuestion() {
  currentIndex++;
  if (currentIndex < questions.length) {
    await loadQuestion(currentIndex);
  } else {
    await completeQuiz();
  }
}

async function completeQuiz() {
  if (timerInterval) clearInterval(timerInterval);
  
  // Mark as completed (if column exists)
  try {
    await sb.from('players').update({
      completed: true,
      completed_at: new Date()
    }).eq('id', myPlayer.id);
  } catch(e) {
    // Column might not exist, just log
    console.log('Completed status not saved (column may not exist)');
  }
  
  const accuracy = questions.length > 0 ? Math.round((correctCount / questions.length) * 100) : 0;
  
  document.getElementById('finalScore').innerText = score;
  document.getElementById('finalCorrect').innerText = `${correctCount}/${questions.length}`;
  document.getElementById('finalAccuracy').innerText = `${accuracy}%`;
  
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('completionScreen').classList.remove('hidden');
}

function viewLeaderboard() {
  if (SESSION_ID) {
    window.open(`foh-sp.html?session=${SESSION_ID}&room=${ROOM_CODE || ''}`, '_blank');
  }
}

function playAgain() {
  localStorage.removeItem('sp_player');
  location.reload();
}

function showError(msg) {
  const errDiv = document.getElementById('joinError');
  errDiv.innerText = msg;
  setTimeout(() => errDiv.innerText = '', 3000);
}

function setupRealtime() {
  if (realtimeChannel) {
    try { sb.removeChannel(realtimeChannel); } catch(e) {}
  }
  
  realtimeChannel = sb.channel(`player-${myPlayer.id}`);
  realtimeChannel
    .on('postgres_changes', {
      event: 'UPDATE',
      schema: 'public',
      table: 'players',
      filter: `id=eq.${myPlayer.id}`
    }, (payload) => {
      if (payload.new) {
        myPlayer = payload.new;
        score = myPlayer.score || 0;
        correctCount = myPlayer.correct_count || 0;
        document.getElementById('scoreDisplay').innerHTML = `${score} pts`;
      }
    })
    .subscribe();
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

// Auto-rejoin on page load
async function autoRejoin() {
  const saved = localStorage.getItem('sp_player');
  if (!saved) return;
  
  try {
    const data = JSON.parse(saved);
    const { data: player, error } = await sb
      .from('players')
      .select('*')
      .eq('id', data.id)
      .maybeSingle();
    
    if (error || !player) {
      localStorage.removeItem('sp_player');
      return;
    }
    
    if (player.is_eliminated) {
      localStorage.removeItem('sp_player');
      return;
    }
    
    myPlayer = player;
    SESSION_ID = player.session_id;
    score = player.score || 0;
    correctCount = player.correct_count || 0;
    selectedAvatar = player.avatar_color || '😎';
    
    // Get session to find room code
    const { data: session } = await sb
      .from('game_sessions')
      .select('room_code')
      .eq('id', SESSION_ID)
      .single();
    
    if (session) {
      window.ROOM_CODE = session.room_code;
    }
    
    // Load questions
    const { data: qs } = await sb.from('questions').select('*').order('created_at');
    questions = qs || [];
    
    if (questions.length === 0) {
      showError('No questions available');
      return;
    }
    
    document.getElementById('joinScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');
    document.getElementById('playerAvatar').innerText = selectedAvatar;
    document.getElementById('playerName').innerText = player.name;
    document.getElementById('scoreDisplay').innerHTML = `${score} pts`;
    
    const savedIndex = player.current_q_index || 0;
    await loadQuestion(savedIndex);
    setupRealtime();
    updateConnectionStatus(true, 'Connected');
    
  } catch(e) {
    console.log('Auto-rejoin failed:', e);
    localStorage.removeItem('sp_player');
  }
}

const roomFromUrl = urlParams.get('room');
if (roomFromUrl) {
  document.getElementById('roomInput').value = roomFromUrl.toUpperCase();
}

// Auto-rejoin or show join screen
