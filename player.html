   <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayAQuiz — Production</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --accent:#00f0ff; --error:#f43f5e; --success:#10b981;
}
body{font-family:sans-serif;background:#05050f;color:white;display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#111;padding:24px;border-radius:16px;width:320px}
input,button{width:100%;padding:10px;margin-top:10px;border-radius:8px;border:none}
button{background:var(--accent);cursor:pointer}
.error{border:1px solid var(--error)}
.success{border:1px solid var(--success)}
.badge{margin-top:10px;font-size:14px;display:none}
.badge.show{display:block}
.confetti{position:fixed;top:-20px;font-size:20px;transition:2.5s linear}
</style>
</head>
<body>
<div class="card">
  <input id="session" placeholder="Session ID">
  <button id="verify">Verify</button>
  <div class="badge" id="badge"></div>
</div>

<script>
// ───────────────────────────────
// CONFIG
// ───────────────────────────────
const sb = supabase.createClient('YOUR_URL','YOUR_KEY');

// ───────────────────────────────
// SERVICES
// ───────────────────────────────
const SessionService = {
  async verify(code){
    return retry(async ()=>{
      return await sb.from('game_sessions')
        .select('*')
        .ilike('room_code', code)
        .maybeSingle();
    });
  }
};

// ───────────────────────────────
// RETRY + TIMEOUT
// ───────────────────────────────
async function retry(fn, retries=3){
  try{
    return await timeout(fn(),5000);
  }catch(e){
    if(retries<=0) throw e;
    return retry(fn,retries-1);
  }
}

function timeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timeout')),ms))
  ]);
}

// ───────────────────────────────
// STATE
// ───────────────────────────────
let sessionCache = localStorage.getItem('session');

// ───────────────────────────────
// UI
// ───────────────────────────────
const UI = {
  setLoading(btn){btn.disabled=true;btn.textContent='Verifying...'},
  reset(btn){btn.disabled=false;btn.textContent='Verify'},
  error(input,msg){input.classList.add('error');alert(msg)},
  success(input){input.classList.remove('error');input.classList.add('success')}
};

// ───────────────────────────────
// CONFETTI (optimized)
// ───────────────────────────────
function confetti(){
  const frag = document.createDocumentFragment();
  for(let i=0;i<40;i++){
    const el=document.createElement('div');
    el.className='confetti';
    el.textContent=['🎉','✨','🔥'][Math.floor(Math.random()*3)];
    el.style.left=Math.random()*100+'vw';
    frag.appendChild(el);
    requestAnimationFrame(()=>{
      el.style.transform=`translateY(${window.innerHeight}px)`;
      el.style.opacity=0;
    });
    setTimeout(()=>el.remove(),2500);
  }
  document.body.appendChild(frag);
}

// ───────────────────────────────
// CONTROLLER
// ───────────────────────────────
const input = document.getElementById('session');
const btn = document.getElementById('verify');
const badge = document.getElementById('badge');

async function handleVerify(){
  const code = input.value.trim().toUpperCase();
  if(!code) return UI.error(input,'Enter session');

  UI.setLoading(btn);

  try{
    const {data,error} = await SessionService.verify(code);

    if(error || !data) return UI.error(input,'Session not found');
    if(data.status==='ended') return UI.error(input,'Session ended');

    UI.success(input);
    localStorage.setItem('session',data.id);

    badge.classList.add('show');
    badge.innerHTML = `Verified: <b>${data.room_code}</b>`;

    confetti();

  }catch(e){
    UI.error(input,e.message);
  }

  UI.reset(btn);
}

// ───────────────────────────────
// DEBOUNCE + AUTO VERIFY
// ───────────────────────────────
let debounceTimer;
input.addEventListener('input',()=>{
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(()=>{
    if(input.value.length>=5) handleVerify();
  },600);
});

btn.onclick = handleVerify;

// ───────────────────────────────
// RESTORE SESSION
// ───────────────────────────────
if(sessionCache){
  input.value = sessionCache;
  handleVerify();
}
</script>
</body>
</html>
