<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Join & Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0c15 0%, #0f111a 100%);
      font-family: 'Inter', sans-serif;
      color: #eef2ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    /* Container */
    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
    /* Cards */
    .card {
      background: rgba(17, 19, 31, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 32px;
      padding: 32px;
      transition: all 0.3s ease;
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .logo span { color: #3b82f6; }
    .sub {
      text-align: center;
      color: #8b92a8;
      font-size: 14px;
      margin-bottom: 28px;
    }
    /* Form */
    .input-group {
      margin-bottom: 20px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: #8b92a8;
      display: block;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      background: #0a0c15;
      border: 1px solid #2a2f3f;
      border-radius: 16px;
      padding: 14px 16px;
      color: #eef2ff;
      font-size: 16px;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus { border-color: #3b82f6; }
    button {
      width: 100%;
      background: #3b82f6;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    button:active { transform: scale(0.97); }
    button.secondary { background: #2a2f3f; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Emoji grid */
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 12px;
      max-height: 160px;
      overflow-y: auto;
      padding: 4px;
    }
    .emoji-option {
      background: #0a0c15;
      border: 1px solid #2a2f3f;
      border-radius: 12px;
      padding: 10px;
      font-size: 28px;
      text-align: center;
      cursor: pointer;
      transition: all 0.1s;
    }
    .emoji-option.selected {
      border-color: #3b82f6;
      background: rgba(59,130,246,0.15);
      transform: scale(1.02);
    }
    /* Waiting screen */
    .waiting-animation {
      text-align: center;
      animation: pulse 1.5s infinite;
    }
    .waiting-emoji {
      font-size: 72px;
      margin-bottom: 20px;
      display: inline-block;
    }
    .player-name-display {
      font-size: 24px;
      font-weight: 700;
      margin: 12px 0;
    }
    .room-code-large {
      font-family: monospace;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 4px;
      background: #1e293b;
      display: inline-block;
      padding: 8px 24px;
      border-radius: 60px;
      margin: 16px 0;
    }
    /* Quiz screen */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .question-counter {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
    }
    .timer-circle {
      position: relative;
      width: 56px;
      height: 56px;
    }
    .timer-svg {
      transform: rotate(-90deg);
    }
    .timer-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-weight: 800;
    }
    .question-text {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      margin: 20px 0;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .option-btn {
      background: #0a0c15;
      border: 2px solid #2a2f3f;
      border-radius: 20px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .option-btn:hover:not(:disabled) {
      border-color: #3b82f6;
      background: rgba(59,130,246,0.1);
    }
    .option-letter {
      width: 36px;
      height: 36px;
      background: #1e293b;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
    }
    .option-btn.selected {
      border-color: #3b82f6;
      background: rgba(59,130,246,0.15);
    }
    .option-btn.correct {
      border-color: #10b981;
      background: rgba(16,185,129,0.15);
    }
    .option-btn.wrong {
      border-color: #ef4444;
      background: rgba(239,68,68,0.1);
      opacity: 0.6;
    }
    .feedback-card {
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 20px;
      padding: 20px;
      margin-top: 16px;
      text-align: center;
      animation: fadeIn 0.3s;
    }
    .feedback-card.correct { background: rgba(16,185,129,0.1); border-color: #10b981; }
    .feedback-card.wrong { background: rgba(239,68,68,0.1); border-color: #ef4444; }
    .pending-box {
      background: #1e293b;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      margin-top: 16px;
    }
    .score-badge {
      background: #f59e0b;
      color: #0a0c15;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 14px;
    }
    /* Result screen */
    .result-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 24px 0;
    }
    .stat-box {
      background: #0a0c15;
      border-radius: 20px;
      padding: 16px;
      text-align: center;
    }
    .stat-value {
      font-size: 32px;
      font-weight: 800;
      color: #3b82f6;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .hidden { display: none; }
    .mt-4 { margin-top: 16px; }
    .flex { display: flex; gap: 12px; align-items: center; }
  </style>
</head>
<body>
<div class="container" id="app">
  <!-- JOIN SCREEN -->
  <div id="joinScreen">
    <div class="card">
      <div class="logo">PLAY<span>A</span>QUIZ</div>
      <div class="sub">Enter room code to join</div>
      
      <div class="input-group">
        <label>🎮 ROOM CODE</label>
        <input type="text" id="roomCodeInput" placeholder="e.g., A7B3F2" maxlength="10" autocomplete="off" style="text-transform:uppercase">
      </div>
      
      <div class="input-group">
        <label>👤 YOUR NAME</label>
        <input type="text" id="playerNameInput" placeholder="Enter your name" maxlength="20">
      </div>
      
      <div class="input-group">
        <label>😎 CHOOSE AVATAR</label>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>
      
      <button id="joinBtn" onclick="joinGame()">🚀 JOIN GAME</button>
      <div id="joinError" style="color:#ef4444; font-size:13px; margin-top:12px; text-align:center"></div>
    </div>
  </div>

  <!-- WAITING SCREEN -->
  <div id="waitingScreen" class="hidden">
    <div class="card" style="text-align:center">
      <div class="waiting-animation">
        <div class="waiting-emoji" id="waitingEmoji">😎</div>
        <div class="player-name-display" id="waitingName">Player</div>
        <div class="sub">Waiting for host to start...</div>
        <div class="room-code-large" id="waitingRoomCode">——</div>
        <div class="flex" style="justify-content:center; margin-top:20px">
          <span>👥 Players: </span><span id="playerCountWait">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" class="hidden">
    <div class="card">
      <div class="quiz-header">
        <div class="question-counter" id="questionCounter">Q1 / 0</div>
        <div class="score-badge" id="scoreDisplay">0 pts</div>
        <div class="timer-circle">
          <svg class="timer-svg" width="56" height="56" viewBox="0 0 56 56">
            <circle cx="28" cy="28" r="24" fill="none" stroke="#2a2f3f" stroke-width="4"/>
            <circle id="timerRing" cx="28" cy="28" r="24" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-text" id="timerText">0</div>
        </div>
      </div>
      
      <div class="question-text" id="questionText">Loading...</div>
      
      <div class="options-list" id="optionsList"></div>
      
      <!-- Pending / Feedback -->
      <div id="pendingBox" class="pending-box hidden">
        <span>⏳</span> Answer locked! Waiting for reveal...
      </div>
      <div id="feedbackBox" class="feedback-card hidden"></div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="hidden">
    <div class="card" style="text-align:center">
      <div style="font-size: 64px; margin-bottom: 16px;">🏆</div>
      <div style="font-size: 28px; font-weight: 800;">Game Over!</div>
      <div class="result-stats">
        <div class="stat-box">
          <div class="stat-value" id="finalScore">0</div>
          <div>Total Points</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="finalCorrect">0</div>
          <div>Correct Answers</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="finalRank">—</div>
          <div>Rank</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="finalAccuracy">0%</div>
          <div>Accuracy</div>
        </div>
      </div>
      <button onclick="playAgain()">🔄 PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  // Available emojis
  const AVATARS = [
    '😎', '🦁', '🐯', '🐱', '🐶', '🐺', '🦊', '🐸', '🐧', '🐙', '🦄', '🐲', 
    '🚀', '⭐', '🔥', '⚡', '🎮', '🏆', '💎', '🌈', '🍕', '🎸', '👾', '🤖'
  ];
  
  let selectedEmoji = '😎';
  let currentSessionId = null;
  let currentPlayer = null;
  let currentQuestion = null;
  let currentQuestionIndex = -1;
  let totalQuestions = 0;
  let answered = false;
  let timerInterval = null;
  let timeLeft = 0;
  let totalTime = 0;
  let selectedOption = -1;
  let playerScore = 0;
  let correctCount = 0;
  let questionsList = [];
  
  // Build emoji grid
  function buildEmojiGrid() {
    const grid = document.getElementById('emojiGrid');
    grid.innerHTML = AVATARS.map(emoji => `
      <div class="emoji-option ${selectedEmoji === emoji ? 'selected' : ''}" onclick="selectEmoji('${emoji}')">
        ${emoji}
      </div>
    `).join('');
  }
  
  function selectEmoji(emoji) {
    selectedEmoji = emoji;
    document.querySelectorAll('.emoji-option').forEach(el => {
      el.classList.remove('selected');
      if (el.innerText === emoji) el.classList.add('selected');
    });
  }
  
  // Join game
  async function joinGame() {
    const roomCode = document.getElementById('roomCodeInput').value.trim().toUpperCase();
    const playerName = document.getElementById('playerNameInput').value.trim();
    
    if (!roomCode) { showJoinError('Enter room code'); return; }
    if (!playerName) { showJoinError('Enter your name'); return; }
    if (playerName.length < 2) { showJoinError('Name too short'); return; }
    
    document.getElementById('joinBtn').disabled = true;
    document.getElementById('joinBtn').innerText = 'Joining...';
    
    // Find session by room code
    const { data: session, error: sessError } = await sb
      .from('game_sessions')
      .select('*')
      .eq('room_code', roomCode)
      .maybeSingle();
    
    if (sessError || !session) {
      showJoinError('Invalid room code. Check and try again.');
      resetJoinBtn();
      return;
    }
    
    if (session.status === 'ended') {
      showJoinError('This game has already ended.');
      resetJoinBtn();
      return;
    }
    
    currentSessionId = session.id;
    
    // Check if name exists
    const { data: existing } = await sb
      .from('players')
      .select('id')
      .eq('session_id', currentSessionId)
      .eq('name', playerName);
    
    if (existing && existing.length > 0) {
      showJoinError('Name already taken. Choose another.');
      resetJoinBtn();
      return;
    }
    
    // Create player
    const { data: player, error: playerError } = await sb
      .from('players')
      .insert({
        session_id: currentSessionId,
        name: playerName,
        avatar_color: selectedEmoji,
        score: 0,
        correct_count: 0,
        is_eliminated: false
      })
      .select()
      .single();
    
    if (playerError) {
      showJoinError('Failed to join. Try again.');
      resetJoinBtn();
      return;
    }
    
    currentPlayer = player;
    localStorage.setItem('paq_player_id', currentPlayer.id);
    localStorage.setItem('paq_session_id', currentSessionId);
    
    // Load questions and setup
    await loadGameData();
    setupRealtime();
    showWaitingScreen();
  }
  
  async function loadGameData() {
    const { data: qs } = await sb
      .from('questions')
      .select('*')
      .eq('session_id', currentSessionId)
      .order('sort_order');
    questionsList = qs || [];
    totalQuestions = questionsList.length;
  }
  
  function setupRealtime() {
    // Listen for game events
    sb.channel(`player-${currentPlayer.id}`)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'game_events',
        filter: `session_id=eq.${currentSessionId}`
      }, (payload) => handleGameEvent(payload.new))
      .on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'players',
        filter: `id=eq.${currentPlayer.id}`
      }, (payload) => {
        if (payload.new.is_eliminated) {
          alert('You have been eliminated from the game!');
          showResultScreen();
        }
      })
      .subscribe();
    
    // Session status updates
    sb.channel(`session-${currentSessionId}`)
      .on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'game_sessions',
        filter: `id=eq.${currentSessionId}`
      }, (payload) => {
        if (payload.new.status === 'ended') showResultScreen();
        if (payload.new.status === 'waiting' && !currentQuestion) showWaitingScreen();
      })
      .subscribe();
      
    // Player count
    refreshPlayerCount();
    setInterval(refreshPlayerCount, 3000);
  }
  
  function handleGameEvent(event) {
    console.log('Event:', event.event_type);
    
    switch(event.event_type) {
      case 'new_question':
        // Store question data
        currentQuestion = event.payload.question;
        currentQuestionIndex = event.payload.qIdx;
        totalQuestions = event.payload.total;
        answered = false;
        selectedOption = -1;
        break;
        
      case 'show_question_view':
        displayQuestion(currentQuestion, currentQuestionIndex);
        showQuizScreen();
        break;
        
      case 'answer_reveal':
        revealAndScore(event.payload.correctOption);
        break;
        
      case 'game_ended':
        showResultScreen();
        break;
        
      case 'game_reset':
        resetPlayerState();
        showWaitingScreen();
        break;
        
      case 'category_banner':
        // Just visual on FOH, not needed for player
        break;
    }
  }
  
  function displayQuestion(question, idx) {
    if (!question) return;
    document.getElementById('questionCounter').innerHTML = `Q${idx+1} / ${totalQuestions}`;
    document.getElementById('questionText').innerHTML = question.question_text;
    document.getElementById('scoreDisplay').innerHTML = `${playerScore} pts`;
    
    const options = [
      question.option_a, question.option_b, 
      question.option_c, question.option_d
    ];
    const letters = ['A', 'B', 'C', 'D'];
    const container = document.getElementById('optionsList');
    container.innerHTML = options.map((opt, i) => `
      <div class="option-btn" onclick="submitAnswer(${i})" data-opt="${i}">
        <div class="option-letter">${letters[i]}</div>
        <div>${opt}</div>
      </div>
    `).join('');
    
    // Reset timer
    totalTime = question.time_limit || 20;
    timeLeft = totalTime;
    startTimer();
    
    // Hide feedback and pending
    document.getElementById('pendingBox').classList.add('hidden');
    document.getElementById('feedbackBox').classList.add('hidden');
    answered = false;
    
    // Enable all options
    document.querySelectorAll('.option-btn').forEach(btn => {
      btn.style.pointerEvents = 'auto';
      btn.classList.remove('selected', 'correct', 'wrong');
    });
  }
  
  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    updateTimerUI();
    timerInterval = setInterval(() => {
      if (timeLeft > 0 && !answered) {
        timeLeft--;
        updateTimerUI();
        if (timeLeft === 0) {
          // Time's up - auto submit empty answer
          clearInterval(timerInterval);
          if (!answered) submitAnswer(-1);
        }
      } else if (answered) {
        clearInterval(timerInterval);
      }
    }, 1000);
  }
  
  function updateTimerUI() {
    const ring = document.getElementById('timerRing');
    const timerText = document.getElementById('timerText');
    const circumference = 2 * Math.PI * 24;
    const progress = timeLeft / totalTime;
    const dashoffset = circumference * (1 - progress);
    ring.style.strokeDashoffset = dashoffset;
    timerText.innerText = timeLeft;
    
    if (timeLeft <= 5) ring.style.stroke = '#ef4444';
    else if (timeLeft <= 10) ring.style.stroke = '#f59e0b';
    else ring.style.stroke = '#3b82f6';
  }
  
  async function submitAnswer(optionIdx) {
    if (answered) return;
    if (!currentQuestion) return;
    
    answered = true;
    clearInterval(timerInterval);
    selectedOption = optionIdx;
    
    // Highlight selected option
    document.querySelectorAll('.option-btn').forEach(btn => {
      btn.style.pointerEvents = 'none';
      if (parseInt(btn.dataset.opt) === optionIdx) {
        btn.classList.add('selected');
      }
    });
    
    const isCorrect = (optionIdx === currentQuestion.correct_option);
    const pointsEarned = isCorrect ? Math.round((currentQuestion.points || 100) * (timeLeft / totalTime)) : 0;
    
    // Save answer to DB
    await sb.from('answers').insert({
      session_id: currentSessionId,
      question_id: currentQuestion.id,
      player_id: currentPlayer.id,
      chosen_option: optionIdx,
      is_correct: isCorrect,
      points_earned: pointsEarned,
      time_taken_ms: (totalTime - timeLeft) * 1000
    });
    
    // Show pending
    document.getElementById('pendingBox').classList.remove('hidden');
  }
  
  async function revealAndScore(correctOption) {
    if (!currentQuestion) return;
    
    document.getElementById('pendingBox').classList.add('hidden');
    
    // Find player's answer
    const { data: myAnswer } = await sb
      .from('answers')
      .select('*')
      .eq('question_id', currentQuestion.id)
      .eq('player_id', currentPlayer.id)
      .single();
    
    const isCorrect = myAnswer?.is_correct || false;
    const earned = myAnswer?.points_earned || 0;
    
    if (isCorrect) {
      playerScore += earned;
      correctCount++;
      await sb.from('players').update({ score: playerScore, correct_count: correctCount }).eq('id', currentPlayer.id);
      document.getElementById('scoreDisplay').innerHTML = `${playerScore} pts`;
    }
    
    // Highlight correct/wrong on options
    document.querySelectorAll('.option-btn').forEach((btn, idx) => {
      if (idx === correctOption) btn.classList.add('correct');
      else if (idx === selectedOption && selectedOption !== correctOption) btn.classList.add('wrong');
    });
    
    // Show feedback
    const feedbackBox = document.getElementById('feedbackBox');
    feedbackBox.classList.remove('hidden', 'correct', 'wrong');
    if (isCorrect) {
      feedbackBox.classList.add('correct');
      feedbackBox.innerHTML = `<span>🎉 CORRECT! +${earned} points</span>`;
    } else {
      feedbackBox.classList.add('wrong');
      const correctLetter = String.fromCharCode(65 + correctOption);
      feedbackBox.innerHTML = `<span>❌ WRONG! The correct answer was ${correctLetter}.</span>`;
    }
    
    // Update player data locally
    currentPlayer.score = playerScore;
    currentPlayer.correct_count = correctCount;
  }
  
  async function refreshPlayerCount() {
    if (!currentSessionId) return;
    const { count } = await sb
      .from('players')
      .select('*', { count: 'exact', head: true })
      .eq('session_id', currentSessionId);
    document.getElementById('playerCountWait').innerText = count || 0;
  }
  
  async function showResultScreen() {
    if (timerInterval) clearInterval(timerInterval);
    
    // Get final rank
    const { data: allPlayers } = await sb
      .from('players')
      .select('id, score')
      .eq('session_id', currentSessionId)
      .order('score', { ascending: false });
    
    const rank = (allPlayers || []).findIndex(p => p.id === currentPlayer.id) + 1;
    const accuracy = totalQuestions > 0 ? Math.round((correctCount / totalQuestions) * 100) : 0;
    
    document.getElementById('finalScore').innerHTML = playerScore;
    document.getElementById('finalCorrect').innerHTML = `${correctCount}/${totalQuestions}`;
    document.getElementById('finalRank').innerHTML = `#${rank}`;
    document.getElementById('finalAccuracy').innerHTML = `${accuracy}%`;
    
    showScreen('resultScreen');
  }
  
  function resetPlayerState() {
    playerScore = 0;
    correctCount = 0;
    currentQuestion = null;
    answered = false;
    if (timerInterval) clearInterval(timerInterval);
  }
  
  function playAgain() {
    localStorage.removeItem('paq_player_id');
    localStorage.removeItem('paq_session_id');
    currentSessionId = null;
    currentPlayer = null;
    resetPlayerState();
    document.getElementById('roomCodeInput').value = '';
    document.getElementById('playerNameInput').value = '';
    showScreen('joinScreen');
    resetJoinBtn();
  }
  
  function showWaitingScreen() {
    document.getElementById('waitingEmoji').innerHTML = currentPlayer?.avatar_color || '😎';
    document.getElementById('waitingName').innerHTML = currentPlayer?.name || 'Player';
    document.getElementById('waitingRoomCode').innerHTML = '???';
    // Get room code
    sb.from('game_sessions').select('room_code').eq('id', currentSessionId).single().then(({ data }) => {
      if (data) document.getElementById('waitingRoomCode').innerHTML = data.room_code;
    });
    showScreen('waitingScreen');
  }
  
  function showQuizScreen() { showScreen('quizScreen'); }
  
  function showScreen(screenId) {
    document.getElementById('joinScreen').classList.add('hidden');
    document.getElementById('waitingScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.add('hidden');
    document.getElementById(screenId).classList.remove('hidden');
  }
  
  function showJoinError(msg) {
    const errDiv = document.getElementById('joinError');
    errDiv.innerText = msg;
    setTimeout(() => errDiv.innerText = '', 3000);
  }
  
  function resetJoinBtn() {
    document.getElementById('joinBtn').disabled = false;
    document.getElementById('joinBtn').innerText = '🚀 JOIN GAME';
  }
  
  // Check for existing player session
  async function checkExistingSession() {
    const savedPlayerId = localStorage.getItem('paq_player_id');
    const savedSessionId = localStorage.getItem('paq_session_id');
    if (savedPlayerId && savedSessionId) {
      const { data: player } = await sb.from('players').select('*').eq('id', savedPlayerId).maybeSingle();
      const { data: session } = await sb.from('game_sessions').select('*').eq('id', savedSessionId).maybeSingle();
      if (player && session && session.status !== 'ended') {
        currentPlayer = player;
        currentSessionId = savedSessionId;
        playerScore = player.score;
        correctCount = player.correct_count;
        await loadGameData();
        setupRealtime();
        if (session.status === 'active' || session.status === 'reveal') {
          showQuizScreen();
        } else {
          showWaitingScreen();
        }
        return true;
      }
    }
    return false;
  }
  
  // Initialize
  buildEmojiGrid();
  selectEmoji('😎');
  checkExistingSession().then(found => {
    if (!found) showScreen('joinScreen');
  });
  
  // Expose globals
  window.selectEmoji = selectEmoji;
  window.joinGame = joinGame;
  window.submitAnswer = submitAnswer;
  window.playAgain = playAgain;
</script>
</body>
</html>
