<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Final Round Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #03050b; --gold: #fbbf24; --green: #10b981;
      --red: #ef4444; --accent: #3b82f6; --purple: #a855f7;
      --text: #ffffff; --muted: rgba(255,255,255,0.5);
    }
    body { background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--text); height: 100vh; overflow: hidden; }
    .app { height: 100vh; display: flex; flex-direction: column; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; background: rgba(3,5,11,0.9); backdrop-filter: blur(16px); border-bottom: 2px solid rgba(251,191,36,0.4); }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 4px; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .room-display { font-family: 'JetBrains Mono', monospace; font-size: 22px; background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3); padding: 5px 20px; border-radius: 30px; color: var(--gold); letter-spacing: 3px; }
    .player-counter { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.6); padding: 5px 18px; border-radius: 40px; }
    .counter-num { font-family: monospace; font-size: 28px; font-weight: 800; color: var(--gold); }
    
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px; }
    .question-screen { text-align: center; max-width: 1100px; width: 100%; }
    .question-text { font-size: clamp(28px, 5vw, 56px); font-weight: 800; line-height: 1.4; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); border-radius: 28px; padding: 35px; margin-bottom: 30px; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    .opt-display { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 18px; text-align: left; display: flex; align-items: center; gap: 15px; font-size: 18px; }
    .opt-letter-big { width: 45px; height: 45px; border-radius: 12px; background: rgba(59,130,246,0.2); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; }
    .buzzer-open { margin-top: 25px; display: inline-flex; align-items: center; gap: 10px; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); padding: 10px 24px; border-radius: 50px; font-size: 16px; font-weight: 700; color: var(--green); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{ opacity: 1; } 50%{ opacity: 0.6; } }
    
    .buzzed-screen { text-align: center; }
    .buzzed-name { font-family: 'Bebas Neue', sans-serif; font-size: 80px; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .waiting-screen { text-align: center; }
    .waiting-room { font-family: 'JetBrains Mono', monospace; font-size: 64px; color: var(--gold); letter-spacing: 8px; margin-top: 20px; }
    
    .screen { display: none; animation: fadeIn 0.4s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .footer { padding: 10px 28px; text-align: center; font-size: 11px; color: rgba(255,255,255,0.25); border-top: 1px solid #0f1420; }
    .right-panel { position: fixed; right: 20px; top: 100px; width: 260px; background: rgba(6,8,18,0.85); backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); padding: 15px; }
    .right-panel-title { font-size: 12px; font-weight: 700; color: var(--gold); margin-bottom: 10px; text-align: center; }
    .player-bubble { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
    .bubble-avatar { font-size: 20px; }
    .bubble-name { flex: 1; }
    .bubble-score { color: var(--gold); font-family: monospace; font-weight: 700; }
  </style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="logo">PLAY<span style="color:var(--gold)">A</span>QUIZ</div>
    <div>⚡ FINAL ROUND</div>
    <div style="display: flex; gap: 15px; align-items: center;">
      <div class="player-counter"><span>👥</span><span class="counter-num" id="playerCount">0</span></div>
      <div class="room-display" id="roomDisplay">——</div>
    </div>
  </div>

  <div class="main">
    <div id="waitingScreen" class="screen active">
      <div class="waiting-screen">
        <div style="font-size: 70px; margin-bottom: 15px;">⚡</div>
        <div style="font-family: 'Bebas Neue', sans-serif; font-size: 44px;">FINAL ROUND</div>
        <div class="waiting-room" id="waitingRoomCode">——</div>
        <div style="margin-top: 25px; color: var(--muted);">Get ready for the ultimate battle!</div>
      </div>
    </div>

    <div id="questionScreen" class="screen">
      <div class="question-screen">
        <div class="question-text" id="questionText">Loading...</div>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="buzzer-open">🔴 BUZZERS ARE OPEN</div>
      </div>
    </div>

    <div id="buzzedScreen" class="screen">
      <div class="buzzed-screen">
        <div style="font-size: 50px; margin-bottom: 15px;">🔔</div>
        <div style="font-size: 22px; color: var(--gold); letter-spacing: 2px;">BUZZED IN</div>
        <div class="buzzed-name" id="buzzedName">—</div>
        <div style="font-size: 16px; color: var(--muted); margin-top: 15px;">is answering...</div>
      </div>
    </div>

    <div id="correctScreen" class="screen">
      <div class="question-screen">
        <div style="font-size: 80px; margin-bottom: 15px;">✅</div>
        <div style="font-size: 42px; font-weight: 800; color: var(--green);">CORRECT!</div>
        <div style="font-size: 20px; margin-top: 15px;" id="correctName">—</div>
      </div>
    </div>

    <div id="endedScreen" class="screen">
      <div class="question-screen">
        <div style="font-size: 70px; margin-bottom: 15px;">🏆</div>
        <div style="font-size: 44px; font-weight: 800;">GAME OVER</div>
        <div style="font-size: 22px; margin-top: 15px; color: var(--gold);" id="winnerName">—</div>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="right-panel-title">🏆 LIVE PLAYERS</div>
    <div id="playerListPanel"></div>
  </div>

  <div class="footer">
    <span>PlayAQuiz — Final Round</span>
    <span id="footerTime"></span>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let roomCode = null;
let realtimeChannel = null;
let currentPlayers = [];
const letters = ['A', 'B', 'C', 'D'];

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`${screenId}Screen`).classList.add('active');
}

function updatePlayerList(players) {
  const container = document.getElementById('playerListPanel');
  const count = document.getElementById('playerCount');
  
  currentPlayers = players || [];
  count.innerText = currentPlayers.length;
  
  if (currentPlayers.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--muted);padding:10px">No players yet</div>';
    return;
  }
  
  container.innerHTML = currentPlayers.map(p => `
    <div class="player-bubble">
      <div class="bubble-avatar">${p.avatar || '🎮'}</div>
      <div class="bubble-name">${p.name}</div>
      <div class="bubble-score">${p.score || 0}</div>
    </div>
  `).join('');
}

function handleBroadcast(event, payload) {
  console.log('FOH received:', event, payload);
  
  switch (event) {
    case 'round_started':
      showScreen('waiting');
      break;
      
    case 'player_list_update':
      updatePlayerList(payload.players);
      break;
      
    case 'question_open':
      document.getElementById('questionText').innerText = payload.question;
      
      // Render options if provided
      if (payload.options && payload.options.length === 4) {
        const optsHtml = payload.options.map((opt, i) => `
          <div class="opt-display">
            <div class="opt-letter-big">${letters[i]}</div>
            <div>${opt}</div>
          </div>
        `).join('');
        document.getElementById('optionsGrid').innerHTML = optsHtml;
      }
      showScreen('question');
      break;
      
    case 'buzz_confirmed':
      document.getElementById('buzzedName').innerHTML = `${payload.playerAvatar} ${payload.playerName}`;
      showScreen('buzzed');
      break;
      
    case 'correct':
      document.getElementById('correctName').innerHTML = `${payload.playerName} +${payload.points || 100} pts`;
      showScreen('correct');
      setTimeout(() => {
        if (document.getElementById('questionScreen').classList.contains('active')) return;
        showScreen('question');
      }, 2000);
      break;
      
    case 'wrong':
      showScreen('question');
      break;
      
    case 'next_question':
      showScreen('waiting');
      break;
      
    case 'reset_buzzers':
      showScreen('question');
      break;
      
    case 'round_ended':
      document.getElementById('winnerName').innerHTML = `${payload.winner?.avatar || '🏆'} ${payload.winner?.name || '—'}`;
      showScreen('ended');
      break;
  }
}

async function init() {
  setInterval(() => {
    document.getElementById('footerTime').innerText = new Date().toLocaleTimeString();
  }, 1000);
  
  const params = new URLSearchParams(window.location.search);
  roomCode = params.get('room') || localStorage.getItem('fr_room');
  if (!roomCode) {
    document.getElementById('waitingRoomCode').innerHTML = 'NO ROOM CODE';
    return;
  }
  
  document.getElementById('roomDisplay').innerText = roomCode;
  document.getElementById('waitingRoomCode').innerText = roomCode;
  
  realtimeChannel = sb.channel(`fr-${roomCode}`, { config: { broadcast: { self: false } } });
  realtimeChannel
    .on('broadcast', { event: 'round_started' }, ({ payload }) => handleBroadcast('round_started', payload))
    .on('broadcast', { event: 'player_list_update' }, ({ payload }) => handleBroadcast('player_list_update', payload))
    .on('broadcast', { event: 'question_open' }, ({ payload }) => handleBroadcast('question_open', payload))
    .on('broadcast', { event: 'buzz_confirmed' }, ({ payload }) => handleBroadcast('buzz_confirmed', payload))
    .on('broadcast', { event: 'correct' }, ({ payload }) => handleBroadcast('correct', payload))
    .on('broadcast', { event: 'wrong' }, ({ payload }) => handleBroadcast('wrong', payload))
    .on('broadcast', { event: 'next_question' }, ({ payload }) => handleBroadcast('next_question', payload))
    .on('broadcast', { event: 'reset_buzzers' }, ({ payload }) => handleBroadcast('reset_buzzers', payload))
    .on('broadcast', { event: 'eliminated' }, ({ payload }) => handleBroadcast('eliminated', payload))
    .on('broadcast', { event: 'round_ended' }, ({ payload }) => handleBroadcast('round_ended', payload))
    .subscribe();
}

init();
</script>
</body>
</html>
