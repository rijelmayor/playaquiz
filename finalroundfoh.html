<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayAQuiz — Final Round Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background:#03050b; color:white; font-family:'Space Grotesk',sans-serif; margin:0; height:100vh; overflow:hidden; }
    .room { font-size:120px; font-family:'Bebas Neue'; color:#fbbf24; text-align:center; margin-top:20vh; letter-spacing:12px; }
    .cat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:20px; padding:40px; }
    .cat-tile { background:rgba(168,85,247,0.15); border:3px solid #a855f7; border-radius:20px; padding:30px; text-align:center; font-size:28px; transition:all 0.4s; }
    .cat-tile:hover { transform:scale(1.08); background:rgba(168,85,247,0.3); }
    .player-blocks { position:fixed; bottom:20px; left:0; right:0; display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
    .player-block { width:110px; padding:12px; background:#1f2a3c; border-radius:12px; text-align:center; transition:all 0.3s; }
    .player-block.buzzed { background:#fbbf24; color:#000; transform:scale(1.15); animation:pulse 1s infinite; }
    .player-block.disabled { opacity:0.4; filter:grayscale(1); }
    @keyframes pulse { 0%,100%{ transform:scale(1.15); } 50%{ transform:scale(1.25); } }
  </style>
</head>
<body>

<div id="roomScreen">
  <div class="room" id="roomCodeBig">——</div>
  <div style="text-align:center; margin-top:40px; font-size:24px; color:#888;">Waiting for host to show categories...</div>
</div>

<div id="categoryScreen" style="display:none;">
  <h1 style="text-align:center; font-size:48px; margin:30px 0; color:#a855f7;">PICK A CATEGORY</h1>
  <div class="cat-grid" id="catGrid"></div>
</div>

<div class="player-blocks" id="playerBlocks"></div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let roomCode = new URLSearchParams(location.search).get('room') || 'FRXXXX';

document.getElementById('roomCodeBig').textContent = roomCode;

const channel = sb.channel(`fr-${roomCode}`);

channel
  .on('broadcast', {event: 'show_category_picker'}, () => {
    document.getElementById('roomScreen').style.display = 'none';
    document.getElementById('categoryScreen').style.display = 'block';
    // Render categories (expandable)
    document.getElementById('catGrid').innerHTML = `
      <div class="cat-tile">🎥 Movies</div>
      <div class="cat-tile">🎵 Music</div>
      <div class="cat-tile">🌍 Geography</div>
      <div class="cat-tile">🧠 General</div>`;
  })
  .on('broadcast', {event: 'buzz_confirmed'}, ({payload}) => {
    // Animate player block
    const block = document.getElementById(`p-${payload.id}`);
    if (block) block.classList.add('buzzed');
  })
  .on('broadcast', {event: 'wrong'}, ({payload}) => {
    const block = document.getElementById(`p-${payload.playerId}`);
    if (block) block.classList.add('disabled');
  })
  .subscribe();

channel.on('broadcast', {event: 'player_list_update'}, ({payload}) => {
  const container = document.getElementById('playerBlocks');
  container.innerHTML = payload.players.map(p => `
    <div class="player-block" id="p-${p.id}">
      <div style="font-size:32px">${p.avatar}</div>
      <div>${p.name}</div>
    </div>
  `).join('');
});
</script>
</body>
</html>
