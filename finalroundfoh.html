<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Final Round Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #03050b; --gold: #fbbf24; --green: #10b981; --red: #ef4444; --accent: #3b82f6; --purple: #a855f7; --text: #ffffff; --muted: rgba(255,255,255,0.45); }
    body { background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--text); height: 100vh; overflow: hidden; }
    .app { height: 100vh; display: flex; flex-direction: column; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 28px; background: rgba(3,5,11,0.92); backdrop-filter: blur(20px); border-bottom: 2px solid rgba(251,191,36,0.25); flex-shrink: 0; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 4px; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .room-display { font-family: 'JetBrains Mono', monospace; font-size: 20px; background: rgba(0,0,0,0.5); border: 1px solid rgba(251,191,36,0.3); padding: 5px 18px; border-radius: 30px; color: var(--gold); letter-spacing: 3px; }
    .player-counter { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .counter-num { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 800; color: var(--gold); }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; overflow: hidden; }
    .screen { display: none; animation: fadeUp 0.5s ease; width: 100%; max-width: 1100px; }
    .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .waiting-hero { text-align: center; }
    .waiting-icon { font-size: 80px; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-12px); } }
    .waiting-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(44px,7vw,80px); letter-spacing: 5px; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .waiting-code { font-family: 'JetBrains Mono', monospace; font-size: clamp(40px,6vw,72px); color: var(--gold); letter-spacing: 10px; margin: 16px 0; }
    .question-text { font-size: clamp(24px, 3.8vw, 52px); font-weight: 800; line-height: 1.35; background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.07); border-radius: 24px; padding: 32px 36px; margin-bottom: 22px; text-align: center; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .opt-tile { background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px 20px; display: flex; align-items: center; gap: 14px; font-size: clamp(14px, 1.8vw, 20px); font-weight: 600; }
    .opt-letter { width: 44px; height: 44px; border-radius: 12px; background: rgba(59,130,246,0.18); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; flex-shrink: 0; color: var(--accent); }
    .buzzer-open-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.35); padding: 9px 22px; border-radius: 40px; font-size: 15px; font-weight: 700; color: var(--green); margin-top: 18px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{ opacity: 1; } 50%{ opacity: 0.55; } }
    .buzzed-hero { text-align: center; }
    .buzzed-ring { width: 180px; height: 180px; border-radius: 50%; margin: 0 auto 20px; border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 80px; animation: ringPulse 0.8s ease-in-out infinite alternate; }
    @keyframes ringPulse { from { box-shadow: 0 0 0 0 rgba(251,191,36,0.4); } to { box-shadow: 0 0 0 30px rgba(251,191,36,0); } }
    .buzzed-name { font-family: 'Bebas Neue', sans-serif; font-size: clamp(56px,8vw,100px); background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .result-hero { text-align: center; }
    .result-icon { font-size: 90px; margin-bottom: 16px; animation: pop 0.4s ease; }
    @keyframes pop { 0%{ transform: scale(0.5); } 80%{ transform: scale(1.1); } 100%{ transform: scale(1); } }
    .result-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(50px,8vw,90px); letter-spacing: 4px; }
    .catpick-hero { text-align: center; width: 100%; }
    .catpick-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px,5vw,64px); letter-spacing: 4px; margin-bottom: 8px; color: var(--purple); }
    .catpick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; max-width: 900px; margin: 0 auto; }
    .cat-tile { background: rgba(139,92,246,0.08); border: 2px solid rgba(139,92,246,0.2); border-radius: 20px; padding: 22px 14px; text-align: center; transition: 0.3s; animation: catPop 0.5s ease backwards; }
    .cat-tile-icon { font-size: 44px; margin-bottom: 10px; }
    .cat-tile-name { font-weight: 700; font-size: 14px; }
    @keyframes catPop { from { opacity:0; transform:scale(0.8); } to { opacity:1; transform:scale(1); } }
    .live-panel { position: fixed; right: 16px; top: 80px; width: 220px; background: rgba(6,8,18,0.88); backdrop-filter: blur(16px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); padding: 14px; }
    .panel-title { font-size: 10px; font-weight: 700; color: var(--gold); margin-bottom: 10px; text-align: center; }
    .player-row { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; }
    .player-row-name { flex: 1; font-weight: 600; }
    .player-row-score { color: var(--gold); font-family: monospace; }
    .footer { padding: 8px 24px; text-align: center; font-size: 10px; color: rgba(255,255,255,0.2); border-top: 1px solid rgba(255,255,255,0.04); flex-shrink: 0; }
    @keyframes confettiFall { 0%{ opacity:1; transform: translateY(-10px); } 100%{ opacity:0; transform: translateY(100vh); } }
  </style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="logo">PLAY<span style="color:var(--gold)">A</span>QUIZ</div>
    <div style="display:flex;gap:12px;align-items:center">
      <div class="player-counter">👥 <span class="counter-num" id="playerCount">0</span></div>
      <div class="room-display" id="roomDisplay">——</div>
    </div>
  </div>
  <div class="main">
    <div id="waitingScreen" class="screen active"><div class="waiting-hero"><div class="waiting-icon">⚡</div><div class="waiting-title">FINAL ROUND</div><div class="waiting-code" id="waitingRoomCode">——</div></div></div>
    <div id="questionScreen" class="screen"><div class="question-hero"><div class="question-text" id="questionText">Loading...</div><div class="options-grid" id="optionsGrid"></div><div class="buzzer-open-badge">🔴 BUZZERS ARE OPEN — HIT THE BUTTON!</div></div></div>
    <div id="buzzedScreen" class="screen"><div class="buzzed-hero"><div class="buzzed-ring">🔔</div><div class="buzzed-label">BUZZED IN</div><div class="buzzed-name" id="buzzedName">—</div></div></div>
    <div id="correctScreen" class="screen"><div class="result-hero"><div class="result-icon">✅</div><div class="result-title" style="color:var(--green)">CORRECT!</div><div class="result-sub" id="correctSub">—</div></div></div>
    <div id="wrongScreen" class="screen"><div class="result-hero"><div class="result-icon">❌</div><div class="result-title" style="color:var(--red)">WRONG!</div></div></div>
    <div id="catPickScreen" class="screen"><div class="catpick-hero"><div class="catpick-title">🎨 PICK A CATEGORY</div><div class="catpick-grid" id="catPickGrid"></div></div></div>
    <div id="endedScreen" class="screen"><div class="ended-hero"><div class="result-icon">🏆</div><div class="result-title">GAME OVER</div><div class="ended-winner" id="winnerName">—</div></div></div>
  </div>
  <div class="live-panel"><div class="panel-title">🏆 LIVE PLAYERS</div><div id="playerListPanel">No players yet</div></div>
  <div class="footer">PlayAQuiz — Final Round Display</div>
</div>
<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let roomCode = null, realtimeChannel = null, currentPlayers = [];
function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); let el=document.getElementById(`${id}Screen`); if(el) el.classList.add('active'); }
function updatePlayerPanel(players) { currentPlayers=players||[]; document.getElementById('playerCount').innerText=currentPlayers.length; let panel=document.getElementById('playerListPanel'); if(currentPlayers.length===0){ panel.innerHTML='No players yet'; return; } let sorted=[...currentPlayers].sort((a,b)=>(b.score||0)-(a.score||0)); panel.innerHTML=sorted.map(p=>`<div class="player-row"><div>${p.avatar||'🎮'}</div><div class="player-row-name">${p.name}</div><div class="player-row-score">${p.score||0}</div></div>`).join(''); }
function launchConfetti(){ for(let i=0;i<80;i++){ let c=document.createElement('div'); c.style.cssText=`position:fixed;width:8px;height:8px;background:${['#fbbf24','#ef4444','#10b981','#3b82f6'][Math.floor(Math.random()*4)]};left:${Math.random()*100}vw;top:-10px;border-radius:2px;pointer-events:none;animation:confettiFall ${2+Math.random()*2}s linear forwards;z-index:9999;`; document.body.appendChild(c); setTimeout(()=>c.remove(),5000); } }
function handleBroadcast(event,payload){ console.log('FOH:',event); switch(event){ case 'round_started': showScreen('waiting'); break; case 'player_list_update': updatePlayerPanel(payload.players); break; case 'question_open': document.getElementById('questionText').innerText=payload.question; let opts=payload.options||[]; document.getElementById('optionsGrid').innerHTML=opts.map((o,i)=>`<div class="opt-tile"><div class="opt-letter">${String.fromCharCode(65+i)}</div><div>${o}</div></div>`).join(''); showScreen('question'); break; case 'buzz_confirmed': document.getElementById('buzzedName').innerHTML=`${payload.playerAvatar||''} ${payload.playerName}`; showScreen('buzzed'); break; case 'correct': document.getElementById('correctSub').innerHTML=`${payload.playerAvatar||''} ${payload.playerName} +${payload.points||100} pts`; showScreen('correct'); launchConfetti(); setTimeout(()=>showScreen('question'),2800); break; case 'wrong': showScreen('wrong'); setTimeout(()=>showScreen('question'),1800); break; case 'next_question': showScreen('waiting'); break; case 'reset_buzzers': showScreen('question'); break; case 'show_category_picker': let cats=payload.categories||[]; document.getElementById('catPickGrid').innerHTML=cats.map((c,i)=>`<div class="cat-tile" style="animation-delay:${i*0.07}s"><div class="cat-tile-icon">${c.icon||'📁'}</div><div class="cat-tile-name">${c.name}</div></div>`).join(''); showScreen('catPick'); break; case 'round_ended': let winner=payload.winner; document.getElementById('winnerName').innerHTML=`${winner?.avatar||'🏆'} ${winner?.name||'—'} — ${winner?.score||0} pts`; showScreen('ended'); launchConfetti(); break; } }
async function init(){ let params=new URLSearchParams(window.location.search); roomCode=params.get('room')||localStorage.getItem('fr_room'); if(!roomCode){ document.getElementById('waitingRoomCode').innerText='NO ROOM'; document.getElementById('roomDisplay').innerText='NO ROOM'; return; } document.getElementById('roomDisplay').innerText=roomCode; document.getElementById('waitingRoomCode').innerText=roomCode; realtimeChannel=sb.channel(`fr-${roomCode}`); realtimeChannel.on('broadcast',{event:'round_started'},({payload})=>handleBroadcast('round_started',payload)).on('broadcast',{event:'player_list_update'},({payload})=>handleBroadcast('player_list_update',payload)).on('broadcast',{event:'question_open'},({payload})=>handleBroadcast('question_open',payload)).on('broadcast',{event:'buzz_confirmed'},({payload})=>handleBroadcast('buzz_confirmed',payload)).on('broadcast',{event:'correct'},({payload})=>handleBroadcast('correct',payload)).on('broadcast',{event:'wrong'},({payload})=>handleBroadcast('wrong',payload)).on('broadcast',{event:'next_question'},({payload})=>handleBroadcast('next_question',payload)).on('broadcast',{event:'reset_buzzers'},({payload})=>handleBroadcast('reset_buzzers',payload)).on('broadcast',{event:'show_category_picker'},({payload})=>handleBroadcast('show_category_picker',payload)).on('broadcast',{event:'round_ended'},({payload})=>handleBroadcast('round_ended',payload)).subscribe(); }
init();
</script>
</body>
</html>
