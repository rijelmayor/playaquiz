<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Final Round Display (Fixed)</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #03050b; --gold: #fbbf24; --green: #10b981; --red: #ef4444;
      --accent: #3b82f6; --purple: #a855f7; --text: #ffffff; --muted: rgba(255,255,255,0.45);
    }
    body { background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--text); height: 100vh; overflow: hidden; }
    .app { height: 100vh; display: flex; flex-direction: column; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 28px; background: rgba(3,5,11,0.92); backdrop-filter: blur(20px); border-bottom: 2px solid rgba(251,191,36,0.25); flex-shrink: 0; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 28px; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .room-display { font-family: 'JetBrains Mono', monospace; font-size: 20px; background: rgba(0,0,0,0.5); border: 1px solid rgba(251,191,36,0.3); padding: 5px 18px; border-radius: 30px; color: var(--gold); }
    .audio-control { background: rgba(0,0,0,0.4); border: none; color: var(--gold); font-size: 20px; cursor: pointer; padding: 6px 12px; border-radius: 30px; margin-right: 10px; }
    .main-grid { flex: 1; display: grid; grid-template-columns: 1fr 280px; gap: 0; overflow: hidden; }
    .game-content { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; position: relative; background: radial-gradient(circle at 20% 30%, rgba(59,130,246,0.05), transparent); }
    .screen { display: none; animation: fadeUp 0.4s ease; width: 100%; max-width: 920px; }
    .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .waiting-hero { text-align: center; }
    .waiting-icon { font-size: 80px; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-12px); } }
    .waiting-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(44px,5vw,70px); background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .waiting-code { font-family: 'JetBrains Mono', monospace; font-size: clamp(36px,5vw,64px); color: var(--gold); letter-spacing: 8px; margin: 16px 0; }
    .question-hero { width: 100%; position: relative; }
    .question-text { font-size: clamp(22px, 3.2vw, 44px); font-weight: 800; background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.07); border-radius: 24px; padding: 28px 32px; margin-bottom: 20px; text-align: center; backdrop-filter: blur(4px); }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .opt-tile { background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; transition: 0.1s; }
    .opt-letter { width: 42px; height: 42px; border-radius: 12px; background: rgba(59,130,246,0.2); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: var(--accent); }
    .buzzer-open-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.35); padding: 9px 22px; border-radius: 40px; font-weight: 700; color: var(--green); margin-top: 18px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{ opacity: 1; } 50%{ opacity: 0.55; } }
    .timer-display { position: fixed; top: 100px; right: 320px; background: rgba(0,0,0,0.85); border: 3px solid var(--gold); border-radius: 60px; padding: 15px 30px; z-index: 100; text-align: center; box-shadow: 0 0 20px rgba(251,191,36,0.3); }
    .timer-number { font-family: 'Bebas Neue', sans-serif; font-size: 64px; color: var(--gold); line-height: 1; }
    .overlay-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(3,5,11,0.92); backdrop-filter: blur(20px); border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; text-align: center; animation: fadeInScale 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    .overlay-icon { font-size: 85px; margin-bottom: 12px; }
    .overlay-title { font-size: 48px; font-weight: 800; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
    .overlay-message { font-size: 28px; font-weight: 600; color: var(--gold); margin-top: 8px; }
    .players-column { background: rgba(3,5,11,0.6); border-left: 1px solid rgba(251,191,36,0.2); backdrop-filter: blur(8px); padding: 20px 16px; overflow-y: auto; }
    .players-header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(251,191,36,0.3); padding-bottom: 12px; }
    .players-header h3 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); }
    .player-block { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); border: 1.5px solid rgba(255,255,255,0.08); border-radius: 60px; padding: 6px 12px; margin-bottom: 10px; transition: all 0.1s; }
    .player-avatar-circle { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #1f2a3c, #0d1120); display: flex; align-items: center; justify-content: center; font-size: 32px; border: 2px solid rgba(255,255,255,0.15); }
    .player-block.buzzed { background: linear-gradient(135deg, rgba(251,191,36,0.25), rgba(251,191,36,0.05)); border-color: var(--gold); animation: heartbeat 0.4s ease-in-out 3; }
    @keyframes heartbeat { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.02); } }
    .player-block.locked { opacity: 0.5; filter: grayscale(0.3); }
    .player-block.eliminated { opacity: 0.25; filter: grayscale(0.7); }
    .footer { padding: 6px 20px; text-align: center; font-size: 9px; color: rgba(255,255,255,0.15); border-top: 1px solid rgba(255,255,255,0.03); }
    .confetti-piece { position: fixed; pointer-events: none; z-index: 9999; border-radius: 2px; }
    @keyframes confettiFall { 0%{ opacity:1; transform: translateY(-10px) rotate(0deg); } 100%{ opacity:0; transform: translateY(100vh) rotate(360deg); } }
    .catpick-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
    .cat-tile { background: rgba(139,92,246,0.08); border: 2px solid rgba(139,92,246,0.25); border-radius: 20px; padding: 18px; text-align: center; min-width: 120px; backdrop-filter: blur(4px); }
    .cat-tile-icon { font-size: 40px; }
    .cat-tile-name { font-weight: 700; }
    @keyframes catPop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="logo">PLAY<span style="color:var(--gold)">A</span>QUIZ</div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="audio-control" id="bgmToggleBtn" onclick="toggleBackgroundMusic()">🔊 BGM</button>
      <div style="font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;background:rgba(0,0,0,0.4);color:#6b7a99;" id="fohConnBadge">⏳ Connecting</div>
      <div class="room-display" id="roomDisplay">——</div>
    </div>
  </div>
  <div class="main-grid">
    <div class="game-content">
      <div id="waitingScreen" class="screen active"><div class="waiting-hero"><div class="waiting-icon">⚡</div><div class="waiting-title">FINAL ROUND</div><div class="waiting-code" id="waitingRoomCode">——</div><div style="margin-top: 20px; font-size:14px; color: var(--muted);">Waiting for host to start the round...</div></div></div>
      <div id="questionScreen" class="screen"><div class="question-hero" style="position:relative;"><div class="question-text" id="questionText">Loading...</div><div class="options-grid" id="optionsGrid"></div><div class="buzzer-open-badge">🔴 BUZZERS ARE OPEN</div><div id="overlayContainer"></div></div></div>
      <div id="catPickScreen" class="screen"><div class="catpick-hero"><div class="waiting-title" style="font-size: 42px;">🎨 PICK A CATEGORY</div><div class="catpick-grid" id="catPickGrid"></div></div></div>
      <div id="endedScreen" class="screen"><div class="ended-hero"><div class="waiting-icon">🏆</div><div class="waiting-title">GAME OVER</div><div class="ended-winner" id="winnerName" style="font-size: 32px; background: linear-gradient(135deg, var(--gold), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">—</div></div></div>
    </div>
    <div class="players-column"><div class="players-header"><h3>🎮 CONTESTANTS</h3></div><div id="playersBlocksContainer"><div style="text-align:center;color:var(--muted);padding:20px;">Waiting...</div></div></div>
  </div>
  <div class="footer">PlayAQuiz — Final Round Display (v2)</div>
  <div id="roomEntryOverlay" style="display:none;position:fixed;inset:0;background:rgba(3,5,11,0.96);backdrop-filter:blur(20px);z-index:500;flex-direction:column;align-items:center;justify-content:center;gap:18px;"><div style="font-family:'Bebas Neue',sans-serif;font-size:52px;background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">PLAYAQUIZ</div><div style="font-size:15px;color:rgba(255,255,255,0.5);">FOH Display — Enter the room code from the Control panel</div><div style="display:flex;gap:10px;align-items:center;"><input id="fohRoomInput" placeholder="e.g. FR4X7K" maxlength="8" style="background:rgba(255,255,255,0.06);border:2px solid rgba(251,191,36,0.4);border-radius:14px;padding:14px 20px;color:#fff;font-size:26px;font-family:'JetBrains Mono',monospace;letter-spacing:6px;text-align:center;outline:none;text-transform:uppercase;width:260px;" onkeydown="if(event.key==='Enter') submitFohRoom()"><button onclick="submitFohRoom()" style="padding:14px 24px;background:linear-gradient(135deg,var(--gold),#f97316);border:none;border-radius:14px;font-size:17px;font-weight:800;color:#111;cursor:pointer;">CONNECT</button></div><div id="fohRoomError" style="color:var(--red);font-size:13px;"></div></div>
  <div id="timerWidget" class="timer-display" style="display:none;"><div class="timer-number" id="timerNumber">0</div><div class="timer-label" style="font-size: 11px; letter-spacing: 1px;">SECONDS LEFT</div></div>
</div>
<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let roomCode = null, realtimeChannel = null, currentPlayers = [], timerInterval = null;
let bgmAudio = null, bgmEnabled = true, audioCtx = null;

// Background music (silent if not present)
function initBackgroundMusic() {
  bgmAudio = new Audio();
  bgmAudio.src = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'; // royalty-free demo track
  bgmAudio.loop = true;
  bgmAudio.volume = 0.25;
  bgmAudio.load();
}
function playBackgroundMusic() { if (bgmAudio && bgmEnabled) bgmAudio.play().catch(e => console.log('BGM play blocked:', e)); }
function stopBackgroundMusic() { if (bgmAudio) { bgmAudio.pause(); bgmAudio.currentTime = 0; } }
function toggleBackgroundMusic() {
  if (!bgmAudio) initBackgroundMusic();
  const btn = document.getElementById('bgmToggleBtn');
  if (bgmAudio.paused) { bgmAudio.play().catch(e=>console.log(e)); bgmEnabled = true; btn.innerHTML = '🔊 BGM'; }
  else { bgmAudio.pause(); bgmEnabled = false; btn.innerHTML = '🔈 BGM'; }
}

function getAudio() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
function playTickSound() { try { const ctx = getAudio(); const osc = ctx.createOscillator(), g = ctx.createGain(); osc.connect(g); g.connect(ctx.destination); osc.type = 'sine'; osc.frequency.value = 880; g.gain.setValueAtTime(0.25, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08); osc.start(); osc.stop(ctx.currentTime + 0.08); } catch(e){} }
function playBuzzSound() { try { const ctx = getAudio(); const osc = ctx.createOscillator(), g = ctx.createGain(); osc.connect(g); g.connect(ctx.destination); osc.type = 'square'; osc.frequency.value = 880; g.gain.setValueAtTime(0.6, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15); osc.start(); osc.stop(ctx.currentTime + 0.15); } catch(e){} }
function playCorrectSound() { try { const ctx = getAudio(); [523,659,784,1047].forEach((f,i)=>{ const osc = ctx.createOscillator(), g = ctx.createGain(); osc.connect(g); g.connect(ctx.destination); osc.type = 'sine'; osc.frequency.value = f; g.gain.setValueAtTime(0.5, ctx.currentTime + i*0.09); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.09 + 0.2); osc.start(ctx.currentTime + i*0.09); osc.stop(ctx.currentTime + i*0.09 + 0.2); }); } catch(e){} }
function playWrongSound() { try { const ctx = getAudio(); const osc = ctx.createOscillator(), g = ctx.createGain(); osc.connect(g); g.connect(ctx.destination); osc.type = 'sawtooth'; osc.frequency.value = 200; g.gain.setValueAtTime(0.5, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); } catch(e){} }
function playCategorySound() { try { const ctx = getAudio(); [392,523,659].forEach((f,i)=>{ const osc = ctx.createOscillator(), g = ctx.createGain(); osc.connect(g); g.connect(ctx.destination); osc.type = 'sine'; osc.frequency.value = f; g.gain.setValueAtTime(0.4, ctx.currentTime + i*0.12); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.12 + 0.2); osc.start(ctx.currentTime + i*0.12); osc.stop(ctx.currentTime + i*0.12 + 0.2); }); } catch(e){} }
function showScreen(id) { document.querySelectorAll('.game-content .screen').forEach(s=>s.classList.remove('active')); let el=document.getElementById(`${id}Screen`); if(el) el.classList.add('active'); }
function clearOverlay() { let container = document.getElementById('overlayContainer'); if(container) container.innerHTML = ''; }

// ========== FIXED CORRECT OVERLAY ==========
function showCorrectOverlay(playerName, playerAvatar, points) {
  clearOverlay();
  const container = document.getElementById('overlayContainer');
  if (!container) return;
  const overlayDiv = document.createElement('div');
  overlayDiv.className = 'overlay-container';
  overlayDiv.innerHTML = `
    <div class="overlay-icon">🎉✅🎉</div>
    <div class="overlay-title">CORRECT ANSWER!</div>
    <div style="font-size: 38px; margin: 8px 0;">${playerAvatar || '🏆'} ${escapeHtml(playerName)}</div>
    <div class="overlay-message">✨ +${points || 100} POINTS ✨</div>
    <div style="margin-top: 24px; font-size: 18px; background: rgba(16,185,129,0.2); padding: 6px 20px; border-radius: 60px;">🎊 CONGRATULATIONS! 🎊</div>
  `;
  container.appendChild(overlayDiv);
  // Auto remove after 3.5 seconds
  setTimeout(() => {
    if (overlayDiv && overlayDiv.parentNode) overlayDiv.remove();
  }, 3800);
}

function showWrongOverlay(playerName) {
  clearOverlay();
  const container = document.getElementById('overlayContainer');
  if (!container) return;
  const overlayDiv = document.createElement('div');
  overlayDiv.className = 'overlay-container';
  overlayDiv.innerHTML = `
    <div class="overlay-icon">❌😵❌</div>
    <div class="overlay-title" style="background: linear-gradient(135deg, #ef4444, #b91c1c); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">WRONG ANSWER</div>
    <div style="font-size: 32px; margin: 8px 0;">${escapeHtml(playerName)}</div>
    <div class="overlay-message" style="color: var(--red);">Locked out this round!</div>
  `;
  container.appendChild(overlayDiv);
  setTimeout(() => {
    if (overlayDiv && overlayDiv.parentNode) overlayDiv.remove();
  }, 2500);
}

function showBuzzOverlay(playerName, playerAvatar) {
  clearOverlay();
  const container = document.getElementById('overlayContainer');
  if (!container) return;
  const overlayDiv = document.createElement('div');
  overlayDiv.className = 'overlay-container';
  overlayDiv.innerHTML = `
    <div class="overlay-icon">🔔⚡🔔</div>
    <div class="overlay-title" style="background: linear-gradient(135deg, var(--gold), #f97316); -webkit-background-clip: text;">BUZZED IN!</div>
    <div style="font-size: 40px; margin: 8px 0;">${playerAvatar || '🎤'} ${escapeHtml(playerName)}</div>
    <div class="overlay-message" style="color: var(--gold);">Ready to answer...</div>
  `;
  container.appendChild(overlayDiv);
  setTimeout(() => {
    if (overlayDiv && overlayDiv.parentNode) overlayDiv.remove();
  }, 2000);
}

function renderPlayersBlocks(players) {
  let container=document.getElementById('playersBlocksContainer'); if(!container) return;
  if(!players||players.length===0){ container.innerHTML='<div style="padding:20px;color:var(--muted);">Waiting...</div>'; return; }
  let sorted=[...players].sort((a,b)=>(b.score||0)-(a.score||0));
  container.innerHTML=sorted.map(p=>{ 
    let cls=''; 
    if(p.status==='buzzed') cls='buzzed'; 
    else if(p.status==='locked'||p.status==='wrong') cls='locked'; 
    else if(p.status==='eliminated') cls='eliminated'; 
    return `<div class="player-block ${cls}"><div class="player-avatar-circle">${p.avatar||'🎮'}</div><div><div>${escapeHtml(p.name)}</div><div style="color:var(--gold);">${p.score||0} pts</div></div></div>`; 
  }).join('');
}
function escapeHtml(s){ if(!s) return ''; return s.replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

function launchConfetti(){
  for(let i=0;i<180;i++){
    let c=document.createElement('div'); c.className='confetti-piece';
    c.style.cssText=`position:fixed;width:${6+Math.random()*10}px;height:${6+Math.random()*8}px;background:${['#fbbf24','#ef4444','#10b981','#3b82f6','#a855f7','#ec4899'][Math.floor(Math.random()*6)]};left:${Math.random()*100}vw;top:-10px;border-radius:${Math.random()>0.5?'50%':'2px'};animation:confettiFall ${2+Math.random()*3}s linear forwards;z-index:9999;`;
    document.body.appendChild(c); setTimeout(()=>c.remove(),5000);
  }
}

function startTimer(seconds){ 
  if(timerInterval) clearInterval(timerInterval); 
  let timerDiv=document.getElementById('timerWidget'); let timerNum=document.getElementById('timerNumber'); 
  let remaining=seconds; timerDiv.style.display='block'; timerNum.innerText=remaining; playTickSound(); 
  timerInterval=setInterval(()=>{ remaining--; if(remaining<=0){ clearInterval(timerInterval); timerDiv.style.display='none'; } else { timerNum.innerText=remaining; playTickSound(); } },1000); 
}

function handleBroadcast(event,payload){ console.log('FOH:',event,payload);
  switch(event){
    case 'round_started': showScreen('waiting'); break;
    case 'player_list_update': currentPlayers=payload.players||[]; renderPlayersBlocks(currentPlayers); break;
    case 'question_open': 
      document.getElementById('questionText').innerText=payload.question; 
      let opts=payload.options||[]; 
      document.getElementById('optionsGrid').innerHTML=opts.map((o,i)=>`<div class="opt-tile"><div class="opt-letter">${String.fromCharCode(65+i)}</div><div>${escapeHtml(o)}</div></div>`).join(''); 
      clearOverlay(); showScreen('question'); 
      break;
    case 'buzz_confirmed': 
      playBuzzSound(); 
      showBuzzOverlay(payload.playerName, payload.playerAvatar);
      let buzzP=currentPlayers.find(p=>p.id===payload.playerId); 
      if(buzzP){ currentPlayers.forEach(p=>{ if(p.status!=='eliminated') p.status='locked'; }); buzzP.status='buzzed'; renderPlayersBlocks(currentPlayers); } 
      break;
    case 'correct': 
      playCorrectSound(); 
      // FIXED: Display beautiful congratulations overlay with player name, not room code
      showCorrectOverlay(payload.playerName, payload.playerAvatar, payload.points || 100);
      let cP=currentPlayers.find(p=>p.id===payload.playerId); 
      if(cP){ cP.score=payload.newScore; cP.status='correct'; renderPlayersBlocks(currentPlayers); } 
      launchConfetti(); 
      // Ensure no room code appears anywhere else (just celebration)
      break;
    case 'wrong': 
      playWrongSound(); 
      showWrongOverlay(payload.playerName);
      let wP=currentPlayers.find(p=>p.id===payload.playerId); 
      if(wP){ wP.status='wrong'; renderPlayersBlocks(currentPlayers); } 
      break;
    case 'next_question': clearOverlay(); currentPlayers.forEach(p=>{ if(p.status!=='eliminated') p.status='waiting'; }); renderPlayersBlocks(currentPlayers); showScreen('waiting'); break;
    case 'reset_for_next_question': clearOverlay(); currentPlayers.forEach(p=>{ if(p.status!=='eliminated') p.status='waiting'; }); renderPlayersBlocks(currentPlayers); showScreen('waiting'); break;
    case 'reset_buzzers': clearOverlay(); currentPlayers.forEach(p=>{ if(p.status!=='eliminated'&&p.status!=='correct') p.status='waiting'; }); renderPlayersBlocks(currentPlayers); showScreen('question'); break;
    case 'buzzers_reopen': clearOverlay(); currentPlayers.forEach(p=>{ if(p.status!=='eliminated'&&p.status!=='correct'&&p.status!=='wrong') p.status='waiting'; }); renderPlayersBlocks(currentPlayers); showScreen('question'); break;
    case 'eliminated': let eP=currentPlayers.find(p=>p.id===payload.playerId); if(eP){ eP.status='eliminated'; renderPlayersBlocks(currentPlayers); } break;
    case 'show_category_picker': playCategorySound(); let cats=payload.categories||[]; document.getElementById('catPickGrid').innerHTML=cats.map((c,i)=>`<div class="cat-tile" style="animation:catPop 0.4s ease backwards;animation-delay:${i*0.05}s;"><div class="cat-tile-icon">${c.icon||'📁'}</div><div class="cat-tile-name">${c.name}</div></div>`).join(''); clearOverlay(); showScreen('catPick'); playBackgroundMusic(); break;
    case 'round_ended': 
      let winner=payload.winner; 
      document.getElementById('winnerName').innerHTML=`${winner?.avatar||'🏆'} ${winner?.name||'—'} — ${winner?.score||0} pts`; 
      showScreen('ended'); launchConfetti(); stopBackgroundMusic(); 
      break;
    case 'timer_start': startTimer(payload.seconds); break;
    case 'full_game_reset': location.reload(); break;
    default: break;
  }
}

function connectToRoom(code){
  roomCode = code.trim().toUpperCase();
  localStorage.setItem('fr_room', roomCode);
  document.getElementById('roomDisplay').innerText = roomCode;
  document.getElementById('waitingRoomCode').innerText = roomCode;
  let overlay = document.getElementById('roomEntryOverlay');
  if(overlay) overlay.style.display = 'none';
  if(realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel(`fr-${roomCode}`);
  realtimeChannel
    .on('broadcast',{event:'round_started'},({payload})=>handleBroadcast('round_started',payload))
    .on('broadcast',{event:'player_list_update'},({payload})=>handleBroadcast('player_list_update',payload))
    .on('broadcast',{event:'question_open'},({payload})=>handleBroadcast('question_open',payload))
    .on('broadcast',{event:'buzz_confirmed'},({payload})=>handleBroadcast('buzz_confirmed',payload))
    .on('broadcast',{event:'correct'},({payload})=>handleBroadcast('correct',payload))
    .on('broadcast',{event:'wrong'},({payload})=>handleBroadcast('wrong',payload))
    .on('broadcast',{event:'next_question'},({payload})=>handleBroadcast('next_question',payload))
    .on('broadcast',{event:'reset_for_next_question'},({payload})=>handleBroadcast('reset_for_next_question',payload))
    .on('broadcast',{event:'reset_buzzers'},({payload})=>handleBroadcast('reset_buzzers',payload))
    .on('broadcast',{event:'buzzers_reopen'},({payload})=>handleBroadcast('buzzers_reopen',payload))
    .on('broadcast',{event:'eliminated'},({payload})=>handleBroadcast('eliminated',payload))
    .on('broadcast',{event:'show_category_picker'},({payload})=>handleBroadcast('show_category_picker',payload))
    .on('broadcast',{event:'round_ended'},({payload})=>handleBroadcast('round_ended',payload))
    .on('broadcast',{event:'timer_start'},({payload})=>handleBroadcast('timer_start',payload))
    .on('broadcast',{event:'full_game_reset'},({payload})=>handleBroadcast('full_game_reset',payload))
    .subscribe((status)=>{
      let badge = document.getElementById('fohConnBadge');
      if(badge) badge.innerText = status==='SUBSCRIBED' ? '🟢 LIVE' : '🔴 '+status;
    });
}

async function init(){
  initBackgroundMusic();
  let p = new URLSearchParams(location.search);
  let code = p.get('room') || localStorage.getItem('fr_room');
  if(!code){
    document.getElementById('roomDisplay').innerText = 'NO ROOM';
    document.getElementById('waitingRoomCode').innerText = 'Enter Room Code Below';
    document.getElementById('roomEntryOverlay').style.display = 'flex';
    return;
  }
  connectToRoom(code);
  document.body.addEventListener('click',()=>{
    if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
    if(bgmAudio && bgmAudio.paused && bgmEnabled) bgmAudio.play().catch(e=>console.log(e));
  },{once:true});
}
init();
function submitFohRoom(){ let code=document.getElementById("fohRoomInput").value.trim().toUpperCase(); if(code.length<4){ document.getElementById("fohRoomError").innerText="Enter a valid room code (4-8 chars)"; return; } document.getElementById("fohRoomError").innerText=""; connectToRoom(code); }
window.submitFohRoom = submitFohRoom;
window.toggleBackgroundMusic = toggleBackgroundMusic;
window.connectToRoom = connectToRoom;
</script>
