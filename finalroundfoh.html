<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Final Round Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #03050b; --gold: #fbbf24; --green: #10b981;
      --red: #ef4444; --accent: #3b82f6; --purple: #a855f7;
      --text: #ffffff; --muted: rgba(255,255,255,0.5);
    }
    body { background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--text); height: 100vh; overflow: hidden; }
    .app { height: 100vh; display: flex; flex-direction: column; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; background: rgba(3,5,11,0.9); backdrop-filter: blur(16px); border-bottom: 2px solid rgba(251,191,36,0.4); }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 4px; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .room-display { font-family: 'JetBrains Mono', monospace; font-size: 24px; background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.3); padding: 6px 24px; border-radius: 30px; color: var(--gold); letter-spacing: 3px; }
    
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
    .question-screen { text-align: center; max-width: 1000px; width: 100%; }
    .question-text { font-size: clamp(32px, 5vw, 64px); font-weight: 800; line-height: 1.4; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); border-radius: 32px; padding: 40px; margin-bottom: 40px; }
    .buzzer-open { margin-top: 20px; display: inline-flex; align-items: center; gap: 12px; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); padding: 12px 28px; border-radius: 60px; font-size: 18px; font-weight: 700; color: var(--green); }
    .buzzed-screen { text-align: center; }
    .buzzed-name { font-family: 'Bebas Neue', sans-serif; font-size: 80px; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .waiting-screen { text-align: center; }
    .waiting-room { font-family: 'JetBrains Mono', monospace; font-size: 72px; color: var(--gold); letter-spacing: 8px; margin-top: 20px; }
    
    .screen { display: none; animation: fadeIn 0.4s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .footer { padding: 12px 32px; text-align: center; font-size: 12px; color: rgba(255,255,255,0.25); border-top: 1px solid #0f1420; }
  </style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="logo">PLAY<span style="color:var(--gold)">A</span>QUIZ</div>
    <div>⚡ FINAL ROUND</div>
    <div class="room-display" id="roomDisplay">——</div>
  </div>

  <div class="main">
    <div id="waitingScreen" class="screen active">
      <div class="waiting-screen">
        <div style="font-size: 80px; margin-bottom: 20px;">⚡</div>
        <div style="font-family: 'Bebas Neue', sans-serif; font-size: 48px;">FINAL ROUND</div>
        <div class="waiting-room" id="waitingRoomCode">——</div>
        <div style="margin-top: 30px; color: var(--muted);">Get ready for the ultimate battle!</div>
      </div>
    </div>

    <div id="questionScreen" class="screen">
      <div class="question-screen">
        <div class="question-text" id="questionText">Loading...</div>
        <div class="buzzer-open">🔴 BUZZERS ARE OPEN</div>
      </div>
    </div>

    <div id="buzzedScreen" class="screen">
      <div class="buzzed-screen">
        <div style="font-size: 60px; margin-bottom: 20px;">🔔</div>
        <div style="font-size: 24px; color: var(--gold); letter-spacing: 2px;">BUZZED IN</div>
        <div class="buzzed-name" id="buzzedName">—</div>
        <div style="font-size: 18px; color: var(--muted); margin-top: 20px;">is answering...</div>
      </div>
    </div>

    <div id="correctScreen" class="screen">
      <div class="question-screen">
        <div style="font-size: 100px; margin-bottom: 20px;">✅</div>
        <div style="font-size: 48px; font-weight: 800; color: var(--green);">CORRECT!</div>
        <div style="font-size: 24px; margin-top: 20px;" id="correctName">—</div>
      </div>
    </div>

    <div id="endedScreen" class="screen">
      <div class="question-screen">
        <div style="font-size: 80px; margin-bottom: 20px;">🏆</div>
        <div style="font-size: 48px; font-weight: 800;">GAME OVER</div>
        <div style="font-size: 24px; margin-top: 20px; color: var(--gold);" id="winnerName">—</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span>PlayAQuiz — Final Round</span>
    <span id="footerTime"></span>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let roomCode = null;
let realtimeChannel = null;

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`${screenId}Screen`).classList.add('active');
}

function handleBroadcast(event, payload) {
  switch (event) {
    case 'round_started':
      showScreen('waiting');
      break;
    case 'question_open':
      document.getElementById('questionText').innerText = payload.question;
      showScreen('question');
      break;
    case 'buzz_confirmed':
      document.getElementById('buzzedName').innerHTML = `${payload.playerAvatar} ${payload.playerName}`;
      showScreen('buzzed');
      break;
    case 'correct':
      document.getElementById('correctName').innerHTML = `${payload.playerName} +${payload.points || 100} pts`;
      showScreen('correct');
      setTimeout(() => showScreen('question'), 2000);
      break;
    case 'next_question':
      showScreen('waiting');
      break;
    case 'round_ended':
      document.getElementById('winnerName').innerHTML = `${payload.winner?.avatar || '🏆'} ${payload.winner?.name || '—'}`;
      showScreen('ended');
      break;
  }
}

async function init() {
  setInterval(() => {
    document.getElementById('footerTime').innerText = new Date().toLocaleTimeString();
  }, 1000);
  
  const params = new URLSearchParams(window.location.search);
  roomCode = params.get('room') || localStorage.getItem('fr_room');
  if (!roomCode) {
    document.getElementById('waitingRoomCode').innerHTML = 'NO ROOM CODE';
    return;
  }
  
  document.getElementById('roomDisplay').innerText = roomCode;
  document.getElementById('waitingRoomCode').innerText = roomCode;
  
  realtimeChannel = sb.channel(`fr-${roomCode}`, { config: { broadcast: { self: false } } });
  realtimeChannel
    .on('broadcast', { event: 'round_started' }, ({ payload }) => handleBroadcast('round_started', payload))
    .on('broadcast', { event: 'question_open' }, ({ payload }) => handleBroadcast('question_open', payload))
    .on('broadcast', { event: 'buzz_confirmed' }, ({ payload }) => handleBroadcast('buzz_confirmed', payload))
    .on('broadcast', { event: 'correct' }, ({ payload }) => handleBroadcast('correct', payload))
    .on('broadcast', { event: 'wrong' }, ({ payload }) => handleBroadcast('wrong', payload))
    .on('broadcast', { event: 'next_question' }, ({ payload }) => handleBroadcast('next_question', payload))
    .on('broadcast', { event: 'round_ended' }, ({ payload }) => handleBroadcast('round_ended', payload))
    .subscribe();
}

init();
</script>
</body>
</html>
