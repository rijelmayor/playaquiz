<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Display — PlayAQuiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #03050b; --gold: #fbbf24; --red: #ef4444; --green: #10b981; }
    body { background: var(--bg); color: #fff; font-family: 'Space Grotesk', sans-serif; margin: 0; overflow: hidden; }
    
    .screen { height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .active { display: flex; }

    /* Category Blocks */
    .cat-grid { display: flex; gap: 20px; margin-top: 40px; }
    .cat-card { background: rgba(255,255,255,0.05); border: 2px solid var(--gold); padding: 30px; border-radius: 20px; min-width: 200px; animation: pop 0.5s ease backwards; }
    
    /* Player Blocks */
    .player-grid { display: flex; gap: 30px; margin-top: 60px; }
    .p-block { padding: 20px; background: #111; border: 4px solid #333; border-radius: 15px; min-width: 150px; transition: 0.3s; }
    .p-block.buzzed { border-color: var(--gold); background: rgba(251,191,36,0.2); transform: scale(1.1); animation: shake 0.2s infinite; }
    .p-block.locked { opacity: 0.2; filter: grayscale(1); }
    .p-block.wrong { border-color: var(--red); opacity: 0.5; }

    @keyframes shake { 0% { transform: rotate(1deg); } 50% { transform: rotate(-1deg); } 100% { transform: rotate(1deg); } }
    @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .room-code { font-size: 100px; font-family: 'Bebas Neue'; color: var(--gold); }
    .q-text { font-size: 50px; max-width: 900px; margin-bottom: 40px; }
  </style>
</head>
<body>

<audio id="sfxCorrect" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-reward-952.mp3"></audio>
<audio id="sfxWrong" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>
<audio id="sfxBuzz" src="https://assets.mixkit.co/sfx/preview/mixkit-game-show-buzzer-case-failed-729.mp3"></audio>

<div id="screenWaiting" class="screen active">
  <div style="font-size: 24px; letter-spacing: 5px;">JOIN AT PLAYAQUIZ.COM</div>
  <div class="room-code" id="roomCodeDisp">----</div>
</div>

<div id="screenCategories" class="screen">
  <h1 style="font-family: 'Bebas Neue'; font-size: 60px;">CHOOSE YOUR DESTINY</h1>
  <div class="cat-grid" id="catList"></div>
  <div class="player-grid" id="finalistList"></div>
</div>

<div id="screenQuestion" class="screen">
  <div class="q-text" id="qText">Question appears here...</div>
  <div class="player-grid" id="gamePlayerList"></div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const roomCode = urlParams.get('room');
  document.getElementById('roomCodeDisp').innerText = roomCode;

  const SB_URL = "YOUR_SUPABASE_URL";
  const SB_KEY = "YOUR_SUPABASE_ANON_KEY";
  const sb = supabase.createClient(SB_URL, SB_KEY);
  
  let currentFinalists = [];
  let lockedOutIds = new Set();

  const channel = sb.channel(`fr-${roomCode}`)
    .on('broadcast', { event: 'show_category_picker' }, ({ payload }) => {
      showScreen('screenCategories');
      currentFinalists = payload.finalists;
      renderCategories(payload.categories);
      renderPlayers('finalistList');
    })
    .on('broadcast', { event: 'question_open' }, ({ payload }) => {
      showScreen('screenQuestion');
      lockedOutIds.clear();
      document.getElementById('qText').innerText = payload.question.question_text;
      renderPlayers('gamePlayerList');
    })
    .on('broadcast', { event: 'buzz_confirmed' }, ({ payload }) => {
      document.getElementById('sfxBuzz').play();
      highlightBuzzer(payload.id);
    })
    .on('broadcast', { event: 'correct' }, () => {
      document.getElementById('sfxCorrect').play();
      // Reset for next question
    })
    .on('broadcast', { event: 'wrong' }, ({ payload }) => {
      document.getElementById('sfxWrong').play();
      lockedOutIds.add(payload.id);
      renderPlayers('gamePlayerList'); // Refresh to show the X and unlock others
    })
    .subscribe();

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function renderCategories(cats) {
    const list = document.getElementById('catList');
    list.innerHTML = cats.map((c, i) => `
      <div class="cat-card" style="animation-delay: ${i*0.1}s">
        <div style="font-size: 40px">📦</div>
        <div style="margin-top:10px; font-weight:800">${c}</div>
      </div>
    `).join('');
  }

  function renderPlayers(containerId) {
    const list = document.getElementById(containerId);
    list.innerHTML = currentFinalists.map(p => {
      let statusClass = '';
      let icon = p.avatar;
      if (lockedOutIds.has(p.id)) {
        statusClass = 'wrong';
        icon = '❌';
      }
      return `
        <div class="p-block ${statusClass}" id="p-${p.id}">
          <div style="font-size: 40px">${icon}</div>
          <div style="font-weight:800">${p.name}</div>
        </div>
      `;
    }).join('');
  }

  function highlightBuzzer(id) {
    document.querySelectorAll('.p-block').forEach(b => {
      b.classList.remove('buzzed');
      if (b.id !== `p-${id}`) b.classList.add('locked');
    });
    document.getElementById(`p-${id}`).classList.add('buzzed');
  }
</script>
</body>
</html>
