<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control — PlayAQuiz Final</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #03050b; --surface: #0d1120; --border: #1f2a3c;
      --text: #e8edf7; --accent: #3b82f6; --green: #10b981; --red: #ef4444; --gold: #fbbf24;
    }
    body { background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--text); margin: 0; display: flex; height: 100vh; }
    
    /* Sidebar */
    .sidebar { width: 300px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); letter-spacing: 2px; }
    .room-box { background: #000; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--gold); }
    .room-code { font-size: 32px; font-weight: 800; color: var(--gold); }

    /* Main Area */
    .main { flex: 1; padding: 30px; overflow-y: auto; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    /* Buttons */
    .btn { padding: 12px 20px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; transition: 0.2s; font-family: inherit; }
    .btn-gold { background: var(--gold); color: #000; width: 100%; font-size: 18px; }
    .btn-green { background: var(--green); color: #fff; flex: 1; }
    .btn-red { background: var(--red); color: #fff; flex: 1; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; margin-top: 5px; }
    
    .buzzed-box { border: 2px solid var(--gold); background: rgba(251,191,36,0.1); padding: 20px; text-align: center; border-radius: 12px; }
    .buzzed-name { font-size: 40px; font-family: 'Bebas Neue'; color: var(--gold); margin: 10px 0; }
    
    .q-item { padding: 10px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; }
    .q-item:hover { background: rgba(255,255,255,0.05); }
    .fire-btn { background: var(--red); color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="logo">PLAYAQUIZ</div>
  <div class="room-box">
    <div style="font-size: 10px; color: var(--gold)">ROOM CODE</div>
    <div class="room-code" id="roomDisp">----</div>
  </div>

  <div>
    <label style="font-size: 12px; color: #888">Finalist Count</label>
    <input type="number" id="finalistLimit" value="3">
  </div>

  <button class="btn btn-gold" onclick="showCategories()">📺 SHOW CATEGORIES</button>
  
  <div id="leaderboard" style="margin-top:20px">
    <div style="font-size: 12px; color: #888; margin-bottom: 10px;">TOP PLAYERS</div>
    </div>
</div>

<div class="main">
  <div class="card" id="buzzerSection" style="display:none">
    <div class="buzzed-box">
      <div style="font-size: 12px; letter-spacing: 2px;">CURRENTLY ANSWERING</div>
      <div class="buzzed-name" id="activePlayerName">...</div>
      <div style="display:flex; gap:15px">
        <button class="btn btn-green" onclick="markCorrect()">✅ CORRECT (+100)</button>
        <button class="btn btn-red" onclick="markWrong()">❌ WRONG (LOCKOUT)</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Question Bank</h3>
    <div id="questionList">Loading questions...</div>
  </div>
</div>

<script>
  const SB_URL = "YOUR_SUPABASE_URL";
  const SB_KEY = "YOUR_SUPABASE_ANON_KEY";
  const sb = supabase.createClient(SB_URL, SB_KEY);
  
  let roomCode = Math.random().toString(36).substring(2,6).toUpperCase();
  let channel;
  let players = [];
  let currentBuzzedPlayer = null;
  let allQuestions = [];

  async function init() {
    document.getElementById('roomDisp').innerText = roomCode;
    channel = sb.channel(`fr-${roomCode}`, { config: { broadcast: { self: true } } });
    
    channel
      .on('broadcast', { event: 'player_join' }, ({ payload }) => {
        if(!players.find(p => p.id === payload.id)) players.push(payload);
        updateUI();
      })
      .on('broadcast', { event: 'buzz' }, ({ payload }) => handleBuzz(payload))
      .subscribe();

    const { data } = await sb.from('questions').select('*');
    allQuestions = data || [];
    renderQuestions();
  }

  function updateUI() {
    const lb = document.getElementById('leaderboard');
    players.sort((a,b) => b.score - a.score);
    lb.innerHTML = players.map(p => `<div style="padding:5px 0">${p.avatar} ${p.name} - ${p.score}</div>`).join('');
    
    // Broadcast player list to FOH
    channel.send({ type: 'broadcast', event: 'player_update', payload: { players } });
  }

  function showCategories() {
    const limit = parseInt(document.getElementById('finalistLimit').value);
    const finalists = players.slice(0, limit);
    const categories = [...new Set(allQuestions.map(q => q.category))];
    
    channel.send({ 
      type: 'broadcast', 
      event: 'show_category_picker', 
      payload: { finalists, categories } 
    });
  }

  function renderQuestions() {
    const list = document.getElementById('questionList');
    list.innerHTML = allQuestions.map(q => `
      <div class="q-item">
        <span>[${q.category}] ${q.question_text}</span>
        <button class="fire-btn" onclick="fireQuestion(${q.id})">FIRE</button>
      </div>
    `).join('');
  }

  function fireQuestion(id) {
    const q = allQuestions.find(x => x.id === id);
    currentBuzzedPlayer = null;
    document.getElementById('buzzerSection').style.display = 'none';
    channel.send({ type: 'broadcast', event: 'question_open', payload: { question: q } });
  }

  function handleBuzz(payload) {
    if (currentBuzzedPlayer) return;
    currentBuzzedPlayer = payload;
    document.getElementById('buzzerSection').style.display = 'block';
    document.getElementById('activePlayerName').innerText = payload.name;
    channel.send({ type: 'broadcast', event: 'buzz_confirmed', payload });
  }

  function markCorrect() {
    const p = players.find(x => x.id === currentBuzzedPlayer.id);
    if(p) p.score += 100;
    channel.send({ type: 'broadcast', event: 'correct', payload: { id: currentBuzzedPlayer.id } });
    currentBuzzedPlayer = null;
    document.getElementById('buzzerSection').style.display = 'none';
    updateUI();
  }

  function markWrong() {
    channel.send({ type: 'broadcast', event: 'wrong', payload: { id: currentBuzzedPlayer.id } });
    currentBuzzedPlayer = null;
    document.getElementById('buzzerSection').style.display = 'none';
  }

  init();
</script>
</body>
</html>
