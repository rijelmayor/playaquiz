<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayAQuiz — Final Round Control</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* (Same beautiful styles as before - abbreviated for brevity) */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #03050b; --surface: #0d1120; --gold: #fbbf24; --green: #10b981;
      --red: #ef4444; --accent: #3b82f6; --purple: #a855f7;
    }
    body { background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: #fff; height: 100vh; overflow: hidden; }
    .app { display: flex; height: 100%; }
    .sidebar { width: 280px; background: #0d1120; border-right: 1px solid #1f2a3c; padding: 20px; overflow-y: auto; }
    .main { flex: 1; padding: 24px; overflow-y: auto; }
    .btn { padding: 12px 24px; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.2s; }
    .btn-green { background: var(--green); color: white; }
    .btn-red { background: var(--red); color: white; }
    .btn-purple { background: var(--purple); color: white; }
    .btn-lg { padding: 16px 32px; font-size: 18px; }
    .card { background: #111827; border: 1px solid #1f2a3c; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  </style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <h1 style="font-family:Bebas Neue; font-size:32px; background:linear-gradient(#fff,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">PLAYAQUIZ</h1>
    <div class="card">
      <div style="margin-bottom:12px">Room Code</div>
      <div id="roomCodeDisplay" style="font-size:42px; font-family:JetBrains Mono; color:var(--gold); letter-spacing:6px; text-align:center;">——</div>
    </div>
    <div class="card">
      <label>Number of Finalists</label>
      <input type="number" id="numFinalists" value="8" min="2" max="20" style="width:100%; padding:12px; font-size:18px; text-align:center; margin-top:8px;">
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="card">
      <button class="btn btn-purple btn-lg" style="width:100%" onclick="showCategoryPickerOnFOH()">🎨 SHOW CATEGORIES TO START</button>
      <p style="text-align:center; margin-top:12px; color:#888; font-size:14px;">This will open the category picker on the big screen</p>
    </div>

    <!-- Question Bank & Controls -->
    <div class="card">
      <h3>Question Bank</h3>
      <!-- Question list and filters remain same as before -->
      <div id="gameQuestionBankList" style="max-height:300px; overflow-y:auto;"></div>
    </div>

    <!-- Buzzer Judge -->
    <div id="buzzerCard" class="card" style="display:none; border:3px solid #fbbf24;">
      <h2 style="color:#fbbf24; text-align:center;">🔔 <span id="buzzedNameBig"></span> BUZZED</h2>
      <div style="display:flex; gap:16px; justify-content:center; margin:30px 0;">
        <button class="btn btn-green btn-lg" onclick="markCorrect()">✅ CORRECT</button>
        <button class="btn btn-red btn-lg" onclick="markWrong()">❌ WRONG</button>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== CONFIG ====================
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let roomCode = '';
let frPlayers = new Map();
let buzzedPlayerId = null;
let realtimeChannel = null;

// Generate Room Code
function generateRoomCode() {
  roomCode = 'FR' + Math.random().toString(36).substring(2,7).toUpperCase();
  document.getElementById('roomCodeDisplay').textContent = roomCode;
  setupRealtime();
}

function setupRealtime() {
  realtimeChannel = sb.channel(`fr-${roomCode}`);
  realtimeChannel
    .on('broadcast', {event: 'player_join'}, ({payload}) => handlePlayerJoin(payload))
    .on('broadcast', {event: 'buzz'}, ({payload}) => handleBuzz(payload))
    .subscribe();
}

function broadcast(event, payload) {
  realtimeChannel.send({type: 'broadcast', event, payload});
}

// Player Join & Buzz Handlers (same logic as before, simplified)
function handlePlayerJoin(p) {
  if (!frPlayers.has(p.id)) {
    frPlayers.set(p.id, {...p, score: 0});
    renderPlayers();
  }
}

function handleBuzz(p) {
  if (buzzedPlayerId) return;
  buzzedPlayerId = p.id;
  document.getElementById('buzzerCard').style.display = 'block';
  document.getElementById('buzzedNameBig').innerHTML = `${p.avatar} ${p.name}`;
  broadcast('buzz_confirmed', p);
}

// Judge
function markCorrect() {
  const player = frPlayers.get(buzzedPlayerId);
  if (player) player.score += 100;
  broadcast('correct', {playerId: buzzedPlayerId, playerName: player?.name, points: 100});
  resetBuzzerState();
}

function markWrong() {
  broadcast('wrong', {playerId: buzzedPlayerId, playerName: frPlayers.get(buzzedPlayerId)?.name});
  resetBuzzerState();
}

function resetBuzzerState() {
  buzzedPlayerId = null;
  document.getElementById('buzzerCard').style.display = 'none';
}

// Show Categories
function showCategoryPickerOnFOH() {
  broadcast('show_category_picker', { categories: [] }); // You can expand categories later
  // Auto open first question flow if needed
}

// Init
generateRoomCode();
</script>
</body>
</html>
