<!-- admin-password.html - Only accessible via direct link -->
<!DOCTYPE html>
<html>
<head>
  <title>Admin Password Setup</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div style="max-width: 400px; margin: 100px auto; padding: 20px;">
    <h2>Set Admin Password</h2>
    <input type="password" id="newPassword" placeholder="New Password">
    <input type="password" id="confirmPassword" placeholder="Confirm Password">
    <button onclick="updatePassword()">Update Password</button>
    <div id="result"></div>
  </div>
  
  <script>
    const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    
    async function updatePassword() {
      const pwd = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      
      if (pwd !== confirm) {
        document.getElementById('result').innerText = 'Passwords do not match';
        return;
      }
      
      const hash = await hashPassword(pwd);
      
      const { error } = await sb
        .from('admin_settings')
        .update({ admin_password_hash: hash, updated_at: new Date() })
        .eq('id', 1);
      
      if (error) {
        document.getElementById('result').innerText = 'Error: ' + error.message;
      } else {
        document.getElementById('result').innerText = '✅ Password updated!';
      }
    }
  </script>
</body>
</html>
