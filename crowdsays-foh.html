<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crowd Says</title>
<style>
  :root {
    --navy-deep: #06080F;
    --navy-panel: #11162A;
    --navy-line: #232B45;
    --gold: #E8B84B;
    --gold-bright: #FFD571;
    --teal: #3DDC97;
    --red: #D14545;
    --text-hi: #F4F1E8;
    --text-lo: #6E7493;
    --font-display: 'Archivo Black', 'Arial Black', sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--navy-deep); color: var(--text-hi);
    font-family: var(--font-mono);
    width: 100%; height: 100%; overflow: hidden;
  }

  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: clamp(16px, 3vw, 48px);
    background:
      radial-gradient(ellipse at 50% -10%, rgba(232,184,75,0.08), transparent 60%),
      var(--navy-deep);
  }

  /* Event branding: background image sits behind everything, dimmed so the
     board/text stays readable; event title shows above the Crowd Says mark. */
  .branding-bg {
    position: fixed; inset: 0; z-index: -1;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    opacity: 0; transition: opacity 0.6s ease;
  }
  .branding-bg.show { opacity: 1; }
  .branding-bg::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(6,8,15,0.72);
  }
  .event-title-banner {
    width: 100%; text-align: center; font-family: var(--font-mono);
    font-size: clamp(11px, 1.1vw, 15px); letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--gold-bright); display: none;
  }
  .event-title-banner.show { display: block; }

  /* Idle / waiting state */
  .idle-screen {
    text-align: center;
  }
  .idle-screen .eyebrow {
    font-size: clamp(13px, 1.4vw, 18px); letter-spacing: 0.3em; color: var(--gold);
    text-transform: uppercase; margin-bottom: 16px;
  }
  .idle-screen h1 {
    font-family: var(--font-display); font-size: clamp(36px, 7vw, 96px);
    color: var(--text-hi); letter-spacing: -0.01em;
  }
  .idle-screen p { color: var(--text-lo); margin-top: 14px; font-size: clamp(13px, 1.3vw, 18px); }

  /* Main game screen */
  .game-screen { display: none; width: 100%; max-width: 1400px; flex-direction: column; align-items: center; gap: clamp(16px, 2.4vw, 28px); }
  .game-screen.show { display: flex; }

  .header-row {
    display: flex; justify-content: space-between; align-items: baseline; width: 100%;
  }
  .crowdsays-mark {
    font-family: var(--font-display); font-size: clamp(20px, 2.4vw, 32px); color: var(--gold);
    letter-spacing: -0.01em;
  }
  .crowdsays-mark span { color: var(--text-hi); }
  .pot-display {
    font-size: clamp(13px, 1.2vw, 16px); color: var(--text-lo); text-align: right;
    text-transform: uppercase; letter-spacing: 0.15em;
  }
  .pot-display strong {
    display: block; font-family: var(--font-display); font-size: clamp(28px, 3.2vw, 44px);
    color: var(--gold-bright); letter-spacing: 0; margin-top: 2px;
    text-shadow: 0 0 24px rgba(232,184,75,0.4);
  }

  .prompt-bar {
    width: 100%; text-align: center; padding: clamp(14px, 1.8vw, 22px) clamp(20px, 3vw, 40px);
    background: var(--navy-panel); border: 1px solid var(--navy-line); border-radius: 16px;
  }
  .prompt-bar .prompt-text {
    font-family: var(--font-display); font-size: clamp(20px, 3vw, 34px); color: var(--text-hi);
    line-height: 1.2; text-transform: none;
  }

  /* Board */
  .board {
    display: grid; grid-template-columns: 1fr 1fr; gap: clamp(10px, 1.4vw, 16px);
    width: 100%;
  }
  .tile {
    position: relative; height: clamp(70px, 9vw, 110px); border-radius: 14px;
    background: linear-gradient(180deg, #1A2038, #11162A);
    border: 2px solid var(--navy-line);
    display: flex; align-items: center; padding: 0 clamp(16px, 2vw, 28px);
    overflow: hidden;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.2,.9,.25,1), border-color 0.4s, background 0.4s;
  }
  .tile-num {
    font-family: var(--font-display); font-size: clamp(18px, 2vw, 26px); color: var(--navy-line);
    width: clamp(32px, 4vw, 48px); flex-shrink: 0;
  }
  .tile-content { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-width: 0; }
  .tile-text {
    font-size: clamp(16px, 2vw, 26px); color: var(--text-lo); letter-spacing: 0.08em;
    text-transform: uppercase; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .tile-pts {
    font-family: var(--font-display); font-size: clamp(18px, 2.2vw, 30px); color: var(--navy-line);
    flex-shrink: 0;
  }

  .tile.revealed {
    border-color: var(--teal);
    background: linear-gradient(180deg, #16302A, #0D1F1B);
  }
  .tile.revealed .tile-num { color: var(--teal); }
  .tile.revealed .tile-text { color: var(--text-hi); }
  .tile.revealed .tile-pts { color: var(--gold-bright); }

  .tile.flip-in {
    animation: tileFlip 0.55s cubic-bezier(.2,.9,.25,1);
  }
  @keyframes tileFlip {
    0%   { transform: rotateX(0deg) scale(1); }
    40%  { transform: rotateX(90deg) scale(1.02); }
    55%  { transform: rotateX(90deg) scale(1.02); }
    80%  { transform: rotateX(-8deg) scale(1.02); }
    100% { transform: rotateX(0deg) scale(1); }
  }
  .tile.flip-in::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle, rgba(232,184,75,0.5), transparent 70%);
    animation: flashOut 0.6s ease-out forwards;
  }
  @keyframes flashOut { from { opacity: 1; } to { opacity: 0; } }

  /* Strikes */
  .strikes-block { display: flex; gap: clamp(8px, 1vw, 14px); justify-content: center; }
  .strike-tile {
    width: clamp(40px, 4.6vw, 60px); height: clamp(40px, 4.6vw, 60px);
    border: 3px solid var(--navy-line); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: clamp(20px, 2.4vw, 32px); color: var(--navy-line);
    transition: all 0.3s;
  }
  .strike-tile.hit {
    border-color: var(--red); color: var(--red);
    background: rgba(209,69,69,0.12);
    animation: strikePulse 0.4s ease-out;
  }
  @keyframes strikePulse {
    0% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  .status-flag {
    text-align: center; font-size: clamp(13px, 1.3vw, 17px); letter-spacing: 0.2em;
    text-transform: uppercase; padding: 4px 0; color: var(--text-lo);
  }
  .status-flag.randomizing { color: var(--gold); }
  .status-flag.steal { color: var(--red); }

  /* Team scoreboard — flexes from 2 up to 16 teams */
  .teams-board {
    display: grid; gap: clamp(6px, 0.8vw, 12px); width: 100%;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  }
  .team-block {
    background: var(--navy-panel); border: 2px solid var(--navy-line); border-radius: 12px;
    padding: clamp(8px, 1.1vw, 14px); text-align: center;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .team-block.control {
    border-color: var(--gold); box-shadow: 0 0 24px rgba(232,184,75,0.25);
  }
  .team-block .t-name {
    font-size: clamp(9px, 0.9vw, 12px); letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-lo);
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .team-block.control .t-name { color: var(--gold); }
  .team-block .t-score {
    font-family: var(--font-display); font-size: clamp(20px, 2.6vw, 36px); color: var(--text-hi); margin-top: 2px;
  }
  .team-block.control .t-score { color: var(--gold-bright); }

  /* Slot-machine randomizer overlay */
  .randomize-overlay {
    position: fixed; inset: 0; background: rgba(6,8,15,0.95);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    z-index: 60; text-align: center; gap: 22px;
  }
  .randomize-overlay.show { display: flex; animation: fadeIn 0.25s ease-out; }
  .randomize-overlay .ro-eyebrow {
    font-size: clamp(13px, 1.5vw, 18px); letter-spacing: 0.3em; color: var(--text-lo);
    text-transform: uppercase;
  }
  .slot-window {
    position: relative; width: min(90vw, 620px); height: clamp(90px, 13vw, 150px);
    border: 3px solid var(--gold); border-radius: 18px;
    background: linear-gradient(180deg, #1A2038, #0D1120);
    overflow: hidden;
    box-shadow: 0 0 50px rgba(232,184,75,0.25), inset 0 0 30px rgba(0,0,0,0.4);
  }
  .slot-window::before, .slot-window::after {
    content: ''; position: absolute; left: 0; right: 0; height: 30%;
    z-index: 2; pointer-events: none;
  }
  .slot-window::before { top: 0; background: linear-gradient(180deg, rgba(13,17,32,0.95), transparent); }
  .slot-window::after { bottom: 0; background: linear-gradient(0deg, rgba(13,17,32,0.95), transparent); }
  .slot-name {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: clamp(24px, 4.4vw, 52px); color: var(--text-hi);
    letter-spacing: 0.02em; padding: 0 16px; text-align: center;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100%;
  }
  .slot-name.cycling {
    animation: slotCycle 0.09s steps(1) infinite;
  }
  @keyframes slotCycle {
    0% { transform: translateY(-6px); opacity: 0.7; }
    50% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(6px); opacity: 0.7; }
  }
  .slot-name.locked {
    animation: slotLock 0.45s cubic-bezier(.2,.9,.25,1);
    color: var(--gold-bright);
    text-shadow: 0 0 30px rgba(232,184,75,0.6);
  }
  @keyframes slotLock {
    0% { transform: scale(1.15); }
    60% { transform: scale(0.96); }
    100% { transform: scale(1); }
  }
  .slot-window.locked {
    border-color: var(--gold-bright);
    box-shadow: 0 0 70px rgba(232,184,75,0.45), inset 0 0 30px rgba(0,0,0,0.4);
  }
  .randomize-overlay .ro-sub {
    font-size: clamp(13px, 1.4vw, 18px); color: var(--text-lo);
    letter-spacing: 0.1em; text-transform: uppercase; min-height: 1.4em;
  }
  .randomize-overlay .ro-sub.locked { color: var(--teal); }

  /* Win banner overlay */
  .win-overlay {
    position: fixed; inset: 0; background: rgba(6,8,15,0.92);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    z-index: 50; text-align: center;
  }
  .win-overlay.show { display: flex; animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .win-overlay .win-label {
    font-size: clamp(14px, 1.6vw, 20px); letter-spacing: 0.3em; color: var(--text-lo);
    text-transform: uppercase; margin-bottom: 10px;
  }
  .win-overlay .win-team {
    font-family: var(--font-display); font-size: clamp(36px, 6.4vw, 80px); color: var(--gold-bright);
    text-shadow: 0 0 40px rgba(232,184,75,0.5);
  }
  .win-overlay .win-amount {
    font-size: clamp(18px, 2.2vw, 28px); color: var(--teal); margin-top: 16px;
  }
</style>
</head>
<body>

<div class="branding-bg" id="brandingBg"></div>

<div class="idle-screen" id="idleScreen">
  <div class="event-title-banner" id="idleEventTitle"></div>
  <div class="eyebrow">PlayAQuiz</div>
  <h1>Crowd Says</h1>
  <p>Waiting for the host to load a question…</p>
</div>

<div class="game-screen" id="gameScreen">
  <div class="event-title-banner" id="activeEventTitle"></div>
  <div class="header-row">
    <div class="crowdsays-mark">CROWD <span>SAYS</span></div>
    <div class="pot-display">Pot<strong id="potValue">0</strong></div>
  </div>

  <div class="prompt-bar">
    <div class="prompt-text" id="promptText">—</div>
  </div>

  <div class="status-flag" id="statusFlag"></div>

  <div class="board" id="board"></div>

  <div class="strikes-block">
    <div class="strike-tile" id="strike1">✕</div>
    <div class="strike-tile" id="strike2">✕</div>
    <div class="strike-tile" id="strike3">✕</div>
  </div>

  <div class="teams-board" id="teamsBoard"></div>
</div>

<div class="randomize-overlay" id="randomizeOverlay">
  <div class="ro-eyebrow">Who's in control?</div>
  <div class="slot-window" id="slotWindow">
    <div class="slot-name" id="slotName">Team 1</div>
  </div>
  <div class="ro-sub" id="roSub">Shuffling…</div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-label" id="winLabel">Round won by</div>
  <div class="win-team" id="winTeam">Team 1</div>
  <div class="win-amount" id="winAmount">+0 points</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ====== CONFIG ======
  const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ====== SOUND EFFECTS (generated tones, no audio files needed) ======
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  // Unlock on first user gesture — browsers block audio until then.
  document.body.addEventListener('click', () => getAudioCtx(), { once: true });
  document.body.addEventListener('touchstart', () => getAudioCtx(), { once: true });

  // Plays a single tone. type: oscillator waveform, freq: Hz, start/end times
  // relative to now, peakGain: volume 0-1.
  function tone(freq, duration, { type = 'sine', startGain = 0.001, peakGain = 0.18, delay = 0 } = {}) {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + delay;
    gain.gain.setValueAtTime(startGain, t0);
    gain.gain.exponentialRampToValueAtTime(peakGain, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  }

  function playSfx(name) {
    try {
      switch (name) {
        case 'reveal':
          // Bright upward chime — a tile flipping open
          tone(660, 0.18, { type: 'triangle', peakGain: 0.2 });
          tone(990, 0.22, { type: 'triangle', peakGain: 0.16, delay: 0.06 });
          break;
        case 'strike':
          // Low buzzy thud — a wrong answer
          tone(160, 0.28, { type: 'sawtooth', peakGain: 0.22 });
          tone(110, 0.32, { type: 'sawtooth', peakGain: 0.16, delay: 0.04 });
          break;
        case 'award':
          // Warm ascending triad — points banked
          tone(440, 0.22, { type: 'triangle', peakGain: 0.18 });
          tone(554, 0.22, { type: 'triangle', peakGain: 0.18, delay: 0.09 });
          tone(660, 0.3, { type: 'triangle', peakGain: 0.2, delay: 0.18 });
          break;
        case 'steal':
          // Sharp, urgent two-note sting
          tone(880, 0.12, { type: 'square', peakGain: 0.15 });
          tone(740, 0.18, { type: 'square', peakGain: 0.15, delay: 0.1 });
          break;
        case 'entrance':
          // Rising sweep as a new question takes the stage
          tone(330, 0.4, { type: 'sine', peakGain: 0.14 });
          tone(440, 0.35, { type: 'sine', peakGain: 0.16, delay: 0.12 });
          tone(550, 0.3, { type: 'sine', peakGain: 0.18, delay: 0.24 });
          break;
        case 'win':
          // Bigger fanfare for round resolution — kept distinct from 'award'
          tone(523, 0.2, { type: 'triangle', peakGain: 0.2 });
          tone(659, 0.2, { type: 'triangle', peakGain: 0.2, delay: 0.1 });
          tone(784, 0.35, { type: 'triangle', peakGain: 0.22, delay: 0.2 });
          break;
      }
    } catch (e) {
      console.error('SFX playback failed:', e);
    }
  }

  // ====== STATE ======
  const params = new URLSearchParams(window.location.search);
  const roomCode = (params.get('room') || '').toUpperCase();
  let sessionId = null;
  let channel = null;
  let currentQuestion = null; // { id, prompt, answers: [{text, points}], revealed_answers: [] }
  let teamNames = [];         // e.g. ["Table 1", "Table 2", ...]
  let teamScores = [];
  let controllingTeam = null; // index into teamNames, or null

  function teamLabel(idx) {
    return (idx !== null && idx !== undefined && teamNames[idx]) ? teamNames[idx] : '—';
  }

  // ====== EVENT BRANDING ======
  // bgImage: a data URL to set it, null to explicitly clear it, or undefined
  // to leave whatever's currently showing untouched (used when only the
  // title changed and the image wasn't re-sent to avoid a huge payload).
  let currentBgImage = null;
  function applyBranding(title, bgImage) {
    const bg = document.getElementById('brandingBg');

    if (bgImage !== undefined) {
      currentBgImage = bgImage;
      if (bgImage) {
        bg.style.backgroundImage = `url(${bgImage})`;
        bg.classList.add('show');
      } else {
        bg.classList.remove('show');
        bg.style.backgroundImage = '';
      }
    }

    [document.getElementById('idleEventTitle'), document.getElementById('activeEventTitle')].forEach(el => {
      if (title) {
        el.textContent = title;
        el.classList.add('show');
      } else {
        el.textContent = '';
        el.classList.remove('show');
      }
    });
  }

  async function init() {
    if (!roomCode) {
      document.getElementById('idleScreen').querySelector('p').textContent = 'No room code in URL — add ?room=CODE';
      return;
    }

    const { data: sessionRow } = await db
      .from('crowdsays_sessions')
      .select('*')
      .eq('room_code', roomCode)
      .maybeSingle();

    if (!sessionRow) {
      document.getElementById('idleScreen').querySelector('p').textContent = 'Room not found — ask the host to start it from crowdsays-host.html';
      return;
    }
    sessionId = sessionRow.id;
    teamNames = Array.isArray(sessionRow.team_names) ? sessionRow.team_names : [];
    applyBranding(sessionRow.event_title, sessionRow.event_bg_image);

    await loadState();
    subscribeRealtime();
    startPoll();
  }

  async function loadState() {
    const { data } = await db
      .from('crowdsays_state')
      .select('*')
      .eq('session_id', sessionId)
      .maybeSingle();
    if (!data) return;

    if (data.current_question_id) {
      const { data: qRow } = await db
        .from('crowdsays_questions')
        .select('*')
        .eq('id', data.current_question_id)
        .single();
      currentQuestion = qRow;
    } else {
      currentQuestion = null;
    }

    renderFromState(data);
  }

  function subscribeRealtime() {
    channel = db.channel(`room:${roomCode}`, { config: { broadcast: { self: false } } });

    channel.on('broadcast', { event: 'crowdsays_question_loaded' }, (msg) => {
      handleQuestionLoaded(msg.payload);
    });
    channel.on('broadcast', { event: 'crowdsays_randomize_started' }, (msg) => {
      handleRandomizeStarted(msg.payload);
    });
    channel.on('broadcast', { event: 'crowdsays_answer_revealed' }, (msg) => {
      handleAnswerRevealed(msg.payload);
    });
    channel.on('broadcast', { event: 'crowdsays_strike' }, (msg) => {
      handleStrike(msg.payload);
    });
    channel.on('broadcast', { event: 'crowdsays_steal_started' }, (msg) => {
      handleStealStarted(msg.payload);
    });
    channel.on('broadcast', { event: 'crowdsays_round_won' }, (msg) => {
      handleRoundWon(msg.payload);
    });
    channel.on('broadcast', { event: 'crowdsays_board_cleared' }, () => {
      handleBoardCleared();
    });
    channel.on('broadcast', { event: 'crowdsays_team_renamed' }, (msg) => {
      teamNames = msg.payload.team_names;
      renderTeamsBoard();
    });
    channel.on('broadcast', { event: 'crowdsays_branding_updated' }, (msg) => {
      applyBranding(msg.payload.event_title, msg.payload.event_bg_image);
    });

    channel.subscribe();
  }

  // Periodic poll as a safety net for FOH state recovery (consistent with existing reconnection patterns)
  function startPoll() {
    setInterval(loadState, 8000);
  }

  // ====== HANDLERS ======
  function handleQuestionLoaded(payload) {
    document.getElementById('idleScreen').style.display = 'none';
    document.getElementById('gameScreen').classList.add('show');
    document.getElementById('winOverlay').classList.remove('show');
    document.getElementById('randomizeOverlay').classList.remove('show');

    document.getElementById('promptText').textContent = payload.prompt;
    document.getElementById('potValue').textContent = '0';
    setStatusFlag('randomizing', 'Waiting for host to randomize control');
    resetStrikes();
    setControl(null);
    playSfx('entrance');

    // build empty board
    currentQuestion = { id: payload.question_id, prompt: payload.prompt, answers: new Array(payload.answer_count).fill({ text: '', points: 0 }), revealed_answers: [] };
    renderBoard([]);
  }

  let shuffleInterval = null;

  function handleRandomizeStarted(payload) {
    teamNames = payload.team_names || teamNames;
    renderTeamsBoard();

    const overlay = document.getElementById('randomizeOverlay');
    const slotWindow = document.getElementById('slotWindow');
    const slotName = document.getElementById('slotName');
    const roSub = document.getElementById('roSub');

    overlay.classList.add('show');
    slotWindow.classList.remove('locked');
    roSub.classList.remove('locked');
    roSub.textContent = 'Shuffling…';
    slotName.classList.remove('locked');
    slotName.classList.add('cycling');

    const names = teamNames.length ? teamNames : ['Team 1', 'Team 2'];
    let i = 0;
    if (shuffleInterval) clearInterval(shuffleInterval);
    shuffleInterval = setInterval(() => {
      slotName.textContent = names[i % names.length];
      i++;
    }, 90);

    // Shuffle for ~1.8s, then lock on the host-decided result
    setTimeout(() => {
      clearInterval(shuffleInterval);
      shuffleInterval = null;
      slotName.classList.remove('cycling');
      slotName.textContent = teamLabel(payload.result_index);
      slotName.classList.add('locked');
      slotWindow.classList.add('locked');
      roSub.textContent = `${teamLabel(payload.result_index)} controls the board`;
      roSub.classList.add('locked');
      playSfx('reveal');

      setControl(payload.result_index);
      setStatusFlag('playing', `${teamLabel(payload.result_index)} in control`);

      setTimeout(() => {
        overlay.classList.remove('show');
      }, 1300);
    }, 1800);
  }

  function handleAnswerRevealed(payload) {
    if (!currentQuestion) return;
    if (!currentQuestion.answers[payload.index] || !currentQuestion.answers[payload.index].text) {
      currentQuestion.answers[payload.index] = { text: payload.text, points: payload.points };
    }
    currentQuestion.revealed_answers = [...(currentQuestion.revealed_answers || []), payload.index];
    document.getElementById('potValue').textContent = payload.pot;
    renderBoard(currentQuestion.revealed_answers, payload.index);
    playSfx('reveal');
  }

  function handleStrike(payload) {
    setStrikes(payload.strikes);
    playSfx('strike');
  }

  function handleStealStarted(payload) {
    setStatusFlag('steal', 'Steal — open floor, one guess wins it');
    playSfx('steal');
  }

  function handleRoundWon(payload) {
    showWinOverlay(payload.team_index, payload.amount, payload.by_steal, payload.steal_success);
    if (payload.by_steal) {
      playSfx(payload.steal_success ? 'win' : 'strike');
    } else {
      playSfx('award');
    }
    setTimeout(() => {
      document.getElementById('winOverlay').classList.remove('show');
    }, 4200);
  }

  function handleBoardCleared() {
    document.getElementById('gameScreen').classList.remove('show');
    document.getElementById('idleScreen').style.display = 'flex';
    document.getElementById('idleScreen').querySelector('p').textContent = 'Waiting for the host to load the next question…';
    currentQuestion = null;
  }

  // ====== RENDER HELPERS ======
  function renderFromState(data) {
    teamScores = Array.isArray(data.team_scores) ? data.team_scores : [];
    controllingTeam = data.controlling_team;
    document.getElementById('potValue').textContent = data.pot;
    setStrikes(data.strikes);
    renderTeamsBoard();

    if (data.round_status === 'idle' && !currentQuestion) {
      document.getElementById('gameScreen').classList.remove('show');
      document.getElementById('idleScreen').style.display = 'flex';
      return;
    }

    document.getElementById('idleScreen').style.display = 'none';
    document.getElementById('gameScreen').classList.add('show');

    if (currentQuestion) {
      document.getElementById('promptText').textContent = currentQuestion.prompt;
      renderBoard(currentQuestion.revealed_answers || []);
    }

    const flagMap = {
      randomizing: ['randomizing', 'Waiting for host to randomize control'],
      playing: ['playing', data.controlling_team !== null && data.controlling_team !== undefined ? `${teamLabel(data.controlling_team)} in control` : ''],
      steal: ['steal', 'Steal — open floor, one guess wins it']
    };
    const [cls, text] = flagMap[data.round_status] || ['', ''];
    setStatusFlag(cls, text);
  }

  function renderTeamsBoard() {
    const wrap = document.getElementById('teamsBoard');
    wrap.innerHTML = teamNames.map((name, i) => `
      <div class="team-block ${controllingTeam === i ? 'control' : ''}">
        <div class="t-name">${escapeHtml(name)}</div>
        <div class="t-score">${teamScores[i] || 0}</div>
      </div>
    `).join('');
  }

  function renderBoard(revealedIndices, flipIndex) {
    if (!currentQuestion) return;
    const board = document.getElementById('board');
    board.innerHTML = currentQuestion.answers.map((a, i) => {
      const isRevealed = revealedIndices.includes(i);
      return `
        <div class="tile ${isRevealed ? 'revealed' : ''} ${flipIndex === i ? 'flip-in' : ''}">
          <span class="tile-num">${i + 1}</span>
          <span class="tile-content">
            <span class="tile-text">${isRevealed ? escapeHtml(a.text) : ''}</span>
            <span class="tile-pts">${isRevealed ? a.points : ''}</span>
          </span>
        </div>`;
    }).join('');
  }

  function setStrikes(n) {
    [1, 2, 3].forEach(i => {
      document.getElementById(`strike${i}`).classList.toggle('hit', n >= i);
    });
  }
  function resetStrikes() { setStrikes(0); }

  function setControl(idx) {
    controllingTeam = idx;
    renderTeamsBoard();
  }

  function setStatusFlag(cls, text) {
    const el = document.getElementById('statusFlag');
    el.className = 'status-flag' + (cls ? ' ' + cls : '');
    el.textContent = text;
  }

  function showWinOverlay(teamIdx, amount, bySteal, stealSuccess) {
    document.getElementById('winLabel').textContent = bySteal
      ? (stealSuccess ? 'Stolen by' : 'Steal failed — kept by')
      : 'Round won by';
    document.getElementById('winTeam').textContent = teamLabel(teamIdx);
    document.getElementById('winAmount').textContent = `+${amount} points`;
    document.getElementById('winOverlay').classList.add('show');
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s || '';
    return div.innerHTML;
  }

  init().catch(function(err) {
    console.error('FOH init failed:', err);
  });
</script>
</body>
</html>
