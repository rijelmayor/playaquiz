<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crowd Says</title>
<style>
  :root {
    --navy-deep: #06080F;
    --navy-panel: #11162A;
    --navy-line: #232B45;
    --gold: #E8B84B;
    --gold-bright: #FFD571;
    --teal: #3DDC97;
    --red: #D14545;
    --text-hi: #F4F1E8;
    --text-lo: #6E7493;
    --font-display: 'Archivo Black', 'Arial Black', sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;

    /* Branding overrides (set via host broadcast) */
    --brand-bg-color: #06080F;
    --brand-overlay: rgba(6,8,15,0.0);
    --brand-text: 'CROWD SAYS';
    --brand-accent: #E8B84B;
    --brand-bg-image: none;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    color: var(--text-hi);
    font-family: var(--font-mono);
    width: 100%; height: 100%; overflow: hidden;
  }

  /* ===================== BACKGROUND THEMES ===================== */
  body {
    background: var(--brand-bg-color);
    transition: background 0.6s ease, background-image 0.6s ease;
    position: relative;
  }

  /* Background image support */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: var(--brand-bg-image);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 0.8s ease;
    pointer-events: none;
    z-index: 0;
  }
  body.has-bg-image::before {
    opacity: 1;
  }
  body.has-bg-image::after {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--brand-overlay);
    pointer-events: none;
    z-index: 1;
  }
  body.has-bg-image > *:not(.randomize-overlay):not(.win-overlay):not(.brand-watermark):not(#errorBanner) { 
    position: relative; 
    z-index: 2; 
  }

  /* Theme: Classic (default) */
  body.theme-classic {
    --brand-bg-color: #06080F;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(232,184,75,0.08), transparent 60%),
      var(--brand-bg-color);
  }

  /* Theme: Deep Blue */
  body.theme-blue {
    --brand-bg-color: #020815;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(61,132,220,0.18), transparent 55%),
      radial-gradient(ellipse at 70% 80%, rgba(30,60,140,0.22), transparent 55%),
      var(--brand-bg-color);
  }

  /* Theme: Purple/Violet */
  body.theme-purple {
    --brand-bg-color: #0A0515;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(140,60,220,0.22), transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(80,20,160,0.18), transparent 50%),
      var(--brand-bg-color);
  }

  /* Theme: Red/Dark */
  body.theme-red {
    --brand-bg-color: #0F0606;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(209,69,69,0.15), transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(160,20,20,0.12), transparent 50%),
      var(--brand-bg-color);
  }

  /* Theme: Teal/Green */
  body.theme-teal {
    --brand-bg-color: #030F09;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(61,220,151,0.12), transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(20,120,80,0.14), transparent 55%),
      var(--brand-bg-color);
  }

  /* Theme: White/Light */
  body.theme-light {
    --brand-bg-color: #F0EDE4;
    --text-hi: #1A1306;
    --text-lo: #6B6550;
    --navy-panel: #E2DDD4;
    --navy-line: #C8C4BB;
    --navy-deep: #F0EDE4;
    --gold: #C4A030;
    --gold-bright: #D4B040;
    background: var(--brand-bg-color);
  }

  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: clamp(16px, 3vw, 48px);
  }

  /* ===================== BRANDING TEXT ===================== */
  .brand-watermark {
    position: fixed;
    bottom: clamp(12px, 2vw, 24px);
    right: clamp(16px, 2.5vw, 32px);
    font-family: var(--font-mono);
    font-size: clamp(10px, 1vw, 13px);
    letter-spacing: 0.18em;
    color: var(--text-lo);
    text-transform: uppercase;
    opacity: 0.55;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.4s;
    white-space: nowrap;
  }

  /* ===================== IDLE SCREEN ===================== */
  .idle-screen { 
    text-align: center; 
    z-index: 2;
    position: relative;
  }
  .idle-screen .eyebrow {
    font-size: clamp(13px, 1.4vw, 18px); 
    letter-spacing: 0.3em; 
    color: var(--gold);
    text-transform: uppercase; 
    margin-bottom: 16px;
    opacity: 0.9;
  }
  .idle-screen h1 {
    font-family: var(--font-display); 
    font-size: clamp(36px, 7vw, 96px);
    color: var(--text-hi); 
    letter-spacing: -0.01em;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }
  .idle-screen p { 
    color: var(--text-lo); 
    margin-top: 14px; 
    font-size: clamp(13px, 1.3vw, 18px);
    text-shadow: 0 1px 10px rgba(0,0,0,0.3);
  }

  /* ===================== GAME SCREEN ===================== */
  .game-screen { 
    display: none; 
    width: 100%; 
    max-width: 1400px; 
    flex-direction: column; 
    align-items: center; 
    gap: clamp(16px, 2.4vw, 28px);
    z-index: 2;
    position: relative;
  }
  .game-screen.show { display: flex; }

  .header-row {
    display: flex; justify-content: space-between; align-items: baseline; width: 100%;
  }
  .crowdsays-mark {
    font-family: var(--font-display); 
    font-size: clamp(20px, 2.4vw, 32px); 
    color: var(--gold);
    letter-spacing: -0.01em;
    text-shadow: 0 2px 15px rgba(0,0,0,0.4);
  }
  .crowdsays-mark span { color: var(--text-hi); }
  .pot-display {
    font-size: clamp(13px, 1.2vw, 16px); 
    color: var(--text-lo); 
    text-align: right;
    text-transform: uppercase; 
    letter-spacing: 0.15em;
    text-shadow: 0 1px 8px rgba(0,0,0,0.3);
  }
  .pot-display strong {
    display: block; 
    font-family: var(--font-display); 
    font-size: clamp(28px, 3.2vw, 44px);
    color: var(--gold-bright); 
    letter-spacing: 0; 
    margin-top: 2px;
    text-shadow: 0 0 24px rgba(232,184,75,0.4);
  }

  .prompt-bar {
    width: 100%; 
    text-align: center; 
    padding: clamp(14px, 1.8vw, 22px) clamp(20px, 3vw, 40px);
    background: var(--navy-panel); 
    border: 1px solid var(--navy-line); 
    border-radius: 16px;
    backdrop-filter: blur(10px);
    background: rgba(17, 22, 42, 0.85);
  }
  body.theme-light .prompt-bar {
    background: rgba(226, 221, 212, 0.9);
  }
  .prompt-bar .prompt-text {
    font-family: var(--font-display); 
    font-size: clamp(20px, 3vw, 34px); 
    color: var(--text-hi);
    line-height: 1.2;
    text-shadow: 0 1px 10px rgba(0,0,0,0.2);
  }

  /* ===================== BOARD ===================== */
  .board {
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: clamp(10px, 1.4vw, 16px); 
    width: 100%;
  }
  .tile {
    position: relative; 
    height: clamp(70px, 9vw, 110px); 
    border-radius: 14px;
    background: linear-gradient(180deg, #1A2038, #11162A);
    border: 2px solid var(--navy-line);
    display: flex; 
    align-items: center; 
    padding: 0 clamp(16px, 2vw, 28px);
    overflow: hidden;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.2,.9,.25,1), border-color 0.4s, background 0.4s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  body.theme-light .tile {
    background: linear-gradient(180deg, #E8E4DA, #D8D4CA);
    border-color: #B8B4AA;
  }
  body.theme-light .tile.revealed {
    background: linear-gradient(180deg, #D4E8E0, #C4D8D0);
  }
  .tile-num {
    font-family: var(--font-display); 
    font-size: clamp(18px, 2vw, 26px); 
    color: var(--navy-line);
    width: clamp(32px, 4vw, 48px); 
    flex-shrink: 0;
  }
  .tile-content { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-width: 0; }
  .tile-text {
    font-size: clamp(16px, 2vw, 26px); 
    color: var(--text-lo); 
    letter-spacing: 0.08em;
    text-transform: uppercase; 
    overflow: hidden; 
    white-space: nowrap; 
    text-overflow: ellipsis;
  }
  .tile-pts {
    font-family: var(--font-display); 
    font-size: clamp(18px, 2.2vw, 30px); 
    color: var(--navy-line);
    flex-shrink: 0;
  }

  .tile.revealed {
    border-color: var(--teal);
    background: linear-gradient(180deg, #16302A, #0D1F1B);
  }
  body.theme-light .tile.revealed {
    background: linear-gradient(180deg, #D4E8E0, #C4D8D0);
  }
  .tile.revealed .tile-num { color: var(--teal); }
  .tile.revealed .tile-text { color: var(--text-hi); }
  .tile.revealed .tile-pts { color: var(--gold-bright); }

  .tile.flip-in { animation: tileFlip 0.55s cubic-bezier(.2,.9,.25,1); }
  @keyframes tileFlip {
    0%   { transform: rotateX(0deg) scale(1); }
    40%  { transform: rotateX(90deg) scale(1.02); }
    55%  { transform: rotateX(90deg) scale(1.02); }
    80%  { transform: rotateX(-8deg) scale(1.02); }
    100% { transform: rotateX(0deg) scale(1); }
  }
  .tile.flip-in::after {
    content: ''; 
    position: absolute; 
    inset: 0;
    background: radial-gradient(circle, rgba(232,184,75,0.5), transparent 70%);
    animation: flashOut 0.6s ease-out forwards;
  }
  @keyframes flashOut { from { opacity: 1; } to { opacity: 0; } }

  /* ===================== STRIKES ===================== */
  .strikes-block { 
    display: flex; 
    gap: clamp(8px, 1vw, 14px); 
    justify-content: center; 
    padding: 4px 0;
  }
  .strike-tile {
    width: clamp(40px, 4.6vw, 60px); 
    height: clamp(40px, 4.6vw, 60px);
    border: 3px solid var(--navy-line); 
    border-radius: 10px;
    display: flex; 
    align-items: center; 
    justify-content: center;
    font-family: var(--font-display); 
    font-size: clamp(20px, 2.4vw, 32px); 
    color: var(--navy-line);
    transition: all 0.3s;
  }
  .strike-tile.hit {
    border-color: var(--red); 
    color: var(--red);
    background: rgba(209,69,69,0.12);
    animation: strikePulse 0.4s ease-out;
  }
  @keyframes strikePulse { 0% { transform: scale(1.3); } 100% { transform: scale(1); } }

  .status-flag {
    text-align: center; 
    font-size: clamp(13px, 1.3vw, 17px); 
    letter-spacing: 0.2em;
    text-transform: uppercase; 
    padding: 4px 0; 
    color: var(--text-lo);
    text-shadow: 0 1px 8px rgba(0,0,0,0.3);
  }
  .status-flag.randomizing { color: var(--gold); }
  .status-flag.steal { color: var(--red); }

  /* ===================== TEAMS BOARD ===================== */
  .teams-board {
    display: grid; 
    gap: clamp(6px, 0.8vw, 12px); 
    width: 100%;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  }
  .team-block {
    background: var(--navy-panel); 
    border: 2px solid var(--navy-line); 
    border-radius: 12px;
    padding: clamp(8px, 1.1vw, 14px); 
    text-align: center;
    transition: border-color 0.3s, box-shadow 0.3s;
    backdrop-filter: blur(8px);
    background: rgba(17, 22, 42, 0.85);
  }
  body.theme-light .team-block {
    background: rgba(226, 221, 212, 0.9);
  }
  .team-block.control {
    border-color: var(--gold); 
    box-shadow: 0 0 24px rgba(232,184,75,0.25);
  }
  .team-block .t-name {
    font-size: clamp(9px, 0.9vw, 12px); 
    letter-spacing: 0.15em; 
    text-transform: uppercase; 
    color: var(--text-lo);
    overflow: hidden; 
    white-space: nowrap; 
    text-overflow: ellipsis;
  }
  .team-block.control .t-name { color: var(--gold); }
  .team-block .t-score {
    font-family: var(--font-display); 
    font-size: clamp(20px, 2.6vw, 36px); 
    color: var(--text-hi); 
    margin-top: 2px;
  }
  .team-block.control .t-score { color: var(--gold-bright); }

  /* ===================== RANDOMIZE OVERLAY ===================== */
  .randomize-overlay {
    position: fixed; 
    inset: 0; 
    background: rgba(6,8,15,0.95);
    display: none; 
    align-items: center; 
    justify-content: center; 
    flex-direction: column;
    z-index: 60; 
    text-align: center; 
    gap: 22px;
  }
  .randomize-overlay.show { display: flex; animation: fadeIn 0.25s ease-out; }
  .randomize-overlay .ro-eyebrow {
    font-size: clamp(13px, 1.5vw, 18px); 
    letter-spacing: 0.3em; 
    color: var(--text-lo);
    text-transform: uppercase;
  }
  .slot-window {
    position: relative; 
    width: min(90vw, 620px); 
    height: clamp(90px, 13vw, 150px);
    border: 3px solid var(--gold); 
    border-radius: 18px;
    background: linear-gradient(180deg, #1A2038, #0D1120);
    overflow: hidden;
    box-shadow: 0 0 50px rgba(232,184,75,0.25), inset 0 0 30px rgba(0,0,0,0.4);
  }
  .slot-window::before, .slot-window::after {
    content: ''; 
    position: absolute; 
    left: 0; 
    right: 0; 
    height: 30%;
    z-index: 2; 
    pointer-events: none;
  }
  .slot-window::before { top: 0; background: linear-gradient(180deg, rgba(13,17,32,0.95), transparent); }
  .slot-window::after { bottom: 0; background: linear-gradient(0deg, rgba(13,17,32,0.95), transparent); }
  .slot-name {
    position: absolute; 
    inset: 0; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    font-family: var(--font-display); 
    font-size: clamp(24px, 4.4vw, 52px); 
    color: var(--text-hi);
    letter-spacing: 0.02em; 
    padding: 0 16px; 
    text-align: center;
    overflow: hidden; 
    white-space: nowrap; 
    text-overflow: ellipsis; 
    max-width: 100%;
  }
  .slot-name.cycling { animation: slotCycle 0.09s steps(1) infinite; }
  @keyframes slotCycle {
    0% { transform: translateY(-6px); opacity: 0.7; }
    50% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(6px); opacity: 0.7; }
  }
  .slot-name.locked {
    animation: slotLock 0.45s cubic-bezier(.2,.9,.25,1);
    color: var(--gold-bright);
    text-shadow: 0 0 30px rgba(232,184,75,0.6);
  }
  @keyframes slotLock { 0% { transform: scale(1.15); } 60% { transform: scale(0.96); } 100% { transform: scale(1); } }
  .slot-window.locked {
    border-color: var(--gold-bright);
    box-shadow: 0 0 70px rgba(232,184,75,0.45), inset 0 0 30px rgba(0,0,0,0.4);
  }
  .randomize-overlay .ro-sub {
    font-size: clamp(13px, 1.4vw, 18px); 
    color: var(--text-lo);
    letter-spacing: 0.1em; 
    text-transform: uppercase; 
    min-height: 1.4em;
  }
  .randomize-overlay .ro-sub.locked { color: var(--teal); }

  /* ===================== WIN OVERLAY ===================== */
  .win-overlay {
    position: fixed; 
    inset: 0; 
    background: rgba(6,8,15,0.92);
    display: none; 
    align-items: center; 
    justify-content: center; 
    flex-direction: column;
    z-index: 50; 
    text-align: center;
  }
  .win-overlay.show { display: flex; animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .win-overlay .win-label {
    font-size: clamp(14px, 1.6vw, 20px); 
    letter-spacing: 0.3em; 
    color: var(--text-lo);
    text-transform: uppercase; 
    margin-bottom: 10px;
  }
  .win-overlay .win-team {
    font-family: var(--font-display); 
    font-size: clamp(36px, 6.4vw, 80px); 
    color: var(--gold-bright);
    text-shadow: 0 0 40px rgba(232,184,75,0.5);
  }
  .win-overlay .win-amount {
    font-size: clamp(18px, 2.2vw, 28px); 
    color: var(--teal); 
    margin-top: 16px;
  }

  /* ===================== CONFETTI ===================== */
  .confetti-piece {
    position: fixed; 
    width: 10px; 
    height: 10px; 
    border-radius: 2px;
    animation: confettiFall linear forwards;
    pointer-events: none; 
    z-index: 55;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0.3; }
  }

  /* ===================== ERROR BANNER ===================== */
  #errorBanner {
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    right: 0;
    background: #D14545; 
    color: #fff; 
    padding: 14px 16px;
    font-family: monospace; 
    font-size: 12px; 
    z-index: 9999;
    max-height: 50vh; 
    overflow-y: auto; 
    white-space: pre-wrap; 
    word-break: break-word;
  }
  #errorBanner .err-close {
    float: right; 
    cursor: pointer; 
    font-size: 16px; 
    line-height: 1; 
    margin-left: 12px;
    background: rgba(255,255,255,0.2); 
    border: none; 
    color: #fff;
    border-radius: 4px; 
    padding: 2px 8px;
  }
</style>
</head>
<body class="theme-classic">

<div class="idle-screen" id="idleScreen">
  <div class="eyebrow" id="brandEyebrow">PlayAQuiz</div>
  <h1 id="brandTitle">Crowd Says</h1>
  <p id="idleMessage">Waiting for the host to load a question…</p>
</div>

<div class="game-screen" id="gameScreen">
  <div class="header-row">
    <div class="crowdsays-mark" id="headerMark">CROWD <span>SAYS</span></div>
    <div class="pot-display">Pot<strong id="potValue">0</strong></div>
  </div>
  <div class="prompt-bar">
    <div class="prompt-text" id="promptText">—</div>
  </div>
  <div class="status-flag" id="statusFlag"></div>
  <div class="board" id="board"></div>
  <div class="strikes-block">
    <div class="strike-tile" id="strike1">✕</div>
    <div class="strike-tile" id="strike2">✕</div>
    <div class="strike-tile" id="strike3">✕</div>
  </div>
  <div class="teams-board" id="teamsBoard"></div>
</div>

<div class="randomize-overlay" id="randomizeOverlay">
  <div class="ro-eyebrow">Who's in control?</div>
  <div class="slot-window" id="slotWindow">
    <div class="slot-name" id="slotName">Team 1</div>
  </div>
  <div class="ro-sub" id="roSub">Shuffling…</div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-label" id="winLabel">Round won by</div>
  <div class="win-team" id="winTeam">Team 1</div>
  <div class="win-amount" id="winAmount">+0 points</div>
</div>

<div class="brand-watermark" id="brandWatermark">PlayAQuiz</div>

<div id="errorBanner">
  <button class="err-close" onclick="document.getElementById('errorBanner').style.display='none'">✕ dismiss</button>
  <span id="errorBannerText"></span>
</div>

<script>
  // ====== ERROR HANDLING ======
  function showBannerMsg(msg) {
    var banner = document.getElementById('errorBanner');
    var text = document.getElementById('errorBannerText');
    banner.style.display = 'block';
    text.textContent += msg + '\n\n';
  }
  window.addEventListener('error', function(e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
      showBannerMsg('⚠ SCRIPT FAILED TO LOAD: ' + (e.target.src || '(inline script)'));
      return;
    }
    var msg = e.message || (e.error && e.error.message);
    if (!msg || msg === 'Script error.') return;
    showBannerMsg('⚠ ERROR: ' + msg + ' (line ' + e.lineno + ')');
  }, true);
  window.addEventListener('unhandledrejection', function(e) {
    showBannerMsg('⚠ UNHANDLED: ' + (e.reason && e.reason.message ? e.reason.message : JSON.stringify(e.reason)));
  });
</script>

<script>
  // ====== CONFIG ======
  const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ====== AUDIO CONTEXT & SOUND EFFECTS ======
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let audioUnlocked = false;

  function getAudioContext() {
    if (!audioCtx) audioCtx = new AudioCtx();
    return audioCtx;
  }

  function unlockAudio() {
    if (audioUnlocked) return;
    try {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') ctx.resume();
      audioUnlocked = true;
    } catch (e) {}
  }
  document.body.addEventListener('click', unlockAudio, { once: true });
  document.body.addEventListener('touchstart', unlockAudio, { once: true });

  function ensureAudio() {
    if (!audioUnlocked) { unlockAudio(); }
  }

  // --- SYNTHESIZED SOUND EFFECTS ---

  function sfxReveal() {
    // Question entrance / reveal: ascending "ding-dong" sweep
    ensureAudio();
    try {
      const ctx = getAudioContext();
      const t = ctx.currentTime;
      const freqs = [440, 550, 660, 880];
      freqs.forEach((f, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, t + i * 0.09);
        gain.gain.setValueAtTime(0, t + i * 0.09);
        gain.gain.linearRampToValueAtTime(0.38, t + i * 0.09 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.35);
        osc.start(t + i * 0.09);
        osc.stop(t + i * 0.09 + 0.4);
      });
    } catch (e) {}
  }

  function sfxWrong() {
    // Wrong / strike: low buzzer
    ensureAudio();
    try {
      const ctx = getAudioContext();
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const distortion = ctx.createWaveShaper();

      function makeDistortionCurve(amount) {
        const samples = 256; const curve = new Float32Array(samples);
        for (let i = 0; i < samples; i++) {
          const x = (i * 2) / samples - 1;
          curve[i] = ((Math.PI + amount) * x) / (Math.PI + amount * Math.abs(x));
        }
        return curve;
      }
      distortion.curve = makeDistortionCurve(200);

      osc.connect(distortion); distortion.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.5);
      gain.gain.setValueAtTime(0.55, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      osc.start(t);
      osc.stop(t + 0.6);
    } catch (e) {}
  }

  function sfxQuestionEntrance() {
    // Question entrance: dramatic rising sweep + impact
    ensureAudio();
    try {
      const ctx = getAudioContext();
      const t = ctx.currentTime;

      const sweep = ctx.createOscillator();
      const sweepGain = ctx.createGain();
      sweep.connect(sweepGain); sweepGain.connect(ctx.destination);
      sweep.type = 'sine';
      sweep.frequency.setValueAtTime(100, t);
      sweep.frequency.exponentialRampToValueAtTime(800, t + 0.4);
      sweepGain.gain.setValueAtTime(0.3, t);
      sweepGain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      sweep.start(t); sweep.stop(t + 0.5);

      const thud = ctx.createOscillator();
      const thudGain = ctx.createGain();
      thud.connect(thudGain); thudGain.connect(ctx.destination);
      thud.type = 'sine';
      thud.frequency.setValueAtTime(60, t + 0.35);
      thud.frequency.exponentialRampToValueAtTime(40, t + 0.7);
      thudGain.gain.setValueAtTime(0.6, t + 0.35);
      thudGain.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
      thud.start(t + 0.35); thud.stop(t + 0.8);

      [660, 880, 1100].forEach((f, i) => {
        const s = ctx.createOscillator();
        const g = ctx.createGain();
        s.connect(g); g.connect(ctx.destination);
        s.type = 'triangle';
        s.frequency.value = f;
        const st = t + 0.4 + i * 0.07;
        g.gain.setValueAtTime(0.18, st);
        g.gain.exponentialRampToValueAtTime(0.001, st + 0.25);
        s.start(st); s.stop(st + 0.3);
      });
    } catch (e) {}
  }

  function sfxPointsAdded() {
    // Points added to winning team: cheerful ascending arpeggio
    ensureAudio();
    try {
      const ctx = getAudioContext();
      const t = ctx.currentTime;
      const melody = [523, 659, 784, 1047, 1319];
      melody.forEach((f, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = i === melody.length - 1 ? 'sine' : 'triangle';
        osc.frequency.value = f;
        const st = t + i * 0.1;
        gain.gain.setValueAtTime(0, st);
        gain.gain.linearRampToValueAtTime(0.35, st + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, st + (i === melody.length - 1 ? 0.65 : 0.22));
        osc.start(st); osc.stop(st + 0.7);
      });
    } catch (e) {}
  }

  function sfxWin() {
    // Round win / full fanfare
    ensureAudio();
    try {
      const ctx = getAudioContext();
      const t = ctx.currentTime;

      const fanfare = [
        { f: 523, st: 0.0, dur: 0.15 },
        { f: 523, st: 0.15, dur: 0.15 },
        { f: 784, st: 0.3, dur: 0.45 },
        { f: 659, st: 0.3, dur: 0.22 },
        { f: 784, st: 0.52, dur: 0.22 },
        { f: 1047, st: 0.74, dur: 0.7 },
      ];
      fanfare.forEach(({ f, st, dur }) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'square';
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0, t + st);
        gain.gain.linearRampToValueAtTime(0.22, t + st + 0.03);
        gain.gain.setValueAtTime(0.22, t + st + dur - 0.05);
        gain.gain.linearRampToValueAtTime(0, t + st + dur);
        osc.start(t + st); osc.stop(t + st + dur + 0.05);
      });

      [130, 196, 261].forEach((f, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.18, t + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
        osc.start(t + 0.3); osc.stop(t + 1.6);
      });
    } catch (e) {}
  }

  function playSfx(name) {
    switch (name) {
      case 'reveal':         sfxReveal(); break;
      case 'wrong':          sfxWrong(); break;
      case 'questionIn':     sfxQuestionEntrance(); break;
      case 'pointsAdded':    sfxPointsAdded(); break;
      case 'win':            sfxWin(); break;
    }
  }

  // ====== CONFETTI ======
  function launchConfetti(count) {
    const colors = ['#E8B84B', '#FFD571', '#3DDC97', '#D14545', '#fff'];
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left:${Math.random()*100}vw;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        width:${6+Math.random()*8}px;
        height:${6+Math.random()*8}px;
        border-radius:${Math.random()>0.5?'50%':'2px'};
        animation-duration:${1.5+Math.random()*2}s;
        animation-delay:${Math.random()*0.6}s;
      `;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }

  // ====== BRANDING ======
  let brandingConfig = {};

  function applyBranding(cfg) {
    brandingConfig = cfg || {};

    // Theme
    const themes = ['classic','blue','purple','red','teal','light','image'];
    document.body.classList.remove(...themes.map(t => 'theme-' + t));
    const theme = cfg.theme || 'classic';
    document.body.classList.add('theme-' + theme);

    // Custom BG image
    if (cfg.bgImage && cfg.bgImage !== '') {
      document.body.style.setProperty('--brand-bg-image', `url('${cfg.bgImage}')`);
      document.body.classList.add('has-bg-image');
      document.body.style.setProperty('--brand-overlay', cfg.overlayOpacity ? `rgba(0,0,0,${cfg.overlayOpacity})` : 'rgba(0,0,0,0.45)');
    } else {
      document.body.style.setProperty('--brand-bg-image', 'none');
      document.body.classList.remove('has-bg-image');
    }

    // Branding text
    const eyebrow = cfg.eyebrowText || 'PlayAQuiz';
    const title = cfg.titleText || 'Crowd Says';
    const watermark = cfg.watermarkText || 'PlayAQuiz';
    const headerText = cfg.headerText || null;

    document.getElementById('brandEyebrow').textContent = eyebrow;
    document.getElementById('brandTitle').textContent = title;
    document.getElementById('brandWatermark').textContent = watermark;

    if (headerText) {
      const mark = document.getElementById('headerMark');
      const parts = headerText.split('|');
      mark.innerHTML = parts[0] + (parts[1] ? ` <span>${parts[1]}</span>` : '');
    }
  }

  // ====== STATE ======
  const params = new URLSearchParams(window.location.search);
  const roomCode = (params.get('room') || '').toUpperCase();
  let sessionId = null;
  let channel = null;
  let currentQuestion = null;
  let teamNames = [];
  let teamScores = [];
  let controllingTeam = null;
  let shuffleInterval = null;

  function teamLabel(idx) {
    return (idx !== null && idx !== undefined && teamNames[idx]) ? teamNames[idx] : '—';
  }

  // ====== INIT ======
  async function init() {
    if (!roomCode) {
      document.getElementById('idleMessage').textContent = 'No room code in URL — add ?room=CODE';
      return;
    }

    const { data: sessionRow } = await db
      .from('crowdsays_sessions')
      .select('*')
      .eq('room_code', roomCode)
      .maybeSingle();

    if (!sessionRow) {
      document.getElementById('idleMessage').textContent = 'Room not found — ask the host to start it';
      return;
    }
    sessionId = sessionRow.id;
    teamNames = Array.isArray(sessionRow.team_names) ? sessionRow.team_names : [];

    // Load branding config if stored
    if (sessionRow.branding) {
      applyBranding(sessionRow.branding);
    }

    await loadState();
    subscribeRealtime();
    startPoll();
  }

  async function loadState() {
    const { data } = await db
      .from('crowdsays_state')
      .select('*')
      .eq('session_id', sessionId)
      .maybeSingle();
    if (!data) return;

    if (data.current_question_id) {
      const { data: qRow } = await db
        .from('crowdsays_questions')
        .select('*')
        .eq('id', data.current_question_id)
        .single();
      currentQuestion = qRow;
    } else {
      currentQuestion = null;
    }
    renderFromState(data);
  }

  function startPoll() { setInterval(loadState, 8000); }

  // ====== REALTIME ======
  function subscribeRealtime() {
    channel = db.channel(`room:${roomCode}`, { config: { broadcast: { self: false } } });

    channel.on('broadcast', { event: 'crowdsays_question_loaded' }, (msg) => handleQuestionLoaded(msg.payload));
    channel.on('broadcast', { event: 'crowdsays_randomize_started' }, (msg) => handleRandomizeStarted(msg.payload));
    channel.on('broadcast', { event: 'crowdsays_answer_revealed' }, (msg) => handleAnswerRevealed(msg.payload));
    channel.on('broadcast', { event: 'crowdsays_strike' }, (msg) => handleStrike(msg.payload));
    channel.on('broadcast', { event: 'crowdsays_steal_started' }, (msg) => handleStealStarted(msg.payload));
    channel.on('broadcast', { event: 'crowdsays_round_won' }, (msg) => handleRoundWon(msg.payload));
    channel.on('broadcast', { event: 'crowdsays_board_cleared' }, () => handleBoardCleared());
    channel.on('broadcast', { event: 'crowdsays_team_renamed' }, (msg) => {
      teamNames = msg.payload.team_names;
      renderTeamsBoard();
    });
    channel.on('broadcast', { event: 'crowdsays_branding_updated' }, (msg) => {
      applyBranding(msg.payload);
    });

    channel.subscribe();
  }

  // ====== HANDLERS ======
  function handleQuestionLoaded(payload) {
    document.getElementById('idleScreen').style.display = 'none';
    document.getElementById('gameScreen').classList.add('show');
    document.getElementById('winOverlay').classList.remove('show');
    document.getElementById('randomizeOverlay').classList.remove('show');

    document.getElementById('promptText').textContent = payload.prompt;
    document.getElementById('potValue').textContent = '0';
    setStatusFlag('randomizing', 'Waiting for host to randomize control');
    resetStrikes();
    setControl(null);

    currentQuestion = {
      id: payload.question_id,
      prompt: payload.prompt,
      answers: new Array(payload.answer_count).fill({ text: '', points: 0 }),
      revealed_answers: []
    };
    renderBoard([]);
    playSfx('questionIn');
  }

  function handleRandomizeStarted(payload) {
    teamNames = payload.team_names || teamNames;
    renderTeamsBoard();

    const overlay = document.getElementById('randomizeOverlay');
    const slotWindow = document.getElementById('slotWindow');
    const slotName = document.getElementById('slotName');
    const roSub = document.getElementById('roSub');

    overlay.classList.add('show');
    slotWindow.classList.remove('locked');
    roSub.classList.remove('locked');
    roSub.textContent = 'Shuffling…';
    slotName.classList.remove('cycling');
    slotName.classList.remove('locked');
    slotName.classList.add('cycling');

    const names = teamNames.length ? teamNames : ['Team 1', 'Team 2'];
    let i = 0;
    if (shuffleInterval) clearInterval(shuffleInterval);
    shuffleInterval = setInterval(() => {
      slotName.textContent = names[i % names.length];
      i++;
    }, 90);

    setTimeout(() => {
      clearInterval(shuffleInterval);
      shuffleInterval = null;
      slotName.classList.remove('cycling');
      slotName.textContent = teamLabel(payload.result_index);
      slotName.classList.add('locked');
      slotWindow.classList.add('locked');
      roSub.textContent = `${teamLabel(payload.result_index)} controls the board`;
      roSub.classList.add('locked');
      playSfx('reveal');
      setControl(payload.result_index);
      setStatusFlag('playing', `${teamLabel(payload.result_index)} in control`);
      setTimeout(() => overlay.classList.remove('show'), 1300);
    }, 1800);
  }

  function handleAnswerRevealed(payload) {
    if (!currentQuestion) return;
    if (!currentQuestion.answers[payload.index] || !currentQuestion.answers[payload.index].text) {
      currentQuestion.answers[payload.index] = { text: payload.text, points: payload.points };
    }
    currentQuestion.revealed_answers = [...(currentQuestion.revealed_answers || []), payload.index];
    document.getElementById('potValue').textContent = payload.pot;
    renderBoard(currentQuestion.revealed_answers, payload.index);
    playSfx('reveal');
  }

  function handleStrike(payload) {
    setStrikes(payload.strikes);
    playSfx('wrong');
  }

  function handleStealStarted(payload) {
    setStatusFlag('steal', 'Steal — open floor, one guess wins it');
  }

  function handleRoundWon(payload) {
    showWinOverlay(payload.team_index, payload.amount, payload.by_steal, payload.steal_success);
    playSfx('win');
    launchConfetti(60);
    playSfx('pointsAdded');
    setTimeout(() => document.getElementById('winOverlay').classList.remove('show'), 4200);
  }

  function handleBoardCleared() {
    document.getElementById('gameScreen').classList.remove('show');
    document.getElementById('idleScreen').style.display = 'flex';
    document.getElementById('idleMessage').textContent = 'Waiting for the host to load the next question…';
    currentQuestion = null;
  }

  // ====== RENDER HELPERS ======
  function renderFromState(data) {
    teamScores = Array.isArray(data.team_scores) ? data.team_scores : [];
    controllingTeam = data.controlling_team;
    document.getElementById('potValue').textContent = data.pot;
    setStrikes(data.strikes);
    renderTeamsBoard();

    if (data.round_status === 'idle' && !currentQuestion) {
      document.getElementById('gameScreen').classList.remove('show');
      document.getElementById('idleScreen').style.display = 'flex';
      return;
    }
    document.getElementById('idleScreen').style.display = 'none';
    document.getElementById('gameScreen').classList.add('show');

    if (currentQuestion) {
      document.getElementById('promptText').textContent = currentQuestion.prompt;
      renderBoard(currentQuestion.revealed_answers || []);
    }

    const flagMap = {
      randomizing: ['randomizing', 'Waiting for host to randomize control'],
      playing: ['playing', data.controlling_team !== null && data.controlling_team !== undefined ? `${teamLabel(data.controlling_team)} in control` : ''],
      steal: ['steal', 'Steal — open floor, one guess wins it']
    };
    const [cls, text] = flagMap[data.round_status] || ['', ''];
    setStatusFlag(cls, text);
  }

  function renderTeamsBoard() {
    const wrap = document.getElementById('teamsBoard');
    wrap.innerHTML = teamNames.map((name, i) => `
      <div class="team-block ${controllingTeam === i ? 'control' : ''}">
        <div class="t-name">${escapeHtml(name)}</div>
        <div class="t-score">${teamScores[i] || 0}</div>
      </div>
    `).join('');
  }

  function renderBoard(revealedIndices, flipIndex) {
    if (!currentQuestion) return;
    const board = document.getElementById('board');
    board.innerHTML = currentQuestion.answers.map((a, i) => {
      const isRevealed = revealedIndices.includes(i);
      return `
        <div class="tile ${isRevealed ? 'revealed' : ''} ${flipIndex === i ? 'flip-in' : ''}">
          <span class="tile-num">${i + 1}</span>
          <div class="tile-content">
            <span class="tile-text">${isRevealed ? escapeHtml(a.text) : ''}</span>
            <span class="tile-pts">${isRevealed ? a.points : ''}</span>
          </div>
        </div>`;
    }).join('');
  }

  function setStrikes(n) {
    [1, 2, 3].forEach(i => {
      document.getElementById(`strike${i}`).classList.toggle('hit', n >= i);
    });
  }
  function resetStrikes() { setStrikes(0); }

  function setControl(idx) {
    controllingTeam = idx;
    renderTeamsBoard();
  }

  function setStatusFlag(cls, text) {
    const el = document.getElementById('statusFlag');
    el.className = 'status-flag' + (cls ? ' ' + cls : '');
    el.textContent = text;
  }

  function showWinOverlay(teamIdx, amount, bySteal, stealSuccess) {
    document.getElementById('winLabel').textContent = bySteal
      ? (stealSuccess ? 'Stolen by' : 'Steal failed — kept by')
      : 'Round won by';
    document.getElementById('winTeam').textContent = teamLabel(teamIdx);
    document.getElementById('winAmount').textContent = `+${amount} points`;
    document.getElementById('winOverlay').classList.add('show');
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s || '';
    return div.innerHTML;
  }

  init().catch(function(err) {
    showBannerMsg('⚠ INIT ERROR: ' + (err && err.message ? err.message : String(err)));
  });
</script>
</body>
</html>
