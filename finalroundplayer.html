<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PlayAQuiz — Final Round Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #03050b; --surface: #0d1120; --border: #1f2a3c;
      --gold: #fbbf24; --green: #10b981; --red: #ef4444;
      --text: #ffffff; --muted: rgba(255,255,255,0.45);
    }
    body { background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--text); min-height: 100vh; }
    .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

    #joinScreen { width: 100%; max-width: 420px; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 4px; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 8px; }
    .join-card { background: rgba(13,17,32,0.95); border: 1px solid var(--border); border-radius: 28px; padding: 28px 22px; backdrop-filter: blur(20px); }
    .join-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; text-align: center; margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px; }
    .field input { background: rgba(255,255,255,0.04); border: 1.5px solid var(--border); border-radius: 14px; padding: 12px 14px; color: var(--text); font-size: 16px; width: 100%; outline: none; text-align: center; font-weight: 700; }
    .field input:focus { border-color: var(--gold); }
    .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 8px; }
    .avatar-opt { font-size: 28px; text-align: center; padding: 6px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; background: rgba(255,255,255,0.03); transition: 0.1s; }
    .avatar-opt.selected { border-color: var(--gold); background: rgba(251,191,36,0.12); }
    .join-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--gold), #f97316); border: none; border-radius: 14px; font-size: 17px; font-weight: 800; color: #111; cursor: pointer; margin-top: 18px; transition: 0.15s; }
    .join-btn:active { transform: scale(0.97); }

    #buzzerScreen { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; }
    .buzzer-top { text-align: center; }
    .buzzer-name { font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px; }
    .buzzer-score { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: var(--gold); }
    .question-box { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; margin: 15px 0; text-align: center; font-size: 16px; font-weight: 600; line-height: 1.4; max-width: 500px; }
    
    .buzzer-container { position: relative; display: flex; justify-content: center; margin: 20px 0; }
    .buzzer-button { width: min(65vw, 280px); height: min(65vw, 280px); border-radius: 50%; border: none; cursor: pointer; background: radial-gradient(circle at 35% 35%, #ff6b35, #ef4444 50%, #b91c1c); box-shadow: 0 10px 0 #7f1d1d, 0 0 0 10px rgba(239,68,68,0.15); font-family: 'Bebas Neue', sans-serif; font-size: clamp(28px, 7vw, 48px); letter-spacing: 4px; color: #fff; transition: all 0.08s; }
    .buzzer-button:active { transform: translateY(7px); box-shadow: 0 3px 0 #7f1d1d, 0 0 0 10px rgba(239,68,68,0.15); }
    .buzzer-button:disabled { opacity: 0.5; transform: none; cursor: not-allowed; background: radial-gradient(circle at 35% 35%, #4b5563, #374151 50%, #1f2937); box-shadow: 0 10px 0 #111827; }
    .buzzer-pulse { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 3px solid rgba(239,68,68,0.4); animation: pulseRing 1.5s ease-out infinite; pointer-events: none; }
    @keyframes pulseRing { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.25); opacity: 0; } }
    
    .status-text { font-size: 14px; font-weight: 700; text-align: center; padding: 10px; border-radius: 30px; margin: 12px auto; max-width: 260px; }
    .status-open { background: rgba(16,185,129,0.15); color: var(--green); }
    .status-buzzed { background: rgba(251,191,36,0.15); color: var(--gold); animation: blink 0.5s infinite; }
    @keyframes blink { 0%,100%{ opacity: 1; } 50%{ opacity: 0.6; } }
    
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
    .opt-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; }
    .opt-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .opt-letter { width: 28px; height: 28px; border-radius: 8px; background: rgba(59,130,246,0.2); display: flex; align-items: center; justify-content: center; font-weight: 800; }
    
    .hidden { display: none !important; }
    .error-msg { color: var(--red); font-size: 12px; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
<div class="page">
  <div id="joinScreen">
    <div class="logo">PLAYAQUIZ</div>
    <div style="font-size:11px;color:var(--gold);text-align:center;margin-bottom:16px">⚡ FINAL ROUND</div>
    <div class="join-card">
      <div class="join-title">JOIN THE ARENA</div>
      <div class="field"><label>ROOM CODE</label><input id="roomInput" placeholder="e.g. FR4X7K" maxlength="10" style="text-transform:uppercase;letter-spacing:3px;font-size:20px"></div>
      <div class="field"><label>YOUR NAME</label><input id="nameInput" placeholder="Enter your name" maxlength="20"></div>
      <div class="field"><label>AVATAR</label><div class="avatar-grid" id="avatarGrid"></div></div>
      <button class="join-btn" id="joinBtn" onclick="joinGame()">⚡ ENTER FINAL ROUND</button>
      <div id="joinError" class="error-msg"></div>
    </div>
  </div>

  <div id="buzzerScreen">
    <div class="buzzer-top">
      <div class="buzzer-name"><span id="myAvatar">🎮</span> <span id="myName">—</span></div>
      <div class="buzzer-score"><span id="myScore">0</span> <span style="font-size:16px">pts</span></div>
    </div>
    <div class="question-box" id="questionBox">Waiting for question...</div>
    <div class="options-grid" id="optionsGrid" style="display:none"></div>
    <div class="buzzer-container">
      <div class="buzzer-pulse" id="buzzerPulse" style="display:none"></div>
      <button class="buzzer-button" id="buzzerBtn" onclick="buzz()" disabled>BUZZ!</button>
    </div>
    <div class="status-text" id="statusText">Waiting for round to start...</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const AVATARS = ['😎','🦁','🐯','🐱','🐶','🐺','🦊','🐸','🐧','🐙','🦄','🐲','🚀','⭐','🔥','⚡','🎮','🏆','💎','🌈','🍕','🎸','👾','🤖'];
let myId = null, myName = '', myAvatar = '😎', myScore = 0;
let roomCode = null, realtimeChannel = null;
let isQuestionOpen = false;
let myStatus = 'waiting';
let currentQuestionOptions = [];
let hasAnswered = false;

function renderAvatars() {
  const container = document.getElementById('avatarGrid');
  container.innerHTML = AVATARS.map((a, i) => `<div class="avatar-opt ${i === 0 ? 'selected' : ''}" onclick="selectAvatar(this, '${a}')">${a}</div>`).join('');
  myAvatar = AVATARS[0];
}
function selectAvatar(el, avatar) {
  document.querySelectorAll('.avatar-opt').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
  myAvatar = avatar;
}
renderAvatars();

function setStatus(text, type = '') {
  const el = document.getElementById('statusText');
  el.innerText = text;
  el.className = `status-text ${type}`;
}

function updateBuzzerButton() {
  const btn = document.getElementById('buzzerBtn');
  const pulse = document.getElementById('buzzerPulse');
  
  if (myStatus === 'eliminated') {
    btn.disabled = true; btn.innerText = 'OUT'; pulse.style.display = 'none';
    setStatus('⚡ You have been eliminated', 'status-buzzed');
  } else if (myStatus === 'buzzed') {
    btn.disabled = true; btn.innerText = 'BUZZED!'; pulse.style.display = 'none';
    setStatus('🔔 You buzzed in! Answer verbally.', 'status-buzzed');
  } else if (myStatus === 'locked') {
    btn.disabled = true; btn.innerText = 'LOCKED'; pulse.style.display = 'none';
    setStatus('🔒 You are locked out for this question');
  } else if (isQuestionOpen && myStatus === 'waiting') {
    btn.disabled = false; btn.innerText = 'BUZZ!'; pulse.style.display = 'block';
    setStatus('🔴 BUZZERS ARE OPEN! Tap to buzz!', 'status-open');
  } else {
    btn.disabled = true; btn.innerText = 'WAIT'; pulse.style.display = 'none';
    setStatus('⏳ Waiting for question...');
  }
}

async function buzz() {
  if (!isQuestionOpen || myStatus !== 'waiting') return;
  
  if (navigator.vibrate) navigator.vibrate(100);
  playBuzzSound();
  myStatus = 'buzzed';
  updateBuzzerButton();
  
  realtimeChannel.send({ type: 'broadcast', event: 'buzz', payload: { id: myId, name: myName, avatar: myAvatar } });
}

function handleBroadcast(event, payload) {
  console.log('Received:', event, payload);
  
  switch (event) {
    case 'round_started':
      document.getElementById('questionBox').innerHTML = 'Round starting soon...';
      setStatus('Round starting! Get ready!');
      break;
      
    case 'player_list_update':
      // Update player list if needed
      break;
      
    case 'question_open':
      isQuestionOpen = true;
      myStatus = 'waiting';
      hasAnswered = false;
      document.getElementById('questionBox').innerHTML = payload.question;
      document.getElementById('optionsGrid').style.display = 'none';
      currentQuestionOptions = payload.options || [];
      updateBuzzerButton();
      break;
      
    case 'buzz_confirmed':
      isQuestionOpen = false;
      if (payload.playerId === myId) {
        myStatus = 'buzzed';
        setStatus('🔔 You buzzed in! Answer now!', 'status-buzzed');
      } else {
        if (myStatus === 'waiting') myStatus = 'locked';
        setStatus(`🔔 ${payload.playerName} buzzed in first!`);
      }
      updateBuzzerButton();
      break;
      
    case 'correct':
      if (payload.playerId === myId) {
        myScore = payload.newScore || myScore + 100;
        document.getElementById('myScore').innerText = myScore;
        myStatus = 'correct';
        setStatus('✅ CORRECT! +' + (payload.points || 100) + ' points!', 'status-open');
        playCorrectSound();
      } else if (myStatus !== 'eliminated') {
        myStatus = 'waiting';
      }
      updateBuzzerButton();
      break;
      
    case 'wrong':
      if (payload.playerId === myId) {
        myStatus = 'wrong';
        setStatus('❌ Wrong answer! Locked out this question.');
        playWrongSound();
      } else if (myStatus === 'locked') {
        myStatus = 'waiting';
        isQuestionOpen = true;
        setStatus('🔴 BUZZERS REOPENED! Tap to buzz!', 'status-open');
      }
      updateBuzzerButton();
      break;
      
    case 'next_question':
      isQuestionOpen = false;
      myStatus = 'waiting';
      document.getElementById('questionBox').innerHTML = 'Waiting for next question...';
      document.getElementById('optionsGrid').style.display = 'none';
      updateBuzzerButton();
      break;
      
    case 'reset_buzzers':
      if (myStatus !== 'eliminated' && myStatus !== 'buzzed') {
        myStatus = 'waiting';
        isQuestionOpen = true;
      }
      updateBuzzerButton();
      break;
      
    case 'eliminated':
      if (payload.playerId === myId) {
        myStatus = 'eliminated';
        updateBuzzerButton();
        playEliminateSound();
      }
      break;
      
    case 'round_ended':
      isQuestionOpen = false;
      const winner = payload.winner;
      if (winner && winner.id === myId) {
        setStatus('🏆 YOU ARE THE CHAMPION! 🏆', 'status-open');
        document.getElementById('questionBox').innerHTML = `🎉 CONGRATULATIONS! YOU WON! 🎉`;
        launchConfetti();
      } else {
        setStatus(`Game Over! Winner: ${winner?.name || '—'}`);
        document.getElementById('questionBox').innerHTML = `🏁 FINAL ROUND ENDED<br>Winner: ${winner?.avatar || '🏆'} ${winner?.name || '—'}`;
      }
      updateBuzzerButton();
      break;
  }
}

async function joinGame() {
  const room = document.getElementById('roomInput').value.trim().toUpperCase();
  const name = document.getElementById('nameInput').value.trim();
  
  if (!room) { setError('Enter room code'); return; }
  if (!name || name.length < 2) { setError('Enter a valid name (min 2 chars)'); return; }
  
  myId = 'p_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
  myName = name;
  roomCode = room;
  
  realtimeChannel = sb.channel(`fr-${roomCode}`, { config: { broadcast: { self: false } } });
  realtimeChannel
    .on('broadcast', { event: 'round_started' }, ({ payload }) => handleBroadcast('round_started', payload))
    .on('broadcast', { event: 'player_list_update' }, ({ payload }) => handleBroadcast('player_list_update', payload))
    .on('broadcast', { event: 'question_open' }, ({ payload }) => handleBroadcast('question_open', payload))
    .on('broadcast', { event: 'buzz_confirmed' }, ({ payload }) => handleBroadcast('buzz_confirmed', payload))
    .on('broadcast', { event: 'correct' }, ({ payload }) => handleBroadcast('correct', payload))
    .on('broadcast', { event: 'wrong' }, ({ payload }) => handleBroadcast('wrong', payload))
    .on('broadcast', { event: 'next_question' }, ({ payload }) => handleBroadcast('next_question', payload))
    .on('broadcast', { event: 'reset_buzzers' }, ({ payload }) => handleBroadcast('reset_buzzers', payload))
    .on('broadcast', { event: 'eliminated' }, ({ payload }) => handleBroadcast('eliminated', payload))
    .on('broadcast', { event: 'round_ended' }, ({ payload }) => handleBroadcast('round_ended', payload))
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        // Send join event to controller
        realtimeChannel.send({ type: 'broadcast', event: 'player_join', payload: { id: myId, name: myName, avatar: myAvatar } });
        document.getElementById('joinScreen').style.display = 'none';
        document.getElementById('buzzerScreen').style.display = 'flex';
        document.getElementById('myAvatar').innerText = myAvatar;
        document.getElementById('myName').innerText = myName;
        setStatus('Joined! Waiting for host to start...');
      } else {
        setError('Failed to connect. Check room code.');
      }
    });
}

function setError(msg) {
  document.getElementById('joinError').innerText = msg;
  setTimeout(() => document.getElementById('joinError').innerText = '', 3000);
}

// Sound Effects
let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playBuzzSound() {
  const ctx = getAudioContext();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = 'square'; osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.5, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
  osc.start(now); osc.stop(now + 0.1);
}
function playCorrectSound() {
  const ctx = getAudioContext();
  [523, 659, 784, 1047].forEach((f, i) => {
    const now = ctx.currentTime + i * 0.08;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine'; osc.frequency.value = f;
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  });
}
function playWrongSound() {
  const ctx = getAudioContext();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = 'sawtooth'; osc.frequency.value = 200;
  gain.gain.setValueAtTime(0.5, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
  osc.start(); osc.stop(ctx.currentTime + 0.4);
}
function playEliminateSound() {
  const ctx = getAudioContext();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = 'sawtooth'; osc.frequency.value = 160;
  gain.gain.setValueAtTime(0.4, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
  osc.start(); osc.stop(ctx.currentTime + 0.6);
}
function launchConfetti() {
  for (let i = 0; i < 100; i++) {
    const c = document.createElement('div');
    c.style.cssText = `position:fixed;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;background:${['#fbbf24','#ef4444','#10b981','#3b82f6','#a855f7'][Math.floor(Math.random()*5)]};left:${Math.random()*100}vw;top:-10px;border-radius:2px;z-index:9999;pointer-events:none;animation:fall ${2+Math.random()*3}s linear forwards;`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}
const style = document.createElement('style');
style.textContent = `@keyframes fall { 0% { opacity: 1; transform: translateY(0) rotate(0deg); } 100% { opacity: 0; transform: translateY(100vh) rotate(720deg); } }`;
document.head.appendChild(style);

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('room')) document.getElementById('roomInput').value = urlParams.get('room');

window.joinGame = joinGame;
window.selectAvatar = selectAvatar;
window.buzz = buzz;
</script>
</body>
</html>
