<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Final Round Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --bg: #03050b; --gold: #fbbf24; --green: #10b981; --red: #ef4444; --text: #fff; --muted: rgba(255,255,255,0.45); }
    body { background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--text); height: 100vh; overflow: hidden; }
    #joinScreen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 34px; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
    .join-card { background: rgba(13,17,32,0.96); border: 1px solid #1f2a3c; border-radius: 28px; padding: 26px 22px; width: 100%; max-width: 420px; }
    .field { margin-bottom: 14px; }
    .field label { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 5px; }
    .field input { background: rgba(255,255,255,0.04); border: 1.5px solid #1f2a3c; border-radius: 12px; padding: 12px 14px; color: var(--text); font-size: 16px; width: 100%; outline: none; text-align: center; }
    .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 6px; }
    .avatar-opt { font-size: 26px; text-align: center; padding: 5px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; background: rgba(255,255,255,0.03); }
    .avatar-opt.selected { border-color: var(--gold); background: rgba(251,191,36,0.1); }
    .join-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--gold), #f97316); border: none; border-radius: 14px; font-size: 17px; font-weight: 800; color: #111; cursor: pointer; margin-top: 16px; }
    #gameScreen { display: none; height: 100vh; flex-direction: column; padding: 16px; }
    .game-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .my-score { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); }
    .question-box { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; padding: 16px; text-align: center; font-size: 15px; font-weight: 600; }
    .buzzer-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .buzzer-btn { width: min(62vw, 260px); height: min(62vw, 260px); border-radius: 50%; border: none; cursor: pointer; background: radial-gradient(circle at 35% 30%, #ff7043, #ef4444 55%, #b91c1c); box-shadow: 0 10px 0 #7f1d1d; font-family: 'Bebas Neue', sans-serif; font-size: clamp(26px,8vw,46px); color: #fff; transition: 0.05s linear; }
    .buzzer-btn:active { transform: translateY(8px); box-shadow: 0 2px 0 #7f1d1d; }
    .buzzer-btn:disabled { opacity: 0.45; transform: none; cursor: not-allowed; background: radial-gradient(circle at 35% 30%, #4b5563, #374151); }
    .status-pill { font-size: 13px; font-weight: 700; text-align: center; padding: 9px 22px; border-radius: 40px; margin-top: 12px; background: rgba(16,185,129,0.1); color: var(--green); }
    .error-msg { color: var(--red); font-size: 12px; text-align: center; margin-top: 10px; }
    .timer-small { font-size: 24px; font-weight: 800; color: var(--gold); margin-top: 8px; }
  </style>
</head>
<body>
<div id="joinScreen"><div class="logo">PLAYAQUIZ</div><div class="join-card"><div class="field"><label>Room Code</label><input id="roomInput" placeholder="e.g. FR4X7K" style="text-transform:uppercase"></div><div class="field"><label>Your Name</label><input id="nameInput" placeholder="Enter your name"></div><div class="field"><label>Avatar</label><div class="avatar-grid" id="avatarGrid"></div></div><button class="join-btn" onclick="joinGame()">⚡ ENTER FINAL ROUND</button><div id="joinError" class="error-msg"></div></div></div>
<div id="gameScreen"><div class="game-top"><div><div id="myAvatarDisplay" style="font-size:28px">🎮</div><div id="myNameDisplay">—</div></div><div><div class="my-score"><span id="myScoreDisplay">0</span></div><div class="score-label">POINTS</div></div></div><div class="question-box" id="questionBox">Waiting for host...</div><div class="buzzer-wrap"><button class="buzzer-btn" id="buzzerBtn" onclick="buzz()" disabled>BUZZ!</button><div class="status-pill" id="statusPill">Waiting...</div><div id="playerTimer" class="timer-small"></div></div></div>
<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const AVATARS = ['😎','🦁','🐯','🐱','🐶','🐺','🦊','🐸','🐧','🐙','🦄','🐲','🚀','⭐','🔥','⚡','🎮','🏆'];
let myId=null, myName='', myAvatar='😎', myScore=0, roomCode=null, ch=null, isOpen=false, myStatus='waiting', globalBuzzerEnabled=true, timerInterval=null;
document.getElementById('avatarGrid').innerHTML=AVATARS.map((a,i)=>`<div class="avatar-opt ${i===0?'selected':''}" onclick="pickAvatar(this,'${a}')">${a}</div>`).join('');
function pickAvatar(el,a){ document.querySelectorAll('.avatar-opt').forEach(x=>x.classList.remove('selected')); el.classList.add('selected'); myAvatar=a; }
function setStatus(text,color='var(--green)'){ let p=document.getElementById('statusPill'); p.innerText=text; p.style.color=color; }
function updateBuzzer(){ let btn=document.getElementById('buzzerBtn'); if(myStatus==='eliminated'){ btn.disabled=true; btn.innerText='OUT'; setStatus('Eliminated','var(--red)'); } else if(myStatus==='buzzed'){ btn.disabled=true; btn.innerText='BUZZED!'; setStatus('You buzzed! Answer verbally','var(--gold)'); } else if(myStatus==='locked'||myStatus==='wrong'){ btn.disabled=true; btn.innerText='LOCKED'; setStatus('Locked out this round','var(--muted)'); } else if(isOpen && myStatus==='waiting' && globalBuzzerEnabled){ btn.disabled=false; btn.innerText='BUZZ!'; setStatus('🔴 BUZZ NOW!','var(--green)'); } else { btn.disabled=true; btn.innerText='WAIT'; setStatus('Waiting...','var(--muted)'); } }
function buzz(){ if(!isOpen || myStatus!=='waiting' || !globalBuzzerEnabled) return; if(navigator.vibrate) navigator.vibrate(80); myStatus='buzzed'; updateBuzzer(); ch.send({type:'broadcast',event:'buzz',payload:{id:myId,name:myName,avatar:myAvatar}}); }
function startPlayerTimer(seconds){ if(timerInterval) clearInterval(timerInterval); let timerDiv=document.getElementById('playerTimer'); let remaining=seconds; timerDiv.innerText=`⏱️ ${remaining}s`; timerInterval=setInterval(()=>{ remaining--; if(remaining<=0){ clearInterval(timerInterval); timerDiv.innerText=''; } else { timerDiv.innerText=`⏱️ ${remaining}s`; } },1000); }
function handleEvent(event,payload){ console.log('Player:',event,payload);
  switch(event){
    case 'round_started': setStatus('Round started!'); break;
    case 'question_open': isOpen=true; myStatus='waiting'; document.getElementById('questionBox').innerText=payload.question; updateBuzzer(); break;
    case 'buzz_confirmed': isOpen=false; if(payload.playerId===myId){ myStatus='buzzed'; setStatus('You buzzed!','var(--gold)'); } else { if(myStatus==='waiting') myStatus='locked'; setStatus(`${payload.playerName} buzzed first`,'var(--muted)'); } updateBuzzer(); break;
    case 'correct': if(payload.playerId===myId){ myScore=payload.newScore; document.getElementById('myScoreDisplay').innerText=myScore; myStatus='correct'; setStatus(`✅ +${payload.points||100} pts!`,'var(--gold)'); } else { if(myStatus!=='eliminated') myStatus='waiting'; } updateBuzzer(); setTimeout(()=>{ if(myStatus!=='eliminated' && myStatus!=='correct'){ isOpen=true; updateBuzzer(); } },5000); break;
    case 'wrong': if(payload.playerId===myId){ myStatus='wrong'; setStatus('❌ Wrong! Locked out','var(--red)'); } else { if(myStatus==='locked'){ setTimeout(()=>{ if(myStatus!=='eliminated' && myStatus!=='correct'){ myStatus='waiting'; isOpen=true; setStatus('Ready!','var(--green)'); updateBuzzer(); } },5000); } } updateBuzzer(); break;
    case 'next_question': isOpen=false; myStatus='waiting'; document.getElementById('questionBox').innerText='Next question coming...'; updateBuzzer(); break;
    case 'reset_buzzers': if(myStatus!=='eliminated'){ myStatus='waiting'; isOpen=true; } updateBuzzer(); break;
    case 'buzzers_reopen': if(myStatus!=='eliminated' && myStatus!=='correct' && myStatus!=='wrong'){ myStatus='waiting'; isOpen=true; updateBuzzer(); setStatus('Buzzers OPEN!','var(--green)'); } break;
    case 'buzzer_toggle': globalBuzzerEnabled=payload.enabled; if(!globalBuzzerEnabled && myStatus==='waiting'){ setStatus('🔕 Buzzers OFF','var(--muted)'); } else if(globalBuzzerEnabled && myStatus==='waiting' && isOpen){ setStatus('🔴 BUZZ NOW!','var(--green)'); } updateBuzzer(); break;
    case 'eliminated': if(payload.playerId===myId){ myStatus='eliminated'; isOpen=false; document.getElementById('questionBox').innerText='⚡ You have been eliminated!'; setStatus('ELIMINATED','var(--red)'); } updateBuzzer(); break;
    case 'round_ended': isOpen=false; let winner=payload.winner; if(winner && winner.id===myId){ document.getElementById('questionBox').innerHTML='🏆 YOU ARE THE CHAMPION! 🎉'; setStatus('CHAMPION!','var(--gold)'); launchConfetti(); } else { setStatus(`Winner: ${winner?.name||'?'}`,'var(--muted)'); } updateBuzzer(); break;
    case 'timer_start': startPlayerTimer(payload.seconds); break;
    case 'full_game_reset': location.reload(); break;
  }
}
function launchConfetti(){ for(let i=0;i<80;i++){ let c=document.createElement('div'); c.style.cssText=`position:fixed;width:8px;height:8px;background:${['#fbbf24','#ef4444','#10b981','#3b82f6'][Math.floor(Math.random()*4)]};left:${Math.random()*100}vw;top:-10px;border-radius:2px;pointer-events:none;z-index:9999;animation:confettiFall 2s linear forwards;`; document.body.appendChild(c); setTimeout(()=>c.remove(),2000); } }
async function joinGame(){ let room=document.getElementById('roomInput').value.trim().toUpperCase(); let name=document.getElementById('nameInput').value.trim(); if(!room||name.length<2){ document.getElementById('joinError').innerText='Enter valid room code and name'; return; } myId='p_'+Date.now()+'_'+Math.random().toString(36).substring(2,6); myName=name; roomCode=room; ch=sb.channel(`fr-${roomCode}`); ch.on('broadcast',{event:'round_started'},({payload})=>handleEvent('round_started',payload)).on('broadcast',{event:'question_open'},({payload})=>handleEvent('question_open',payload)).on('broadcast',{event:'buzz_confirmed'},({payload})=>handleEvent('buzz_confirmed',payload)).on('broadcast',{event:'correct'},({payload})=>handleEvent('correct',payload)).on('broadcast',{event:'wrong'},({payload})=>handleEvent('wrong',payload)).on('broadcast',{event:'next_question'},({payload})=>handleEvent('next_question',payload)).on('broadcast',{event:'reset_buzzers'},({payload})=>handleEvent('reset_buzzers',payload)).on('broadcast',{event:'buzzers_reopen'},({payload})=>handleEvent('buzzers_reopen',payload)).on('broadcast',{event:'buzzer_toggle'},({payload})=>handleEvent('buzzer_toggle',payload)).on('broadcast',{event:'eliminated'},({payload})=>handleEvent('eliminated',payload)).on('broadcast',{event:'round_ended'},({payload})=>handleEvent('round_ended',payload)).on('broadcast',{event:'timer_start'},({payload})=>handleEvent('timer_start',payload)).on('broadcast',{event:'full_game_reset'},({payload})=>handleEvent('full_game_reset',payload)).subscribe(async(status)=>{ if(status==='SUBSCRIBED'){ ch.send({type:'broadcast',event:'player_join',payload:{id:myId,name:myName,avatar:myAvatar}}); document.getElementById('joinScreen').style.display='none'; document.getElementById('gameScreen').style.display='flex'; document.getElementById('myAvatarDisplay').innerText=myAvatar; document.getElementById('myNameDisplay').innerText=myName; setStatus('Joined! Waiting for host'); updateBuzzer(); } else if(status==='CHANNEL_ERROR'){ document.getElementById('joinError').innerText='Connection failed'; } }); }
window.joinGame=joinGame; window.pickAvatar=pickAvatar; window.buzz=buzz;
</script>
</body>
</html>
