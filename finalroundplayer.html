<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Final Round Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #070510;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.09);
      --border2: rgba(255,255,255,0.15);
      --gold: #f5c842;
      --amber: #f97316;
      --green: #22d3a0;
      --red: #f43f5e;
      --violet: #a78bfa;
      --text: #f0eeff;
      --muted: rgba(240,238,255,0.4);
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 0%, rgba(245,200,66,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ═══════════════════════════════════════════════════════════════════ */
    /* ROOM CODE VERIFICATION GATE */
    /* ═══════════════════════════════════════════════════════════════════ */
    #roomVerifyGate {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(7,5,16,0.98), rgba(16,8,24,0.98));
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }
    #roomVerifyGate.hidden { display: none !important; }

    .verify-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(245,200,66,0.25);
      border-radius: 32px;
      padding: 40px 32px;
      width: 100%;
      max-width: 460px;
      backdrop-filter: blur(20px);
      text-align: center;
      animation: slideUp 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

    .verify-logo {
      font-family: 'Syne', sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #fff 20%, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .verify-subtitle {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .verify-field {
      margin-bottom: 18px;
    }
    .verify-field label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .verify-field input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(245,200,66,0.3);
      border-radius: 14px;
      padding: 14px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      letter-spacing: 2px;
      color: var(--text);
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: all 0.3s;
    }
    .verify-field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(245,200,66,0.15);
      background: rgba(255,255,255,0.1);
    }
    .verify-field input::placeholder { color: rgba(240,238,255,0.3); }

    .verify-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold), var(--amber));
      border: none;
      border-radius: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #111;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .verify-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(245,200,66,0.3); }
    .verify-btn:active { transform: translateY(0); }
    .verify-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .verify-error {
      color: var(--red);
      font-size: 12px;
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
      animation: shake 0.4s;
    }
    @keyframes shake { 0%,100%{ transform: translateX(0); } 25%{ transform: translateX(-6px); } 75%{ transform: translateX(6px); } }

    .verify-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 18px;
      line-height: 1.6;
    }

    /* === JOIN SCREEN === */
    #joinScreen {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      gap: 20px;
    }
    #joinScreen.visible { display: flex; }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #fff 20%, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .join-card {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 28px;
      padding: 28px 22px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(12px);
    }

    .field { margin-bottom: 16px; }
    .field label {
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      display: block;
      margin-bottom: 6px;
    }
    .field input {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border2);
      border-radius: 14px;
      padding: 13px 16px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      width: 100%;
      outline: none;
      text-align: center;
      transition: 0.2s;
    }
    .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,200,66,0.1); }
    .field input::placeholder { color: var(--muted); }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
      margin-top: 6px;
    }
    .avatar-opt {
      font-size: 24px;
      text-align: center;
      padding: 6px 4px;
      border-radius: 12px;
      border: 2px solid transparent;
      cursor: pointer;
      background: rgba(255,255,255,0.04);
      transition: all 0.15s;
    }
    .avatar-opt:active { transform: scale(0.9); }
    .avatar-opt.selected {
      border-color: var(--gold);
      background: rgba(245,200,66,0.1);
    }

    .join-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--gold), var(--amber));
      border: none;
      border-radius: 16px;
      font-family: 'Syne', sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #111;
      cursor: pointer;
      margin-top: 18px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .join-btn:active { transform: scale(0.98); }
    .join-btn:hover { box-shadow: 0 8px 24px rgba(245,200,66,0.3); }
    .join-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg { color: var(--red); font-size: 12px; text-align: center; margin-top: 10px; font-weight: 500; }

    /* === GAME SCREEN === */
    #gameScreen {
      display: none;
      position: relative;
      z-index: 2;
      height: 100vh;
      flex-direction: column;
      padding: 0;
    }
    #gameScreen.visible { display: flex; }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,5,16,0.7);
      backdrop-filter: blur(16px);
      flex-shrink: 0;
    }
    .player-identity { display: flex; align-items: center; gap: 10px; }
    .player-identity-avatar { font-size: 28px; }
    .player-identity-name { font-weight: 700; font-size: 15px; }

    .score-block { text-align: right; }
    .score-value {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
    }
    .score-label { font-size: 8px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

    /* Connection badge */
    .conn-status {
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      margin-top: 4px;
      text-align: center;
      letter-spacing: 0.5px;
      background: rgba(0,0,0,0.5);
      transition: all 0.3s;
    }
    .conn-status.connected { color: var(--green); border: 1px solid rgba(34,211,160,0.3); }
    .conn-status.reconnecting { color: var(--amber); border: 1px solid rgba(249,115,22,0.3); animation: pulseText 1.5s infinite; }
    .conn-status.disconnected { color: var(--red); border: 1px solid rgba(244,63,94,0.3); }
    @keyframes pulseText { 0%,100%{ opacity: 1; } 50%{ opacity: 0.5; } }

    /* Reconnecting overlay banner */
    #reconnectBanner {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 400;
      background: linear-gradient(90deg, #7c2d12, var(--amber));
      color: #fff;
      text-align: center;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      display: none;
      animation: slideDown 0.3s ease;
    }
    #reconnectBanner.visible { display: block; }
    @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

    /* QUESTION BOX */
    .question-area {
      margin: 14px 16px 0;
      background: rgba(255,255,255,0.03);
      border: 1.5px solid var(--border2);
      border-radius: 18px;
      padding: 16px 18px;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Options grid */
    #optionsGrid {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 16px 0;
      flex-shrink: 0;
    }
    #optionsGrid.visible { display: grid; }
    .opt-cell {
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border2);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .opt-letter {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--gold);
      flex-shrink: 0;
    }

    /* STATUS */
    .status-bar {
      background: rgba(255,255,255,0.03);
      border-top: 1px solid var(--border);
      padding: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* BUZZER */
    .buzzer-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow: hidden;
    }
    .buzzer-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      font-size: 48px;
      cursor: pointer;
      transition: all 0.1s;
      background: rgba(255,255,255,0.06);
      border: 2px solid var(--border2);
    }
    .buzzer-btn:active { transform: scale(0.92); }
    .buzzer-btn.enabled { background: linear-gradient(135deg, var(--green), var(--green)); border-color: var(--green); box-shadow: 0 0 30px rgba(34,211,160,0.6), inset 0 0 20px rgba(34,211,160,0.3); }
    .buzzer-btn.disabled { opacity: 0.3; cursor: not-allowed; }

    /* CORRECT PLAYER OVERLAY */
    #correctPlayerOverlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s;
    }
    #correctPlayerOverlay.visible { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .correct-card {
      background: rgba(255,255,255,0.1);
      border: 2px solid var(--gold);
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      backdrop-filter: blur(20px);
      animation: bounceIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes bounceIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
    .correct-avatar { font-size: 64px; margin-bottom: 12px; }
    .correct-name { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .correct-points { font-size: 14px; color: var(--gold); }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(245,200,66,0.3);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      backdrop-filter: blur(12px);
      z-index: 1000;
      animation: slideInLeft 0.3s;
    }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ROOM VERIFICATION GATE (NEW) -->
<div id="roomVerifyGate">
  <div class="verify-card">
    <div class="verify-logo">PLAYAQUIZ</div>
    <div class="verify-subtitle">Final Round Player</div>
    <div class="verify-field">
      <label for="verifyRoomInput">Enter Room Code</label>
      <input type="text" id="verifyRoomInput" placeholder="e.g., FR7A2B" maxlength="8" autocomplete="off">
    </div>
    <button class="verify-btn" onclick="submitVerifyRoom()">✅ Verify Code</button>
    <div id="verifyError" class="verify-error"></div>
    <div class="verify-hint">
      ℹ️ Enter the room code from the display or asked by the host.<br>
      This code must match an <strong>active live game</strong>.
    </div>
  </div>
</div>

<!-- JOIN SCREEN (AFTER VERIFICATION) -->
<div id="joinScreen">
  <div class="logo">PLAYAQUIZ</div>
  <div class="join-card">
    <div class="field">
      <label for="nameInput">Your Name</label>
      <input type="text" id="nameInput" placeholder="Enter your name" maxlength="20" autocomplete="off">
    </div>
    <div class="field">
      <label>Pick Your Avatar</label>
      <div class="avatar-grid" id="avatarGrid">
        <span class="avatar-opt" onclick="pickAvatar(event)">🎮</span>
        <span class="avatar-opt" onclick="pickAvatar(event)">⚽</span>
        <span class="avatar-opt" onclick="pickAvatar(event)">🏀</span>
        <span class="avatar-opt" onclick="pickAvatar(event)">🎸</span>
        <span class="avatar-opt" onclick="pickAvatar(event)">🍕</span>
        <span class="avatar-opt" onclick="pickAvatar(event)">🚀</span>
      </div>
    </div>
    <button class="join-btn" id="joinBtn" onclick="joinGame()">ENTER GAME</button>
    <div id="joinError" class="error-msg"></div>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
  <div class="game-header">
    <div class="player-identity">
      <span class="player-identity-avatar" id="playerAvatar">😎</span>
      <span class="player-identity-name" id="playerName">You</span>
    </div>
    <div style="flex:1; text-align: center; font-family: JetBrains Mono; font-size: 12px; color: var(--muted); letter-spacing: 1px;">
      ROOM: <span id="gameRoomDisplay" style="color: var(--gold);">——</span>
    </div>
    <div class="score-block">
      <div class="score-value" id="playerScore">0</div>
      <div class="score-label">POINTS</div>
      <div class="conn-status connected" id="playerConnStatus">● Connected</div>
    </div>
  </div>

  <div class="question-area" id="questionBox">Waiting for question...</div>
  <div id="optionsGrid"></div>

  <div class="status-bar" id="statusBar">Connecting...</div>

  <div class="buzzer-area">
    <button class="buzzer-btn disabled" id="buzzerBtn" onclick="buzz()">🔴</button>
  </div>
</div>

<!-- CORRECT PLAYER OVERLAY -->
<div id="correctPlayerOverlay">
  <div class="correct-card">
    <div class="correct-avatar" id="correctAvatar">🎮</div>
    <div class="correct-name" id="correctName">Player</div>
    <div class="correct-points" id="correctPoints">+100 pts!</div>
  </div>
</div>

<!-- RECONNECT BANNER -->
<div id="reconnectBanner">⟳ Reconnecting... Your session is being restored.</div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://ldejfqfxdwhqkwqnquya.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZWpmcWZ4ZHdocWt3cW5xdXlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MTkwMDAwMDAwMH0.x1Hx1vNxgZWxlKWMxjL9h8Gm-OvL3Mq4K_Zq8T9oO8c';
const RECONNECT_DELAYS = [1000, 2000, 4000, 8000, 16000];

// ─── State ────────────────────────────────────────────────────────────────────
let sb = null;
let ch = null;
let myId = null;
let myName = '';
let myAvatar = '😎';
let myScore = 0;
let myStatus = 'waiting';
let roomCode = null;
let isOpen = false;
let globalBuzzerEnabled = false;
let reconnectTimer = null;
let reconnectAttempts = 0;

// ─── Supabase Init ────────────────────────────────────────────────────────────
function initSupabase() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}
initSupabase();

// ─── Room Verification Gate (NEW) ─────────────────────────────────────────────
function submitVerifyRoom() {
  const code = document.getElementById('verifyRoomInput').value.trim().toUpperCase();
  const errorEl = document.getElementById('verifyError');
  
  if(code.length < 4) {
    errorEl.innerText = '❌ Room code must be 4-8 characters';
    return;
  }
  
  // Validate code format
  if(!/^[A-Z0-9]{4,8}$/.test(code)) {
    errorEl.innerText = '❌ Invalid code format. Use letters and numbers only.';
    return;
  }
  
  errorEl.innerText = '';
  const btn = event.target;
  btn.disabled = true;
  btn.innerText = '⟳ Verifying...';
  
  // IMPORTANT: In a real implementation, you would verify this against Control
  // For now, we simulate a basic check (in production, call Control's API)
  setTimeout(() => {
    // In production: fetch from control endpoint to verify room code is active
    // const isValid = await verifyRoomCodeWithControl(code);
    
    // Simulated validation
    const isValid = code.length >= 4 && /^FR/.test(code); // Simple heuristic: FR prefix
    
    if(!isValid) {
      errorEl.innerText = '❌ Room code not found or inactive. Check with the host.';
      btn.disabled = false;
      btn.innerText = '✅ Verify Code';
      return;
    }
    
    // Verification passed
    roomCode = code;
    document.getElementById('verifyRoomInput').value = code;
    document.getElementById('roomVerifyGate').classList.add('hidden');
    document.getElementById('joinScreen').classList.add('visible');
    btn.disabled = false;
    btn.innerText = '✅ Verify Code';
  }, 1200);
}

// Optional: Real verification function to call Control backend
async function verifyRoomCodeWithControl(code) {
  try {

    // const response = await fetch(`https://your-control-backend.com/api/verify-room/${code}`);
    // const data = await response.json();
    // return data.isActive && data.isLive;
    
    // For now, return true (implement when backend is ready)
    return true;
  } catch(e) {
    console.error('Verification error:', e);
    return false;
  }
}

// ─── Avatar picker ────────────────────────────────────────────────────────────
function pickAvatar(event) {
  document.querySelectorAll('.avatar-opt').forEach(opt => opt.classList.remove('selected'));
  event.target.classList.add('selected');
}

// ─── Local storage ────────────────────────────────────────────────────────────
function saveIdentity() {
  const identity = { myId, myName, myAvatar, myScore, myStatus, roomCode };
  localStorage.setItem('fr_player_identity', JSON.stringify(identity));
}

function loadIdentity() {
  const stored = localStorage.getItem('fr_player_identity');
  return stored ? JSON.parse(stored) : null;
}

function clearIdentity() {
  localStorage.removeItem('fr_player_identity');
}

// ─── Join game ────────────────────────────────────────────────────────────────
async function joinGame() {
  const name = document.getElementById('nameInput').value.trim();
  if(name.length < 2) {
    document.getElementById('joinError').innerText = 'Enter a name (min 2 chars)';
    return;
  }
  document.getElementById('joinBtn').disabled = true;
  document.getElementById('joinError').innerText = '';

  if(ch) { try { sb.removeChannel(ch); } catch(e) {} ch = null; }

  myId = 'p_' + Date.now() + '_' + Math.random().toString(36).substring(2,6);
  myName = name;
  myAvatar = document.querySelector('.avatar-opt.selected')?.innerText || '😎';
  myScore = 0;
  isOpen = false;
  myStatus = 'waiting';
  globalBuzzerEnabled = true;

  saveIdentity();
  subscribeChannel();

  setTimeout(() => {
    const btn = document.getElementById('joinBtn');
    if(btn) btn.disabled = false;
  }, 5000);
}

// ─── Subscribe channel ────────────────────────────────────────────────────────
function subscribeChannel() {
  if(!roomCode) return;

  ch = sb.channel(`fr-${roomCode}`);

  const events = [
    'full_game_reset', 'round_started', 'question_open', 'buzz_confirmed',
    'correct', 'wrong', 'buzzers_reopen', 'reset_buzzers', 'next_question',
    'reset_for_next_question', 'eliminated', 'round_ended', 'timer_start', 'buzzer_toggle',
    'state_sync'
  ];
  
  events.forEach(ev => {
    ch.on('broadcast', { event: ev }, ({ payload }) => handleEvent(ev, payload));
  });

  ch.subscribe((status) => {
    const badge = document.getElementById('playerConnStatus');
    if(status === 'SUBSCRIBED') {
      cancelReconnect();
      badge.className = 'conn-status connected';
      badge.innerText = '● Connected';
      document.getElementById('gameRoomDisplay').innerText = roomCode;
      document.getElementById('gameScreen').classList.add('visible');
      document.getElementById('joinScreen').classList.remove('visible');
      updateBuzzerUI();
    } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
      badge.className = 'conn-status disconnected';
      badge.innerText = '⚠ Disconnected';
      if(roomCode) scheduleReconnect();
    }
  });
}

// ─── Reconnect ────────────────────────────────────────────────────────────────
function cancelReconnect() {
  if(reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  reconnectAttempts = 0;
}

function scheduleReconnect() {
  if(reconnectTimer) return;
  const delay = RECONNECT_DELAYS[Math.min(reconnectAttempts, RECONNECT_DELAYS.length-1)];
  reconnectAttempts++;
  const banner = document.getElementById('reconnectBanner');
  banner.classList.add('visible');
  const badge = document.getElementById('playerConnStatus');
  badge.className = 'conn-status reconnecting';
  badge.innerText = `⟳ Reconnecting (${reconnectAttempts})...`;
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    if(ch) { try { sb.removeChannel(ch); } catch(e) {} ch = null; }
    subscribeChannel();
  }, delay);
}

// ─── Event handler ────────────────────────────────────────────────────────────
function handleEvent(event, payload) {
  switch(event) {

    case 'full_game_reset':
      clearIdentity();
      resetToJoinScreen(payload?.newRoomCode || null);
      break;

    case 'round_started':
      if(myStatus === 'eliminated') break;
      myStatus = 'waiting';
      isOpen = false;
      globalBuzzerEnabled = true;
      hideCorrectPlayerOverlay();
      hideOptions();
      document.getElementById('questionBox').innerText = 'Round started! Get ready...';
      setStatus('Round started!', 'var(--green)');
      updateBuzzerUI();
      break;

    case 'question_open':
      if(myStatus === 'eliminated') break;
      myStatus = 'waiting';
      isOpen = true;
      globalBuzzerEnabled = true;
      hideCorrectPlayerOverlay();
      document.getElementById('questionBox').innerText = payload.question || '';
      showOptions(payload.options || []);
      setStatus('🔴 BUZZ NOW!', 'var(--green)');
      updateBuzzerUI();
      break;

    case 'buzz_confirmed':
      isOpen = false;
      if(payload.playerId === myId) {
        myStatus = 'buzzed';
        setStatus('🎤 Answer verbally!', 'var(--gold)');
      } else {
        if(myStatus === 'waiting') myStatus = 'locked';
        setStatus(`⏸ ${payload.playerName} is answering...`, 'var(--muted)');
      }
      updateBuzzerUI();
      break;

    case 'correct':
      isOpen = false;
      if(payload.playerId === myId) {
        updateScore(payload.newScore || (myScore + (payload.points || 100)));
        myStatus = 'correct';
        setStatus(`✅ +${payload.points || 100} pts!`, 'var(--gold)');
        launchConfetti();
        hideOptions();
      } else {
        if(myStatus !== 'eliminated') myStatus = 'waiting';
        showCorrectPlayerOverlay(payload.playerName, payload.playerAvatar, payload.points || 100);
      }
      updateBuzzerUI();
      saveIdentity();
      break;

    case 'wrong':
      if(payload.playerId === myId) {
        myStatus = 'wrong';
        setStatus('❌ Wrong! Locked out', 'var(--red)');
        isOpen = false;
        updateBuzzerUI();
      } else {
        if(myStatus === 'locked' || myStatus === 'waiting') {
          setStatus('⏳ Stand by — steal chance incoming...', 'var(--amber)');
          setTimeout(() => {
            if((myStatus === 'locked' || myStatus === 'waiting') && myStatus !== 'eliminated' && myStatus !== 'wrong' && myStatus !== 'correct') {
              isOpen = true;
              myStatus = 'waiting';
              globalBuzzerEnabled = true;
              setStatus('🔴 STEAL! BUZZ NOW!', 'var(--green)');
              updateBuzzerUI();
            }
          }, 5500);
        }
      }
      break;

    case 'buzzers_reopen':
      if(myStatus === 'eliminated' || myStatus === 'correct' || myStatus === 'wrong') break;
      isOpen = true;
      myStatus = 'waiting';
      globalBuzzerEnabled = true;
      setStatus('🔴 STEAL! BUZZ NOW!', 'var(--green)');
      updateBuzzerUI();
      break;

    case 'reset_buzzers':
      if(myStatus === 'eliminated') break;
      myStatus = 'waiting';
      isOpen = true;
      globalBuzzerEnabled = true;
      setStatus('🔴 BUZZ NOW!', 'var(--green)');
      updateBuzzerUI();
      break;

    case 'next_question':
    case 'reset_for_next_question':
      if(myStatus === 'eliminated') { hideCorrectPlayerOverlay(); break; }
      myStatus = 'waiting';
      isOpen = false;
      globalBuzzerEnabled = true;
      hideCorrectPlayerOverlay();
      hideOptions();
      document.getElementById('questionBox').innerText = 'Next question coming...';
      setStatus('Waiting for next question...', 'var(--muted)');
      updateBuzzerUI();
      break;

    case 'buzzer_toggle':
      globalBuzzerEnabled = payload.enabled;
      if(!globalBuzzerEnabled) setStatus('🔕 Buzzers OFF', 'var(--muted)');
      else if(isOpen && myStatus === 'waiting') setStatus('🔴 BUZZ NOW!', 'var(--green)');
      updateBuzzerUI();
      break;

    case 'eliminated':
      if(payload.playerId === myId) {
        myStatus = 'eliminated';
        isOpen = false;
        hideCorrectPlayerOverlay();
        hideOptions();
        document.getElementById('questionBox').innerText = '⚡ You have been eliminated from the round!';
        setStatus('⚡ ELIMINATED', 'var(--red)');
        updateBuzzerUI();
        saveIdentity();
      }
      break;

    case 'round_ended':
      isOpen = false;
      hideCorrectPlayerOverlay();
      hideOptions();
      const winner = payload.winner;
      if(winner && winner.id === myId) {
        document.getElementById('questionBox').innerHTML = '🏆 YOU ARE THE CHAMPION!';
        setStatus('🏆 CHAMPION!', 'var(--gold)');
        launchConfetti();
      } else {
        document.getElementById('questionBox').innerText = `🏆 Winner: ${winner?.name || '?'}`;
        setStatus(`Winner: ${winner?.name || '?'}`, 'var(--muted)');
      }
      updateBuzzerUI();
      break;

    case 'timer_start':
      startPlayerTimer(payload.seconds);
      break;

    case 'state_sync':
      if(payload.playerId !== myId) break;
      myStatus = payload.status || 'waiting';
      if(payload.score !== undefined) updateScore(payload.score);
      if(payload.isEliminated) {
        myStatus = 'eliminated';
        document.getElementById('questionBox').innerText = '⚡ You have been eliminated!';
        hideOptions();
        isOpen = false;
      } else if(payload.questionText) {
        document.getElementById('questionBox').innerText = payload.questionText;
        if(payload.questionOptions && payload.questionOptions.length) {
          showOptions(payload.questionOptions);
        }
        isOpen = payload.isQuestionOpen || false;
      }
      globalBuzzerEnabled = true;
      updateBuzzerUI();
      updateConnectionBadge('connected', '● Reconnected ✓');
      showToast('✅ Back in the game!', 2500);
      saveIdentity();
      break;
  }
}

// ─── UI Updates ───────────────────────────────────────────────────────────────
function updateScore(newScore) {
  myScore = newScore;
  document.getElementById('playerScore').innerText = myScore;
}

function setStatus(msg, color) {
  const bar = document.getElementById('statusBar');
  bar.innerText = msg;
  bar.style.color = `var(--text)`;
}

function updateConnectionBadge(state, text) {
  const badge = document.getElementById('playerConnStatus');
  badge.className = `conn-status ${state}`;
  badge.innerText = text;
}

function updateBuzzerUI() {
  const btn = document.getElementById('buzzerBtn');
  btn.className = 'buzzer-btn';
  if(isOpen && globalBuzzerEnabled && myStatus === 'waiting') {
    btn.classList.add('enabled');
  } else {
    btn.classList.add('disabled');
  }
}

// ─── Options ──────────────────────────────────────────────────────────────────
function showOptions(options) {
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = (options || []).map(opt => `
    <div class="opt-cell">
      <span class="opt-letter">${opt.letter}</span>
      <span>${opt.text}</span>
    </div>
  `).join('');
  grid.classList.add('visible');
}

function hideOptions() {
  const grid = document.getElementById('optionsGrid');
  grid.classList.remove('visible');
}

// ─── Correct Player Overlay ───────────────────────────────────────────────────
function showCorrectPlayerOverlay(name, avatar, points) {
  document.getElementById('correctAvatar').innerText = avatar || '🎮';
  document.getElementById('correctName').innerText = name;
  document.getElementById('correctPoints').innerText = `+${points} pts!`;
  document.getElementById('correctPlayerOverlay').classList.add('visible');
  setTimeout(() => hideCorrectPlayerOverlay(), 3000);
}

function hideCorrectPlayerOverlay() {
  document.getElementById('correctPlayerOverlay').classList.remove('visible');
}

// ─── Buzzer ───────────────────────────────────────────────────────────────────
function buzz() {
  if(!isOpen || !globalBuzzerEnabled || myStatus !== 'waiting') return;
  isOpen = false;
  globalBuzzerEnabled = false;
  myStatus = 'buzzed';
  setStatus('Buzzing in...', 'var(--gold)');
  updateBuzzerUI();

  ch.send({
    type: 'broadcast',
    event: 'buzz_attempt',
    payload: {
      playerId: myId,
      playerName: myName,
      playerAvatar: myAvatar,
      timestamp: Date.now()
    }
  });
}

// ─── Timer ────────────────────────────────────────────────────────────────────
function startPlayerTimer(seconds) {
  let remaining = seconds;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:500;';
  const timer = document.createElement('div');
  timer.style.cssText = 'font-family:"Syne",sans-serif;font-size:120px;font-weight:800;color:var(--gold);text-shadow:0 0 30px rgba(245,200,66,0.5);';
  timer.innerText = remaining;
  overlay.appendChild(timer);
  document.body.appendChild(overlay);
  
  const interval = setInterval(() => {
    remaining--;
    timer.innerText = remaining;
    if(remaining <= 3) timer.style.color = 'var(--red)';
    else if(remaining <= 6) timer.style.color = 'var(--amber)';
    if(remaining <= 0) {
      clearInterval(interval);
      overlay.remove();
    }
  }, 1000);
}

// ─── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg, duration = 3000) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerText = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), duration);
}

// ─── Confetti ─────────────────────────────────────────────────────────────────
function launchConfetti() {
  if(typeof confetti !== 'undefined') {
    confetti({ particleCount: 50, spread: 70, origin: { y: 0.6 } });
  }
}

// ─── Reset ────────────────────────────────────────────────────────────────────
function resetToJoinScreen(newRoomCode) {
  if(ch) { try { sb.removeChannel(ch); } catch(e) {} ch = null; }
  cancelReconnect();
  roomCode = null;
  myId = null;
  myName = '';
  myAvatar = '😎';
  myScore = 0;
  myStatus = 'waiting';
  document.getElementById('gameScreen').classList.remove('visible');
  document.getElementById('joinScreen').classList.remove('visible');
  document.getElementById('verifyRoomInput').value = '';
  document.getElementById('nameInput').value = '';
  document.getElementById('joinError').innerText = '';
  document.getElementById('verifyError').innerText = '';
  document.querySelectorAll('.avatar-opt').forEach(opt => opt.classList.remove('selected'));
  document.getElementById('roomVerifyGate').classList.remove('hidden');
  if(newRoomCode) {
    document.getElementById('verifyRoomInput').value = newRoomCode;
    submitVerifyRoom();
  }
}

// ─── Auto-rejoin ──────────────────────────────────────────────────────────────
(function autoRejoin() {
  const saved = loadIdentity();
  if(saved && saved.roomCode && saved.myId) {
    myId = saved.myId;
    myName = saved.myName;
    myAvatar = saved.myAvatar;
    myScore = saved.myScore || 0;
    myStatus = saved.myStatus || 'waiting';
    roomCode = saved.roomCode;

    document.getElementById('nameInput').value = myName;
    document.querySelectorAll('.avatar-opt').forEach(opt => {
      opt.classList.toggle('selected', opt.innerText === myAvatar);
    });

    document.getElementById('verifyRoomInput').value = roomCode;
    document.getElementById('roomVerifyGate').classList.add('hidden');
    document.getElementById('joinScreen').classList.add('visible');
    document.getElementById('playerAvatar').innerText = myAvatar;
    document.getElementById('playerName').innerText = myName;
    document.getElementById('playerScore').innerText = myScore;

    updateConnectionBadge('reconnecting', '⟳ Reconnecting...');
    subscribeChannel();
  }
})();

window.submitVerifyRoom = submitVerifyRoom;
window.pickAvatar = pickAvatar;
window.joinGame = joinGame;
window.buzz = buzz;
</script>
