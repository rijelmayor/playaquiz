<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Final Round Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #070510;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.09);
      --border2: rgba(255,255,255,0.15);
      --gold: #f5c842;
      --amber: #f97316;
      --green: #22d3a0;
      --red: #f43f5e;
      --violet: #a78bfa;
      --text: #f0eeff;
      --muted: rgba(240,238,255,0.4);
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 0%, rgba(245,200,66,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* === JOIN SCREEN === */
    #joinScreen {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      gap: 20px;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #fff 20%, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .join-card {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 28px;
      padding: 28px 22px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(12px);
    }

    .field { margin-bottom: 16px; }
    .field label {
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      display: block;
      margin-bottom: 6px;
    }
    .field input {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border2);
      border-radius: 14px;
      padding: 13px 16px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      width: 100%;
      outline: none;
      text-align: center;
      transition: 0.2s;
    }
    .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,200,66,0.1); }
    .field input::placeholder { color: var(--muted); }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
      margin-top: 6px;
    }
    .avatar-opt {
      font-size: 24px;
      text-align: center;
      padding: 6px 4px;
      border-radius: 12px;
      border: 2px solid transparent;
      cursor: pointer;
      background: rgba(255,255,255,0.04);
      transition: all 0.15s;
    }
    .avatar-opt:active { transform: scale(0.9); }
    .avatar-opt.selected {
      border-color: var(--gold);
      background: rgba(245,200,66,0.1);
    }

    .join-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--gold), var(--amber));
      border: none;
      border-radius: 16px;
      font-family: 'Syne', sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #111;
      cursor: pointer;
      margin-top: 18px;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .join-btn:active { transform: scale(0.98); }
    .join-btn:hover { box-shadow: 0 8px 24px rgba(245,200,66,0.3); }
    .join-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg { color: var(--red); font-size: 12px; text-align: center; margin-top: 10px; font-weight: 500; }

    /* === GAME SCREEN === */
    #gameScreen {
      display: none;
      position: relative;
      z-index: 2;
      height: 100vh;
      flex-direction: column;
      padding: 0;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,5,16,0.7);
      backdrop-filter: blur(16px);
      flex-shrink: 0;
    }
    .player-identity { display: flex; align-items: center; gap: 10px; }
    .player-identity-avatar { font-size: 28px; }
    .player-identity-name { font-weight: 700; font-size: 15px; }

    .score-block { text-align: right; }
    .score-value {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
    }
    .score-label { font-size: 8px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

    /* Connection badge */
    .conn-status {
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      margin-top: 4px;
      text-align: center;
      letter-spacing: 0.5px;
      background: rgba(0,0,0,0.5);
      transition: all 0.3s;
    }
    .conn-status.connected { color: var(--green); border: 1px solid rgba(34,211,160,0.3); }
    .conn-status.reconnecting { color: var(--amber); border: 1px solid rgba(249,115,22,0.3); animation: pulseText 1.5s infinite; }
    .conn-status.disconnected { color: var(--red); border: 1px solid rgba(244,63,94,0.3); }
    @keyframes pulseText { 0%,100%{ opacity: 1; } 50%{ opacity: 0.5; } }

    /* Reconnecting overlay banner — shown IN GAME when DC'd */
    #reconnectBanner {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 400;
      background: linear-gradient(90deg, #7c2d12, var(--amber));
      color: #fff;
      text-align: center;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      display: none;
      animation: slideDown 0.3s ease;
    }
    #reconnectBanner.visible { display: block; }
    @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

    /* QUESTION BOX */
    .question-area {
      margin: 14px 16px 0;
      background: rgba(255,255,255,0.03);
      border: 1.5px solid var(--border2);
      border-radius: 18px;
      padding: 16px 18px;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Options grid (shown during question) */
    #optionsGrid {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 16px 0;
      flex-shrink: 0;
    }
    #optionsGrid.visible { display: grid; }
    .opt-cell {
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--border2);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .opt-letter {
      color: var(--gold);
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* BUZZER AREA */
    .buzzer-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 16px;
    }

    .buzzer-btn-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Glow rings */
    .buzzer-glow {
      position: absolute;
      border-radius: 50%;
      background: transparent;
      border: 2px solid rgba(244,63,94,0.15);
      animation: glowRing 2s ease-in-out infinite;
    }
    .buzzer-glow:nth-child(1) { width: calc(min(62vw,260px) + 30px); height: calc(min(62vw,260px) + 30px); animation-delay: 0s; }
    .buzzer-glow:nth-child(2) { width: calc(min(62vw,260px) + 60px); height: calc(min(62vw,260px) + 60px); animation-delay: 0.4s; }
    .buzzer-glow:nth-child(3) { width: calc(min(62vw,260px) + 90px); height: calc(min(62vw,260px) + 90px); animation-delay: 0.8s; }
    @keyframes glowRing { 0%,100%{ opacity: 0.4; transform: scale(1); } 50%{ opacity: 0.1; transform: scale(1.03); } }

    .buzzer-btn {
      position: relative;
      z-index: 2;
      width: min(62vw, 260px);
      height: min(62vw, 260px);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: radial-gradient(circle at 35% 28%, #ff6b6b, #f43f5e 50%, #be123c);
      box-shadow:
        0 12px 0 #881337,
        0 18px 40px rgba(244,63,94,0.35),
        inset 0 2px 4px rgba(255,255,255,0.2);
      font-family: 'Syne', sans-serif;
      font-size: clamp(26px, 8vw, 46px);
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.06s linear, box-shadow 0.06s linear;
    }
    .buzzer-btn:not(:disabled):active {
      transform: translateY(10px);
      box-shadow:
        0 2px 0 #881337,
        0 4px 20px rgba(244,63,94,0.25),
        inset 0 2px 4px rgba(255,255,255,0.1);
    }
    .buzzer-btn:disabled {
      opacity: 0.5;
      transform: none !important;
      cursor: not-allowed;
      background: radial-gradient(circle at 35% 28%, #4b5563, #374151);
      box-shadow: 0 8px 0 #1f2937, 0 12px 30px rgba(0,0,0,0.3);
    }
    .buzzer-btn.buzzed-state {
      background: radial-gradient(circle at 35% 28%, #fde68a, var(--gold) 50%, #d97706);
      box-shadow: 0 10px 0 #92400e, 0 16px 40px rgba(245,200,66,0.4), inset 0 2px 4px rgba(255,255,255,0.3);
    }

    .status-pill {
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      padding: 8px 22px;
      border-radius: 40px;
      background: rgba(34,211,160,0.08);
      border: 1px solid rgba(34,211,160,0.2);
      color: var(--green);
      letter-spacing: 0.5px;
      transition: all 0.3s;
    }

    /* PLAYER COUNTDOWN TIMER */
    #playerTimerOverlay {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
      z-index: 300; pointer-events: none;
      display: none; flex-direction: column; align-items: center;
    }
    #playerTimerOverlay.active { display: flex; }
    .player-timer-ring { position: relative; width: 80px; height: 80px; }
    .player-timer-ring svg { width: 80px; height: 80px; transform: rotate(-90deg); }
    .player-timer-ring .track { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 6; }
    .player-timer-ring .progress {
      fill: none; stroke: var(--gold); stroke-width: 6; stroke-linecap: round;
      stroke-dasharray: 220; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear, stroke 0.3s;
    }
    .player-timer-number {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--gold);
      transition: color 0.3s;
    }

    /* FLASH OVERLAY */
    .buzz-flash {
      position: fixed;
      inset: 0;
      background: rgba(245,200,66,0.15);
      pointer-events: none;
      z-index: 100;
      animation: flashFade 0.6s ease forwards;
    }
    @keyframes flashFade { from{ opacity:1; } to{ opacity:0; } }

    /* NOTIFICATION TOAST */
    .reconnect-toast {
      position: fixed;
      bottom: 20px;
      left: 16px; right: 16px;
      background: linear-gradient(135deg, var(--amber), #b45309);
      color: white;
      padding: 12px 18px;
      border-radius: 16px;
      text-align: center;
      animation: slideUp 0.3s cubic-bezier(0.22,1,0.36,1);
      z-index: 2000;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    @keyframes slideUp { from { opacity:0; transform: translateY(50px); } to { opacity:1; transform: translateY(0); } }

    .hidden { display: none !important; }

    /* CORRECT OVERLAY */
    #correctOverlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(7,5,16,0.97);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
      animation: correctOverlayIn 0.4s cubic-bezier(0.22,1,0.36,1);
    }
    #correctOverlay.active { display: flex; }
    @keyframes correctOverlayIn { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform:none; } }
    .correct-icon { font-size: 72px; margin-bottom: 12px; }
    .correct-name-big {
      font-family: 'Syne', sans-serif; font-size: clamp(28px, 8vw, 52px); font-weight: 800;
      color: var(--green); text-shadow: 0 0 30px rgba(34,211,160,0.5);
      margin-bottom: 8px;
    }
    .correct-label {
      font-size: 13px; letter-spacing: 4px; color: rgba(34,211,160,0.6);
      text-transform: uppercase; font-weight: 700;
    }
    .correct-pts {
      margin-top: 18px; font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800;
      color: var(--gold);
    }

    /* Score pop animation */
    @keyframes scorePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.4); color: var(--gold); }
      100% { transform: scale(1); }
    }
    .score-pop { animation: scorePop 0.5s cubic-bezier(0.22,1,0.36,1); }

    @keyframes confettiFall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  </style>
</head>
<body>

<!-- RECONNECT BANNER -->
<div id="reconnectBanner">⟳ Reconnecting to game... your progress is safe</div>

<!-- CORRECT ANSWER OVERLAY -->
<div id="correctOverlay">
  <div class="correct-icon">💎</div>
  <div class="correct-name-big" id="correctOverlayName">—</div>
  <div class="correct-label">Got it correct!</div>
  <div class="correct-pts" id="correctOverlayPts">+100 pts</div>
</div>

<!-- JOIN SCREEN -->
<div id="joinScreen">
  <div class="logo">PLAYAQUIZ</div>
  <div class="join-card">
    <div class="field">
      <label>Room Code</label>
      <input id="roomInput" placeholder="FR4X7K" style="text-transform:uppercase;font-family:'JetBrains Mono',monospace;letter-spacing:4px;font-size:22px;" autocomplete="off">
    </div>
    <div class="field">
      <label>Your Name</label>
      <input id="nameInput" placeholder="Enter your name" autocomplete="off">
    </div>
    <div class="field">
      <label>Choose Avatar</label>
      <div class="avatar-grid" id="avatarGrid"></div>
    </div>
    <button class="join-btn" id="joinBtn" onclick="joinGame()">⚡ ENTER FINAL ROUND</button>
    <div id="joinError" class="error-msg"></div>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
  <div class="game-header">
    <div class="player-identity">
      <div class="player-identity-avatar" id="myAvatarDisplay">🎮</div>
      <div>
        <div class="player-identity-name" id="myNameDisplay">—</div>
        <div class="conn-status connected" id="connStatusBadge">● Connected</div>
      </div>
    </div>
    <div class="score-block">
      <div class="score-value" id="myScoreDisplay">0</div>
      <div class="score-label">Points</div>
    </div>
  </div>

  <div class="question-area" id="questionBox">Waiting for host to start...</div>
  <div id="optionsGrid"></div>

  <div class="buzzer-wrap">
    <div class="buzzer-btn-wrap">
      <div class="buzzer-glow"></div>
      <div class="buzzer-glow"></div>
      <div class="buzzer-glow"></div>
      <button class="buzzer-btn" id="buzzerBtn" onclick="buzz()" disabled>BUZZ!</button>
    </div>
    <div class="status-pill" id="statusPill">Waiting...</div>
  </div>
</div>

<!-- PLAYER COUNTDOWN TIMER -->
<div id="playerTimerOverlay">
  <div class="player-timer-ring">
    <svg viewBox="0 0 80 80">
      <circle class="track" cx="40" cy="40" r="35"/>
      <circle class="progress" id="playerTimerProgress" cx="40" cy="40" r="35"/>
    </svg>
    <div class="player-timer-number" id="playerTimerNumber">—</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const AVATARS = ['😎','🦁','🐯','🐱','🐶','🐺','🦊','🐸','🐧','🐙','🦄','🐲','🚀','⭐','🔥','⚡','🎮','🏆'];

// ─── Core state ───────────────────────────────────────────────────────────────
let myId = null, myName = '', myAvatar = '😎', myScore = 0, roomCode = null, ch = null;
let isOpen = false, myStatus = 'waiting', globalBuzzerEnabled = true, timerInterval = null;
let reconnectAttempts = 0, reconnectTimer = null, heartbeatInterval = null;
const RECONNECT_DELAYS = [2000, 4000, 8000, 15000];
const HEARTBEAT_MS = 6000;

// ─── Build avatar grid ────────────────────────────────────────────────────────
document.getElementById('avatarGrid').innerHTML = AVATARS.map((a,i) =>
  `<div class="avatar-opt ${i===0?'selected':''}" onclick="pickAvatar(this,'${a}')">${a}</div>`
).join('');

function pickAvatar(el, avatar) {
  document.querySelectorAll('.avatar-opt').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
  myAvatar = avatar;
}

// ─── Helper Functions ─────────────────────────────────────────────────────────
function updateConnectionBadge(state, message) {
  const badge = document.getElementById('connStatusBadge');
  const banner = document.getElementById('reconnectBanner');
  if(badge) { badge.className = `conn-status ${state}`; badge.innerText = message; }
  if(banner) banner.classList.toggle('visible', state === 'reconnecting' || state === 'disconnected');
}

function showToast(msg, duration = 4000) {
  const toast = document.createElement('div');
  toast.className = 'reconnect-toast';
  toast.innerText = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), duration);
}

function setStatus(text, color = 'var(--green)') {
  const pill = document.getElementById('statusPill');
  if(pill) { pill.innerText = text; pill.style.color = color; pill.style.borderColor = color; }
}

function showOptions(opts) {
  const grid = document.getElementById('optionsGrid');
  if(!grid) return;
  if(!opts || !opts.length) { grid.className = ''; grid.innerHTML = ''; return; }
  const letters = ['A','B','C','D'];
  grid.innerHTML = opts.map((o,i) => `<div class="opt-cell"><span class="opt-letter">${letters[i]}</span><span>${o}</span></div>`).join('');
  grid.className = 'visible';
}

function hideOptions() { const grid = document.getElementById('optionsGrid'); if(grid) { grid.className = ''; grid.innerHTML = ''; } }

function updateBuzzerUI() {
  const btn = document.getElementById('buzzerBtn');
  if(!btn) return;
  btn.classList.remove('buzzed-state');
  if(myStatus === 'eliminated') { btn.disabled = true; btn.innerText = 'OUT'; setStatus('⚡ Eliminated', 'var(--red)'); }
  else if(myStatus === 'buzzed') { btn.disabled = true; btn.classList.add('buzzed-state'); btn.innerText = 'BUZZED!'; setStatus('🎤 Answer verbally!', 'var(--gold)'); }
  else if(myStatus === 'locked' || myStatus === 'wrong') { btn.disabled = true; btn.innerText = 'LOCKED'; setStatus('Locked out this round', 'var(--muted)'); }
  else if(isOpen && myStatus === 'waiting' && globalBuzzerEnabled) { btn.disabled = false; btn.innerText = 'BUZZ!'; setStatus('🔴 BUZZ NOW!', 'var(--green)'); }
  else { btn.disabled = true; btn.innerText = 'WAIT'; setStatus('Waiting...', 'var(--muted)'); }
}

function buzz() {
  if(!isOpen || myStatus !== 'waiting' || !globalBuzzerEnabled) return;
  if(navigator.vibrate) navigator.vibrate([60,20,60]);
  myStatus = 'buzzed';
  updateBuzzerUI();
  if(ch) ch.send({ type: 'broadcast', event: 'buzz', payload: { id: myId, name: myName, avatar: myAvatar } });
}

function updateScore(newScore) {
  myScore = newScore;
  const el = document.getElementById('myScoreDisplay');
  if(el) el.innerText = myScore;
}

function startPlayerTimer(seconds) {
  if(timerInterval) clearInterval(timerInterval);
  const overlay = document.getElementById('playerTimerOverlay');
  const numEl = document.getElementById('playerTimerNumber');
  const progressEl = document.getElementById('playerTimerProgress');
  const circumference = 2 * Math.PI * 35;
  progressEl.style.strokeDasharray = circumference;
  overlay.classList.add('active');
  let remaining = seconds;
  const update = () => {
    numEl.innerText = remaining;
    const pct = remaining / seconds;
    progressEl.style.strokeDashoffset = circumference * (1 - pct);
    if(remaining <= 3) { progressEl.style.stroke = 'var(--red)'; numEl.style.color = 'var(--red)'; }
    else if(remaining <= 6) { progressEl.style.stroke = 'var(--amber)'; numEl.style.color = 'var(--amber)'; }
    else { progressEl.style.stroke = 'var(--gold)'; numEl.style.color = 'var(--gold)'; }
  };
  update();
  timerInterval = setInterval(() => {
    remaining--;
    if(remaining <= 0) {
      clearInterval(timerInterval); timerInterval = null;
      setTimeout(() => overlay.classList.remove('active'), 800);
    } else { update(); }
  }, 1000);
}

function showCorrectPlayerOverlay(name, avatar, pts) {
  const el = document.getElementById('correctOverlay');
  document.getElementById('correctOverlayName').innerText = `${avatar || '💎'} ${name || ''}`;
  document.getElementById('correctOverlayPts').innerText = `+${pts} pts`;
  el.classList.add('active');
  setTimeout(() => el.classList.remove('active'), 3000);
}

function hideCorrectPlayerOverlay() { document.getElementById('correctOverlay').classList.remove('active'); }
function launchConfetti() { for(let i=0;i<80;i++) { const c=document.createElement('div'); c.style.cssText=`position:fixed;width:6px;height:6px;background:${['#f5c842','#f43f5e','#22d3a0','#6366f1'][Math.floor(Math.random()*4)]};left:${Math.random()*100}vw;top:-10px;border-radius:50%;pointer-events:none;z-index:9999;animation:confettiFall 2.5s linear ${Math.random()*0.5}s forwards;`; document.body.appendChild(c); setTimeout(()=>c.remove(),3000); } }

// ─── Identity persistence ─────────────────────────────────────────────────────
function saveIdentity() { try { sessionStorage.setItem('fr_identity', JSON.stringify({ myId, myName, myAvatar, roomCode, myScore, myStatus })); } catch(e) {} }
function loadIdentity() { try { const s = sessionStorage.getItem('fr_identity'); return s ? JSON.parse(s) : null; } catch(e) { return null; } }
function clearIdentity() { try { sessionStorage.removeItem('fr_identity'); } catch(e) {} }

// ─── Heartbeat ────────────────────────────────────────────────────────────────
function startHeartbeat() { stopHeartbeat(); heartbeatInterval = setInterval(() => { if(ch && myId) ch.send({ type: 'broadcast', event: 'player_heartbeat', payload: { id: myId } }); }, HEARTBEAT_MS); }
function stopHeartbeat() { if(heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; } }

function cancelReconnect() { if(reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; } reconnectAttempts = 0; }
function scheduleReconnect() { if(reconnectTimer) return; const delay = RECONNECT_DELAYS[Math.min(reconnectAttempts, RECONNECT_DELAYS.length-1)]; reconnectAttempts++; updateConnectionBadge('reconnecting', `⟳ Reconnecting (${reconnectAttempts})...`); reconnectTimer = setTimeout(() => { reconnectTimer = null; if(roomCode) subscribeChannel(); }, delay); }

// ─── Room Verification Helpers ────────────────────────────────────────────────
async function verifyRoomBeforeJoining(code) {
  try {
    const { data, error } = await sb.from('game_rooms').select('room_code, is_active').eq('room_code', code).maybeSingle();
    if(error || !data) return false;
    return data.is_active === true;
  } catch(err) { console.error('Verification error:', err); return false; }
}

async function updatePlayerCount(code, increment) {
  try {
    const { data } = await sb.from('game_rooms').select('player_count').eq('room_code', code).single();
    const newCount = (data?.player_count || 0) + (increment ? 1 : -1);
    await sb.from('game_rooms').update({ player_count: Math.max(0, newCount) }).eq('room_code', code);
  } catch(err) { console.warn('Could not update player count:', err); }
}

function resetToJoinScreen(newRoomCode = null) {
  if(ch) { try { sb.removeChannel(ch); } catch(e) {} ch = null; }
  cancelReconnect(); stopHeartbeat(); if(timerInterval) clearInterval(timerInterval);
  clearIdentity();
  myId = null; myName = ''; myAvatar = '😎'; myScore = 0; roomCode = null;
  isOpen = false; myStatus = 'waiting'; globalBuzzerEnabled = true;
  document.getElementById('roomInput').value = newRoomCode || '';
  document.getElementById('nameInput').value = '';
  document.querySelectorAll('.avatar-opt').forEach((opt, idx) => { if(idx === 0) opt.classList.add('selected'); else opt.classList.remove('selected'); });
  myAvatar = '😎';
  document.getElementById('joinScreen').style.display = 'flex';
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('joinError').innerText = '';
  document.getElementById('reconnectBanner').classList.remove('visible');
  hideOptions(); hideCorrectPlayerOverlay();
  if(newRoomCode) showToast(`🔄 New game! Join with code: ${newRoomCode}`);
}

// ─── Channel Setup ────────────────────────────────────────────────────────────
function subscribeChannel() {
  if(ch) { try { sb.removeChannel(ch); } catch(e) {} ch = null; }
  stopHeartbeat();
  if(!roomCode) return;

  verifyRoomBeforeJoining(roomCode).then(async (isValid) => {
    if (!isValid) {
      updateConnectionBadge('error', '❌ Room not available');
      showToast('This room is no longer active.', 3000);
      setTimeout(() => resetToJoinScreen(), 2000);
      return;
    }

    ch = sb.channel(`fr-${roomCode}`);
    const events = ['round_started', 'question_open', 'buzz_confirmed', 'correct', 'wrong', 'next_question', 'reset_buzzers', 'reset_for_next_question', 'buzzers_reopen', 'buzzer_toggle', 'eliminated', 'round_ended', 'timer_start', 'state_sync', 'full_game_reset', 'player_list_update'];
    events.forEach(ev => { ch.on('broadcast', { event: ev }, ({ payload }) => handleEvent(ev, payload)); });

    let subscriptionTimeout = setTimeout(() => { if (ch && ch.state !== 'subscribed') { updateConnectionBadge('error', '⏰ Timeout'); showToast('Connection timeout.', 3000); resetToJoinScreen(); } }, 10000);

    ch.subscribe(async (status) => {
      clearTimeout(subscriptionTimeout);
      if(status === 'SUBSCRIBED') {
        cancelReconnect();
        updateConnectionBadge('connected', '● Connected');
        try {
          await ch.send({ type: 'broadcast', event: 'player_join', payload: { id: myId, name: myName, avatar: myAvatar, timestamp: Date.now() } });
          document.getElementById('joinScreen').style.display = 'none';
          document.getElementById('gameScreen').style.display = 'flex';
          document.getElementById('myAvatarDisplay').innerText = myAvatar;
          document.getElementById('myNameDisplay').innerText = myName;
          document.getElementById('myScoreDisplay').innerText = myScore;
          startHeartbeat();
          saveIdentity();
          updatePlayerCount(roomCode, true).catch(()=>{});
          showToast(`✅ Joined room: ${roomCode}`, 2000);
        } catch(err) { console.error('Join failed:', err); resetToJoinScreen(); }
      } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        stopHeartbeat();
        updateConnectionBadge('disconnected', '⚠ Disconnected');
        verifyRoomBeforeJoining(roomCode).then(isValid => isValid ? scheduleReconnect() : setTimeout(() => resetToJoinScreen(), 2000));
      }
    });
  }).catch(err => { console.error('Verification error:', err); resetToJoinScreen(); });
}

// ─── Join Game ────────────────────────────────────────────────────────────────
async function joinGame() {
  const room = document.getElementById('roomInput').value.trim().toUpperCase();
  const name = document.getElementById('nameInput').value.trim();
  const errorEl = document.getElementById('joinError');
  const joinBtn = document.getElementById('joinBtn');
  
  if (!room || room.length < 4 || room.length > 8 || !/^[A-Z0-9]{4,8}$/.test(room)) {
    errorEl.innerText = '❌ Enter a valid room code (4-8 characters, A-Z0-9)';
    return;
  }
  if (name.length < 2 || name.length > 20) {
    errorEl.innerText = '❌ Name must be 2-20 characters';
    return;
  }
  
  joinBtn.disabled = true;
  const originalText = joinBtn.innerText;
  joinBtn.innerText = '🔍 Verifying...';
  errorEl.innerText = '';
  
  try {
    const { data: roomData, error: roomError } = await sb.from('game_rooms').select('room_code, is_active, player_count').eq('room_code', room).maybeSingle();
    
    if (roomError || !roomData) {
      errorEl.innerText = '❌ Room not found. Please check the code.';
      joinBtn.disabled = false;
      joinBtn.innerText = originalText;
      return;
    }
    if (!roomData.is_active) {
      errorEl.innerText = '❌ This game has ended. Please wait for a new game.';
      joinBtn.disabled = false;
      joinBtn.innerText = originalText;
      return;
    }
    
    joinBtn.innerText = '📡 Connecting...';
    if (ch) { try { await sb.removeChannel(ch); } catch(e) {} ch = null; }
    
    myId = 'p_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    myName = name;
    myAvatar = document.querySelector('.avatar-opt.selected')?.innerText || '😎';
    roomCode = room;
    myScore = 0;
    isOpen = false;
    myStatus = 'waiting';
    globalBuzzerEnabled = true;
    
    saveIdentity();
    subscribeChannel();
    
    sb.from('game_rooms').update({ player_count: (roomData.player_count || 0) + 1 }).eq('room_code', room).catch(()=>{});
    
    setTimeout(() => { if (joinBtn && !joinBtn.disabled) { joinBtn.disabled = false; joinBtn.innerText = originalText; } }, 8000);
    
  } catch (error) {
    console.error('Join error:', error);
    errorEl.innerText = '❌ Connection failed. Please try again.';
    joinBtn.disabled = false;
    joinBtn.innerText = originalText;
  }
}

// ─── Event Handler ────────────────────────────────────────────────────────────
function handleEvent(event, payload) {
  switch(event) {
    case 'full_game_reset': clearIdentity(); resetToJoinScreen(payload?.newRoomCode || null); break;
    case 'round_started': if(myStatus !== 'eliminated') { myStatus='waiting'; isOpen=false; globalBuzzerEnabled=true; hideCorrectPlayerOverlay(); hideOptions(); document.getElementById('questionBox').innerText='Round started! Get ready...'; setStatus('Round started!', 'var(--green)'); updateBuzzerUI(); } break;
    case 'question_open': if(myStatus !== 'eliminated') { myStatus='waiting'; isOpen=true; globalBuzzerEnabled=true; hideCorrectPlayerOverlay(); document.getElementById('questionBox').innerText=payload.question||''; showOptions(payload.options||[]); setStatus('🔴 BUZZ NOW!', 'var(--green)'); updateBuzzerUI(); } break;
    case 'buzz_confirmed': isOpen=false; if(payload.playerId===myId) { myStatus='buzzed'; setStatus('🎤 Answer verbally!', 'var(--gold)'); } else { if(myStatus==='waiting') myStatus='locked'; setStatus(`⏸ ${payload.playerName} is answering...`, 'var(--muted)'); } updateBuzzerUI(); break;
    case 'correct': isOpen=false; if(payload.playerId===myId) { updateScore(payload.newScore); myStatus='correct'; setStatus(`✅ +${payload.points||100} pts!`, 'var(--gold)'); hideOptions(); } else { if(myStatus!=='eliminated') myStatus='waiting'; showCorrectPlayerOverlay(payload.playerName, payload.playerAvatar, payload.points||100); } updateBuzzerUI(); saveIdentity(); break;
    case 'wrong': if(payload.playerId===myId) { myStatus='wrong'; setStatus('❌ Wrong! Locked out', 'var(--red)'); isOpen=false; updateBuzzerUI(); } else { if(myStatus==='locked'||myStatus==='waiting') { setStatus('⏳ Stand by — steal chance incoming...', 'var(--amber)'); setTimeout(()=>{ if((myStatus==='locked'||myStatus==='waiting') && myStatus!=='eliminated' && myStatus!=='wrong' && myStatus!=='correct') { isOpen=true; myStatus='waiting'; globalBuzzerEnabled=true; setStatus('🔴 STEAL! BUZZ NOW!', 'var(--green)'); updateBuzzerUI(); } }, 5500); } } break;
    case 'buzzers_reopen': if(myStatus!=='eliminated' && myStatus!=='correct' && myStatus!=='wrong') { isOpen=true; myStatus='waiting'; globalBuzzerEnabled=true; setStatus('🔴 STEAL! BUZZ NOW!', 'var(--green)'); updateBuzzerUI(); } break;
    case 'reset_buzzers': if(myStatus!=='eliminated') { myStatus='waiting'; isOpen=true; globalBuzzerEnabled=true; setStatus('🔴 BUZZ NOW!', 'var(--green)'); updateBuzzerUI(); } break;
    case 'next_question': case 'reset_for_next_question': if(myStatus==='eliminated') { hideCorrectPlayerOverlay(); break; } myStatus='waiting'; isOpen=false; globalBuzzerEnabled=true; hideCorrectPlayerOverlay(); hideOptions(); document.getElementById('questionBox').innerText='Next question coming...'; setStatus('Waiting for next question...', 'var(--muted)'); updateBuzzerUI(); break;
    case 'buzzer_toggle': globalBuzzerEnabled=payload.enabled; if(!globalBuzzerEnabled) setStatus('🔕 Buzzers OFF', 'var(--muted)'); else if(isOpen && myStatus==='waiting') setStatus('🔴 BUZZ NOW!', 'var(--green)'); updateBuzzerUI(); break;
    case 'eliminated': if(payload.playerId===myId) { myStatus='eliminated'; isOpen=false; hideCorrectPlayerOverlay(); hideOptions(); document.getElementById('questionBox').innerText='⚡ You have been eliminated!'; setStatus('⚡ ELIMINATED', 'var(--red)'); updateBuzzerUI(); saveIdentity(); } break;
    case 'round_ended': isOpen=false; hideCorrectPlayerOverlay(); hideOptions(); const winner=payload.winner; if(winner && winner.id===myId) { document.getElementById('questionBox').innerHTML='🏆 YOU ARE THE CHAMPION!'; setStatus('🏆 CHAMPION!', 'var(--gold)'); launchConfetti(); } else { document.getElementById('questionBox').innerText=`🏆 Winner: ${winner?.name||'?'}`; setStatus(`Winner: ${winner?.name||'?'}`, 'var(--muted)'); } updateBuzzerUI(); break;
    case 'timer_start': startPlayerTimer(payload.seconds); break;
    case 'state_sync': if(payload.playerId===myId) { myStatus=payload.status||'waiting'; if(payload.score!==undefined) updateScore(payload.score); if(payload.isEliminated) { myStatus='eliminated'; document.getElementById('questionBox').innerText='⚡ You have been eliminated!'; hideOptions(); isOpen=false; } else if(payload.questionText) { document.getElementById('questionBox').innerText=payload.questionText; if(payload.questionOptions?.length) showOptions(payload.questionOptions); isOpen=payload.isQuestionOpen||false; } globalBuzzerEnabled=true; updateBuzzerUI(); updateConnectionBadge('connected', '● Reconnected ✓'); showToast('✅ Back in the game!', 2500); saveIdentity(); } break;
  }
}

// ─── Auto-rejoin ──────────────────────────────────────────────────────────────
(function autoRejoin() {
  const saved = loadIdentity();
  if(saved && saved.roomCode && saved.myId) {
    myId = saved.myId; myName = saved.myName; myAvatar = saved.myAvatar; myScore = saved.myScore || 0; myStatus = saved.myStatus || 'waiting'; roomCode = saved.roomCode;
    document.getElementById('roomInput').value = roomCode;
    document.getElementById('nameInput').value = myName;
    document.querySelectorAll('.avatar-opt').forEach(opt => opt.classList.toggle('selected', opt.innerText === myAvatar));
    updateConnectionBadge('reconnecting', '⟳ Reconnecting...');
    subscribeChannel();
  }
})();

style.textContent = `@keyframes confettiFall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }`;
document.head.appendChild(style);

window.joinGame = joinGame;
window.pickAvatar = pickAvatar;
window.buzz = buzz;
