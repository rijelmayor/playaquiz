<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PlayAQuiz — Final Round</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #03050b; --surface: #0d1120; --border: #1f2a3c;
      --gold: #fbbf24; --green: #10b981; --red: #ef4444;
      --accent: #3b82f6; --purple: #a855f7; --text: #fff; --muted: rgba(255,255,255,0.45);
    }
    html, body { height: 100%; background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--text); overflow: hidden; }

    /* ─── JOIN SCREEN ─── */
    #joinScreen {
      height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 5px; background: linear-gradient(135deg, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 4px; }
    .logo-sub { font-size: 10px; color: var(--gold); letter-spacing: 2.5px; text-align: center; margin-bottom: 20px; }
    .join-card { background: rgba(13,17,32,0.96); border: 1px solid var(--border); border-radius: 28px; padding: 26px 22px; width: 100%; max-width: 420px; backdrop-filter: blur(20px); }
    .join-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; text-align: center; margin-bottom: 18px; letter-spacing: 1px; }
    .field { margin-bottom: 14px; }
    .field label { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; display: block; margin-bottom: 5px; }
    .field input { background: rgba(255,255,255,0.04); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px; color: var(--text); font-size: 16px; width: 100%; outline: none; text-align: center; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
    .field input:focus { border-color: var(--gold); }
    .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 6px; }
    .avatar-opt { font-size: 26px; text-align: center; padding: 5px 2px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; background: rgba(255,255,255,0.03); transition: 0.1s; }
    .avatar-opt.selected { border-color: var(--gold); background: rgba(251,191,36,0.1); }
    .join-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--gold), #f97316); border: none; border-radius: 14px; font-size: 17px; font-weight: 800; color: #111; cursor: pointer; margin-top: 16px; transition: 0.15s; font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.5px; }
    .join-btn:active { transform: scale(0.97); }
    .join-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg { color: var(--red); font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; }

    /* ─── GAME SCREEN ─── */
    #gameScreen {
      display: none; height: 100vh;
      flex-direction: column; align-items: center;
      padding: 16px 16px env(safe-area-inset-bottom, 16px);
    }

    /* TOP */
    .game-top { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .my-info { display: flex; align-items: center; gap: 8px; }
    .my-avatar-big { font-size: 28px; }
    .my-name-text { font-weight: 700; font-size: 14px; }
    .my-score { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); }
    .score-label { font-size: 10px; color: var(--muted); text-align: right; line-height: 1; }
    .room-tag { font-family: monospace; font-size: 11px; color: var(--muted); background: rgba(255,255,255,0.04); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }

    /* QUESTION BOX */
    .question-box {
      width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; padding: 16px; text-align: center; font-size: 15px; font-weight: 600;
      line-height: 1.5; flex-shrink: 0; max-height: 130px; overflow-y: auto;
    }

    /* BUZZER */
    .buzzer-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; gap: 12px; }
    .buzzer-ring-container { position: relative; display: flex; align-items: center; justify-content: center; }
    .ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 3px solid rgba(239,68,68,0.35); animation: ringPulse 1.4s ease-out infinite; pointer-events: none; }
    @keyframes ringPulse { 0%{ transform:scale(1); opacity:0.8; } 100%{ transform:scale(1.28); opacity:0; } }
    .buzzer-btn {
      width: min(62vw, 260px); height: min(62vw, 260px); border-radius: 50%; border: none; cursor: pointer;
      background: radial-gradient(circle at 35% 30%, #ff7043, #ef4444 55%, #b91c1c);
      box-shadow: 0 10px 0 #7f1d1d, 0 0 0 10px rgba(239,68,68,0.12);
      font-family: 'Bebas Neue', sans-serif; font-size: clamp(26px,8vw,46px); letter-spacing: 4px;
      color: #fff; transition: all 0.08s; user-select: none;
    }
    .buzzer-btn:active { transform: translateY(8px); box-shadow: 0 2px 0 #7f1d1d, 0 0 0 10px rgba(239,68,68,0.12); }
    .buzzer-btn:disabled {
      opacity: 0.45; transform: none; cursor: not-allowed;
      background: radial-gradient(circle at 35% 30%, #4b5563, #374151 55%, #1f2937);
      box-shadow: 0 10px 0 #111827;
    }

    /* STATUS */
    .status-pill { font-size: 13px; font-weight: 700; text-align: center; padding: 9px 22px; border-radius: 40px; border: 1.5px solid transparent; }
    .s-waiting { background: rgba(107,122,153,0.1); color: var(--muted); border-color: rgba(107,122,153,0.2); }
    .s-open { background: rgba(16,185,129,0.1); color: var(--green); border-color: rgba(16,185,129,0.3); animation: statusPulse 1s infinite; }
    .s-buzzed { background: rgba(251,191,36,0.12); color: var(--gold); border-color: rgba(251,191,36,0.35); animation: statusPulse 0.6s infinite; }
    .s-locked { background: rgba(107,122,153,0.08); color: var(--muted); border-color: rgba(107,122,153,0.15); }
    .s-correct { background: rgba(16,185,129,0.12); color: var(--green); border-color: rgba(16,185,129,0.3); }
    .s-wrong { background: rgba(239,68,68,0.1); color: var(--red); border-color: rgba(239,68,68,0.25); }
    .s-eliminated { background: rgba(239,68,68,0.08); color: var(--red); border-color: rgba(239,68,68,0.2); }
    .s-winner { background: rgba(251,191,36,0.15); color: var(--gold); border-color: rgba(251,191,36,0.4); }
    @keyframes statusPulse { 0%,100%{ opacity:1; } 50%{ opacity:0.6; } }

    /* CATEGORY SCREEN (player view) */
    .cat-overlay {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(3,5,11,0.96); backdrop-filter: blur(20px);
      flex-direction: column; align-items: center; justify-content: center; padding: 24px;
      animation: fadeIn 0.4s ease;
    }
    .cat-overlay.visible { display: flex; }
    @keyframes fadeIn { from{ opacity:0; } to{ opacity:1; } }
    .cat-overlay-title { font-family: 'Bebas Neue', sans-serif; font-size: 40px; color: var(--purple); letter-spacing: 3px; margin-bottom: 6px; }
    .cat-overlay-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
    .cat-overlay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 380px; }
    .cat-pill { background: rgba(139,92,246,0.1); border: 2px solid rgba(139,92,246,0.2); border-radius: 16px; padding: 16px 8px; text-align: center; }
    .cat-pill-icon { font-size: 32px; }
    .cat-pill-name { font-size: 11px; font-weight: 700; margin-top: 5px; }

    /* CONFETTI */
    @keyframes confettiFall { 0%{ opacity:1; transform:translateY(0) rotate(0); } 100%{ opacity:0; transform:translateY(100vh) rotate(720deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- JOIN SCREEN -->
<div id="joinScreen">
  <div class="logo">PLAYAQUIZ</div>
  <div class="logo-sub">⚡ FINAL ROUND</div>
  <div class="join-card">
    <div class="join-title">JOIN THE ARENA</div>
    <div class="field">
      <label>Room Code</label>
      <input id="roomInput" placeholder="e.g. FR4X7K" maxlength="10" style="text-transform:uppercase;letter-spacing:3px;font-size:22px">
    </div>
    <div class="field">
      <label>Your Name</label>
      <input id="nameInput" placeholder="Enter your name" maxlength="20">
    </div>
    <div class="field">
      <label>Avatar</label>
      <div class="avatar-grid" id="avatarGrid"></div>
    </div>
    <button class="join-btn" id="joinBtn" onclick="joinGame()">⚡ ENTER FINAL ROUND</button>
    <div id="joinError" class="error-msg"></div>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
  <div class="game-top">
    <div class="my-info">
      <div class="my-avatar-big" id="myAvatarDisplay">🎮</div>
      <div>
        <div class="my-name-text" id="myNameDisplay">—</div>
        <div class="room-tag" id="roomTag">——</div>
      </div>
    </div>
    <div style="text-align:right">
      <div class="my-score"><span id="myScoreDisplay">0</span></div>
      <div class="score-label">POINTS</div>
    </div>
  </div>

  <div class="question-box" id="questionBox">Waiting for the host to start...</div>

  <div class="buzzer-wrap">
    <div class="buzzer-ring-container">
      <div class="ring" id="buzzerRing" style="display:none"></div>
      <button class="buzzer-btn" id="buzzerBtn" onclick="buzz()" disabled>BUZZ!</button>
    </div>
    <div class="status-pill s-waiting" id="statusPill">Waiting for round to start...</div>
  </div>
</div>

<!-- CATEGORY OVERLAY (player view while picking) -->
<div class="cat-overlay" id="catOverlay">
  <div class="cat-overlay-title">🎨 CATEGORY TIME</div>
  <div class="cat-overlay-sub" id="catOverlaySub">The winner is choosing...</div>
  <div class="cat-overlay-grid" id="catOverlayGrid"></div>
</div>

<script>
const SUPABASE_URL = 'https://efgirqbaayfjwswnwbop.supabase.co';
const SUPABASE_ANON = 'sb_publishable_UUGSZcCX0KVuT6h69OMoHQ_14UjDZ-e';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const AVATARS = ['😎','🦁','🐯','🐱','🐶','🐺','🦊','🐸','🐧','🐙','🦄','🐲','🚀','⭐','🔥','⚡','🎮','🏆','💎','🌈','🍕','🎸','👾','🤖'];
let myId = null, myName = '', myAvatar = '😎', myScore = 0;
let roomCode = null, ch = null;
let isOpen = false, myStatus = 'waiting';

// Render avatars
const agrid = document.getElementById('avatarGrid');
agrid.innerHTML = AVATARS.map((a,i) => `<div class="avatar-opt ${i===0?'selected':''}" onclick="pickAvatar(this,'${a}')">${a}</div>`).join('');
myAvatar = AVATARS[0];
function pickAvatar(el, a) {
  document.querySelectorAll('.avatar-opt').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected'); myAvatar = a;
}

// Audio
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playBuzzSound() {
  try {
    const ctx = getAudio(), osc = ctx.createOscillator(), g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'square'; osc.frequency.value = 880;
    g.gain.setValueAtTime(0.4, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
    osc.start(); osc.stop(ctx.currentTime + 0.12);
  } catch(e) {}
}
function playCorrectSound() {
  try {
    const ctx = getAudio();
    [523,659,784,1047].forEach((f,i)=>{
      const now = ctx.currentTime + i*0.09;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type='sine'; osc.frequency.value=f;
      g.gain.setValueAtTime(0.45,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.18);
      osc.start(now); osc.stop(now+0.18);
    });
  } catch(e) {}
}
function playWrongSound() {
  try {
    const ctx = getAudio(), osc = ctx.createOscillator(), g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'sawtooth'; osc.frequency.value = 180;
    g.gain.setValueAtTime(0.45, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
    osc.start(); osc.stop(ctx.currentTime + 0.45);
  } catch(e) {}
}
function playEliminateSound() {
  try {
    const ctx = getAudio(), osc = ctx.createOscillator(), g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'sawtooth'; osc.frequency.value = 140;
    g.gain.setValueAtTime(0.4, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
    osc.start(); osc.stop(ctx.currentTime + 0.7);
  } catch(e) {}
}

function setStatus(text, cls = 's-waiting') {
  const el = document.getElementById('statusPill');
  el.innerText = text;
  el.className = `status-pill ${cls}`;
}

function updateBuzzer() {
  const btn = document.getElementById('buzzerBtn');
  const ring = document.getElementById('buzzerRing');
  if (myStatus === 'eliminated') {
    btn.disabled = true; btn.innerText = 'OUT';
    ring.style.display = 'none';
    setStatus('⚡ You have been eliminated', 's-eliminated');
  } else if (myStatus === 'buzzed') {
    btn.disabled = true; btn.innerText = 'BUZZED!';
    ring.style.display = 'none';
    setStatus('🔔 You buzzed in! Answer verbally!', 's-buzzed');
  } else if (myStatus === 'locked' || myStatus === 'wrong') {
    btn.disabled = true; btn.innerText = 'LOCKED';
    ring.style.display = 'none';
    setStatus('🔒 Locked out this question', 's-locked');
  } else if (myStatus === 'correct') {
    btn.disabled = true; btn.innerText = '✅';
    ring.style.display = 'none';
    setStatus('✅ Correct! Well done!', 's-correct');
  } else if (isOpen && myStatus === 'waiting') {
    btn.disabled = false; btn.innerText = 'BUZZ!';
    ring.style.display = 'block';
    setStatus('🔴 BUZZ NOW!', 's-open');
  } else {
    btn.disabled = true; btn.innerText = 'WAIT';
    ring.style.display = 'none';
    setStatus('⏳ Waiting for question...', 's-waiting');
  }
}

function buzz() {
  if (!isOpen || myStatus !== 'waiting') return;
  if (navigator.vibrate) navigator.vibrate([80]);
  playBuzzSound();
  myStatus = 'buzzed';
  updateBuzzer();
  ch.send({ type: 'broadcast', event: 'buzz', payload: { id: myId, name: myName, avatar: myAvatar } });
}

function launchConfetti() {
  const colors = ['#fbbf24','#ef4444','#10b981','#3b82f6','#a855f7'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    const size = 5 + Math.random() * 8;
    c.style.cssText = `position:fixed;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${Math.random()*100}vw;top:-10px;border-radius:2px;z-index:9999;pointer-events:none;animation:confettiFall ${2+Math.random()*2.5}s linear ${Math.random()*0.3}s forwards;`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5000);
  }
}

function handleEvent(event, payload) {
  console.log('Player received:', event, payload);

  switch (event) {
    case 'round_started':
      document.getElementById('questionBox').innerText = 'Round is starting! Get ready!';
      setStatus('🎮 Round starting!', 's-open');
      break;

    case 'question_open':
      isOpen = true; myStatus = 'waiting';
      document.getElementById('questionBox').innerText = payload.question;
      document.getElementById('catOverlay').classList.remove('visible');
      updateBuzzer();
      break;

    case 'buzz_confirmed':
      isOpen = false;
      if (payload.playerId === myId) {
        myStatus = 'buzzed';
        setStatus('🔔 You buzzed in! Answer out loud!', 's-buzzed');
      } else {
        if (myStatus === 'waiting') myStatus = 'locked';
        setStatus(`🔔 ${payload.playerName} buzzed first!`, 's-locked');
      }
      updateBuzzer();
      break;

    case 'correct':
      if (payload.playerId === myId) {
        myScore = payload.newScore || myScore + 100;
        document.getElementById('myScoreDisplay').innerText = myScore;
        myStatus = 'correct';
        setStatus(`✅ CORRECT! +${payload.points||100} pts!`, 's-correct');
        playCorrectSound();
        launchConfetti();
      } else {
        if (myStatus !== 'eliminated') myStatus = 'waiting';
      }
      updateBuzzer();
      break;

    case 'wrong':
      if (payload.playerId === myId) {
        myStatus = 'wrong';
        setStatus('❌ Wrong answer! Locked out.', 's-wrong');
        playWrongSound();
      } else {
        if (myStatus === 'locked') {
          myStatus = 'waiting';
          isOpen = true;
          setStatus('🔴 Buzzers OPEN again! Hit it!', 's-open');
        }
      }
      updateBuzzer();
      break;

    case 'next_question':
      isOpen = false; myStatus = 'waiting';
      document.getElementById('questionBox').innerText = 'Waiting for next question...';
      document.getElementById('catOverlay').classList.remove('visible');
      updateBuzzer();
      break;

    case 'reset_buzzers':
      if (myStatus !== 'eliminated') {
        myStatus = 'waiting'; isOpen = true;
      }
      updateBuzzer();
      break;

    case 'eliminated':
      if (payload.playerId === myId) {
        myStatus = 'eliminated';
        isOpen = false;
        playEliminateSound();
        document.getElementById('questionBox').innerText = '⚡ You have been eliminated. Better luck next time!';
      }
      updateBuzzer();
      break;

    case 'show_category_picker': {
      const cats = payload.categories || [];
      document.getElementById('catOverlayGrid').innerHTML = cats.map(c => `
        <div class="cat-pill">
          <div class="cat-pill-icon">${c.icon||'📁'}</div>
          <div class="cat-pill-name">${c.name}</div>
        </div>`).join('');
      document.getElementById('catOverlay').classList.add('visible');
      // Auto-hide after 8 seconds
      setTimeout(() => document.getElementById('catOverlay').classList.remove('visible'), 8000);
      break;
    }

    case 'round_ended': {
      isOpen = false;
      const winner = payload.winner;
      const iWin = winner && winner.id === myId;
      document.getElementById('questionBox').innerHTML = iWin
        ? '🏆 YOU ARE THE CHAMPION! 🎉'
        : `🏁 FINAL ROUND ENDED<br>Winner: ${winner?.avatar||'🏆'} ${winner?.name||'—'}`;
      if (iWin) {
        setStatus('🏆 YOU ARE THE CHAMPION! 🏆', 's-winner');
        launchConfetti();
        playCorrectSound();
      } else {
        setStatus(`Game Over! Winner: ${winner?.name||'—'}`, 's-waiting');
      }
      updateBuzzer();
      break;
    }
  }
}

async function joinGame() {
  const room = document.getElementById('roomInput').value.trim().toUpperCase();
  const name = document.getElementById('nameInput').value.trim();
  const btn = document.getElementById('joinBtn');

  if (!room) { showErr('Enter the room code'); return; }
  if (name.length < 2) { showErr('Name must be at least 2 characters'); return; }

  btn.disabled = true; btn.innerText = 'Connecting...';
  myId = 'p_' + Date.now() + '_' + Math.random().toString(36).substring(2,6);
  myName = name; roomCode = room;

  ch = sb.channel(`fr-${roomCode}`, { config: { broadcast: { self: false } } });
  ch
    .on('broadcast', { event: 'round_started' }, ({ payload }) => handleEvent('round_started', payload))
    .on('broadcast', { event: 'player_list_update' }, ({ payload }) => handleEvent('player_list_update', payload))
    .on('broadcast', { event: 'question_open' }, ({ payload }) => handleEvent('question_open', payload))
    .on('broadcast', { event: 'buzz_confirmed' }, ({ payload }) => handleEvent('buzz_confirmed', payload))
    .on('broadcast', { event: 'correct' }, ({ payload }) => handleEvent('correct', payload))
    .on('broadcast', { event: 'wrong' }, ({ payload }) => handleEvent('wrong', payload))
    .on('broadcast', { event: 'next_question' }, ({ payload }) => handleEvent('next_question', payload))
    .on('broadcast', { event: 'reset_buzzers' }, ({ payload }) => handleEvent('reset_buzzers', payload))
    .on('broadcast', { event: 'eliminated' }, ({ payload }) => handleEvent('eliminated', payload))
    .on('broadcast', { event: 'show_category_picker' }, ({ payload }) => handleEvent('show_category_picker', payload))
    .on('broadcast', { event: 'round_ended' }, ({ payload }) => handleEvent('round_ended', payload))
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        // Announce join
        ch.send({ type: 'broadcast', event: 'player_join', payload: { id: myId, name: myName, avatar: myAvatar } });
        // Transition
        document.getElementById('joinScreen').style.display = 'none';
        const gs = document.getElementById('gameScreen');
        gs.style.display = 'flex';
        document.getElementById('myAvatarDisplay').innerText = myAvatar;
        document.getElementById('myNameDisplay').innerText = myName;
        document.getElementById('roomTag').innerText = roomCode;
        setStatus('Joined! Waiting for host...', 's-waiting');
        updateBuzzer();
      } else if (status === 'CHANNEL_ERROR') {
        btn.disabled = false; btn.innerText = '⚡ ENTER FINAL ROUND';
        showErr('Connection failed. Check your room code.');
      }
    });
}

function showErr(msg) {
  const el = document.getElementById('joinError');
  el.innerText = msg;
  setTimeout(() => el.innerText = '', 3500);
  document.getElementById('joinBtn').disabled = false;
  document.getElementById('joinBtn').innerText = '⚡ ENTER FINAL ROUND';
}

// Confetti keyframe
const style = document.createElement('style');
style.textContent = `@keyframes confettiFall { 0%{ opacity:1; transform:translateY(0) rotate(0deg); } 100%{ opacity:0; transform:translateY(100vh) rotate(720deg); } }`;
