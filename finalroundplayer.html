<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PlayAQuiz — Final Round</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #070510;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.09);
      --border2: rgba(255,255,255,0.15);
      --gold: #f5c842;
      --amber: #f97316;
      --green: #22d3a0;
      --red: #f43f5e;
      --violet: #a78bfa;
      --text: #f0eeff;
      --muted: rgba(240,238,255,0.4);
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 0%, rgba(245,200,66,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* === JOIN SCREEN === */
    #joinScreen {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      gap: 20px;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #fff 20%, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .join-card {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 28px;
      padding: 28px 22px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(12px);
    }

    .field { margin-bottom: 16px; }
    .field label {
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      display: block;
      margin-bottom: 6px;
    }
    .field input {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border2);
      border-radius: 14px;
      padding: 13px 16px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      width: 100%;
      outline: none;
      text-align: center;
      transition: 0.2s;
    }
    .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,200,66,0.1); }
    .field input::placeholder { color: var(--muted); }

    /* AVATAR GRID */
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
      margin-top: 6px;
    }
    .avatar-opt {
      font-size: 24px;
      text-align: center;
      padding: 6px 4px;
      border-radius: 12px;
      border: 2px solid transparent;
      cursor: pointer;
      background: rgba(255,255,255,0.04);
      transition: all 0.15s;
    }
    .avatar-opt:active { transform: scale(0.9); }
    .avatar-opt.selected {
      border-color: var(--gold);
      background: rgba(245,200,66,0.1);
    }

    .join-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--gold), var(--amber));
      border: none;
      border-radius: 16px;
      font-family: 'Syne', sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #111;
      cursor: pointer;
      margin-top: 18px;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .error-msg { color: var(--red); font-size: 12px; text-align: center; margin-top: 10px; font-weight: 500; }

    /* === GAME SCREEN === */
    #gameScreen {
      display: none;
      position: relative;
      z-index: 2;
      height: 100vh;
      flex-direction: column;
      padding: 0;
    }

    /* PLAYER HEADER */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,5,16,0.7);
      backdrop-filter: blur(16px);
      flex-shrink: 0;
    }
    .player-identity { display: flex; align-items: center; gap: 10px; }
    .player-identity-avatar { font-size: 28px; }
    .player-identity-name { font-weight: 700; font-size: 15px; }

    .score-block { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
    .score-value {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
    }
    .score-label { font-size: 8px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

    /* FIX: Player Connection Monitor Style Badge */
    .player-conn-badge {
      font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
      margin-top: 3px; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .player-conn-badge.connected { background: rgba(34,211,160,0.12); color: var(--green); }
    .player-conn-badge.reconnecting { background: rgba(249,115,22,0.12); color: var(--amber); animation: pulseText 1.5s infinite; }
    .player-conn-badge.disconnected { background: rgba(244,63,94,0.12); color: var(--red); }
    @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* QUESTION BOX */
    .question-area {
      margin: 14px 16px 0;
      background: rgba(255,255,255,0.03);
      border: 1.5px solid var(--border2);
      border-radius: 18px;
      padding: 16px 18px;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* BUZZER AREA */
    .buzzer-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 16px;
    }

    .buzzer-btn-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .buzzer-glow {
      position: absolute;
      border-radius: 50%;
      background: transparent;
      border: 2px solid rgba(244,63,94,0.15);
      animation: glowRing 2s ease-in-out infinite;
    }
    .buzzer-glow:nth-child(1) { width: calc(min(62vw,260px) + 30px); height: calc(min(62vw,260px) + 30px); animation-delay: 0s; }
    .buzzer-glow:nth-child(2) { width: calc(min(62vw,260px) + 60px); height: calc(min(62vw,260px) + 60px); animation-delay: 0.4s; }
    .buzzer-glow:nth-child(3) { width: calc(min(62vw,260px) + 90px); height: calc(min(62vw,260px) + 90px); animation-delay: 0.8s; }

    @keyframes glowRing { 0%,100%{ opacity: 0.4; transform: scale(1); } 50%{ opacity: 0.1; transform: scale(1.03); } }

    .buzzer-btn {
      position: relative;
      width: min(62vw, 260px);
      height: min(62vw, 260px);
      border-radius: 50%;
      border: 6px solid #140d21;
      background: linear-gradient(145deg, #ef4444, #b91c1c);
      box-shadow: 
        0 12px 0 #7f1d1d,
        0 20px 40px rgba(0,0,0,0.6),
        inset 0 4px 12px rgba(255,255,255,0.3);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .buzzer-btn:active:not(:disabled) {
      transform: translateY(8px);
      box-shadow: 
        0 4px 0 #7f1d1d,
        0 8px 20px rgba(0,0,0,0.6),
        inset 0 2px 6px rgba(0,0,0,0.4);
    }

    /* BUZZER BUTTON STATES MAP */
    .buzzer-btn:disabled {
      background: #1e1b29;
      box-shadow: 0 4px 0 #111, inset 0 4px 10px rgba(0,0,0,0.5);
      border-color: #1a1625;
      cursor: not-allowed;
    }
    
    .buzzer-btn.ready-state {
      background: linear-gradient(145deg, #10b981, #047857) !important;
      box-shadow: 
        0 12px 0 #064e3b,
        0 20px 40px rgba(4,120,87,0.3),
        inset 0 4px 12px rgba(255,255,255,0.4) !important;
      border-color: #061f14 !important;
    }
    .buzzer-btn.ready-state:active {
      transform: translateY(8px);
      box-shadow: 0 4px 0 #064e3b, inset 0 2px 6px rgba(0,0,0,0.4) !important;
    }

    .buzzer-btn.locked-state {
      background: linear-gradient(145deg, #374151, #1f2937) !important;
      box-shadow: 0 6px 0 #111827, inset 0 4px 10px rgba(0,0,0,0.5) !important;
      border-color: #111827;
    }

    .buzzer-icon { font-size: clamp(36px, 10vw, 54px); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    .buzzer-label { font-family: 'Syne', sans-serif; font-size: clamp(14px, 4vw, 20px); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }

    .status-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      background: rgba(255,255,255,0.02);
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div id="joinScreen">
    <div class="logo">PLAYAQUIZ</div>
    <div class="join-card">
      <div class="field">
        <label>Room Target Code</label>
        <input type="text" id="roomInput" placeholder="ENTER 4-LETTER CODE" maxlength="8" style="text-transform: uppercase;">
      </div>
      <div class="field">
        <label>Your Handle / Name</label>
        <input type="text" id="nameInput" placeholder="YOUR NAME" maxlength="14">
      </div>
      <div class="field">
        <label>Select Avatar Icon</label>
        <div class="avatar-grid" id="avatarGridContainer">
          </div>
      </div>
      <button class="join-btn" onclick="joinGame()">Enter Grand Arena</button>
      <div id="joinError" class="error-msg"></div>
    </div>
  </div>

  <div id="gameScreen">
    <div class="game-header">
      <div class="player-identity">
        <div class="player-identity-avatar" id="myAvatarDisplay">🦊</div>
        <div>
          <div class="player-identity-name" id="myNameDisplay">Finalist Name</div>
        </div>
      </div>
      <div class="score-block">
        <div class="score-value" id="myScoreDisplay">00</div>
        <div class="score-label">Points</div>
        <div class="player-conn-badge connected" id="playerConnBadge">● Connected</div>
      </div>
    </div>

    <div class="question-area">
      <p id="playerQuestionText">Waiting for next question from host...</p>
    </div>

    <div class="buzzer-wrap">
      <div class="buzzer-btn-wrap">
        <div class="buzzer-glow" id="glow1"></div>
        <div class="buzzer-glow" id="glow2"></div>
        <div class="buzzer-glow" id="glow3"></div>

        <button class="buzzer-btn" id="buzzerActionBtn" onclick="triggerBuzzerPress()" disabled>
          <span class="buzzer-icon" id="buzzerIcon">🔒</span>
          <span class="buzzer-label" id="buzzerLabel">Locked</span>
        </button>
      </div>

      <div class="status-text" id="playerStatusText">STANDBY STATE</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1') ? 'http://localhost:54321' : '';
    const SUPABASE_KEY = '';

    let sb = null;
    if(SUPABASE_URL && SUPABASE_KEY) {
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } else {
      sb = supabase.createClient(window.location.origin, '');
    }

    let myId = '';
    let myName = '';
    let myAvatar = '🦊';
    let roomCode = '';
    let myScore = 0;
    let ch = null;

    let myStatus = 'waiting'; 
    let isOpen = false;
    let globalBuzzerEnabled = true;
    let autoReconnectInterval = null;

    const avatarsList = ['🦊','🦁','🐯','🦝','🐼','🐨','🤖','👽','👾','👻','👑','⭐'];

    function buildAvatarsGrid(){
      const container = document.getElementById('avatarGridContainer');
      container.innerHTML = '';
      avatarsList.forEach((av, idx) => {
        const div = document.createElement('div');
        div.className = `avatar-opt ${idx === 0 ? 'selected' : ''}`;
        div.innerText = av;
        div.onclick = () => {
          document.querySelectorAll('.avatar-opt').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
          myAvatar = av;
        };
        container.appendChild(div);
      });
    }

    function saveIdentity(){
      localStorage.setItem('fr_id', myId);
      localStorage.setItem('fr_name', myName);
      localStorage.setItem('fr_avatar', myAvatar);
      localStorage.setItem('fr_room', roomCode);
    }

    function loadIdentity(){
      if(localStorage.getItem('fr_id')) {
        myId = localStorage.getItem('fr_id');
        myName = localStorage.getItem('fr_name');
        myAvatar = localStorage.getItem('fr_avatar');
        roomCode = localStorage.getItem('fr_room');
        return { myId, myName, myAvatar, roomCode };
      }
      return null;
    }

    // FIX IMPLEMENTED: High performance automated connection status monitors.
    function updateConnectionBadge(state) {
      const badge = document.getElementById('playerConnBadge');
      if(!badge) return;
      badge.className = `player-conn-badge ${state}`;
      if(state === 'connected') badge.innerText = '● Connected';
      if(state === 'reconnecting') badge.innerText = '● Reconnecting';
      if(state === 'disconnected') badge.innerText = '● Disconnected';
    }

    function subscribeChannel(){
      if(ch) {
         try { sb.removeChannel(ch); } catch(e){}
      }

      updateConnectionBadge('reconnecting');
      ch = sb.channel(`fr-${roomCode}`, {
        config: { presence: { key: myId } }
      });

      ch.on('broadcast', { event: 'player_list_update' }, ({ payload }) => {
        const me = payload.players.find(p => p.id === myId);
        if(me) {
          myScore = me.score;
          document.getElementById('myScoreDisplay').innerText = String(myScore).padStart(2, '0');
          if(me.eliminated) {
            myStatus = 'eliminated';
            setStatus('ELIMINATED FROM ARENA','var(--red)');
            updateBuzzer();
          }
        }
      });

      const eventsMap = {
        'question_open': () => { isOpen = false; myStatus = 'waiting'; setStatus('Question Incoming...','var(--gold)'); updateBuzzer(); },
        'buzzers_reopen': () => { isOpen = true; if(myStatus !== 'locked' && myStatus !== 'eliminated') myStatus = 'open'; setStatus('PRESS NOW!','var(--green)'); updateBuzzer(); },
        'buzz_confirmed': ({ payload }) => { isOpen = false; if(payload.id === myId) { myStatus = 'buzzed'; setStatus('YOUR BUZZ LOCKED IN','var(--gold)'); } else { setStatus(`${payload.name} Buzz Lock`,'var(--muted)'); } updateBuzzer(); },
        'correct': ({ payload }) => { isOpen = false; if(payload.id === myId) myStatus = 'waiting'; setStatus('Correct Answer Registered','var(--green)'); updateBuzzer(); },
        'wrong': ({ payload }) => { isOpen = false; if(payload.id === myId) { myStatus = 'locked'; setStatus('LOCKED OUT ON QUESTION','var(--red)'); } updateBuzzer(); },
        'reset_buzzers': () => { isOpen = false; if(myStatus !== 'locked' && myStatus !== 'eliminated') myStatus = 'waiting'; setStatus('Buzzers Reset By Host','var(--muted)'); updateBuzzer(); },
        'next_question': () => { isOpen = false; if(myStatus !== 'eliminated') myStatus = 'waiting'; document.getElementById('playerQuestionText').innerText = 'Waiting for next question from host...'; setStatus('STANDBY STATE','var(--muted)'); updateBuzzer(); },
        'eliminated': ({ payload }) => { if(payload.id === myId) { myStatus = 'eliminated'; setStatus('ELIMINATED','var(--red)'); updateBuzzer(); } },
        'round_ended': () => { isOpen = false; setStatus('MATCH COMPLETED','var(--gold)'); updateBuzzer(); }
      };

      Object.entries(eventsMap).forEach(([ev, handler]) => {
        ch.on('broadcast', { event: ev }, (resp) => handler(resp));
      });

      ch.subscribe(async (status) => {
        if(status === 'SUBSCRIBED') {
          updateConnectionBadge('connected');
          // Clear recovery loop interval upon healthy connection track receipt
          if(autoReconnectInterval) { clearInterval(autoReconnectInterval); autoReconnectInterval = null; }
          
          await ch.track({
            id: myId, name: myName, avatar: myAvatar, score: myScore, joinedAt: Date.now()
          });
          
          document.getElementById('joinScreen').style.display = 'none';
          document.getElementById('gameScreen').style.display = 'flex';
          document.getElementById('myAvatarDisplay').innerText = myAvatar;
          document.getElementById('myNameDisplay').innerText = myName;
          document.getElementById('myScoreDisplay').innerText = String(myScore).padStart(2, '0');
        } else if (status === 'CHANNEL_ERROR' || status === 'CLOSED') {
          updateConnectionBadge('disconnected');
          startAutoRecoveryLoop();
        }
      });
    }

    // FIX IMPLEMENTED: Accelerated auto recovery interval loops
    function startAutoRecoveryLoop() {
      if(autoReconnectInterval) return;
      autoReconnectInterval = setInterval(() => {
        subscribeChannel();
      }, 2500); // Poll channel setup aggressively every 2.5 seconds until live channel presence sync is secure
    }

    function setStatus(text, color){
      const el = document.getElementById('playerStatusText');
      el.innerText = text;
      el.style.borderColor = color || 'var(--border)';
      el.style.color = color || 'var(--text)';
    }

    function updateBuzzer(){
      const btn = document.getElementById('buzzerActionBtn');
      const icon = document.getElementById('buzzerIcon');
      const label = document.getElementById('buzzerLabel');
      
      const g1 = document.getElementById('glow1');
      const g2 = document.getElementById('glow2');
      const g3 = document.getElementById('glow3');

      btn.className = 'buzzer-btn';
      g1.style.display = 'none'; g2.style.display = 'none'; g3.style.display = 'none';

      if(myStatus === 'eliminated') {
        btn.disabled = true; icon.innerText = '💀'; label.innerText = 'Out';
        return;
      }
      if(myStatus === 'locked') {
        btn.disabled = true; btn.classList.add('locked-state'); icon.innerText = '🔒'; label.innerText = 'Locked';
        return;
      }
      if(myStatus === 'buzzed') {
        btn.disabled = true; icon.innerText = '⚡'; label.innerText = 'Buzzed';
        return;
      }

      if(isOpen && myStatus === 'open') {
        btn.disabled = false;
        btn.classList.add('ready-state');
        icon.innerText = '🛎️'; label.innerText = 'BUZZ!';
        g1.style.display = 'block'; g2.style.display = 'block'; g3.style.display = 'block';
      } else {
        btn.disabled = true;
        icon.innerText = '🔴'; label.innerText = 'Wait';
      }
    }

    function triggerBuzzerPress(){
      if(!isOpen || myStatus !== 'open') return;
      // Optimistic instant button lockdown state representation
      myStatus = 'buzzed';
      updateBuzzer();
      
      if(ch) {
        ch.send({
          type: 'broadcast',
          event: 'player_buzz',
          payload: { id: myId, name: myName }
        });
      }
    }

    async function joinGame(){
      const room = document.getElementById('roomInput').value.trim().toUpperCase();
      const name = document.getElementById('nameInput').value.trim();
      if(!room || name.length < 2) { 
        document.getElementById('joinError').innerText = 'Enter valid room code and name (min 2 chars)'; 
        return; 
      }
      
      myId = 'p_' + Date.now() + '_' + Math.random().toString(36).substring(2,6);
      myName = name; roomCode = room; myScore = 0; isOpen = false; myStatus = 'waiting';
      
      saveIdentity(); 
      subscribeChannel();
    }

    (function initPlayerSetup(){
      buildAvatarsGrid();
      const saved = loadIdentity();
      if(saved && saved.roomCode){
        document.getElementById('roomInput').value = roomCode;
        document.getElementById('nameInput').value = myName;
        subscribeChannel();
      }
    })();
  </script>
</body>
</html>
